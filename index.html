                `
                : `
                  <div class="empty-reviews">
                    Chưa có đánh giá nào.<br>
                    Hãy mở cửa và phục vụ những vị khách đầu tiên nhé!
                  </div>
                `
            }
          </div>
        </section>
      `;
    }

    function renderReviewCard(review) {
      const stars = Array.from({ length: 5 }).map(function(_, index) {
        return `
          <span class="${index < review.rating ? "gold-star" : "empty-star"}">
            ★
          </span>
        `;
      }).join("");

      const avatar = review.anonymous
        ? anonymousAvatar()
        : review.gender === "male"
          ? maleAvatarSvg()
          : femaleAvatarSvg();

      const suggestions = getReplySuggestions(review);

      return `
        <article class="review-card">
          <div class="review-head">

            <div class="review-avatar">
              ${avatar}
            </div>

            <div class="review-info">
              <div class="review-name">
                ${escapeHtml(review.anonymous ? "Khách ẩn danh" : review.name)}
              </div>

              <div class="review-day">
                ${escapeHtml(getCurrentDateLabel(review.day))}
              </div>
            </div>

            <div class="stars">
              ${stars}
            </div>
          </div>

          <div class="review-text">
            ${escapeHtml(review.text)}
          </div>

          ${
            review.reply
              ? `
                <div class="review-reply">
                  <strong>Tiệm:</strong>
                  ${escapeHtml(review.reply)}
                </div>
              `
              : ""
          }

          <div class="reply-suggestions">
            ${suggestions.map(function(text) {
              return `
                <button
                  type="button"
                  class="reply-suggestion"
                  data-action="reply-template"
                  data-id="${review.id}"
                  data-text="${escapeHtml(text)}"
                >
                  ${escapeHtml(text)}
                </button>
              `;
            }).join("")}
          </div>

          <div class="reply-row">
            <input
              class="reply-input"
              id="reply-${review.id}"
              maxlength="180"
              autocomplete="off"
              placeholder="Viết phản hồi cho khách..."
            >

            <button
              type="button"
              class="reply-send"
              data-action="send-review-reply"
              data-id="${review.id}"
            >
              Gửi
            </button>
          </div>
        </article>
      `;
    }

    function getReplySuggestions(review) {
      if (review.rating >= 5) {
        return [
          "Dạ cảm ơn bạn nhiều nha, hẹn gặp lại quán lần sau ạ! ❤️",
          "Tiệm vui lắm vì bạn thích kem ạ! Hẹn bạn lần tới nha!"
        ];
      }

      if (review.rating >= 3) {
        return [
          "Dạ cảm ơn bạn đã góp ý, tiệm sẽ cố gắng phục vụ tốt hơn ạ!",
          "Dạ cảm ơn bạn nha, tiệm sẽ chú ý để trải nghiệm tốt hơn ạ!"
        ];
      }

      return [
        "Dạ tiệm xin lỗi vì sự bất tiện này, lần sau quán sẽ cố gắng phục vụ nhanh hơn ạ!",
        "Dạ tiệm thành thật xin lỗi bạn, cảm ơn bạn đã góp ý để tiệm cải thiện ạ!"
      ];
    }

    /* =========================================================
       SUMMARY
       ========================================================= */

    function renderSummaryScreen() {
      const today = state.dailyHistory.length
        ? state.dailyHistory[state.dailyHistory.length - 1]
        : null;

      const weekRevenue = state.dailyHistory
        .slice(-7)
        .reduce(function(sum, item) {
          return sum + Number(item.revenue || 0);
        }, 0);

      const monthRevenue = state.dailyHistory
        .slice(-30)
        .reduce(function(sum, item) {
          return sum + Number(item.revenue || 0);
        }, 0);

      const dayRevenue = today
        ? today.revenue
        : state.dayRevenue;

      const dayProfit = today
        ? today.profit
        : state.dayRevenue - state.dayStockCosts - state.dayUpgradeCosts - state.dayStaffCosts;

      const flavorSales = {};

      Object.keys(FLAVORS).forEach(function(key) {
        flavorSales[key] = 0;
      });

      state.dailyHistory.forEach(function(day) {
        if (day.flavorSales) {
          Object.keys(day.flavorSales).forEach(function(key) {
            flavorSales[key] += Number(day.flavorSales[key] || 0);
          });
        }
      });

      let maxSales = 1;

      Object.keys(flavorSales).forEach(function(key) {
        maxSales = Math.max(maxSales, flavorSales[key]);
      });

      return `
        <section
          class="screen"
          data-screen="summary"
        >
          <div class="panel-title-row">
            <div>
              <h2 class="panel-title">Tổng Kết</h2>
              <p class="panel-subtitle">
                Theo dõi tình hình kinh doanh của tiệm
              </p>
            </div>
          </div>

          <div class="summary-scroll">

            <div class="summary-hero">
              <small>Lợi nhuận gần nhất</small>
              <div class="summary-profit ${dayProfit < 0 ? "negative" : ""}">
                ${moneyFull(dayProfit)}
              </div>
            </div>

            <div class="summary-periods">
              <div class="summary-period">
                <strong>${moneyFull(dayRevenue)}</strong>
                <span>Ngày</span>
              </div>

              <div class="summary-period">
                <strong>${moneyFull(weekRevenue)}</strong>
                <span>7 ngày</span>
              </div>

              <div class="summary-period">
                <strong>${moneyFull(monthRevenue)}</strong>
                <span>30 ngày</span>
              </div>
            </div>

            <div class="stat-grid">
              <div class="stat-card">
                <div class="stat-label">Tổng ly / đơn</div>
                <div class="stat-value">
                  ${state.totalServed}
                </div>
              </div>

              <div class="stat-card">
                <div class="stat-label">Khách bỏ về</div>
                <div class="stat-value">
                  ${state.totalWalkouts}
                </div>
              </div>

              <div class="stat-card">
                <div class="stat-label">Doanh thu</div>
                <div class="stat-value">
                  ${money(state.totalRevenue)}
                </div>
              </div>

              <div class="stat-card">
                <div class="stat-label">Đánh giá</div>
                <div class="stat-value">
                  ${getRatingText()}
                </div>
              </div>
            </div>

            <div class="sales-card">
              <div class="sales-title">
                Hương vị bán chạy / ế ẩm
              </div>

              ${Object.keys(FLAVORS).map(function(key) {
                const value = flavorSales[key];
                const width = Math.round(value / maxSales * 100);

                return `
                  <div class="sales-row">
                    <div class="sales-name">
                      ${escapeHtml(FLAVORS[key].name)}
                    </div>

                    <div class="sales-track">
                      <div
                        class="sales-fill"
                        style="width:${width}%"
                      ></div>
                    </div>

                    <div class="sales-number">
                      ${value}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>

          </div>
        </section>
      `;
    }

    /* =========================================================
       INVENTORY
       ========================================================= */

    function totalWarehouseItems() {
      let total = 0;

      Object.keys(state.inventory.flavors).forEach(function(key) {
        total += state.inventory.flavors[key];
      });

      Object.keys(state.inventory.toppings).forEach(function(key) {
        total += state.inventory.toppings[key];
      });

      Object.keys(state.inventory.bases).forEach(function(key) {
        total += state.inventory.bases[key];
      });

      return total;
    }

    function categoryUsed(category, key) {
      return Number(state.inventory[category][key] || 0);
    }

    function buyStock(category, key) {
      const source =
        category === "flavors"
          ? FLAVORS
          : category === "toppings"
            ? TOPPINGS
            : BASES;

      const item = source[key];

      if (!item) {
        return;
      }

      const amount = item.amount;

      if (state.cash < item.cost) {
        showToast("Không đủ tiền để nhập thùng hàng này.", "error");
        return;
      }

      if (totalWarehouseItems() + amount > warehouseCapacity()) {
        showToast(
          "Kho đã đầy. Hãy nâng cấp sức chứa trước khi nhập thêm.",
          "error"
        );
        return;
      }

      state.cash -= item.cost;
      state.inventory[category][key] += amount;
      state.purchased[category][key] = true;
      state.dayStockCosts += item.cost;

      saveState();
      scheduleRender();

      showToast(
        "Đã nhập " + amount + " " + item.name + " vào kho.",
        "success"
      );
    }

    /* =========================================================
       OPEN / CLOSE
       ========================================================= */

    function canOpenShop() {
      const hasBase =
        state.inventory.bases.cone > 0 ||
        state.inventory.bases.cup > 0;

      const hasFlavor =
        Object.keys(state.inventory.flavors).some(function(key) {
          return state.inventory.flavors[key] > 0;
        });

      return hasBase && hasFlavor;
    }

    function hasEnoughMoneyForStaffPayroll() {
      if (!staffActive()) {
        return true;
      }

      if (state.staffLastPaidDay === 0) {
        return true;
      }

      const daysSincePay =
        state.day - state.staffLastPaidDay;

      return daysSincePay < 2 || state.cash >= staffWage();
    }

    function processStaffPayroll() {
      if (!staffActive()) {
        return true;
      }

      if (state.staffLastPaidDay === 0) {
        state.staffLastPaidDay = state.day;
        return true;
      }

      const daysSincePay =
        state.day - state.staffLastPaidDay;

      if (daysSincePay < 2) {
        return true;
      }

      const wage = staffWage();

      if (state.cash < wage) {
        return false;
      }

      state.cash -= wage;
      state.dayStaffCosts += wage;
      state.staffLastPaidDay = state.day;

      return true;
    }

    function openShop() {
      if (state.isOpen) {
        return;
      }

      if (!canOpenShop()) {
        showModal({
          icon: "📦",
          title: "Chưa thể mở cửa",
          text: "Bạn cần nhập sỉ nguyên liệu ở Kho Hàng trước khi mở bán!",
          actions: [
            {
              label: "Đến Kho Hàng",
              className: "primary-button",
              action: "go-warehouse"
            }
          ]
        });
        return;
      }

      if (!hasEnoughMoneyForStaffPayroll()) {
        showModal({
          icon: "💰",
          title: "Chưa đủ tiền trả nhân viên",
          text: "Tiền mặt hiện tại chưa đủ để thanh toán kỳ lương của nhân viên. Hãy kinh doanh thêm trước.",
          actions: [
            {
              label: "Đã hiểu",
              className: "primary-button",
              action: "close-modal"
            }
          ]
        });
        return;
      }

      if (!processStaffPayroll()) {
        return;
      }

      state.isOpen = true;
      state.currentScreen = "shop";
      state.minutes = OPEN_MINUTE;
      state.served = 0;
      state.walkouts = 0;
      state.endHandled = false;
      state.dayStartReal = Date.now();

      resetBuild();

      saveState();
      scheduleRender();

      startGameClock();

      setTimeout(function() {
        if (state.isOpen && !state.activeCustomer) {
          spawnCustomer();
        }
      }, 450);
    }

    function closeShop() {
      if (!state.isOpen) {
        return;
      }

      stopGameClock();
      clearCustomerTimer();

      state.isOpen = false;
      state.activeCustomer = null;
      resetBuild();

      if (state.served >= dayTarget()) {
        finishSuccessfulDay();
        return;
      }

      saveState();
      scheduleRender();

      showModal({
        icon: "🕰️",
        title: "Chưa hoàn thành chỉ tiêu",
        text:
          "Bạn mới phục vụ " +
          state.served +
          "/" +
          dayTarget() +
          " khách. Ngày hiện tại chưa được tính là hoàn thành.",
        actions: [
          {
            label: "Tiếp tục ngày này",
            className: "primary-button",
            action: "continue-same-day"
          },
          {
            label: "Ở lại quản lý",
            className: "secondary-button",
            action: "close-modal"
          }
        ]
      });
    }

    function finishSuccessfulDay() {
      stopGameClock();
      clearCustomerTimer();

      state.isOpen = false;
      state.activeCustomer = null;
      resetBuild();

      const profit =
        state.dayRevenue -
        state.dayStockCosts -
        state.dayUpgradeCosts -
        state.dayStaffCosts;

      const flavorSales = {};

      Object.keys(FLAVORS).forEach(function(key) {
        flavorSales[key] = 0;
      });

      state.dailyHistory.push({
        day: state.day,
        served: state.served,
        walkouts: state.walkouts,
        revenue: state.dayRevenue,
        stockCosts: state.dayStockCosts,
        upgradeCosts: state.dayUpgradeCosts,
        staffCosts: state.dayStaffCosts,
        profit: profit,
        flavorSales: flavorSales
      });

      saveState();
      scheduleRender();

      showModal({
        icon: "🍦",
        title: "Hoàn thành Ngày " + state.day,
        text:
          "Bạn đã phục vụ đủ " +
          state.served +
          "/" +
          dayTarget() +
          " khách. Lợi nhuận ca này là " +
          moneyFull(profit) +
          ".",
        actions: [
          {
            label: "Sang Ngày " + (state.day + 1),
            className: "primary-button",
            action: "next-day"
          },
          {
            label: "Xem tổng kết",
            className: "secondary-button",
            action: "go-summary"
          }
        ]
      });
    }

    function continueSameDay() {
      closeModal();

      state.minutes = OPEN_MINUTE;
      state.served = 0;
      state.walkouts = 0;
      state.endHandled = false;
      state.isOpen = true;
      state.activeCustomer = null;
      state.dayStartReal = Date.now();

      resetBuild();
      saveState();
      scheduleRender();

      startGameClock();

      setTimeout(function() {
        if (state.isOpen && !state.activeCustomer) {
          spawnCustomer();
        }
      }, 350);
    }

    function nextDay() {
      closeModal();

      state.day += 1;
      state.minutes = OPEN_MINUTE;
      state.isOpen = false;
      state.activeCustomer = null;

      state.served = 0;
      state.walkouts = 0;

      state.dayRevenue = 0;
      state.dayStockCosts = 0;
      state.dayUpgradeCosts = 0;
      state.dayStaffCosts = 0;

      state.endHandled = false;

      resetBuild();

      saveState();
      scheduleRender();
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function startGameClock() {
      stopGameClock();

      state.dayStartReal = Date.now();

      state.clockTimerId = setInterval(function() {
        if (!state.isOpen) {
          return;
        }

        const elapsed = Date.now() - state.dayStartReal;

        state.minutes = clamp(
          OPEN_MINUTE + Math.floor(elapsed / GAME_MINUTE_MS),
          OPEN_MINUTE,
          CLOSE_MINUTE
        );

        updateClockOnly();

        if (state.minutes >= CLOSE_MINUTE) {
          handleEndOfDay();
        }

        checkCustomerTimeout();
      }, 100);
    }

    function stopGameClock() {
      if (state.clockTimerId) {
        clearInterval(state.clockTimerId);
        state.clockTimerId = null;
      }
    }

    function updateClockOnly() {
      const clock = document.querySelector(".daily-progress .progress-label:last-child");

      if (clock) {
        clock.textContent = formatClock(state.minutes);
      }

      const progress = document.querySelector(".progress-fill");

      if (progress) {
        progress.style.width =
          clamp(state.served / dayTarget(), 0, 1) * 100 + "%";
      }

      updateCustomerPatienceOnly();
    }

    function updateCustomerPatienceOnly() {
      const customer = state.activeCustomer;

      if (!customer) {
        return;
      }

      const elapsed = Date.now() - customer.createdAt;

      let patience = clamp(
        1 - elapsed / CUSTOMER_PATIENCE_MS,
        0,
        1
      );

      if (customer.hurrySent) {
        const hurryElapsed =
          Math.max(0, elapsed - CUSTOMER_PATIENCE_MS * .5);

        const acceleratedRemaining =
          Math.max(
            0,
            .5 - hurryElapsed / (CUSTOMER_PATIENCE_MS * .5)
          );

        patience = Math.min(patience, acceleratedRemaining);
      }

      const percent = Math.round(patience * 100);

      const ring = document.querySelector(".patience-ring");

      if (ring) {
        ring.style.setProperty("--patience", percent + "%");
        ring.classList.toggle("warning", patience <= .35);
      }

      const inner = document.querySelector(".patience-inner");

      if (inner) {
        inner.textContent = percent + "%";
      }

      if (!customer.hurrySent && patience <= .5) {
        customer.hurrySent = true;

        showToast(
          customer.name +
          " đang hơi vội, hãy cố gắng phục vụ nhanh nhé!",
          "error"
        );

        scheduleRender();
      }
    }

    function handleEndOfDay() {
      if (state.endHandled) {
        return;
      }

      state.endHandled = true;
      stopGameClock();
      clearCustomerTimer();

      if (state.served >= dayTarget()) {
        state.isOpen = false;
        state.activeCustomer = null;
        resetBuild();

        finishSuccessfulDay();
        return;
      }

      state.isOpen = false;
      state.activeCustomer = null;
      resetBuild();

      saveState();
      scheduleRender();

      showModal({
        icon: "🌙",
        title: "Hết giờ nhưng chưa đạt chỉ tiêu",
        text:
          "Ngày " +
          state.day +
          " cần " +
          dayTarget() +
          " khách, nhưng bạn mới phục vụ " +
          state.served +
          ". Bạn phải chơi lại ngày này từ mốc 0/" +
          dayTarget() +
          ".",
        actions: [
          {
            label: "Chơi lại Ngày " + state.day,
            className: "primary-button",
            action: "retry-day"
          }
        ]
      });
    }

    function retryDay() {
      closeModal();

      state.isOpen = false;
      state.activeCustomer = null;
      state.minutes = OPEN_MINUTE;

      state.served = 0;
      state.walkouts = 0;

      state.dayRevenue = 0;
      state.dayStockCosts = 0;
      state.dayUpgradeCosts = 0;
      state.dayStaffCosts = 0;

      state.endHandled = false;

      resetBuild();

      saveState();
      scheduleRender();

      showToast(
        "Ngày " + state.day + " đã được đặt lại về 0/" + dayTarget() + ".",
        "error"
      );
    }

    /* =========================================================
       CUSTOMER GENERATION
       ========================================================= */

    function clearCustomerTimer() {
      if (state.customerTimerId) {
        clearTimeout(state.customerTimerId);
        state.customerTimerId = null;
      }
    }

    function availableFlavors() {
      return Object.keys(FLAVORS).filter(function(key) {
        return state.inventory.flavors[key] > 0;
      });
    }

    function availableBases() {
      return Object.keys(BASES).filter(function(key) {
        return state.inventory.bases[key] > 0;
      });
    }

    function availableToppings() {
      return Object.keys(TOPPINGS).filter(function(key) {
        return state.inventory.toppings[key] > 0;
      });
    }

    function spawnCustomer() {
      if (!state.isOpen || state.activeCustomer) {
        return;
      }

      if (state.minutes >= CLOSE_MINUTE) {
        return;
      }

      const bases = availableBases();
      const flavors = availableFlavors();

      if (!bases.length || !flavors.length) {
        showModal({
          icon: "📦",
          title: "Kho không đủ nguyên liệu",
          text:
            "Khách vẫn đang chờ nhưng tiệm không còn đủ đế hoặc kem. Hãy vào Kho Hàng nhập thêm.",
          actions: [
            {
              label: "Mở Kho Hàng",
              className: "primary-button",
              action: "go-warehouse"
            }
          ]
        });
        return;
      }

      const gender =
        Math.random() < .5
          ? "male"
          : "female";

      const name =
        gender === "male"
          ? randomItem(MALE_NAMES)
          : randomItem(FEMALE_NAMES);

      const base = randomItem(bases);

      const creative = state.day >= 5 && Math.random() < .25;

      let scoopCount;
      let requestedFlavors;
      let randomFlavors = false;

      if (creative) {
        scoopCount = randomInt(1, 3);
        randomFlavors = true;
        requestedFlavors = [];
      } else {
        scoopCount =
          state.day <= 2
            ? 1
            : randomInt(1, 3);

        requestedFlavors = [];

        for (let index = 0; index < scoopCount; index += 1) {
          requestedFlavors.push(randomItem(flavors));
        }
      }

      let topping = null;
      let randomTopping = false;

      const toppings = availableToppings();

      if (state.day >= 2 && Math.random() < .65) {
        if (creative && Math.random() < .6) {
          randomTopping = true;
        } else if (toppings.length) {
          topping = randomItem(toppings);
        }
      }

      const orderText = createOrderText({
        name: name,
        base: base,
        flavors: requestedFlavors,
        scoopCount: scoopCount,
        topping: topping,
        randomFlavors: randomFlavors,
        randomTopping: randomTopping
      });

      state.activeCustomer = {
        id: Date.now() + "-" + Math.random().toString(36).slice(2),
        gender: gender,
        name: name,
        order: {
          base: base,
          scoops: scoopCount,
          flavors: requestedFlavors,
          randomFlavors: randomFlavors,
          topping: topping,
          randomTopping: randomTopping,
          text: orderText
        },
        createdAt: Date.now(),
        maxPatienceMs: CUSTOMER_PATIENCE_MS,
        hurrySent: false
      };

      resetBuild();
      saveState();
      scheduleRender();

      clearCustomerTimer();

      state.customerTimerId = setTimeout(function() {
        checkCustomerTimeout();
      }, CUSTOMER_PATIENCE_MS + 500);
    }

    function createOrderText(order) {
      const baseText = order.base === "cone"
        ? "ốc quế"
        : "ly giấy";

      let flavorText = "";

      if (order.randomFlavors) {
        flavorText =
          "cho mình " +
          order.scoopCount +
          " viên vị bất kỳ tùy shop mix nhé";
      } else {
        flavorText = order.flavors.map(function(key) {
          return FLAVORS[key].name;
        }).join(" + ");

        flavorText =
          "cho mình " +
          order.scoopCount +
          " viên vị " +
          flavorText;
      }

      let toppingText = "";

      if (order.randomTopping) {
        toppingText = " và thêm một loại topping bất kỳ hợp vị";
      } else if (order.topping) {
        toppingText =
          " và thêm " +
          TOPPINGS[order.topping].name;
      } else {
        toppingText = " không cần topping";
      }

      const politeOpenings = [
        "Shop ơi,",
        "Cho mình hỏi tiệm ơi,",
        "Bạn ơi,",
        "Tiệm giúp mình với ạ,"
      ];

      return (
        randomItem(politeOpenings) +
        " làm giúp mình " +
        baseText +
        ", " +
        flavorText +
        toppingText +
        " nha!"
      );
    }

    function checkCustomerTimeout() {
      const customer = state.activeCustomer;

      if (!customer) {
        return;
      }

      const elapsed = Date.now() - customer.createdAt;

      if (elapsed < CUSTOMER_PATIENCE_MS) {
        return;
      }

      customerWalkout(
        customer,
        "Mình đợi khá lâu rồi nên đành đi trước. Mong tiệm cải thiện thời gian phục vụ nha."
      );
    }

    /* =========================================================
       CUSTOMER REVIEWS
       ========================================================= */

    function calculateServiceRating(customer) {
      const elapsed = Date.now() - customer.createdAt;
      const patience = clamp(
        1 - elapsed / CUSTOMER_PATIENCE_MS,
        0,
        1
      );

      if (patience > .8) {
        return 5;
      }

      if (patience > .62) {
        return 4;
      }

      if (patience > .38) {
        return 3;
      }

      if (patience > .15) {
        return 2;
      }

      return 1;
    }

    function reviewTextForRating(rating) {
      if (rating >= 5) {
        return randomItem([
          "Kem ngon, phục vụ nhanh, mình rất hài lòng!",
          "Tiệm dễ thương quá, kem ngon và lên món nhanh!",
          "Mình thích cách tiệm làm kem, chắc chắn sẽ quay lại!",
          "Kem xinh xắn, vị ổn áp và phục vụ rất dễ thương!"
        ]);
      }

      if (rating === 4) {
        return randomItem([
          "Kem ngon, tiệm dễ thương. Mình chờ hơi lâu một chút nhưng vẫn ổn.",
          "Món khá ngon, nếu phục vụ nhanh hơn một chút thì tuyệt hơn!",
          "Vị kem ổn và nhân viên dễ thương, thời gian chờ hơi lâu."
        ]);
      }

      if (rating === 3) {
        return randomItem([
          "Kem ổn nhưng mình phải chờ khá lâu một chút.",
          "Món ngon nhưng thời gian phục vụ chưa thật sự nhanh.",
          "Tiệm xinh, kem được, nhưng mình mong phục vụ nhanh hơn."
        ]);
      }

      if (rating === 2) {
        return randomItem([
          "Mình chờ khá lâu nên trải nghiệm chưa tốt.",
          "Món chưa đúng ý và mình phải đợi hơi lâu.",
          "Tiệm cần chú ý hơn đến thời gian phục vụ và đơn hàng."
        ]);
      }

      return randomItem([
        "Mình đợi khá lâu nên phải bỏ về. Mong tiệm cải thiện thời gian phục vụ.",
        "Đơn chưa đúng yêu cầu nên mình khá thất vọng.",
        "Trải nghiệm hôm nay không ổn, mong tiệm kiểm tra lại quy trình phục vụ."
      ]);
    }

    function createReview(customer, rating, text, forceAnonymous) {
      const negative = rating <= 2 ||
        /chờ|sai|thất vọng|không ổn|bỏ về|lâu/i.test(text);

      const anonymous =
        forceAnonymous ||
        (
          negative &&
          Math.random() < .45
        );

      const review = {
        id:
          "review-" +
          Date.now() +
          "-" +
          Math.random().toString(36).slice(2),

        day: state.day,

        name: customer.name,
        gender: customer.gender,

        rating: rating,
        text: text,

        anonymous: anonymous,

        reply: ""
      };

      state.reviews.unshift(review);

      return review;
    }

    function customerWalkout(customer, reviewText) {
      if (!state.activeCustomer) {
        return;
      }

      clearCustomerTimer();

      state.activeCustomer = null;
      state.walkouts += 1;
      state.totalWalkouts += 1;

      const rating = Math.random() < .5 ? 1 : 2;

      createReview(
        customer,
        rating,
        reviewText || reviewTextForRating(rating),
        false
      );

      resetBuild();

      saveState();
      scheduleRender();

      showToast(
        customer.name + " đã rời tiệm vì chờ quá lâu.",
        "error"
      );

      if (state.walkouts >= BANKRUPTCY_WALKOUT_LIMIT) {
        setTimeout(function() {
          triggerBankruptcy();
        }, 250);
        return;
      }

      scheduleNextCustomer();
    }

    function scheduleNextCustomer() {
      clearCustomerTimer();

      if (!state.isOpen) {
        return;
      }

      if (state.served >= dayTarget()) {
        return;
      }

      state.customerTimerId = setTimeout(function() {
        if (state.isOpen && !state.activeCustomer) {
          spawnCustomer();
        }
      }, 850);
    }

    /* =========================================================
       BUILDING ICE CREAM
       ========================================================= */

    function resetBuild() {
      state.build = {
        base: null,
        flavors: [],
        topping: null
      };
    }

    function chooseBase(key) {
      if (!state.isOpen) {
        return;
      }

      if (!BASES[key]) {
        return;
      }

      if (state.inventory.bases[key] <= 0) {
        showToast(
          "Bạn đã hết " + BASES[key].name + ". Hãy nhập thêm ở Kho Hàng.",
          "error"
        );
        return;
      }

      state.build.base = key;

      saveState();
      scheduleRender();
    }

    function chooseFlavor(key) {
      if (!state.isOpen) {
        return;
      }

      if (!FLAVORS[key]) {
        return;
      }

      if (state.build.flavors.length >= 3) {
        showToast(
          "Mỗi đơn chỉ được tối đa 3 viên kem.",
          "error"
        );
        return;
      }

      const selectedCount = state.build.flavors.filter(function(value) {
        return value === key;
      }).length;

      const remainingStock =
        state.inventory.flavors[key] - selectedCount;

      if (remainingStock <= 0) {
        showToast(
          "Vị " + FLAVORS[key].name + " không đủ hàng.",
          "error"
        );
        return;
      }

      state.build.flavors.push(key);

      saveState();
      scheduleRender();
    }

    function chooseTopping(key) {
      if (!state.isOpen) {
        return;
      }

      if (key === "") {
        state.build.topping = null;
        saveState();
        scheduleRender();
        return;
      }

      if (!TOPPINGS[key]) {
        return;
      }

      if (state.inventory.toppings[key] <= 0) {
        showToast(
          "Topping này đã hết. Hãy nhập thêm ở Kho Hàng.",
          "error"
        );
        return;
      }

      state.build.topping = key;

      saveState();
      scheduleRender();
    }

    function removeLastScoop() {
      if (state.build.flavors.length) {
        state.build.flavors.pop();
        saveState();
        scheduleRender();
      }
    }

    function validateBuildAgainstOrder(customer) {
      const build = state.build;
      const order = customer.order;

      if (!build.base) {
        return {
          valid: false,
          reason: "Bạn chưa chọn ốc quế hoặc ly."
        };
      }

      if (build.base !== order.base) {
        return {
          valid: false,
          reason: "Sai loại đế mà khách yêu cầu."
        };
      }

      if (build.flavors.length !== order.scoops) {
        return {
          valid: false,
          reason:
            "Khách yêu cầu " +
            order.scoops +
            " viên kem nhưng bạn đang làm " +
            build.flavors.length +
            " viên."
        };
      }

      const builtFlavorCounts = {};

      build.flavors.forEach(function(key) {
        builtFlavorCounts[key] =
          (builtFlavorCounts[key] || 0) + 1;
      });

      if (!order.randomFlavors) {
        const requestedCounts = {};

        order.flavors.forEach(function(key) {
          requestedCounts[key] =
            (requestedCounts[key] || 0) + 1;
        });

        const requestedKeys = Object.keys(requestedCounts);
        const builtKeys = Object.keys(builtFlavorCounts);

        if (requestedKeys.length !== builtKeys.length) {
          return {
            valid: false,
            reason: "Vị kem chưa đúng yêu cầu của khách."
          };
        }

        for (const key of requestedKeys) {
          if (requestedCounts[key] !== builtFlavorCounts[key]) {
            return {
              valid: false,
              reason: "Vị kem chưa đúng yêu cầu của khách."
            };
          }
        }
      }

      if (order.randomTopping) {
        if (!build.topping) {
          return {
            valid: false,
            reason: "Khách muốn một loại topping bất kỳ."
          };
        }
      } else {
        if (order.topping !== build.topping) {
          return {
            valid: false,
            reason:
              order.topping
                ? "Topping chưa đúng yêu cầu của khách."
                : "Khách không yêu cầu topping."
          };
        }
      }

      return {
        valid: true,
        reason: ""
      };
    }

    function consumeBuildInventory() {
      state.inventory.bases[state.build.base] -= 1;

      state.build.flavors.forEach(function(key) {
        state.inventory.flavors[key] -= 1;
      });

      if (state.build.topping) {
        state.inventory.toppings[state.build.topping] -= 1;
      }
    }

    function serveOrder() {
      if (!state.isOpen) {
        return;
      }

      const customer = state.activeCustomer;

      if (!customer) {
        showToast(
          "Hiện chưa có khách nào đang chờ.",
          "error"
        );
        return;
      }

      const validation = validateBuildAgainstOrder(customer);

      if (!validation.valid) {
        punishWrongOrder(customer, validation.reason);
        return;
      }

      const rating = calculateServiceRating(customer);

      consumeBuildInventory();

      const revenue = pricePerOrder();

      state.cash += revenue;
      state.dayRevenue += revenue;
      state.totalRevenue += revenue;

      state.served += 1;
      state.totalServed += 1;

      const review = createReview(
        customer,
        rating,
        reviewTextForRating(rating),
        false
      );

      if (state.dailyHistory.length) {
        const latest =
          state.dailyHistory[state.dailyHistory.length - 1];

        if (latest.flavorSales) {
          state.build.flavors.forEach(function(key) {
            latest.flavorSales[key] =
              (latest.flavorSales[key] || 0) + 1;
          });
        }
      }

      clearCustomerTimer();

      state.activeCustomer = null;
      resetBuild();

      saveState();
      scheduleRender();

      showToast(
        "Đã phục vụ thành công cho khách " +
        customer.name +
        "! +" +
        moneyFull(revenue),
        "success"
      );

      if (state.served >= dayTarget()) {
        setTimeout(function() {
          finishSuccessfulDay();
        }, 900);
        return;
      }

      scheduleNextCustomer();
    }

    function punishWrongOrder(customer, reason) {
      const elapsed = Date.now() - customer.createdAt;
      const currentPatience = clamp(
        1 - elapsed / CUSTOMER_PATIENCE_MS,
        0,
        1
      );

      const fakeNewCreatedAt =
        Date.now() -
        CUSTOMER_PATIENCE_MS *
        (1 - currentPatience * .5);

      customer.createdAt = fakeNewCreatedAt;

      if (!customer.wrongAttempts) {
        customer.wrongAttempts = 0;
      }

      customer.wrongAttempts += 1;

      saveState();
      scheduleRender();

      showToast(
        "Làm sai đơn: " +
        reason +
        " Kiên nhẫn của khách giảm mạnh.",
        "error"
      );

      if (customer.wrongAttempts >= 2) {
        setTimeout(function() {
          const active = state.activeCustomer;

          if (!active || active.id !== customer.id) {
            return;
          }

          customerWalkout(
            customer,
            "Mình đã phải chờ và đơn vẫn chưa đúng yêu cầu. Mong tiệm kiểm tra lại trước khi giao nhé."
          );
        }, 500);
      }
    }

    /* =========================================================
       MISSING STOCK CHAT
       ========================================================= */

    function openMissingStockChat() {
      const customer = state.activeCustomer;

      if (!customer) {
        return;
      }

      const missing = getMissingOrderIngredients(customer);

      if (!missing.length) {
        showToast(
          "Đơn hiện tại vẫn có đủ nguyên liệu trong kho.",
          "success"
        );
        return;
      }

      state.chat.open = true;
      state.chat.messages = [
        {
          sender: "customer",
          text:
            "Shop ơi, hình như món mình gọi đang thiếu nguyên liệu đúng không ạ?"
        }
      ];

      showChatModal(missing);
    }

    function getMissingOrderIngredients(customer) {
      const missing = [];

      const order = customer.order;

      if (
        order.base &&
        state.inventory.bases[order.base] <= 0
      ) {
        missing.push(BASES[order.base].name);
      }

      if (!order.randomFlavors) {
        const flavorCounts = {};

        order.flavors.forEach(function(key) {
          flavorCounts[key] =
            (flavorCounts[key] || 0) + 1;
        });

        Object.keys(flavorCounts).forEach(function(key) {
          if (state.inventory.flavors[key] < flavorCounts[key]) {
            missing.push(FLAVORS[key].name);
          }
        });
      }

      if (
        order.topping &&
        state.inventory.toppings[order.topping] <= 0
      ) {
        missing.push(TOPPINGS[order.topping].name);
      }

      return missing;
    }

    function showChatModal(missing) {
      const layer = document.getElementById("modalLayer");

      if (!layer) {
        return;
      }

      layer.innerHTML = `
        <div class="modal-card">
          <div class="modal-icon">💬</div>

          <h3 class="modal-title">
            Nhắn tin với ${escapeHtml(state.activeCustomer ? state.activeCustomer.name : "khách")}
          </h3>

          <p class="modal-text">
            Nguyên liệu đang thiếu:
            <strong>${escapeHtml(missing.join(", "))}</strong>.
            Hãy báo khách thật lịch sự nhé.
          </p>

          <div class="chat-messages" id="chatMessages">
            ${state.chat.messages.map(function(message) {
              return `
                <div class="chat-line ${message.sender}">
                  <div class="chat-bubble">
                    ${escapeHtml(message.text)}
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="chat-compose">
            <input
              id="chatInput"
              class="chat-input"
              maxlength="180"
              autocomplete="off"
              placeholder="Nhắn tin cho khách..."
            >

            <button
              type="button"
              class="chat-send"
              data-action="send-chat"
            >
              Gửi
            </button>
          </div>

          <div style="height:6px"></div>

          <button
            type="button"
            class="secondary-button"
            style="width:100%"
            data-action="send-polite-chat"
          >
            Dùng câu lịch sự mẫu
          </button>
        </div>
      `;

      layer.classList.add("visible");

      setTimeout(function() {
        const input = document.getElementById("chatInput");

        if (input) {
          input.focus();
        }
      }, 50);
    }

    function sendChatMessage(text) {
      const customer = state.activeCustomer;

      if (!customer) {
        closeModal();
        return;
      }

      const message = String(text || "").trim();

      if (!message) {
        showToast(
          "Hãy nhập nội dung trước khi gửi.",
          "error"
        );
        return;
      }

      state.chat.messages.push({
        sender: "player",
        text: message
      });

      const rude = RUDE_WORDS.some(function(word) {
        return message.toLowerCase().includes(word);
      });

      if (rude) {
        state.chat.messages.push({
          sender: "customer",
          text:
            "Mình chỉ hỏi lịch sự thôi mà. Cách nói này làm mình rất khó chịu."
        });

        closeModal();

        createReview(
          customer,
          1,
          "Thái độ phản hồi của tiệm làm mình rất thất vọng.",
          true
        );

        clearCustomerTimer();

        state.activeCustomer = null;
        state.walkouts += 1;
        state.totalWalkouts += 1;

        resetBuild();
        saveState();
        scheduleRender();

        showToast(
          customer.name +
          " tức giận và để lại đánh giá 1 sao.",
          "error"
        );

        if (state.walkouts >= BANKRUPTCY_WALKOUT_LIMIT) {
          setTimeout(triggerBankruptcy, 300);
        } else {
          scheduleNextCustomer();
        }

        return;
      }

      state.chat.messages.push({
        sender: "customer",
        text:
          randomItem([
            "Dạ mình hiểu rồi ạ, cảm ơn tiệm đã báo.",
            "Không sao đâu ạ, mình thông cảm cho tiệm nha.",
            "Dạ được ạ, mình sẽ ghé lại lần khác."
          ])
      });

      closeModal();

      createReview(
        customer,
        4,
        "Tiệm báo tình trạng món khá lịch sự, mình thông cảm nha.",
        false
      );

      clearCustomerTimer();

      state.activeCustomer = null;
      resetBuild();

      saveState();
      scheduleRender();

      showToast(
        "Khách đã thông cảm và rời tiệm nhẹ nhàng.",
        "success"
      );

      scheduleNextCustomer();
    }

    /* =========================================================
       BANKRUPTCY
       ========================================================= */

    function triggerBankruptcy() {
      stopGameClock();
      clearCustomerTimer();

      state.isOpen = false;
      state.activeCustomer = null;

      closeModal();

      showModal({
        icon: "💔",
        title: "PHÁ SẢN",
        text:
          "Tiệm đã để quá nhiều khách bực bội và uy tín sụt giảm nghiêm trọng. Toàn bộ hành trình sẽ được đặt lại từ đầu.",
        actions: [
          {
            label: "Chơi lại từ đầu",
            className: "primary-button",
            action: "restart-game"
          }
        ]
      });
    }

    function restartGame() {
      stopGameClock();
      clearCustomerTimer();

      localStorage.removeItem(STORAGE_KEY);

      Object.assign(state, createDefaultState());

      closeModal();
      renderWelcome();
    }

    /* =========================================================
       UPGRADES
       ========================================================= */

    function buyUpgrade(key) {
      let cost = 0;

      if (key === "warehouse") {
        cost = warehouseUpgradeCost();
      }

      if (key === "scoopSpeed") {
        cost =
          130000 +
          state.upgrades.scoopSpeed * 100000;
      }

      if (key === "price") {
        if (state.upgrades.price >= 5) {
          showToast(
            "Giá bán đã đạt mức cao nhất.",
            "success"
          );
          return;
        }

        cost =
          150000 +
          state.upgrades.price * 125000;
      }

      if (key === "employee") {
        if (state.upgrades.employee === 0) {
          cost = 150000;
        } else {
          cost =
            180000 +
            state.upgrades.employee * 140000;
        }
      }

      if (!cost) {
        return;
      }

      if (state.cash < cost) {
        showToast(
          "Không đủ tiền cho nâng cấp này.",
          "error"
        );
        return;
      }

      state.cash -= cost;
      state.dayUpgradeCosts += cost;
      state.upgrades[key] += 1;

      saveState();
      scheduleRender();

      if (key === "employee") {
        showToast(
          state.upgrades.employee === 1
            ? "Đã thuê nhân viên pha chế. Nhân viên bắt đầu làm việc ngay."
            : "Đã nâng cấp nhân viên pha chế.",
          "success"
        );
      } else {
        showToast(
          "Nâng cấp thành công.",
          "success"
        );
      }
    }

    /* =========================================================
       MODAL
       ========================================================= */

    function showModal(config) {
      const layer = document.getElementById("modalLayer");

      if (!layer) {
        return;
      }

      layer.innerHTML = `
        <div class="modal-card">
          <div class="modal-icon">
            ${config.icon || "🍦"}
          </div>

          <h3 class="modal-title">
            ${escapeHtml(config.title || "")}
          </h3>

          <p class="modal-text">
            ${escapeHtml(config.text || "")}
          </p>

          <div class="modal-actions">
            ${(config.actions || []).map(function(action) {
              return `
                <button
                  type="button"
                  class="${action.className || "primary-button"}"
                  data-action="${action.action}"
                >
                  ${escapeHtml(action.label)}
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;

      layer.classList.add("visible");
    }

    function closeModal() {
      const layer = document.getElementById("modalLayer");

      if (!layer) {
        return;
      }

      layer.classList.remove("visible");
      layer.innerHTML = "";
    }

    /* =========================================================
       TOAST
       ========================================================= */

    function showToast(message, type) {
      const container = document.getElementById("toastContainer");

      if (!container) {
        return;
      }

      const toast = document.createElement("div");

      toast.className =
        "toast " +
        (type === "success"
          ? "success"
          : type === "error"
            ? "error"
            : "");

      toast.textContent = message;

      container.appendChild(toast);

      setTimeout(function() {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(5px)";

        setTimeout(function() {
          toast.remove();
        }, 220);
      }, 2600);
    }

    /* =========================================================
       RENAME SHOP
       ========================================================= */

    function showRenameModal() {
      const layer = document.getElementById("modalLayer");

      if (!layer) {
        return;
      }

      layer.innerHTML = `
        <div class="modal-card">
          <div class="modal-icon">✎</div>

          <h3 class="modal-title">
            Đổi tên tiệm
          </h3>

          <p class="modal-text">
            Tên mới sẽ được lưu và xuất hiện trên bảng hiệu.
          </p>

          <input
            id="renameShopInput"
            class="rename-input"
            maxlength="28"
            value="${escapeHtml(state.shopName)}"
            autocomplete="off"
          >

          <div class="modal-actions">
            <button
              type="button"
              class="primary-button"
              data-action="save-shop-name"
            >
              Lưu tên tiệm
            </button>

            <button
              type="button"
              class="secondary-button"
              data-action="close-modal"
            >
              Hủy
            </button>
          </div>
        </div>
      `;

      layer.classList.add("visible");

      setTimeout(function() {
        const input = document.getElementById("renameShopInput");

        if (input) {
          input.focus();
          input.select();
        }
      }, 40);
    }

    function saveShopName() {
      const input = document.getElementById("renameShopInput");

      if (!input) {
        return;
      }

      const value = input.value.trim();

      if (!value) {
        showToast(
          "Tên tiệm không được để trống.",
          "error"
        );
        return;
      }

      state.shopName = value;

      saveState();
      closeModal();
      scheduleRender();

      showToast(
        "Đã cập nhật tên tiệm.",
        "success"
      );
    }

    /* =========================================================
       REVIEW REPLIES
       ========================================================= */

    function sendReviewReply(reviewId) {
      const input = document.getElementById("reply-" + reviewId);

      if (!input) {
        return;
      }

      const text = input.value.trim();

      if (!text) {
        showToast(
          "Bạn chưa nhập nội dung phản hồi.",
          "error"
        );
        return;
      }

      const review = state.reviews.find(function(item) {
        return item.id === reviewId;
      });

      if (!review) {
        return;
      }

      review.reply = text;

      saveState();
      scheduleRender();

      showToast(
        "Đã gửi phản hồi cho khách.",
        "success"
      );
    }

    function fillReplyTemplate(reviewId, text) {
      const input = document.getElementById("reply-" + reviewId);

      if (!input) {
        return;
      }

      input.value = text;
      input.focus();
    }

    /* =========================================================
       PRICE
       ========================================================= */

    function selectPrice(level) {
      const safeLevel = clamp(
        Number(level),
        0,
        5
      );

      if (safeLevel > state.upgrades.price) {
        showToast(
          "Hãy nâng cấp Giá bán để mở mức giá này.",
          "error"
        );
        return;
      }

      state.upgrades.price = safeLevel;

      saveState();
      scheduleRender();
    }

    /* =========================================================
       EVENT DELEGATION
       ========================================================= */

    function handleAction(actionElement) {
      const action = actionElement.dataset.action;

      if (!action) {
        return;
      }

      switch (action) {
        case "start-game": {
          const input =
            document.getElementById("welcomeShopName");

          const value =
            input
              ? input.value.trim()
              : "";

          if (!value) {
            showToast(
              "Hãy đặt tên cho tiệm trước khi bắt đầu.",
              "error"
            );
            return;
          }

          state.shopName = value;
          state.currentScreen = "shop";
          state.isOpen = false;

          saveState();
          renderGame();

          showToast(
            "Chào mừng bạn đến với tiệm " +
            value +
            "!",
            "success"
          );

          break;
        }

        case "navigate": {
          const screen = actionElement.dataset.screen;

          const allowedScreens = [
            "shop",
            "warehouse",
            "upgrade",
            "price",
            "reviews"
          ];

          if (!allowedScreens.includes(screen)) {
            return;
          }

          state.currentScreen = screen;

          saveState();

          updateActiveScreen();

          break;
        }

        case "open-shop":
          openShop();
          break;

        case "close-shop":
          closeShop();
          break;

        case "go-warehouse":
          closeModal();
          state.currentScreen = "warehouse";
          saveState();
          scheduleRender();
          break;

        case "choose-base":
          chooseBase(actionElement.dataset.key);
          break;

        case "choose-flavor":
          chooseFlavor(actionElement.dataset.key);
          break;

        case "choose-topping":
          chooseTopping(actionElement.dataset.key || "");
          break;

        case "reset-build":
          resetBuild();
          saveState();
          scheduleRender();
          break;

        case "serve-order":
          serveOrder();
          break;

        case "buy-stock":
          buyStock(
            actionElement.dataset.category,
            actionElement.dataset.key
          );
          break;

        case "upgrade-warehouse":
          buyUpgrade("warehouse");
          break;

        case "upgrade-scoop":
          buyUpgrade("scoopSpeed");
          break;

        case "upgrade-price":
          buyUpgrade("price");
          break;

        case "upgrade-employee":
          buyUpgrade("employee");
          break;

        case "select-price":
          selectPrice(actionElement.dataset.level);
          break;

        case "open-rename":
          showRenameModal();
          break;

        case "save-shop-name":
          saveShopName();
          break;

        case "close-modal":
          closeModal();
          break;

        case "send-review-reply":
          sendReviewReply(actionElement.dataset.id);
          break;

        case "reply-template":
          fillReplyTemplate(
            actionElement.dataset.id,
            actionElement.dataset.text
          );
          break;

        case "send-chat": {
          const input =
            document.getElementById("chatInput");

          sendChatMessage(
            input ? input.value : ""
          );

          break;
        }

        case "send-polite-chat":
          sendChatMessage(
            randomItem(POLITE_SHORT_MESSAGES)
          );
          break;

        case "continue-same-day":
          continueSameDay();
          break;

        case "retry-day":
          retryDay();
          break;

        case "next-day":
          nextDay();
          break;

        case "go-summary":
          closeModal();
          state.currentScreen = "summary";
          saveState();
          scheduleRender();
          break;

        case "restart-game":
          restartGame();
          break;

        default:
          break;
      }
    }

    document.addEventListener("click", function(event) {
      const actionElement =
        event.target.closest("[data-action]");

      if (!actionElement) {
        return;
      }

      handleAction(actionElement);
    });

    document.addEventListener("input", function(event) {
      const target = event.target;

      if (
        target &&
        target.dataset &&
        target.dataset.action === "price-slider"
      ) {
        const level = clamp(
          Number(target.value),
          0,
          5
        );

        if (level <= state.upgrades.price) {
          state.upgrades.price = level;
          saveState();
          scheduleRender();
        } else {
          target.value = String(state.upgrades.price);

          showToast(
            "Hãy mua nâng cấp Giá bán để mở mức này.",
            "error"
          );
        }
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key !== "Enter") {
        return;
      }

      const target = event.target;

      if (target && target.id === "welcomeShopName") {
        const button =
          document.querySelector('[data-action="start-game"]');

        if (button) {
          button.click();
        }
      }

      if (target && target.id === "renameShopInput") {
        const button =
          document.querySelector('[data-action="save-shop-name"]');

        if (button) {
          button.click();
        }
      }

      if (
        target &&
        target.classList.contains("reply-input")
      ) {
        const id =
          target.id.replace("reply-", "");

        sendReviewReply(id);
      }

      if (target && target.id === "chatInput") {
        const button =
          document.querySelector('[data-action="send-chat"]');

        if (button) {
          button.click();
        }
      }
    });

    /* =========================================================
       KEEP CUSTOMER PATIENCE RESPONSIVE
       ========================================================= */

    setInterval(function() {
      if (!state.isOpen || !state.activeCustomer) {
        return;
      }

      updateCustomerPatienceOnly();
      checkCustomerTimeout();
    }, 250);

    /* =========================================================
       BOOT
       ========================================================= */

    init();
  </script>
</body>
</html>
