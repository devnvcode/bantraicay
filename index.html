<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Trái Cây Siêu Cấp Đáng Yêu 🍓</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            /* Bảng màu Pastel */
            --bg-color: #FFF2F2;
            --panel-bg: #FFE5E5;
            --border-color: #7B6079;
            --text-color: #594545;
            --btn-pink: #FF8787;
            --btn-pink-hover: #FF6B6B;
            --btn-green: #A3D9A5;
            --btn-green-hover: #82C985;
            --btn-yellow: #FFD166;
            --shelf-color: #FFD6A5;
            --flat-shadow: 4px 4px 0px var(--border-color);
            --flat-shadow-sm: 2px 2px 0px var(--border-color);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #FFC4C4;
            border-bottom: 3px solid var(--border-color);
            box-shadow: 0 4px 0px rgba(123, 96, 121, 0.1); /* Bóng phẳng mờ nhẹ, không glow */
            z-index: 10;
        }

        .header-item {
            font-size: 1.2rem;
            font-weight: 700;
            background: white;
            padding: 8px 20px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--flat-shadow-sm);
        }

        .btn-toggle {
            padding: 10px 25px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--btn-green);
            color: var(--text-color);
            box-shadow: var(--flat-shadow);
            transition: transform 0.1s;
        }
        .btn-toggle:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border-color);
        }
        .btn-toggle.closed {
            background-color: var(--btn-pink);
        }

        /* MAIN LAYOUT - 3 CỘT */
        main {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 80px);
        }

        .panel {
            background-color: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--flat-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .panel-title {
            background-color: var(--border-color);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* 1. KHO NHẬP HÀNG */
        .inventory-area {
            flex: 1;
            min-width: 300px;
        }
        .inv-list {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .fruit-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--flat-shadow-sm);
        }
        .fruit-icon-lg { font-size: 2.5rem; }
        .fruit-info { flex: 1; margin-left: 10px; }
        .fruit-name { font-weight: 800; font-size: 1.1rem; }
        .fruit-price { font-size: 0.9rem; color: #888; }
        .fruit-qty { font-weight: 700; color: var(--btn-pink-hover); }
        .inv-actions { display: flex; flex-direction: column; gap: 5px; }
        
        button {
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            cursor: pointer;
            padding: 5px 10px;
            box-shadow: 2px 2px 0px var(--border-color);
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 var(--border-color);
        }
        .btn-buy { background-color: var(--btn-yellow); }
        .btn-restock { background-color: var(--btn-green); }

        /* 2. KHU VỰC BÁN HÀNG */
        .sales-area {
            flex: 2;
            background: linear-gradient(180deg, #E6F4F1 0%, #FFF5E4 100%);
        }
        .shelves-container {
            height: 45%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 20px;
            border-bottom: 4px solid var(--border-color);
            background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="2" fill="%237B6079" opacity="0.1"/></svg>');
        }
        .shelf {
            width: 80px;
            height: 120px;
            background-color: var(--shelf-color);
            border: 3px solid var(--border-color);
            border-radius: 10px 10px 0 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
            box-shadow: inset 0 -15px 0 rgba(0,0,0,0.1);
        }
        .shelf-qty {
            position: absolute;
            top: -15px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 2px 8px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: var(--flat-shadow-sm);
        }
        .shelf-fruit { font-size: 2.5rem; }

        .customer-queue {
            height: 55%;
            position: relative;
            overflow: hidden;
        }

        /* KHÁCH HÀNG */
        .customer {
            position: absolute;
            bottom: 20px;
            left: -100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: left 0.5s linear;
        }
        .character {
            font-size: 4rem;
            filter: drop-shadow(2px 2px 0px var(--border-color));
        }
        .speech-bubble {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 5px 15px;
            font-size: 1.5rem;
            position: relative;
            margin-bottom: 5px;
            box-shadow: var(--flat-shadow-sm);
            animation: bounce 1s infinite alternate;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: var(--border-color) transparent transparent transparent;
        }
        .patience-container {
            width: 80px;
            height: 10px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        .patience-bar {
            height: 100%;
            width: 100%;
            background-color: var(--btn-green);
            transition: width 0.1s linear, background-color 0.3s;
        }
        
        /* Hiệu ứng Floating Text */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 1.2rem;
            pointer-events: none;
            text-shadow: 2px 2px 0px white, -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 100;
            text-align: center;
            width: max-content;
            max-width: 200px;
        }

        /* 3. REVIEW APP (MẠNG XÃ HỘI) */
        .review-area {
            flex: 1;
            min-width: 300px;
            background-color: #E8F0FE;
        }
        .phone-header {
            background: #fff;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
        }
        .star-rating { font-size: 2rem; color: #FFB703; text-shadow: 1px 1px 0 var(--border-color); }
        .rating-number { font-weight: 900; font-size: 1.5rem; }
        
        .reviews-list {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: calc(100% - 100px);
        }
        .review-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            box-shadow: var(--flat-shadow-sm);
            animation: slideIn 0.3s ease-out;
        }
        .review-stars { color: #FFB703; font-size: 1rem; margin-bottom: 5px; }
        .review-text { font-size: 0.9rem; font-weight: 700; line-height: 1.4; }
        
        /* MODAL TỔNG KẾT */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(89, 69, 69, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #FFF;
            border: 4px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 400px;
            text-align: center;
            box-shadow: 8px 8px 0px var(--border-color);
            transform: translateY(50px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        .modal-content h1 { font-size: 2rem; margin-bottom: 20px; color: var(--btn-pink-hover); }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 5px;
        }
        .profit { color: var(--btn-green-hover); font-size: 1.5rem; font-weight: 900; margin-top: 20px;}
        .loss { color: #FF4D4D; font-size: 1.5rem; font-weight: 900; margin-top: 20px;}
        .btn-next-day {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 1.2rem;
            background: var(--btn-pink);
            width: 100%;
        }

        /* Animations */
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }
        @keyframes slideIn {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-item" id="money-display">💰 Tiền: $500</div>
        <div class="header-item" id="day-display">Ngày 1</div>
        <div class="header-item" id="clock-display">⏰ 08:00</div>
        <button class="btn-toggle closed" id="toggle-shop-btn">🔴 ĐANG ĐÓNG CỬA</button>
    </header>

    <main>
        <!-- Cột 1: Kho & Nhập Hàng -->
        <div class="panel inventory-area">
            <div class="panel-title">📦 KHO NHẬP HÀNG</div>
            <div class="inv-list" id="inventory-list">
                <!-- Gen bằng JS -->
            </div>
        </div>

        <!-- Cột 2: Cửa Hàng -->
        <div class="panel sales-area">
            <div class="panel-title">🏪 KHU VỰC BÁN HÀNG</div>
            <div class="shelves-container" id="shelves-container">
                <!-- Gen bằng JS -->
            </div>
            <div class="customer-queue" id="customer-queue">
                <!-- Khách hàng xuất hiện ở đây -->
            </div>
        </div>

        <!-- Cột 3: Điện thoại Đánh Giá -->
        <div class="panel review-area">
            <div class="panel-title">📱 FOOD-TOK REVIEWS</div>
            <div class="phone-header">
                <div class="star-rating">⭐⭐⭐⭐⭐</div>
                <div class="rating-number"><span id="avg-rating">5.0</span> / 5.0</div>
            </div>
            <div class="reviews-list" id="reviews-list">
                <!-- Gen bằng JS -->
            </div>
        </div>
    </main>

    <!-- Modal Tổng kết ngày -->
    <div class="modal-overlay" id="summary-modal">
        <div class="modal-content">
            <h1>🌙 Hết Ngày Rồi!</h1>
            <div class="stat-row">
                <span>Doanh thu:</span>
                <span id="stat-revenue" style="color: green;">+$0</span>
            </div>
            <div class="stat-row">
                <span>Tiền nhập hàng:</span>
                <span id="stat-cost" style="color: red;">-$0</span>
            </div>
            <div class="stat-row">
                <span>Khách phục vụ:</span>
                <span id="stat-served">0</span>
            </div>
            <div class="stat-row">
                <span>Khách giận bỏ đi:</span>
                <span id="stat-angry">0</span>
            </div>
            <div class="stat-row profit" id="stat-profit">
                <span>Lợi nhuận:</span>
                <span>$0</span>
            </div>
            <button class="btn-next-day" id="btn-next-day">Bắt đầu Ngày Mới ☀️</button>
        </div>
    </div>

<script>
    // --- DATABASE & CẤU HÌNH ---
    const FRUIT_DB = {
        apple:      { id: 'apple', name: 'Táo Đỏ', icon: '🍎', cost: 3, price: 10 },
        banana:     { id: 'banana', name: 'Chuối', icon: '🍌', cost: 2, price: 8 },
        watermelon: { id: 'watermelon', name: 'Dưa Hấu', icon: '🍉', cost: 10, price: 25 },
        strawberry: { id: 'strawberry', name: 'Dâu Tây', icon: '🍓', cost: 5, price: 15 },
        mango:      { id: 'mango', name: 'Xoài Cát', icon: '🥭', cost: 7, price: 20 }
    };
    const FRUIT_KEYS = Object.keys(FRUIT_DB);
    const CHARACTERS = ['🙎‍♂️','🙎‍♀️','🧝‍♀️','🧙‍♂️','👨‍🌾','👩‍🍳','🕵️‍♂️','🦸‍♀️'];

    // Câu chửi hài hước khi khách đợi lâu
    const ANGRY_QUOTES = [
        "Làm ăn lề mề quá, dỗi!",
        "Đợi mòn thanh xuân, cạch mặt!",
        "Ủa alo shop? Chậm rì vậy?",
        "Hết hàng thì dẹp tiệm đi!",
        "Thái độ 0 điểm! Đi về!",
        "Rùa bò còn nhanh hơn shop!",
        "Bán buôn chán thế, tốn time!"
    ];

    // --- STATE TRÒ CHƠI ---
    let state = {
        money: 100,
        day: 1,
        time: 8 * 60, // 8:00 AM tính bằng phút
        isOpen: false,
        rating: 5.0,
        inventory: { apple: 10, banana: 10, watermelon: 5, strawberry: 5, mango: 5 },
        shelf:     { apple: 0, banana: 0, watermelon: 0, strawberry: 0, mango: 0 },
        reviews: [],
        customers: [], // Các khách hàng đang đứng chờ
        daily: { revenue: 0, cost: 0, served: 0, angry: 0 }
    };

    let gameTimer = null;
    let spawnTimer = null;
    let loopTimer = null;

    // --- DOM ELEMENTS ---
    const elMoney = document.getElementById('money-display');
    const elDay = document.getElementById('day-display');
    const elClock = document.getElementById('clock-display');
    const btnToggle = document.getElementById('toggle-shop-btn');
    const invList = document.getElementById('inventory-list');
    const shelfContainer = document.getElementById('shelves-container');
    const queueContainer = document.getElementById('customer-queue');
    const reviewList = document.getElementById('reviews-list');
    const elRating = document.getElementById('avg-rating');
    const elStars = document.querySelector('.star-rating');
    const modal = document.getElementById('summary-modal');

    // --- KHỞI TẠO UI ---
    function initUI() {
        updateHUD();
        renderInventory();
        renderShelves();
    }

    function updateHUD() {
        elMoney.innerText = `💰 Tiền: $${state.money}`;
        elDay.innerText = `Ngày ${state.day}`;
        let hours = Math.floor(state.time / 60);
        let mins = state.time % 60;
        elClock.innerText = `⏰ ${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        
        let displayRating = Math.max(1, Math.min(5, state.rating)).toFixed(1);
        elRating.innerText = displayRating;
        let starStr = '';
        for(let i=1; i<=5; i++) {
            starStr += (i <= Math.round(state.rating)) ? '⭐' : '☆';
        }
        elStars.innerText = starStr;
    }

    function renderInventory() {
        invList.innerHTML = '';
        FRUIT_KEYS.forEach(k => {
            let fruit = FRUIT_DB[k];
            let html = `
                <div class="fruit-card">
                    <div class="fruit-icon-lg">${fruit.icon}</div>
                    <div class="fruit-info">
                        <div class="fruit-name">${fruit.name}</div>
                        <div class="fruit-price">Mua sỉ: $${fruit.cost} | Bán: $${fruit.price}</div>
                        <div class="fruit-qty">Trong kho: <span id="inv-qty-${k}">${state.inventory[k]}</span></div>
                    </div>
                    <div class="inv-actions">
                        <button class="btn-buy" onclick="buyFruit('${k}')">Mua +5</button>
                        <button class="btn-restock" onclick="restockFruit('${k}')">Lên kệ</button>
                    </div>
                </div>
            `;
            invList.insertAdjacentHTML('beforeend', html);
        });
    }

    function renderShelves() {
        shelfContainer.innerHTML = '';
        FRUIT_KEYS.forEach(k => {
            let html = `
                <div class="shelf">
                    <div class="shelf-qty" id="shelf-qty-${k}">${state.shelf[k]}/10</div>
                    <div class="shelf-fruit">${FRUIT_DB[k].icon}</div>
                </div>
            `;
            shelfContainer.insertAdjacentHTML('beforeend', html);
        });
    }

    function updateInventoryUI(key) {
        document.getElementById(`inv-qty-${key}`).innerText = state.inventory[key];
        document.getElementById(`shelf-qty-${key}`).innerText = `${state.shelf[key]}/10`;
    }

    // --- LOGIC MUA HÀNG & LÊN KỆ ---
    window.buyFruit = function(key) {
        let cost = FRUIT_DB[key].cost * 5;
        if(state.money >= cost) {
            state.money -= cost;
            state.daily.cost += cost;
            state.inventory[key] += 5;
            updateHUD();
            updateInventoryUI(key);
            spawnFloatingText(`-$${cost}`, queueContainer, 100, 50, '#FF4D4D'); // Chữ bay lên ở giữa màn
        } else {
            alert('Không đủ tiền b ơi! Bán thêm trái cây đi!');
        }
    }

    window.restockFruit = function(key) {
        let currentShelf = state.shelf[key];
        let space = 10 - currentShelf;
        if(space <= 0) return; // Kệ đầy
        if(state.inventory[key] <= 0) {
            alert('Kho đã hết hàng này! Vui lòng mua thêm.');
            return;
        }
        let moveAmount = Math.min(space, state.inventory[key]);
        state.inventory[key] -= moveAmount;
        state.shelf[key] += moveAmount;
        updateInventoryUI(key);
    }

    // --- LOGIC THỜI GIAN & ĐÓNG/MỞ CỬA ---
    btnToggle.addEventListener('click', () => {
        if(state.isOpen) return; // Đang mở không cho đóng sớm
        
        state.isOpen = true;
        btnToggle.innerText = '🟢 ĐANG MỞ CỬA';
        btnToggle.classList.remove('closed');
        
        // Timer thời gian trong game: 1 giây đời thực = 10 phút game
        gameTimer = setInterval(() => {
            state.time += 10; 
            updateHUD();
            if(state.time >= 20 * 60) { // 20:00 (8 PM) đóng cửa
                closeShop();
            }
        }, 1000);

        // Timer sinh khách hàng (phụ thuộc rating)
        scheduleNextCustomer();

        // Game loop cập nhật sự kiên nhẫn
        loopTimer = setInterval(gameLoop, 100);
    });

    function closeShop() {
        state.isOpen = false;
        clearInterval(gameTimer);
        clearTimeout(spawnTimer);
        clearInterval(loopTimer);
        
        btnToggle.innerText = '🔴 ĐANG ĐÓNG CỬA';
        btnToggle.classList.add('closed');
        
        // Đuổi hết khách đang chờ
        state.customers.forEach(c => c.dom.remove());
        state.customers = [];

        // Hiện modal
        showSummary();
    }

    // --- LOGIC KHÁCH HÀNG ---
    function scheduleNextCustomer() {
        if(!state.isOpen) return;
        // Rating càng cao sinh càng nhanh. Rating 5 => 1-2s. Rating 1 => 4-6s.
        let baseDelay = (6 - state.rating) * 1000; 
        let randomDelay = baseDelay + Math.random() * 1500;
        
        spawnTimer = setTimeout(() => {
            spawnCustomer();
            scheduleNextCustomer();
        }, randomDelay);
    }

    let custIdCounter = 0;
    function spawnCustomer() {
        if(state.customers.length >= 6) return; // Quán chật không nhận thêm
        
        let fruitKey = FRUIT_KEYS[Math.floor(Math.random() * FRUIT_KEYS.length)];
        let charIcon = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
        let id = `cust_${custIdCounter++}`;
        
        let dom = document.createElement('div');
        dom.className = 'customer';
        dom.id = id;
        dom.innerHTML = `
            <div class="speech-bubble">${FRUIT_DB[fruitKey].icon}</div>
            <div class="character">${charIcon}</div>
            <div class="patience-container">
                <div class="patience-bar" id="bar-${id}"></div>
            </div>
        `;
        
        // Vị trí khách đứng (từ trái qua phải)
        let slotIndex = state.customers.length; 
        let leftPos = 20 + (slotIndex * 90); 
        dom.style.left = leftPos + 'px';

        // Click để bán
        dom.addEventListener('click', () => serveCustomer(id));

        queueContainer.appendChild(dom);

        state.customers.push({
            id: id,
            fruit: fruitKey,
            patience: 100, // 100%
            dom: dom,
            status: 'waiting'
        });
    }

    function gameLoop() {
        state.customers.forEach((c, index) => {
            if(c.status === 'waiting') {
                c.patience -= 0.6; // Trừ kiên nhẫn mỗi 100ms (~16s tổng cộng)
                let bar = document.getElementById(`bar-${c.id}`);
                if(bar) {
                    bar.style.width = Math.max(0, c.patience) + '%';
                    if(c.patience < 50) bar.style.backgroundColor = '#FFD166'; // Vàng
                    if(c.patience < 20) bar.style.backgroundColor = '#FF4D4D'; // Đỏ
                }

                if(c.patience <= 0) {
                    customerAngryLeave(c);
                } else {
                    // Update vị trí nếu hàng phía trước trống
                    let targetLeft = 20 + (index * 90);
                    c.dom.style.left = targetLeft + 'px';
                }
            }
        });
    }

    function serveCustomer(id) {
        let index = state.customers.findIndex(c => c.id === id);
        if(index === -1) return;
        let c = state.customers[index];
        if(c.status !== 'waiting') return;

        let reqFruit = c.fruit;
        if(state.shelf[reqFruit] > 0) {
            // Có hàng -> Bán thành công
            state.shelf[reqFruit]--;
            updateInventoryUI(reqFruit);
            
            let price = FRUIT_DB[reqFruit].price;
            state.money += price;
            state.daily.revenue += price;
            state.daily.served++;
            updateHUD();

            c.status = 'served';
            
            // Hiệu ứng nhận tiền
            let rect = c.dom.getBoundingClientRect();
            let qRect = queueContainer.getBoundingClientRect();
            spawnFloatingText(`+$${price}`, queueContainer, c.dom.offsetLeft + 20, c.dom.offsetTop, 'green');

            // Thêm review tốt
            addReview(true);

            // Xóa khách
            c.dom.style.transform = 'translateY(-20px)';
            c.dom.style.opacity = '0';
            setTimeout(() => c.dom.remove(), 300);
            state.customers.splice(index, 1);
        } else {
            // Không có hàng
            spawnFloatingText("Hết hàng trên kệ!", queueContainer, c.dom.offsetLeft, c.dom.offsetTop - 20, 'red');
            // Lắc khách
            c.dom.style.animation = 'none';
            setTimeout(() => {
                c.dom.style.transform = 'rotate(10deg)';
                setTimeout(() => c.dom.style.transform = 'rotate(-10deg)', 100);
                setTimeout(() => c.dom.style.transform = 'rotate(0)', 200);
                c.dom.style.animation = 'bounce 1s infinite alternate';
            }, 50);
        }
    }

    function customerAngryLeave(c) {
        c.status = 'leaving';
        state.daily.angry++;
        
        let quote = ANGRY_QUOTES[Math.floor(Math.random() * ANGRY_QUOTES.length)];
        spawnFloatingText(quote, queueContainer, c.dom.offsetLeft - 20, c.dom.offsetTop - 30, '#FF4D4D');
        
        addReview(false);

        // Khách bỏ đi
        c.dom.style.opacity = '0.5';
        c.dom.style.left = '-100px';
        
        let index = state.customers.findIndex(x => x.id === c.id);
        if(index > -1) state.customers.splice(index, 1);
        
        setTimeout(() => c.dom.remove(), 500);
    }

    // --- FLOATING TEXT ---
    function spawnFloatingText(text, parent, x, y, color) {
        let el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.color = color;
        parent.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }

    // --- HỆ THỐNG REVIEW MẠNG XÃ HỘI ---
    function addReview(isGood) {
        let text = "";
        let stars = 5;
        if(isGood) {
            let posText = [
                "Trái cây ngon đỉnh của chóp, chủ tiệm dthw ❤️",
                "Giao hàng nhanh bằng tốc độ người yêu cũ trở mặt. 10 điểm!",
                "10/10 không có nhưng, sẽ quay lại ủng hộ mòn dép.",
                "Tươi rói, ăn một miếng là u mê không lối thoát 😍"
            ];
            text = posText[Math.floor(Math.random() * posText.length)];
            state.rating = Math.min(5.0, state.rating + 0.2);
            stars = 5;
        } else {
            let negText = [
                "Bắt khách đợi như đợi mẹ đi chợ về. Tệ!",
                "Khách khứa đông mà không lo châm hàng. Chê mạnh!",
                "Mới sáng ra làm ăn lề mề, tuột mood dễ sợ 😡",
                "Tiệm gì mà lười, cạch mặt đến già nha!!"
            ];
            text = negText[Math.floor(Math.random() * negText.length)];
            state.rating = Math.max(1.0, state.rating - 0.5); // Phạt nặng
            stars = 1;
        }
        
        updateHUD();

        let reviewHTML = `
            <div class="review-card">
                <div class="review-stars">${'⭐'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
                <div class="review-text">"${text}"</div>
            </div>
        `;
        reviewList.insertAdjacentHTML('afterbegin', reviewHTML);
        if(reviewList.children.length > 20) {
            reviewList.lastChild.remove();
        }
    }

    // --- KẾT THÚC NGÀY ---
    function showSummary() {
        let profit = state.daily.revenue - state.daily.cost;
        document.getElementById('stat-revenue').innerText = `+$${state.daily.revenue}`;
        document.getElementById('stat-cost').innerText = `-$${state.daily.cost}`;
        document.getElementById('stat-served').innerText = state.daily.served;
        document.getElementById('stat-angry').innerText = state.daily.angry;
        
        let pEl = document.getElementById('stat-profit');
        if(profit >= 0) {
            pEl.className = 'stat-row profit';
            pEl.innerHTML = `<span>Lợi nhuận:</span><span>+$${profit}</span>`;
        } else {
            pEl.className = 'stat-row loss';
            pEl.innerHTML = `<span>Lỗ vốn:</span><span>-$${Math.abs(profit)}</span>`;
        }

        modal.classList.add('active');
    }

    document.getElementById('btn-next-day').addEventListener('click', () => {
        modal.classList.remove('active');
        state.day++;
        state.time = 8 * 60; // Reset 8 AM
        state.daily = { revenue: 0, cost: 0, served: 0, angry: 0 }; // Reset stats
        updateHUD();
    });

    // Start game
    initUI();

</script>
</body>
</html>
