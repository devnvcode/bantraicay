                d="m12 4 2.3 4.7 5.2.8-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.7 5.2-.8z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <path
                d="M19.5 3.5v3M18 5h3"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            Đánh Giá
          </button>

        </nav>
      `;
    }

    function renderModal() {
      if (!MODAL_STATE.visible) {
        return `
          <div class="modal-layer hidden"></div>
        `;
      }

      return `
        <div class="modal-layer">
          <div class="modal">
            <div class="modal-icon">
              ${MODAL_STATE.icon}
            </div>

            <h2 class="modal-title">
              ${escapeHTML(MODAL_STATE.title)}
            </h2>

            <p class="modal-message">
              ${escapeHTML(MODAL_STATE.message)}
            </p>

            <div class="modal-actions">
              ${MODAL_STATE.actions.map(action => `
                <button
                  type="button"
                  class="modal-button ${action.primary ? "primary" : "secondary"}"
                  data-action="${action.action}"
                >
                  ${escapeHTML(action.label)}
                </button>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       MODAL / TOAST
    ========================================================= */

    function showModal({
      title,
      message,
      icon = "🍦",
      actions = [
        {
          label: "Đóng",
          action: "close-modal",
          primary: true
        }
      ]
    }) {
      MODAL_STATE.visible = true;
      MODAL_STATE.title = title;
      MODAL_STATE.message = message;
      MODAL_STATE.icon = icon;
      MODAL_STATE.actions = actions;

      render();
    }

    function closeModal() {
      MODAL_STATE.visible = false;
      MODAL_STATE.actions = [];
      render();
    }

    function showToast(message, type = "") {
      const container = document.getElementById("toastContainer");

      if (!container) {
        return;
      }

      const toast = document.createElement("div");

      toast.className = `toast ${type}`;
      toast.textContent = message;

      container.appendChild(toast);

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    /* =========================================================
       CUSTOMER GENERATION
    ========================================================= */

    function getRandomGender() {
      return Math.random() < .5
        ? "male"
        : "female";
    }

    function randomOrderBase() {
      const available = Object.keys(BASES)
        .filter(key => state.inventory.bases[key] > 0);

      return available.length
        ? randomFrom(available)
        : randomFrom(Object.keys(BASES));
    }

    function randomAvailableFlavor() {
      const available = Object.keys(FLAVORS)
        .filter(key => state.inventory.flavors[key] > 0);

      return available.length
        ? randomFrom(available)
        : randomFrom(Object.keys(FLAVORS));
    }

    function randomAvailableTopping() {
      const available = Object.keys(TOPPINGS)
        .filter(key => state.inventory.toppings[key] > 0);

      return available.length
        ? randomFrom(available)
        : randomFrom(Object.keys(TOPPINGS));
    }

    function createCustomer() {
      const gender = getRandomGender();

      const name =
        gender === "male"
          ? randomFrom(MALE_NAMES)
          : randomFrom(FEMALE_NAMES);

      const day = state.day;

      let scoops = 1;

      if (day >= 3 && Math.random() < .42) {
        scoops = 2;
      }

      const creative =
        day >= 5 &&
        Math.random() < .28;

      const base = randomOrderBase();

      let flavors = [];

      if (creative) {
        flavors = Array.from(
          { length: scoops },
          () => randomAvailableFlavor()
        );
      } else {
        flavors = Array.from(
          { length: scoops },
          () => randomAvailableFlavor()
        );
      }

      let topping = null;
      let randomTopping = false;

      if (day >= 3 && Math.random() < .52) {
        topping = randomAvailableTopping();

        if (creative && Math.random() < .5) {
          randomTopping = true;
        }
      }

      const randomFlavors =
        creative && Math.random() < .75;

      const order = {
        base,
        scoops,
        flavors,
        randomFlavors,
        topping,
        randomTopping,
        text: ""
      };

      order.text = createOrderText({
        name,
        order,
        creative
      });

      const now = Date.now();

      return {
        id: "customer_" + now + "_" + Math.random().toString(36).slice(2),
        gender,
        name,
        order,
        createdAt: now,
        expiresAt: now + CUSTOMER_PATIENCE_MS,
        maxPatienceMs: CUSTOMER_PATIENCE_MS,
        hurrySent: false
      };
    }

    function createOrderText({ name, order, creative }) {
      const baseName = BASES[order.base].name;

      if (creative) {
        const creativeTexts = [
          `Shop ơi, cho mình ${order.scoops} viên vị bất kỳ tùy shop mix nhé! Làm giúp mình bằng ${baseName.toLowerCase()} nha.`,
          `Cho mình một phần ${baseName.toLowerCase()} vị ngẫu nhiên ngon nhất quán nhé!`,
          `Shop mix giúp mình ${order.scoops} viên vị bất kỳ nha, mình tin tay nghề của shop ạ!`
        ];

        return randomFrom(creativeTexts);
      }

      const flavorText = order.flavors
        .map(key => FLAVORS[key].name)
        .join(" và ");

      const toppingText =
        order.topping
          ? ` thêm ${TOPPINGS[order.topping].name}`
          : "";

      const templates = [
        `Shop ơi, cho mình ${order.scoops} viên ${flavorText} bằng ${baseName.toLowerCase()}${toppingText} nhé!`,
        `Mình lấy ${baseName.toLowerCase()} ${flavorText}${toppingText} nha shop.`,
        `Cho mình một phần ${flavorText}${toppingText}, dùng ${baseName.toLowerCase()} giúp mình với ạ!`
      ];

      return randomFrom(templates);
    }

    function spawnCustomer(delay = 900) {
      clearTimeout(customerTimer);

      customerTimer = setTimeout(() => {
        if (!state.isOpen) {
          return;
        }

        if (state.minutes >= GAME_END_MINUTE) {
          return;
        }

        if (state.activeCustomer) {
          return;
        }

        state.activeCustomer = createCustomer();

        state.build = {
          base: null,
          flavors: [],
          topping: null
        };

        saveState();
        render();
      }, delay);
    }

    function getPatienceRatio(customer) {
      if (!customer) {
        return 0;
      }

      const now = Date.now();
      const elapsed = now - customer.createdAt;

      let effectiveElapsed = elapsed;

      if (customer.hurrySent) {
        effectiveElapsed =
          customer.hurryAt
            ? customer.hurryAt - customer.createdAt +
              Math.max(
                0,
                now - customer.hurryAt
              ) * 1.9
            : elapsed * 1.9;
      }

      return clamp(
        1 - effectiveElapsed / customer.maxPatienceMs,
        0,
        1
      );
    }

    /* =========================================================
       ORDER TEXT / EMPLOYEE
    ========================================================= */

    function resolveEmployeeOrder(customer) {
      const order = customer.order;

      if (!order.randomFlavors) {
        return [...order.flavors];
      }

      const available = [];

      Object.entries(state.inventory.flavors)
        .forEach(([key, count]) => {
          for (let i = 0; i < count; i++) {
            available.push(key);
          }
        });

      if (available.length < order.scoops) {
        return null;
      }

      const result = [];

      for (let i = 0; i < order.scoops; i++) {
        const index = Math.floor(
          Math.random() * available.length
        );

        result.push(
          available.splice(index, 1)[0]
        );
      }

      return result;
    }

    function employeeAutoBuild() {
      const customer = state.activeCustomer;

      if (!customer) {
        return;
      }

      const flavors =
        resolveEmployeeOrder(customer);

      if (!flavors) {
        showModal({
          title: "Kho chưa đủ nguyên liệu",
          message: "Đơn của khách cần nhiều vị kem hơn số lượng hiện có. Hãy vào Kho Hàng nhập thêm nguyên liệu.",
          icon: "📦",
          actions: [
            {
              label: "Vào Kho Hàng",
              action: "go-warehouse",
              primary: true
            },
            {
              label: "Để khách chờ",
              action: "close-modal"
            }
          ]
        });

        return;
      }

      let topping = customer.order.topping;

      if (customer.order.randomTopping) {
        topping = randomAvailableTopping();
      }

      state.build = {
        base: customer.order.base,
        flavors,
        topping
      };

      saveState();
      render();

      clearTimeout(employeeTimer);

      const speedLevel = state.upgrades.scoopSpeed;

      const duration =
        Math.max(
          900,
          2200 - speedLevel * 300
        );

      employeeTimer = setTimeout(() => {
        if (
          state.isOpen &&
          state.activeCustomer &&
          state.activeCustomer.id === customer.id
        ) {
          serveCurrentOrder();
        }
      }, duration);
    }

    /* =========================================================
       INVENTORY / PURCHASE
    ========================================================= */

    function buyStock(category, key) {
      const catalog =
        category === "flavors"
          ? FLAVORS
          : category === "toppings"
            ? TOPPINGS
            : BASES;

      const item = catalog[key];

      if (!item) {
        return;
      }

      const capacity =
        inventoryCapacity()[category];

      const current =
        state.inventory[category][key];

      if (current + item.bulk > capacity) {
        showModal({
          title: "Kho gần đầy",
          message: `Không thể nhập thêm ${item.bulk} món ${item.name}. Hãy nâng cấp kho hoặc bán bớt hàng trước.`,
          icon: "📦"
        });

        return;
      }

      if (state.cash < item.price) {
        showModal({
          title: "Chưa đủ vốn",
          message: `Bạn cần ${formatMoney(item.price)} để nhập sỉ ${item.name}, nhưng hiện chỉ có ${formatMoney(state.cash)}.`,
          icon: "💰"
        });

        return;
      }

      state.cash -= item.price;
      state.inventory[category][key] += item.bulk;
      state.purchased[category][key] = true;
      state.dayStockCosts += item.price;

      saveState();
      render();

      showToast(
        `Đã nhập ${item.name}: +${item.bulk} · -${formatMoney(item.price)}`,
        "success"
      );
    }

    /* =========================================================
       UPGRADES
    ========================================================= */

    function buyUpgrade(key) {
      const price = upgradePrice(key);

      if (price === null) {
        return;
      }

      if (state.cash < price) {
        showModal({
          title: "Chưa đủ vốn",
          message: `Nâng cấp này cần ${formatMoney(price)}. Tiền hiện có của bạn là ${formatMoney(state.cash)}.`,
          icon: "💰"
        });

        return;
      }

      state.cash -= price;
      state.upgrades[key] += 1;
      state.dayUpgradeCosts += price;

      saveState();
      render();

      showToast(
        `Đã nâng cấp ${upgradeName(key)} thành công!`,
        "success"
      );
    }

    function upgradeName(key) {
      const names = {
        warehouse: "kho hàng",
        scoopSpeed: "quầy múc kem",
        price: "giá bán",
        employee: "nhân viên pha chế"
      };

      return names[key] || "tiệm";
    }

    /* =========================================================
       SHOP OPEN / CLOSE
    ========================================================= */

    function openShop() {
      if (state.isOpen) {
        return;
      }

      if (!canOpenShop()) {
        showModal({
          title: "Chưa thể mở cửa",
          message: "Bạn cần nhập sỉ nguyên liệu ở Kho Hàng trước khi mở bán!",
          icon: "📦",
          actions: [
            {
              label: "Vào Kho Hàng",
              action: "go-warehouse",
              primary: true
            },
            {
              label: "Để sau",
              action: "close-modal"
            }
          ]
        });

        return;
      }

      const shouldPay =
        isEmployeeActive() &&
        state.day - state.staffLastPaidDay >= 2;

      if (shouldPay) {
        const wage = employeeWage();

        if (state.cash < wage) {
          showModal({
            title: "Chưa đủ tiền trả lương",
            message: `Nhân viên cần ${formatMoney(wage)} cho kỳ lương 2 ngày. Hãy kiếm thêm tiền hoặc nhập ít hàng hơn trước khi mở cửa.`,
            icon: "👩‍🍳"
          });

          return;
        }

        state.cash -= wage;
        state.dayStaffCosts += wage;
        state.staffLastPaidDay = state.day;
        state.staffDaysSincePay = 0;
      }

      state.isOpen = true;
      state.minutes = GAME_START_MINUTE;
      state.activeCustomer = null;
      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      dayStartedAt = Date.now();
      dayEndHandled = false;

      saveState();
      render();

      spawnCustomer(500);
    }

    function closeShop() {
      if (!state.isOpen) {
        return;
      }

      state.isOpen = false;
      clearTimeout(customerTimer);
      clearTimeout(serviceTimer);
      clearTimeout(employeeTimer);

      if (state.served < targetForDay(state.day)) {
        state.activeCustomer = null;
        state.build = {
          base: null,
          flavors: [],
          topping: null
        };

        saveState();

        showModal({
          title: "Chưa hoàn thành chỉ tiêu",
          message: `Hôm nay bạn đã phục vụ ${state.served}/${targetForDay(state.day)} khách. Ngày chưa kết thúc, bạn có thể tiếp tục ngày này.`,
          icon: "🌷",
          actions: [
            {
              label: "Tiếp tục ngày này",
              action: "continue-day",
              primary: true
            },
            {
              label: "Ở lại quản lý",
              action: "close-modal"
            }
          ]
        });

        render();
        return;
      }

      finishDay();
    }

    function continueSameDay() {
      closeModal();

      if (!canOpenShop()) {
        showModal({
          title: "Kho đang thiếu nguyên liệu",
          message: "Hãy vào Kho Hàng nhập thêm nguyên liệu trước khi tiếp tục bán.",
          icon: "📦",
          actions: [
            {
              label: "Vào Kho Hàng",
              action: "go-warehouse",
              primary: true
            },
            {
              label: "Đóng",
              action: "close-modal"
            }
          ]
        });

        return;
      }

      openShop();
    }

    function handleEndOfDay() {
      if (dayEndHandled || !state.isOpen) {
        return;
      }

      dayEndHandled = true;
      state.minutes = GAME_END_MINUTE;

      state.isOpen = false;
      clearTimeout(customerTimer);
      clearTimeout(serviceTimer);
      clearTimeout(employeeTimer);

      if (state.activeCustomer) {
        timeoutCustomer();
      }

      if (state.served < targetForDay(state.day)) {
        state.activeCustomer = null;

        saveState();

        showModal({
          title: "Ngày chưa đạt chỉ tiêu",
          message: `Đã đến 21:00 nhưng bạn mới phục vụ ${state.served}/${targetForDay(state.day)} khách. Bạn không bị mất ngày. Hãy tiếp tục ngày này.`,
          icon: "🌙",
          actions: [
            {
              label: "Tiếp tục ngày này",
              action: "continue-day",
              primary: true
            },
            {
              label: "Ở lại quản lý",
              action: "close-modal"
            }
          ]
        });

        render();
        return;
      }

      finishDay();
    }

    function finishDay() {
      state.isOpen = false;

      const target = targetForDay(state.day);

      const summary = {
        day: state.day,
        served: state.served,
        target,
        revenue: state.dayRevenue,
        stockCosts: state.dayStockCosts,
        upgradeCosts: state.dayUpgradeCosts,
        staffCosts: state.dayStaffCosts,
        net:
          state.dayRevenue -
          state.dayStockCosts -
          state.dayUpgradeCosts -
          state.dayStaffCosts
      };

      state.dailyHistory.push(summary);
      state.pendingSummary = true;
      state.pendingSummaryData = summary;

      state.activeCustomer = null;

      saveState();

      showDailySummary();
    }

    function showDailySummary() {
      const summary = state.pendingSummaryData;

      if (!summary) {
        return;
      }

      showModal({
        title: `Hoàn thành Ngày ${summary.day}!`,
        message:
          `Bạn đã phục vụ ${summary.served}/${summary.target} khách. ` +
          `Doanh thu ${formatMoney(summary.revenue)}. ` +
          `Lợi nhuận ròng ${formatMoney(summary.net)}.`,
        icon: "🍨",
        actions: [
          {
            label: `Sang Ngày ${summary.day + 1}`,
            action: "next-day",
            primary: true
          }
        ]
      });
    }

    function nextDay() {
      const summary = state.pendingSummaryData;

      if (!summary) {
        closeModal();
        return;
      }

      state.day += 1;
      state.minutes = GAME_START_MINUTE;
      state.isOpen = false;

      state.served = 0;
      state.walkouts = 0;

      state.dayRevenue = 0;
      state.dayStockCosts = 0;
      state.dayUpgradeCosts = 0;
      state.dayStaffCosts = 0;

      state.activeCustomer = null;

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      state.pendingSummary = false;
      state.pendingSummaryData = null;

      dayEndHandled = false;

      saveState();

      closeModal();
      render();

      showToast(
        `Chào mừng bạn đến Ngày ${state.day}!`,
        "success"
      );
    }

    /* =========================================================
       BUILD / SERVE
    ========================================================= */

    function selectBase(key) {
      if (!BASES[key]) {
        return;
      }

      if (state.inventory.bases[key] <= 0) {
        showModal({
          title: "Hết ốc quế / ly",
          message: `Bạn chưa có ${BASES[key].name}. Hãy nhập thêm tại Kho Hàng.`,
          icon: BASES[key].emoji,
          actions: [
            {
              label: "Vào Kho Hàng",
              action: "go-warehouse",
              primary: true
            },
            {
              label: "Đóng",
              action: "close-modal"
            }
          ]
        });

        return;
      }

      state.build.base = key;

      if (isEmployeeActive()) {
        saveState();
        render();
        employeeAutoBuild();
        return;
      }

      saveState();
      render();
    }

    function selectFlavor(key) {
      if (!FLAVORS[key]) {
        return;
      }

      if (state.inventory.flavors[key] <= 0) {
        showModal({
          title: "Chưa có nguyên liệu",
          message: "Bạn chưa mua nguyên liệu này nên chưa thể mở bán",
          icon: FLAVORS[key].emoji,
          actions: [
            {
              label: "Vào Kho Hàng",
              action: "go-warehouse",
              primary: true
            },
            {
              label: "Đóng",
              action: "close-modal"
            }
          ]
        });

        return;
      }

      if (state.build.flavors.length >= 2) {
        showToast("Mỗi phần chỉ được tối đa 2 viên kem.", "warning");
        return;
      }

      state.build.flavors.push(key);

      saveState();
      render();
    }

    function selectTopping(key) {
      if (key === "none") {
        state.build.topping = null;
        saveState();
        render();
        return;
      }

      if (!TOPPINGS[key]) {
        return;
      }

      if (state.inventory.toppings[key] <= 0) {
        showModal({
          title: "Hết topping",
          message: `Đã hết ${TOPPINGS[key].name}, vui lòng nhập thêm ở Kho Hàng!`,
          icon: TOPPINGS[key].emoji,
          actions: [
            {
              label: "Vào Kho Hàng",
              action: "go-warehouse",
              primary: true
            },
            {
              label: "Đóng",
              action: "close-modal"
            }
          ]
        });

        return;
      }

      state.build.topping = key;

      saveState();
      render();
    }

    function validateCurrentOrder() {
      const customer = state.activeCustomer;

      if (!customer) {
        return {
          ok: false,
          message: "Hiện chưa có khách nào đang chờ."
        };
      }

      const order = customer.order;
      const build = state.build;

      if (!build.base) {
        return {
          ok: false,
          message: "Hãy chọn ốc quế hoặc ly trước."
        };
      }

      if (build.base !== order.base) {
        return {
          ok: false,
          message: `Khách đã gọi ${BASES[order.base].name}. Hãy chọn đúng loại nhé!`
        };
      }

      if (build.flavors.length !== order.scoops) {
        return {
          ok: false,
          message: `Đơn này cần đúng ${order.scoops} viên kem.`
        };
      }

      if (order.randomFlavors) {
        const counts = getSelectedFlavorCounts();

        for (const flavor of Object.keys(counts)) {
          if (
            state.inventory.flavors[flavor] <
            counts[flavor]
          ) {
            return {
              ok: false,
              message: `Đã hết vị ${FLAVORS[flavor].name}, vui lòng nhập thêm ở Kho Hàng!`
            };
          }
        }
      } else if (
        !arraysEqualMultiset(
          build.flavors,
          order.flavors
        )
      ) {
        return {
          ok: false,
          message: "Vị kem chưa đúng với đơn của khách."
        };
      }

      if (order.topping === null) {
        if (build.topping !== null) {
          return {
            ok: false,
            message: "Khách không gọi topping cho phần này."
          };
        }
      } else if (order.randomTopping) {
        if (
          !build.topping ||
          !TOPPINGS[build.topping]
        ) {
          return {
            ok: false,
            message: "Khách muốn một topping bất kỳ."
          };
        }
      } else if (
        build.topping !== order.topping
      ) {
        return {
          ok: false,
          message: `Khách gọi topping ${TOPPINGS[order.topping].name}.`
        };
      }

      return {
        ok: true
      };
    }

    function consumeCurrentOrder() {
      const customer = state.activeCustomer;
      const order = customer.order;
      const build = state.build;

      state.inventory.bases[build.base] -= 1;

      build.flavors.forEach(flavor => {
        state.inventory.flavors[flavor] -= 1;
      });

      if (build.topping) {
        state.inventory.toppings[build.topping] -= 1;
      }
    }

    function calculateRating(customer) {
      const ratio = getPatienceRatio(customer);

      if (ratio > .8) {
        return 5;
      }

      if (ratio > .5) {
        return 4;
      }

      if (ratio > .3) {
        return 3;
      }

      if (ratio > .12) {
        return 2;
      }

      return 1;
    }

    function createReview({
      customer,
      rating,
      timeout = false
    }) {
      let text;

      if (timeout) {
        text = randomFrom(COMPLAINT_REVIEWS);
      } else if (rating >= 4) {
        text = randomFrom(GOOD_REVIEWS);
      } else if (rating === 3) {
        text = randomFrom(MID_REVIEWS);
      } else {
        text = randomFrom(COMPLAINT_REVIEWS);
      }

      const anonymous =
        timeout ||
        rating <= 3
          ? Math.random() < .48
          : false;

      return {
        id:
          "review_" +
          Date.now() +
          "_" +
          Math.random().toString(36).slice(2),

        day: Number(state.day) || 1,

        name: customer.name,
        gender: customer.gender,

        rating,
        text,
        anonymous,

        reply: ""
      };
    }

    function serveCurrentOrder() {
      const result = validateCurrentOrder();

      if (!result.ok) {
        showToast(result.message, "warning");
        return;
      }

      const customer = state.activeCustomer;

      consumeCurrentOrder();

      const rating = calculateRating(customer);

      const review = createReview({
        customer,
        rating,
        timeout: false
      });

      state.reviews.push(review);

      state.served += 1;
      state.totalServed += 1;

      const revenue = sellingPrice();

      state.cash += revenue;
      state.dayRevenue += revenue;
      state.totalRevenue += revenue;

      state.activeCustomer = null;

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      saveState();
      render();

      showToast(
        `Đã phục vụ thành công cho khách ${customer.name}! +${formatMoney(revenue)}`,
        "success"
      );

      if (
        state.served >= targetForDay(state.day)
      ) {
        setTimeout(() => {
          if (state.isOpen) {
            closeShop();
          }
        }, 1100);

        return;
      }

      spawnCustomer(1100);
    }

    function timeoutCustomer() {
      const customer = state.activeCustomer;

      if (!customer) {
        return;
      }

      const review = createReview({
        customer,
        rating: Math.random() < .5 ? 1 : 2,
        timeout: true
      });

      state.reviews.push(review);
      state.walkouts += 1;

      state.activeCustomer = null;

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      saveState();

      showToast(
        `${customer.name} đã rời đi vì chờ quá lâu.`,
        "warning"
      );
    }

    /* =========================================================
       TIME LOOP
    ========================================================= */

    function startClock() {
      cancelAnimationFrame(animationFrame);

      function tick() {
        if (state.isOpen) {
          const elapsed =
            Date.now() - dayStartedAt;

          const minutesPassed =
            Math.floor(elapsed / GAME_MINUTE_MS);

          state.minutes =
            Math.min(
              GAME_END_MINUTE,
              GAME_START_MINUTE + minutesPassed
            );

          const customer = state.activeCustomer;

          if (customer) {
            const ratio = getPatienceRatio(customer);

            if (
              ratio <= .5 &&
              !customer.hurrySent
            ) {
              customer.hurrySent = true;
              customer.hurryAt = Date.now();
              customer.order.text =
                randomFrom(HURRY_MESSAGES);

              saveState();
              render();
            }

            if (ratio <= 0) {
              timeoutCustomer();

              if (state.isOpen) {
                spawnCustomer(900);
              }

              render();
            }
          }

          if (state.minutes >= GAME_END_MINUTE) {
            handleEndOfDay();
          } else {
            renderClockOnly();
          }
        }

        animationFrame =
          requestAnimationFrame(tick);
      }

      animationFrame =
        requestAnimationFrame(tick);
    }

    function renderClockOnly() {
      const shop = document.querySelector(".management-description");

      if (
        shop &&
        state.currentScreen === "shop" &&
        state.isOpen
      ) {
        shop.textContent =
          `Giờ hiện tại ${formatClock(state.minutes)} · Mục tiêu hôm nay ${targetForDay(state.day)} khách`;
      }
    }

    /* =========================================================
       REVIEWS REPLY
    ========================================================= */

    const replyDrafts = {};

    function restoreReplyInputs() {
      Object.keys(replyDrafts).forEach(reviewId => {
        const input = document.querySelector(
          `[data-reply-input="${reviewId}"]`
        );

        if (input) {
          input.value = replyDrafts[reviewId];
        }
      });
    }

    function getReplyInput(reviewId) {
      return document.querySelector(
        `[data-reply-input="${reviewId}"]`
      );
    }

    function setReplyDraft(reviewId, value) {
      replyDrafts[reviewId] = value;
    }

    function sendReply(reviewId) {
      const input = getReplyInput(reviewId);

      if (!input) {
        return;
      }

      const text = input.value.trim();

      if (!text) {
        showToast(
          "Hãy viết nội dung phản hồi trước khi gửi.",
          "warning"
        );

        input.focus();
        return;
      }

      const review =
        state.reviews.find(
          item => item.id === reviewId
        );

      if (!review) {
        return;
      }

      review.reply = text;

      delete replyDrafts[reviewId];

      saveState();
      render();

      showToast(
        "Đã gửi phản hồi cho khách!",
        "success"
      );
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    function navigate(screen) {
      const validScreens = [
        "shop",
        "warehouse",
        "upgrades",
        "reviews"
      ];

      if (!validScreens.includes(screen)) {
        return;
      }

      state.currentScreen = screen;

      saveState();
      render();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    /* =========================================================
       EVENT DELEGATION
       This is intentionally attached only once.
       It prevents the common bug where a re-render creates
       multiple handlers and one tap changes tabs twice.
    ========================================================= */

    document.addEventListener("click", handleDocumentClick);

    document.addEventListener("input", event => {
      const input = event.target;

      if (
        input.matches &&
        input.matches("[data-reply-input]")
      ) {
        setReplyDraft(
          input.dataset.replyInput,
          input.value
        );
      }
    });

    function handleDocumentClick(event) {
      const button =
        event.target.closest("[data-action]");

      if (!button) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      const action = button.dataset.action;

      switch (action) {
        case "start-game":
          startGame();
          break;

        case "navigate":
          navigate(button.dataset.screen);
          break;

        case "open-shop":
          openShop();
          break;

        case "close-shop":
          closeShop();
          break;

        case "continue-day":
          continueSameDay();
          break;

        case "next-day":
          nextDay();
          break;

        case "close-modal":
          closeModal();
          break;

        case "go-warehouse":
          closeModal();
          navigate("warehouse");
          break;

        case "buy-stock":
          buyStock(
            button.dataset.category,
            button.dataset.key
          );
          break;

        case "buy-upgrade":
          buyUpgrade(button.dataset.key);
          break;

        case "select-base":
          selectBase(button.dataset.key);
          break;

        case "select-flavor":
          selectFlavor(button.dataset.key);
          break;

        case "select-topping":
          selectTopping(button.dataset.key);
          break;

        case "reset-build":
          resetBuild();
          break;

        case "serve-order":
          serveCurrentOrder();
          break;

        case "send-reply":
          sendReply(button.dataset.reviewId);
          break;

        case "use-suggestion": {
          const reviewId =
            button.dataset.reviewId;

          const input =
            getReplyInput(reviewId);

          if (input) {
            input.value =
              button.dataset.text || "";

            setReplyDraft(
              reviewId,
              input.value
            );

            input.focus();
          }

          break;
        }

        default:
          break;
      }
    }

    /* =========================================================
       START GAME
    ========================================================= */

    function startGame() {
      const input =
        document.getElementById("shopNameInput");

      const name =
        input
          ? input.value.trim()
          : "";

      if (!name) {
        input?.focus();

        showToast(
          "Bạn hãy đặt tên cho tiệm trước nhé! 🍦",
          "warning"
        );

        return;
      }

      state.initialized = true;
      state.shopName = name;
      state.day = 1;
      state.cash = 400000;
      state.isOpen = false;
      state.currentScreen = "shop";

      state.inventory = {
        flavors: {
          chocolate: 0,
          strawberry: 0,
          vanilla: 0,
          matcha: 0,
          butter: 0,
          durian: 0
        },

        toppings: {
          sprinkles: 0,
          strawberrySauce: 0,
          cherry: 0,
          cookie: 0
        },

        bases: {
          cone: 0,
          cup: 0
        }
      };

      state.purchased = {
        flavors: {
          chocolate: false,
          strawberry: false,
          vanilla: false,
          matcha: false,
          butter: false,
          durian: false
        },

        toppings: {
          sprinkles: false,
          strawberrySauce: false,
          cherry: false,
          cookie: false
        },

        bases: {
          cone: false,
          cup: false
        }
      };

      state.upgrades = {
        warehouse: 0,
        scoopSpeed: 0,
        price: 0,
        employee: 0
      };

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      state.activeCustomer = null;
      state.reviews = [];
      state.served = 0;
      state.walkouts = 0;

      state.dayRevenue = 0;
      state.dayStockCosts = 0;
      state.dayUpgradeCosts = 0;
      state.dayStaffCosts = 0;

      state.totalRevenue = 0;
      state.totalServed = 0;

      state.staffLastPaidDay = 0;
      state.staffDaysSincePay = 0;

      state.dailyHistory = [];

      state.pendingSummary = false;
      state.pendingSummaryData = null;

      saveState();
      render();

      showToast(
        `Chào mừng bạn đến với ${state.shopName}! Hãy nhập nguyên liệu trước khi mở cửa nhé.`,
        "success"
      );
    }

    /* =========================================================
       INIT
    ========================================================= */

    loadState();
    render();
    startClock();

    /*
      Nếu game đã lưu nhưng chưa từng hoàn tất màn chào,
      vẫn giữ nguyên màn hình welcome.

      Nếu đã có game:
      - luôn khởi động ở ĐÓNG CỬA
      - không giữ khách cũ
      - không tự động bán hàng
      - không tự động trừ tiền
      - toàn bộ kho, tiền, ngày, đánh giá và nâng cấp được giữ.
    */

    window.addEventListener("beforeunload", () => {
      saveState();
    });
  </script>
</body>
</html>
