<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#ffe7ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Tiệm Bán Kem Ngọt Ngào</title>

  <style>
    :root {
      --pink-50: #fff8fa;
      --pink-100: #ffedf2;
      --pink-200: #ffdce5;
      --pink-300: #ffc3d2;
      --pink-400: #f99db5;
      --pink-500: #ef7898;
      --pink-600: #d95f81;

      --cream: #fffaf0;
      --vanilla: #fff3c7;
      --brown: #825a4b;
      --brown-dark: #593d35;
      --wood: #c88c62;
      --wood-dark: #a96e49;

      --mint: #cceee1;
      --mint-dark: #68ae96;

      --blue: #dceffc;
      --blue-dark: #79afd0;

      --purple: #e8ddfa;
      --purple-dark: #987cc4;

      --yellow: #ffe28d;
      --gold: #f2bb42;

      --red: #e86d78;
      --green: #62ae83;

      --shadow-soft:
        0 18px 45px rgba(130, 77, 91, .12),
        0 5px 16px rgba(130, 77, 91, .08);

      --shadow-card:
        0 10px 30px rgba(118, 74, 84, .10),
        0 2px 8px rgba(118, 74, 84, .07);

      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;

      --app-width: 540px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.95), transparent 30%),
        linear-gradient(180deg, #fff4f7 0%, #fff9f0 100%);
      color: var(--brown-dark);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
    }

    input {
      outline: none;
    }

    #app {
      width: min(100%, var(--app-width));
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.75),
          rgba(255,249,244,.88)
        );
      box-shadow:
        0 0 0 1px rgba(255,255,255,.7),
        0 0 60px rgba(130,80,90,.08);
    }

    .screen {
      min-height: 100dvh;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    .fade-in {
      animation: fadeIn .35s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       WELCOME
    ========================================================= */

    .welcome {
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 50% 20%, #ffffff 0%, #fff4f7 42%, #ffeef3 100%);
    }

    .welcome::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      left: -130px;
      top: 30%;
      background: rgba(255,255,255,.6);
      border-radius: 50%;
      filter: blur(5px);
    }

    .welcome::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      right: -150px;
      bottom: 8%;
      background: rgba(255,222,232,.55);
      border-radius: 50%;
      filter: blur(8px);
    }

    .cloud {
      position: absolute;
      width: 125px;
      height: 36px;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      filter: blur(.2px);
      opacity: .78;
      animation: cloudMove linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      bottom: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
    }

    .cloud::before {
      width: 48px;
      height: 48px;
      left: 20px;
    }

    .cloud::after {
      width: 62px;
      height: 62px;
      right: 18px;
    }

    .cloud-1 {
      top: 12%;
      left: -150px;
      animation-duration: 25s;
    }

    .cloud-2 {
      top: 27%;
      left: -190px;
      transform: scale(.7);
      animation-duration: 31s;
      animation-delay: -10s;
    }

    .cloud-3 {
      top: 46%;
      left: -160px;
      transform: scale(.55);
      animation-duration: 36s;
      animation-delay: -17s;
    }

    @keyframes cloudMove {
      from {
        transform: translateX(0) scale(var(--cloud-scale,1));
      }
      to {
        transform: translateX(calc(var(--app-width) + 390px)) scale(var(--cloud-scale,1));
      }
    }

    .welcome-particle {
      position: absolute;
      animation:
        particleFloat 4s ease-in-out infinite,
        particleDrift 12s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
    }

    .pearl {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, #fff, #e9a4bd 58%, #d77d9e);
      box-shadow: 0 5px 12px rgba(206,108,139,.18);
    }

    .mini-cone {
      width: 22px;
      height: 31px;
      position: relative;
      transform: rotate(12deg);
    }

    .mini-cone::before {
      content: "";
      position: absolute;
      width: 17px;
      height: 21px;
      left: 3px;
      top: 9px;
      background:
        linear-gradient(135deg, transparent 47%, rgba(130,90,70,.2) 49%, transparent 52%),
        linear-gradient(45deg, transparent 47%, rgba(130,90,70,.2) 49%, transparent 52%),
        #e9b875;
      clip-path: polygon(8% 0, 92% 0, 50% 100%);
      border-radius: 3px 3px 9px 9px;
    }

    .mini-cone::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 15px;
      left: 2px;
      top: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 35%, #fff 0 8%, transparent 9%),
        #f5a8bf;
      box-shadow: 0 3px 6px rgba(150,70,100,.14);
    }

    .welcome-content {
      position: relative;
      z-index: 5;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px 22px 28px;
    }

    .welcome-brand {
      text-align: center;
      margin-bottom: 14px;
      animation: brandFloat 3.5s ease-in-out infinite;
    }

    .brand-small {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--pink-500);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(30px, 9vw, 46px);
      line-height: .98;
      letter-spacing: -2px;
      font-weight: 1000;
      color: var(--brown-dark);
      text-shadow: 0 3px 0 rgba(255,255,255,.8);
    }

    .brand-subtitle {
      margin: 10px auto 0;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.55;
      color: #9a7479;
      font-weight: 700;
    }

    @keyframes brandFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .hero-icecream {
      width: min(260px, 64vw);
      height: 300px;
      position: relative;
      margin: 2px 0 10px;
      animation: heroWobble 4.8s ease-in-out infinite;
      filter: drop-shadow(0 18px 18px rgba(150,80,100,.12));
    }

    @keyframes heroWobble {
      0%, 100% {
        transform: rotate(-3deg) translateY(0);
      }
      25% {
        transform: rotate(3deg) translateY(-5px);
      }
      50% {
        transform: rotate(-2deg) translateY(-8px);
      }
      75% {
        transform: rotate(3deg) translateY(-3px);
      }
    }

    .hero-cone {
      position: absolute;
      width: 106px;
      height: 145px;
      left: 77px;
      top: 125px;
      background:
        linear-gradient(135deg, transparent 46%, rgba(130,85,60,.18) 48%, transparent 51%),
        linear-gradient(45deg, transparent 46%, rgba(130,85,60,.18) 48%, transparent 51%),
        linear-gradient(90deg, #eebd7d, #dca465);
      clip-path: polygon(5% 0,95% 0,52% 100%);
      border-radius: 8px 8px 32px 32px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
    }

    .hero-scoop {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      left: 74px;
      top: 76px;
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.8) 0 7%, transparent 8%),
        radial-gradient(circle at 55% 45%, #fff0f5 0 12%, transparent 13%),
        linear-gradient(145deg, #ffc7d7, #f18da9);
      box-shadow:
        inset -10px -12px 0 rgba(203,81,119,.08),
        0 10px 22px rgba(200,91,122,.15);
    }

    .hero-scoop-2 {
      width: 108px;
      height: 108px;
      left: 21px;
      top: 102px;
      background:
        radial-gradient(circle at 34% 24%, #fff 0 7%, transparent 8%),
        linear-gradient(145deg, #fff2c7, #efc979);
    }

    .hero-scoop-3 {
      width: 106px;
      height: 106px;
      left: 126px;
      top: 102px;
      background:
        radial-gradient(circle at 32% 24%, #fff 0 7%, transparent 8%),
        linear-gradient(145deg, #dff4e7, #91d1b2);
    }

    .hero-face {
      position: absolute;
      left: 104px;
      top: 124px;
      width: 55px;
      height: 34px;
      z-index: 4;
    }

    .hero-eye {
      position: absolute;
      width: 7px;
      height: 10px;
      border-radius: 50%;
      background: #6f4d4a;
      top: 6px;
    }

    .hero-eye.left { left: 9px; }
    .hero-eye.right { right: 9px; }

    .hero-mouth {
      position: absolute;
      width: 12px;
      height: 8px;
      left: 21px;
      top: 18px;
      border-bottom: 2px solid #6f4d4a;
      border-radius: 0 0 50% 50%;
    }

    .hero-cheek {
      position: absolute;
      width: 13px;
      height: 7px;
      border-radius: 50%;
      background: rgba(237,103,137,.38);
      top: 18px;
    }

    .hero-cheek.left { left: 0; }
    .hero-cheek.right { right: 0; }

    .welcome-card {
      width: 100%;
      max-width: 380px;
      padding: 18px;
      border-radius: 28px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
    }

    .welcome-label {
      display: block;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #a57c83;
      margin-bottom: 8px;
    }

    .shop-name-input {
      width: 100%;
      height: 53px;
      border: 2px solid #f8d9e2;
      border-radius: 17px;
      background: #fffafa;
      padding: 0 17px;
      color: var(--brown-dark);
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      transition: .2s ease;
    }

    .shop-name-input:focus {
      border-color: var(--pink-400);
      box-shadow: 0 0 0 4px rgba(249,157,181,.12);
    }

    .primary-btn {
      width: 100%;
      min-height: 54px;
      margin-top: 12px;
      border-radius: 17px;
      background:
        linear-gradient(135deg, #f6a5bc, #eb7699);
      color: #fff;
      font-weight: 1000;
      letter-spacing: .3px;
      box-shadow:
        0 9px 20px rgba(220,93,126,.22),
        inset 0 1px 0 rgba(255,255,255,.45);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .primary-btn:active {
      transform: scale(.975);
      box-shadow: 0 4px 10px rgba(220,93,126,.18);
    }

    .welcome-note {
      text-align: center;
      margin: 11px 0 0;
      font-size: 10px;
      color: #b08f94;
      font-weight: 700;
    }

    /* =========================================================
       MAIN APP
    ========================================================= */

    .game-screen {
      min-height: 100dvh;
      padding-bottom: 82px;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.9), transparent 28%),
        linear-gradient(180deg, #fff9fb 0%, #fffaf4 100%);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding:
        max(12px, env(safe-area-inset-top))
        13px
        10px;
      background: rgba(255,249,251,.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(237,202,210,.55);
    }

    .topbar-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .shop-sign {
      min-width: 0;
    }

    .shop-sign small {
      display: block;
      font-size: 9px;
      font-weight: 1000;
      letter-spacing: 2px;
      color: var(--pink-500);
      text-transform: uppercase;
    }

    .shop-sign strong {
      display: block;
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      line-height: 1.1;
      color: var(--brown-dark);
    }

    .wallet {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 5px 15px rgba(110,67,77,.08);
      border: 1px solid #f4dce2;
    }

    .wallet-icon {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #fff1ba;
      font-size: 14px;
    }

    .wallet-text small {
      display: block;
      font-size: 8px;
      color: #a9878c;
      font-weight: 900;
    }

    .wallet-text strong {
      display: block;
      font-size: 12px;
      color: #815c42;
    }

    .day-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      margin-top: 9px;
    }

    .day-pill,
    .time-pill,
    .target-pill {
      flex: 1;
      min-width: 0;
      padding: 7px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,.8);
      border: 1px solid #f1dfe3;
      text-align: center;
      font-size: 10px;
      font-weight: 1000;
      color: #8a666b;
    }

    .time-pill {
      color: var(--pink-600);
      background: #fff0f4;
    }

    .target-pill {
      color: #9a7a35;
      background: #fff7d8;
    }

    .content {
      padding: 13px;
    }

    /* =========================================================
       CLOSED SHOP
    ========================================================= */

    .closed-card {
      margin-top: 5px;
      border-radius: 28px;
      padding: 25px 18px;
      background:
        linear-gradient(145deg, #fff, #fff6f8);
      border: 1px solid #f3dce3;
      box-shadow: var(--shadow-card);
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .closed-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #fff0f4;
      right: -80px;
      top: -90px;
    }

    .closed-door {
      width: 108px;
      height: 108px;
      margin: 0 auto 14px;
      border-radius: 32px;
      background: #ffe5ec;
      display: grid;
      place-items: center;
      font-size: 48px;
      position: relative;
      box-shadow: inset 0 -7px 0 rgba(208,105,132,.08);
    }

    .closed-card h2 {
      margin: 0;
      font-size: 23px;
      color: var(--brown-dark);
    }

    .closed-card p {
      margin: 8px auto 17px;
      max-width: 350px;
      font-size: 12px;
      line-height: 1.6;
      color: #9a797e;
      font-weight: 700;
    }

    .open-warning {
      margin: 0 auto 12px;
      max-width: 350px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #fff6dc;
      color: #977535;
      font-size: 11px;
      font-weight: 900;
    }

    .open-button {
      width: 100%;
      max-width: 350px;
      min-height: 55px;
      border-radius: 17px;
      background: linear-gradient(135deg, #82c7aa, #5ca98b);
      color: white;
      font-weight: 1000;
      box-shadow: 0 9px 18px rgba(80,150,120,.2);
    }

    .open-button:disabled {
      background: #d8d1d2;
      color: #f9f6f6;
      box-shadow: none;
    }

    .closed-mini-info {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .mini-info {
      padding: 10px 5px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #f2e1e5;
    }

    .mini-info strong {
      display: block;
      font-size: 14px;
      color: var(--brown-dark);
    }

    .mini-info span {
      display: block;
      margin-top: 3px;
      font-size: 8px;
      color: #a9888d;
      font-weight: 800;
    }

    /* =========================================================
       SHOP COUNTER
    ========================================================= */

    .shop-scene {
      border-radius: 27px;
      overflow: hidden;
      background:
        linear-gradient(180deg, #dff4fb 0%, #f8fcfc 46%, #f6e9de 46%, #efd8c4 100%);
      box-shadow: var(--shadow-card);
      border: 1px solid #eadde0;
      position: relative;
    }

    .sky-deco {
      height: 94px;
      position: relative;
      overflow: hidden;
    }

    .scene-cloud {
      position: absolute;
      height: 19px;
      width: 65px;
      border-radius: 99px;
      background: rgba(255,255,255,.78);
      top: 21px;
    }

    .scene-cloud::before,
    .scene-cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.84);
      bottom: 5px;
    }

    .scene-cloud::before {
      width: 27px;
      height: 27px;
      left: 9px;
    }

    .scene-cloud::after {
      width: 35px;
      height: 35px;
      right: 7px;
    }

    .scene-cloud-1 {
      left: 18px;
      animation: tinyCloud 13s linear infinite;
    }

    .scene-cloud-2 {
      right: 10px;
      top: 49px;
      transform: scale(.75);
      animation: tinyCloud2 17s linear infinite;
    }

    @keyframes tinyCloud {
      50% { transform: translateX(35px); }
    }

    @keyframes tinyCloud2 {
      50% { transform: translateX(-35px) scale(.75); }
    }

    .counter-awning {
      position: absolute;
      left: 0;
      right: 0;
      top: 71px;
      height: 35px;
      z-index: 5;
      border-radius: 19px 19px 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          #ffb4c7 0 31px,
          #fff4f5 31px 62px
        );
      box-shadow: 0 7px 12px rgba(124,72,77,.12);
    }

    .counter-awning::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      height: 17px;
      border-radius: 0 0 50% 50%;
      background:
        repeating-linear-gradient(
          90deg,
          #ffb4c7 0 31px,
          #fff4f5 31px 62px
        );
    }

    .jar-row {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(6,1fr);
      gap: 5px;
      padding: 17px 8px 14px;
      margin-top: 20px;
    }

    .jar {
      min-width: 0;
      position: relative;
      padding: 0;
      height: 91px;
      border-radius: 12px 12px 15px 15px;
      background: transparent;
      overflow: visible;
      transition: transform .16s ease;
    }

    .jar:active {
      transform: scale(.95);
    }

    .jar.disabled {
      opacity: .6;
    }

    .jar-lid {
      position: absolute;
      top: 0;
      left: 8%;
      width: 84%;
      height: 13px;
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(255,255,255,.95), rgba(220,226,229,.75));
      border: 1px solid rgba(170,170,170,.35);
      z-index: 3;
    }

    .jar-body {
      position: absolute;
      left: 11%;
      top: 8px;
      width: 78%;
      height: 62px;
      border-radius: 9px 9px 12px 12px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.1) 25%, rgba(255,255,255,.35) 55%, rgba(255,255,255,.1));
      border: 1px solid rgba(160,150,150,.3);
      overflow: hidden;
    }

    .jar-fill {
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 3px;
      height: 12%;
      border-radius: 6px;
      transition: height .35s ease;
      opacity: .92;
    }

    .jar-shine {
      position: absolute;
      left: 8px;
      top: 14px;
      width: 4px;
      height: 35px;
      border-radius: 99px;
      background: rgba(255,255,255,.58);
      z-index: 2;
    }

    .jar-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      font-size: 7px;
      font-weight: 1000;
      color: #77585b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jar-count {
      position: absolute;
      z-index: 5;
      right: -2px;
      top: -7px;
      min-width: 21px;
      height: 21px;
      border-radius: 99px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 2px solid #f4dce2;
      color: #856166;
      font-size: 8px;
      font-weight: 1000;
    }

    .jar-empty .jar-body {
      background: rgba(255,255,255,.42);
    }

    .jar-empty .jar-count {
      color: #c79da5;
    }

    .jar-disabled {
      pointer-events: none;
    }

    .counter-surface {
      height: 64px;
      background:
        linear-gradient(180deg, #d69d70, #b97b52);
      border-top: 7px solid #9d6647;
      border-bottom: 7px solid #8f5c41;
      position: relative;
      box-shadow: inset 0 6px 0 rgba(255,255,255,.12);
    }

    .wood-grain {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 18px;
      height: 3px;
      border-radius: 50%;
      background: rgba(104,64,43,.15);
      box-shadow:
        75px 10px rgba(104,64,43,.13),
        170px -5px rgba(104,64,43,.11),
        260px 8px rgba(104,64,43,.14),
        330px -4px rgba(104,64,43,.10);
    }

    /* =========================================================
       CAT
    ========================================================= */

    .cat-area {
      position: relative;
      min-height: 165px;
      background:
        linear-gradient(180deg, #f4ddcf, #ecd0c1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-cushion {
      position: absolute;
      width: 190px;
      height: 62px;
      border-radius: 50%;
      bottom: 20px;
      background:
        radial-gradient(circle at 50% 25%, #ffcbd8, #ef9fb5);
      box-shadow:
        inset 0 -7px 0 rgba(190,80,112,.12),
        0 9px 18px rgba(160,85,100,.12);
    }

    .cat-svg {
      position: relative;
      z-index: 3;
      width: 185px;
      height: 145px;
      overflow: visible;
    }

    .cat-z {
      position: absolute;
      z-index: 5;
      color: #9a7880;
      font-weight: 1000;
      font-style: italic;
      animation: zzzFloat 2.7s ease-in-out infinite;
    }

    .cat-z.z1 {
      right: 105px;
      top: 22px;
      font-size: 13px;
    }

    .cat-z.z2 {
      right: 78px;
      top: 7px;
      font-size: 18px;
      animation-delay: .65s;
    }

    .cat-z.z3 {
      right: 52px;
      top: -18px;
      font-size: 23px;
      animation-delay: 1.15s;
    }

    @keyframes zzzFloat {
      0%,100% {
        opacity: 0;
        transform: translate(0,8px) rotate(-4deg);
      }
      25% {
        opacity: 1;
      }
      65% {
        opacity: .75;
      }
      100% {
        opacity: 0;
        transform: translate(18px,-25px) rotate(7deg);
      }
    }

    /* =========================================================
       CUSTOMER
    ========================================================= */

    .customer-card {
      margin-top: 13px;
      padding: 13px;
      border-radius: 23px;
      background: #fff;
      border: 1px solid #f1dfe4;
      box-shadow: var(--shadow-card);
    }

    .customer-head {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .customer-avatar {
      width: 70px;
      height: 70px;
      flex: 0 0 70px;
      border-radius: 21px;
      overflow: hidden;
      background: #fff0f4;
      border: 2px solid #f8dce3;
    }

    .customer-info {
      min-width: 0;
      flex: 1;
    }

    .customer-name {
      font-size: 15px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .customer-gender {
      display: inline-flex;
      margin-top: 3px;
      padding: 3px 7px;
      border-radius: 8px;
      font-size: 8px;
      font-weight: 1000;
    }

    .gender-female {
      color: #c45678;
      background: #fff0f4;
    }

    .gender-male {
      color: #5780a1;
      background: #edf7ff;
    }

    .order-bubble {
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 15px;
      background: #fff7dd;
      color: #765e4b;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
      position: relative;
    }

    .order-bubble::before {
      content: "";
      position: absolute;
      left: 23px;
      top: -7px;
      width: 14px;
      height: 14px;
      background: #fff7dd;
      transform: rotate(45deg);
    }

    .patience-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .patience-ring {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      position: relative;
    }

    .patience-ring svg {
      width: 64px;
      height: 64px;
      transform: rotate(-90deg);
    }

    .patience-track {
      fill: none;
      stroke: #f1e5e7;
      stroke-width: 7;
    }

    .patience-progress {
      fill: none;
      stroke: #6fc39c;
      stroke-width: 7;
      stroke-linecap: round;
      transition: stroke .3s ease;
    }

    .patience-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .patience-text {
      min-width: 0;
      flex: 1;
    }

    .patience-text strong {
      display: block;
      font-size: 11px;
      color: #80676b;
    }

    .patience-text span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.45;
      color: #ad8c91;
      font-weight: 700;
    }

    .patience-danger .patience-progress {
      stroke: #e86d78;
    }

    .patience-warning .patience-progress {
      stroke: #e9ad4c;
    }

    /* =========================================================
       WORKSPACE
    ========================================================= */

    .workspace {
      margin-top: 13px;
      padding: 15px;
      border-radius: 23px;
      background: #fff;
      border: 1px solid #f0e0e4;
      box-shadow: var(--shadow-card);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 11px;
    }

    .section-title strong {
      font-size: 14px;
      color: var(--brown-dark);
    }

    .section-title span {
      font-size: 9px;
      color: #b18e94;
      font-weight: 800;
    }

    .step-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 12px 0 7px;
      font-size: 10px;
      color: #9b777d;
      font-weight: 1000;
    }

    .step-number {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ffe3ea;
      color: #c96180;
      font-size: 9px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 8px;
    }

    .choice-btn {
      min-height: 47px;
      border-radius: 14px;
      background: #fff8fa;
      border: 1.5px solid #f0dce2;
      color: #795b60;
      font-size: 11px;
      font-weight: 1000;
      transition: .16s ease;
    }

    .choice-btn.selected {
      background: #ffe3ea;
      border-color: #f398b0;
      color: #b94f70;
      box-shadow: 0 4px 10px rgba(228,111,144,.12);
    }

    .flavor-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 7px;
    }

    .flavor-choice {
      min-height: 58px;
      border-radius: 14px;
      background: #fffafa;
      border: 1.5px solid #eee0e2;
      padding: 7px 4px;
      position: relative;
      overflow: hidden;
    }

    .flavor-choice.selected {
      border-color: #ef91aa;
      background: #fff0f4;
    }

    .flavor-dot {
      width: 23px;
      height: 23px;
      margin: 0 auto 3px;
      border-radius: 50%;
      background: var(--flavor-color);
      box-shadow:
        inset -3px -4px rgba(0,0,0,.05),
        0 3px 7px rgba(90,50,50,.08);
    }

    .flavor-choice span {
      display: block;
      font-size: 8px;
      font-weight: 1000;
      color: #7b6266;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flavor-stock {
      position: absolute;
      right: 4px;
      top: 4px;
      min-width: 16px;
      height: 16px;
      border-radius: 99px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid #ead9dc;
      font-size: 7px;
      font-weight: 1000;
      color: #9b7c81;
    }

    .topping-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 6px;
    }

    .topping-btn {
      min-height: 52px;
      border-radius: 13px;
      background: #fff9fb;
      border: 1.5px solid #eee1e4;
      font-size: 8px;
      font-weight: 1000;
      color: #80666b;
      padding: 5px 2px;
    }

    .topping-btn.selected {
      background: #f4ecff;
      border-color: #bda3df;
      color: #76549e;
    }

    .preview {
      margin-top: 14px;
      padding: 11px;
      border-radius: 17px;
      background: #fffaf0;
      border: 1px solid #f1e3ca;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .preview-cup {
      width: 56px;
      height: 62px;
      position: relative;
      flex: 0 0 56px;
    }

    .preview-cone {
      position: absolute;
      width: 42px;
      height: 48px;
      left: 7px;
      top: 13px;
      clip-path: polygon(6% 0,94% 0,52% 100%);
      background:
        linear-gradient(135deg, transparent 46%, rgba(120,78,48,.18) 48%, transparent 51%),
        linear-gradient(45deg, transparent 46%, rgba(120,78,48,.18) 48%, transparent 51%),
        #e4b470;
      border-radius: 4px 4px 15px 15px;
    }

    .preview-cup-base {
      position: absolute;
      width: 42px;
      height: 41px;
      left: 7px;
      top: 19px;
      background: linear-gradient(90deg,#f6b3c4,#ffe0e8);
      clip-path: polygon(8% 0,92% 0,82% 100%,18% 100%);
      border-radius: 5px;
    }

    .preview-scoop {
      position: absolute;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      left: 13px;
      top: 0;
      background: #f7b4c6;
      box-shadow: 0 2px 5px rgba(110,60,70,.1);
    }

    .preview-scoop.two {
      left: 30px;
      top: 6px;
      background: #f3d48d;
    }

    .preview-info {
      flex: 1;
      min-width: 0;
    }

    .preview-info strong {
      display: block;
      font-size: 10px;
      color: #806a50;
    }

    .preview-info span {
      display: block;
      margin-top: 4px;
      font-size: 9px;
      line-height: 1.45;
      color: #aa8e6d;
      font-weight: 700;
    }

    .workspace-actions {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 8px;
      margin-top: 11px;
    }

    .secondary-btn,
    .serve-btn {
      min-height: 52px;
      border-radius: 15px;
      font-weight: 1000;
      font-size: 11px;
    }

    .secondary-btn {
      background: #f7eef0;
      color: #956f77;
    }

    .serve-btn {
      background: linear-gradient(135deg, #f3a3ba, #df6e91);
      color: #fff;
      box-shadow: 0 7px 16px rgba(217,93,126,.18);
    }

    .serve-btn:disabled {
      background: #d9d0d2;
      box-shadow: none;
      color: #f7f5f5;
    }

    .employee-working {
      padding: 10px 11px;
      margin-top: 10px;
      border-radius: 14px;
      background: #edf8f3;
      color: #5e927c;
      font-size: 10px;
      font-weight: 900;
      text-align: center;
    }

    .employee-working .dots::after {
      content: "";
      animation: dots 1.1s steps(4,end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    .bottom-nav {
      position: fixed;
      z-index: 50;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, var(--app-width));
      padding:
        8px
        9px
        max(9px, env(safe-area-inset-bottom));
      background: rgba(255,250,251,.93);
      backdrop-filter: blur(17px);
      border-top: 1px solid #efdde2;
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
    }

    .nav-btn {
      min-height: 56px;
      border-radius: 16px;
      background: transparent;
      color: #aa8c91;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-weight: 900;
      font-size: 8px;
    }

    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    .nav-btn.active {
      color: var(--pink-600);
      background: #fff0f4;
    }

    /* =========================================================
       WAREHOUSE
    ========================================================= */

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .page-header h2 {
      margin: 0;
      font-size: 22px;
      color: var(--brown-dark);
    }

    .page-header p {
      margin: 4px 0 0;
      font-size: 10px;
      color: #a9878d;
      font-weight: 700;
    }

    .warehouse-money {
      padding: 8px 10px;
      border-radius: 13px;
      background: #fff;
      border: 1px solid #f1dfe3;
      font-size: 10px;
      font-weight: 1000;
      color: #826148;
    }

    .inventory-section {
      margin-top: 13px;
    }

    .inventory-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .inventory-section-title strong {
      font-size: 12px;
      color: #81656a;
    }

    .inventory-section-title span {
      font-size: 8px;
      color: #ad9196;
      font-weight: 800;
    }

    .warehouse-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 9px;
    }

    .stock-card {
      background: #fff;
      border: 1px solid #f0e0e4;
      border-radius: 19px;
      padding: 11px;
      box-shadow: 0 5px 15px rgba(100,60,70,.05);
    }

    .stock-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stock-color {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: var(--stock-color);
      flex: 0 0 38px;
      box-shadow: inset -4px -5px rgba(0,0,0,.06);
    }

    .stock-name {
      min-width: 0;
    }

    .stock-name strong {
      display: block;
      font-size: 10px;
      color: #765d62;
    }

    .stock-name span {
      display: block;
      margin-top: 3px;
      font-size: 8px;
      color: #aa8b90;
      font-weight: 800;
    }

    .stock-count {
      margin-top: 9px;
      font-size: 11px;
      color: #8b6c71;
      font-weight: 1000;
    }

    .buy-btn {
      width: 100%;
      min-height: 35px;
      margin-top: 8px;
      border-radius: 11px;
      background: #fff0f4;
      color: #c65c7a;
      font-size: 9px;
      font-weight: 1000;
    }

    .buy-btn:active {
      transform: scale(.97);
    }

    .capacity-card {
      margin-top: 12px;
      padding: 14px;
      border-radius: 19px;
      background: linear-gradient(135deg,#edf8f3,#f8fffb);
      border: 1px solid #d9eee4;
    }

    .capacity-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      font-weight: 1000;
      color: #668a7c;
    }

    .capacity-bar {
      height: 9px;
      border-radius: 99px;
      background: #dbeee6;
      overflow: hidden;
      margin-top: 8px;
    }

    .capacity-fill {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: #75b99d;
      transition: width .3s ease;
    }

    /* =========================================================
       UPGRADES
    ========================================================= */

    .upgrade-grid {
      display: grid;
      gap: 10px;
    }

    .upgrade-card {
      background: #fff;
      border: 1px solid #f0dfe3;
      border-radius: 21px;
      padding: 13px;
      box-shadow: var(--shadow-card);
    }

    .upgrade-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .upgrade-icon {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--upgrade-bg);
      font-size: 22px;
    }

    .upgrade-title {
      min-width: 0;
      flex: 1;
    }

    .upgrade-title strong {
      display: block;
      font-size: 12px;
      color: #765d62;
    }

    .upgrade-title span {
      display: block;
      margin-top: 3px;
      font-size: 8px;
      line-height: 1.4;
      color: #aa8a90;
      font-weight: 700;
    }

    .level-badge {
      padding: 5px 7px;
      border-radius: 9px;
      background: #fff4d5;
      color: #a28135;
      font-size: 8px;
      font-weight: 1000;
    }

    .upgrade-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .upgrade-price {
      font-size: 10px;
      color: #856348;
      font-weight: 1000;
    }

    .upgrade-btn {
      min-height: 37px;
      padding: 0 13px;
      border-radius: 11px;
      background: #f4ecff;
      color: #7d61a5;
      font-size: 9px;
      font-weight: 1000;
    }

    .upgrade-btn:disabled {
      background: #eee8e9;
      color: #aa9fa1;
    }

    .salary-note {
      margin-top: 10px;
      padding: 10px;
      border-radius: 13px;
      background: #fff0f1;
      color: #ae666c;
      font-size: 9px;
      font-weight: 900;
      line-height: 1.45;
    }

    /* =========================================================
       REVIEWS
    ========================================================= */

    .review-list {
      display: grid;
      gap: 10px;
    }

    .review-card {
      background: #fff;
      border: 1px solid #f0dfe3;
      border-radius: 21px;
      padding: 13px;
      box-shadow: 0 6px 18px rgba(100,60,70,.05);
    }

    .review-head {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .review-avatar {
      width: 45px;
      height: 45px;
      flex: 0 0 45px;
      border-radius: 15px;
      overflow: hidden;
      background: #fff0f4;
    }

    .review-user {
      min-width: 0;
      flex: 1;
    }

    .review-user strong {
      display: block;
      font-size: 11px;
      color: #765b60;
    }

    .review-stars {
      margin-top: 3px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .gold-star {
      color: #f2bc45;
      text-shadow: 0 2px 3px rgba(220,170,50,.12);
    }

    .white-star {
      color: #ddd7d8;
    }

    .review-time {
      font-size: 8px;
      color: #b29a9e;
      font-weight: 700;
    }

    .review-text {
      margin-top: 10px;
      padding: 10px;
      border-radius: 14px;
      background: #fff9f1;
      color: #765f58;
      font-size: 10px;
      line-height: 1.55;
      font-weight: 700;
    }

    .reply-area {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }

    .reply-input {
      min-width: 0;
      flex: 1;
      height: 37px;
      border-radius: 11px;
      border: 1px solid #ecdde0;
      background: #fffafa;
      padding: 0 10px;
      font-size: 9px;
      font-weight: 700;
      color: #765d62;
    }

    .reply-btn {
      width: 58px;
      border-radius: 11px;
      background: #ffe7ee;
      color: #c55c7b;
      font-size: 8px;
      font-weight: 1000;
    }

    .owner-reply {
      margin-top: 8px;
      padding: 9px 10px;
      border-radius: 13px;
      background: #edf8f3;
      color: #628b7b;
      font-size: 9px;
      line-height: 1.45;
      font-weight: 800;
    }

    .anonymous-tag {
      color: #8e7e82;
      font-style: italic;
    }

    .empty-state {
      padding: 35px 20px;
      border-radius: 23px;
      text-align: center;
      background: #fff;
      border: 1px solid #f1e0e4;
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .empty-state strong {
      display: block;
      font-size: 15px;
    }

    .empty-state span {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      color: #aa8c91;
      font-weight: 700;
    }

    /* =========================================================
       SUMMARY
    ========================================================= */

    .summary-screen {
      min-height: 100dvh;
      padding: 28px 15px 30px;
      background:
        radial-gradient(circle at 50% 0%, #fff, transparent 35%),
        linear-gradient(180deg,#fff4f7,#fffaf2);
    }

    .summary-card {
      max-width: 470px;
      margin: 0 auto;
      border-radius: 30px;
      padding: 20px;

    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")

}

function randomChance(percent) {

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function formatTime(totalMinutes) {
  const h = Math.floor(totalMinutes / 60);

function getSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
      return null;
    }

    const parsed = JSON.parse(raw);

    if (!parsed || typeof parsed !== "object") {
      return null;
    }

    return parsed;
  } catch {
    return null;
  }
}

function saveState() {
  try {
    const copy = JSON.parse(JSON.stringify(state));

    copy.isOpen = false;
    copy.activeCustomer = null;
    copy.employeeWorking = false;

    localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
  } catch {
  }
}

function loadState() {
  const saved = getSavedState();

  if (!saved) {
    renderWelcome();
    return;

  Object.assign(state, saved);

  state.isOpen = false;
  state.activeCustomer = null;
  state.employeeWorking = false;
  state.minutes = GAME_START_MINUTE;
  state.currentScreen = "shop";
  state.summary = null;

  renderGame();
}

  if (patienceFrame) {

function showToast(title, message, type = "info", icon = "🍨") {
  const container = document.querySelector(".toast-container");

  if (!container) {
    return;
  }

  const toast = document.createElement("div");

  toast.className = "toast toast-" + type;

  toast.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div class="toast-content">
      <div class="toast-title">${escapeHtml(title)}</div>
      <div class="toast-message">${escapeHtml(message)}</div>
    </div>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add("removing");

    setTimeout(() => {
      toast.remove();
    }, 250);
  }, 3200);
}

function showCenterModal({
  title,
  message,
  icon = "🍦",
  danger = false,
  confirmText = "Đã hiểu",
  cancelText = "Đóng",
  onConfirm = null,
  showCancel = true
}) {
  const layer = document.createElement("div");

  layer.className = "modal-layer";

  layer.innerHTML = `
    <div class="modal ${danger ? "modal-danger" : ""}">
      <div class="modal-icon">${icon}</div>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(message)}</p>

      <div class="modal-actions ${showCancel ? "" : "single"}">
        ${
          showCancel
            ? `<button class="modal-cancel" data-modal-cancel>${escapeHtml(cancelText)}</button>`
            : ""
        }

        <button class="modal-confirm" data-modal-confirm>
          ${escapeHtml(confirmText)}
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(layer);

  const close = () => {
    layer.remove();
  };

  layer.addEventListener("click", event => {
    if (event.target === layer) {
      close();
    }

    if (event.target.closest("[data-modal-cancel]")) {
      close();
    }

    if (event.target.closest("[data-modal-confirm]")) {
      if (typeof onConfirm === "function") {
        onConfirm();
      }

      close();
    }
  });
}

function renderJarRow() {
  return `
    <div class="jar-row">
      ${Object.entries(FLAVORS).map(([key, flavor]) => {
        const stock = state.inventory.flavors[key];
        const max = warehouseCapacity();
        const percentage = clamp((stock / max) * 100, 0, 100);

        return `
          <button
            class="jar ${stock <= 0 ? "jar-empty" : ""}"
            type="button"
            data-action="select-flavor"
            data-flavor="${key}"
            aria-label="${escapeHtml(flavor.name)}"
          >
            <div class="jar-lid"></div>

            <div class="jar-body">
              <div
                class="jar-fill"
                style="
                  background:${flavor.color};
                  height:${Math.max(0, percentage)}%;
                "
              ></div>

              <div class="jar-shine"></div>
            </div>

            <div class="jar-count">
              ${stock}
            </div>

            <div class="jar-label">
              ${escapeHtml(flavor.short)}
            </div>
          </button>
        `;
      }).join("")}
    </div>
  `;
}

function renderCustomer() {
  const customer = state.activeCustomer;

  if (!customer) {
    return "";
  }

  const circumference = 2 * Math.PI * 26;

  return `
    <section class="customer-card fade-in">

      <div class="customer-head">

        <div class="customer-avatar">
          ${
            customer.anonymous
              ? createInitialAvatar(customer.gender, customer.hairStyle, true)
              : createInitialAvatar(customer.gender, customer.hairStyle, false)
          }
        </div>

        <div class="customer-info">
          <div class="customer-name">
            ${
              customer.anonymous
                ? "Ẩn danh"
                : escapeHtml(customer.name)
            }
          </div>

          <span class="customer-gender ${
            customer.gender === "female"
              ? "gender-female"
              : "gender-male"
          }">
            ${
              customer.gender === "female"
                ? "👧 Khách nữ"
                : "👦 Khách nam"
            }
          </span>
        </div>
      </div>

      <div class="order-bubble">
        💬 “${escapeHtml(customer.orderText)}”
      </div>

      <div class="patience-wrap">

        <div
          class="patience-ring"
          id="patienceRing"
          data-customer-id="${customer.id}"
        >
          <svg viewBox="0 0 64 64">
            <circle
              class="patience-track"
              cx="32"
              cy="32"
              r="26"
            ></circle>

            <circle
              class="patience-progress"
              id="patienceProgress"
              cx="32"
              cy="32"
              r="26"
              style="
                stroke-dasharray:${circumference};
                stroke-dashoffset:0;
              "
            ></circle>
          </svg>

          <div class="patience-center">
            🍧
          </div>
        </div>

        <div class="patience-text">
          <strong>Độ kiên nhẫn của khách</strong>
          <span>
            Vòng tròn sẽ giảm dần. Hãy hoàn thành món và giao
            trước khi khách hết kiên nhẫn.
          </span>
        </div>

      </div>

    </section>
  `;
}

function renderWorkspace() {
  const employeeActive = state.upgrades.employee > 0;
  const baseSelected = state.build.base !== null;
  const canServeManually =
    baseSelected &&
    state.build.flavors.length > 0 &&
    state.activeCustomer &&
    !state.employeeWorking;

  return `
    <section class="workspace">

      <div class="section-title">
        <strong>🍨 Quầy pha chế</strong>
        <span>
          ${
            employeeActive
              ? "Nhân viên đang hỗ trợ"
              : "Tự tay làm món"
          }
        </span>
      </div>

      <div class="step-label">
        <span class="step-number">1</span>
        Chọn nền kem
      </div>

      <div class="choice-grid">
        <button
          class="choice-btn ${
            state.build.base === "cone" ? "selected" : ""
          }"
          data-action="select-base"
          data-base="cone"
          ${state.employeeWorking ? "disabled" : ""}
        >
          🍦 Ốc quế
          <br>
          <small>${state.inventory.bases.cone} cái</small>
        </button>

        <button
          class="choice-btn ${
            state.build.base === "cup" ? "selected" : ""
          }"
          data-action="select-base"
          data-base="cup"
          ${state.employeeWorking ? "disabled" : ""}
        >
          🥤 Ly giấy
          <br>
          <small>${state.inventory.bases.cup} cái</small>
        </button>
      </div>

      <div class="step-label">
        <span class="step-number">2</span>
        Chọn vị kem
      </div>

      <div class="flavor-grid">
        ${Object.entries(FLAVORS).map(([key, flavor]) => `
          <button
            class="flavor-choice ${
              state.build.flavors.includes(key) ? "selected" : ""
            }"
            style="--flavor-color:${flavor.color}"
            data-action="select-flavor"
            data-flavor="${key}"
            ${state.employeeWorking ? "disabled" : ""}
          >
            <div class="flavor-stock">
              ${state.inventory.flavors[key]}
            </div>

            <div
              class="flavor-dot"
              style="background:${flavor.color}"
            ></div>

            <span>${escapeHtml(flavor.short)}</span>
          </button>
        `).join("")}
      </div>

      <div class="step-label">
        <span class="step-number">3</span>
        Topping / sốt
      </div>

      <div class="topping-grid">
        <button
          class="topping-btn ${
            state.build.topping === null ? "selected" : ""
          }"
          data-action="select-topping"
          data-topping=""
          ${state.employeeWorking ? "disabled" : ""}
        >
          Không topping
        </button>

        ${Object.entries(TOPPINGS).map(([key, topping]) => `
          <button
            class="topping-btn ${
              state.build.topping === key ? "selected" : ""
            }"
            data-action="select-topping"
            data-topping="${key}"
            ${state.employeeWorking ? "disabled" : ""}
          >
            ${escapeHtml(topping.short)}
            <br>
            <small>${state.inventory.toppings[key]}</small>
          </button>
        `).join("")}
      </div>

      <div class="preview">
        <div class="preview-cup">
          ${
            state.build.base === "cup"
              ? `<div class="preview-cup-base"></div>`
              : `<div class="preview-cone"></div>`
          }

          ${
            state.build.flavors.length >= 1
              ? `<div
                  class="preview-scoop"
                  style="background:${FLAVORS[state.build.flavors[0]].color}"
                ></div>`
              : ""
          }

          ${
            state.build.flavors.length >= 2
              ? `<div
                  class="preview-scoop two"
                  style="background:${FLAVORS[state.build.flavors[1]].color}"
                ></div>`
              : ""
          }
        </div>

        <div class="preview-info">
          <strong>
            ${
              state.build.flavors.length
                ? state.build.flavors.map(
                    key => FLAVORS[key].short
                  ).join(" + ")
                : "Chưa chọn vị kem"
            }
          </strong>

          <span>
            ${
              state.build.base
                ? BASES[state.build.base].name
                : "Chưa chọn ốc quế / ly"
            }

            ${
              state.build.topping
                ? " • " + TOPPINGS[state.build.topping].name
                : ""
            }
          </span>
        </div>
      </div>

      ${
        employeeActive
          ? `
            <div class="employee-working ${
              state.employeeWorking ? "" : "hidden"
            }">
              👩‍🍳 Nhân viên đang pha đúng đơn của khách
              <span class="dots"></span>
            </div>
          `
          : ""
      }

      <div class="workspace-actions">
        <button
          class="secondary-btn"
          data-action="reset-build"
          ${state.employeeWorking ? "disabled" : ""}
        >
          LÀM LẠI
        </button>

        <button
          class="serve-btn"
          data-action="serve-customer"
          ${canServeManually ? "" : "disabled"}
        >
          🍦 GIAO KEM
        </button>
      </div>

    </section>
  `;
}

  if (key === "price") {
    const nextLevel = level + 1;

    return PRICE_UPGRADE_COSTS[nextLevel] ?? Infinity;

  return data.costs[level] ?? Infinity;

function startPatienceAnimation() {
  if (patienceFrame) {
    cancelAnimationFrame(patienceFrame);
  }

  const customerId = state.activeCustomer?.id;

  if (!customerId) {
    return;
  }

  const circumference = 2 * Math.PI * 26;

  function frame(now) {
    const customer = state.activeCustomer;

    if (
      !customer ||
      customer.id !== customerId ||
      !state.isOpen
    ) {
      patienceFrame = null;
      return;
    }

    const remaining = clamp(
      customer.expiresAt - performance.now(),
      0,
      CUSTOMER_PATIENCE_MS
    );

    const ratio = remaining / CUSTOMER_PATIENCE_MS;

    const progress = document.getElementById("patienceProgress");
    const ring = document.getElementById("patienceRing");

    if (progress) {
      progress.style.strokeDashoffset =
        circumference * (1 - ratio);
    }

    if (ring) {
      ring.classList.remove(
        "patience-warning",
        "patience-danger"
      );

      if (ratio <= .25) {
        ring.classList.add("patience-danger");
      } else if (ratio <= .5) {
        ring.classList.add("patience-warning");
      }
    }

    if (remaining <= 0) {
      customerLeavesBecauseOfTimeout(customerId);
      patienceFrame = null;
      return;
    }

    patienceFrame = requestAnimationFrame(frame);
  }

  patienceFrame = requestAnimationFrame(frame);
}

function startGameClock() {
  if (clockTimer) {
    clearInterval(clockTimer);
  }

  const startedAt = performance.now();

  const initialGameMinute = state.minutes;

  clockTimer = setInterval(() => {
    if (!state.isOpen) {
      return;
    }

    const elapsed = performance.now() - startedAt;

    state.minutes = initialGameMinute +
      Math.floor(elapsed / REAL_MS_PER_GAME_MINUTE);

    if (state.minutes >= GAME_END_MINUTE) {
      state.minutes = GAME_END_MINUTE;
      saveState();
      handleEndOfBusinessDay();
      return;
    }

    updateClockOnly();
  }, 250);
}

function updateClockOnly() {
  const timePill = document.querySelector(".time-pill");

  if (timePill) {
    timePill.textContent = formatTime(state.minutes);
  }
}

function createCustomer() {
  const female = randomChance(50);

  const gender = female ? "female" : "male";

  const name = female
    ? randomItem(FEMALE_NAMES)
    : randomItem(MALE_NAMES);

  const hairStyle = female
    ? randomItem(FEMALE_HAIR)
    : randomItem(MALE_HAIR);

  const day = state.day;

  const base = randomItem(
    getAvailableBases().length
      ? getAvailableBases()
      : ["cone", "cup"]
  );

  let scoops = 1;
  let flavors = [];
  let randomFlavors = false;
  let topping = null;
  let randomTopping = false;

  if (day <= 2) {
    scoops = 1;

    const available = getAvailableFlavors();

    if (available.length > 0) {
      flavors = [randomItem(available)];
    } else {
      flavors = [randomItem(Object.keys(FLAVORS))];
    }

    if (randomChance(20)) {
      const availableToppings = getAvailableToppings();

      if (availableToppings.length) {
        topping = randomItem(availableToppings);
      }
    }
  } else if (day <= 4) {
    scoops = randomChance(30) ? 2 : 1;

    const available = getAvailableFlavors();

    if (available.length > 0) {
      for (let i = 0; i < scoops; i++) {
        flavors.push(randomItem(available));
      }
    } else {
      flavors = [randomItem(Object.keys(FLAVORS))];

      if (scoops === 2) {
        flavors.push(randomItem(Object.keys(FLAVORS)));
      }
    }

    if (randomChance(45)) {
      const availableToppings = getAvailableToppings();

      if (availableToppings.length) {
        topping = randomItem(availableToppings);
      }
    }
  } else {
    const creative = randomChance(38);

    if (creative) {
      scoops = 2;
      randomFlavors = true;

      if (randomChance(55)) {
        randomTopping = true;
      }
    } else {
      scoops = randomChance(55) ? 2 : 1;

      const available = getAvailableFlavors();

      if (available.length > 0) {
        for (let i = 0; i < scoops; i++) {
          flavors.push(randomItem(available));
        }
      } else {
        flavors = [randomItem(Object.keys(FLAVORS))];

        if (scoops === 2) {
          flavors.push(randomItem(Object.keys(FLAVORS)));
        }
      }

      if (randomChance(60)) {
        const availableToppings = getAvailableToppings();

        if (availableToppings.length) {
          topping = randomItem(availableToppings);
        }
      }
    }
  }

  let orderText = "";

  const baseText =
    base === "cone"
      ? "ốc quế"
      : "ly";

  if (randomFlavors) {
    if (randomTopping) {
      orderText =
        `Cho mình 2 viên vị bất kỳ tùy shop mix nhé, thêm topping hợp vị nha!`;
    } else {
      orderText =
        `Cho mình 2 viên vị bất kỳ tùy shop mix nhé!`;
    }
  } else {
    const flavorText = flavors
      .map(key => FLAVORS[key].short)
      .join(" và ");

    if (topping) {
      orderText =
        `Cho mình ${baseText} ${flavorText}, thêm ${TOPPINGS[topping].short} nhé!`;
    } else {
      orderText =
        `Cho mình ${baseText} ${flavorText} nhé!`;
    }
  }

  if (day >= 5 && randomChance(22)) {
    randomFlavors = true;
    flavors = [];
    scoops = 1;
    randomTopping = true;
    topping = null;

    orderText =
      "Làm giúp em 1 ly kem vị ngẫu nhiên ngon nhất quán!";
  }

  return {
    id:
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).slice(2),

    gender,
    name,
    hairStyle,

    anonymous: randomChance(27),

    base,

    scoops,
    flavors,
    randomFlavors,

    topping,
    randomTopping,

    orderText,

    createdAt: performance.now(),
    expiresAt: performance.now() + CUSTOMER_PATIENCE_MS
  };
}

function chooseEmployeeOrder(customer) {
  const result = {
    base: customer.base,
    flavors: [],
    topping: null
  };

  if (state.inventory.bases[customer.base] <= 0) {
    return null;
  }

  if (customer.randomFlavors) {
    const available = getAvailableFlavors();

    if (!available.length) {
      return null;
    }

    for (let i = 0; i < customer.scoops; i++) {
      result.flavors.push(
        randomItem(available)
      );
    }
  } else {
    result.flavors = [...customer.flavors];

    for (const flavor of result.flavors) {
      if (state.inventory.flavors[flavor] <= 0) {
        return null;
      }
    }
  }

  if (customer.randomTopping) {
    const availableToppings = getAvailableToppings();

    if (availableToppings.length) {
      result.topping = randomItem(availableToppings);
    }
  } else {
    result.topping = customer.topping;

    if (
      result.topping &&
      state.inventory.toppings[result.topping] <= 0
    ) {
      return null;
    }
  }

  return result;
}

function consumeOrder(order) {
  if (!order) {
    return false;
  }

  if (
    !state.inventory.bases[order.base] ||
    state.inventory.bases[order.base] <= 0
  ) {
    return false;
  }

  for (const flavor of order.flavors) {
    if (
      !state.inventory.flavors[flavor] ||
      state.inventory.flavors[flavor] <= 0
    ) {
      return false;
    }
  }

  if (
    order.topping &&
    (
      !state.inventory.toppings[order.topping] ||
      state.inventory.toppings[order.topping] <= 0
    )
  ) {
    return false;
  }

  state.inventory.bases[order.base]--;

  for (const flavor of order.flavors) {
    state.inventory.flavors[flavor]--;
  }

  if (order.topping) {
    state.inventory.toppings[order.topping]--;
  }

  return true;
}

function sameMultiset(a, b) {
  if (a.length !== b.length) {
    return false;
  }

  const aa = [...a].sort();
  const bb = [...b].sort();

  return aa.every((value, index) => value === bb[index]);
}

function buildMatchesCustomer(customer) {
  if (!customer) {
    return false;
  }

  if (state.build.base !== customer.base) {
    return false;
  }

  if (state.build.flavors.length !== customer.scoops) {
    return false;
  }

  if (customer.randomFlavors) {
    for (const flavor of state.build.flavors) {
      if (!FLAVORS[flavor]) {
        return false;
      }
    }
  } else if (!sameMultiset(
    state.build.flavors,
    customer.flavors
  )) {
    return false;
  }

  if (customer.randomTopping) {
    if (
      state.build.topping &&
      !TOPPINGS[state.build.topping]
    ) {
      return false;
    }
  } else {
    if (state.build.topping !== customer.topping) {
      return false;
    }
  }

  return true;
}

function getPatienceRatio(customer) {
  if (!customer) {
    return 0;
  }

  const remaining = clamp(
    customer.expiresAt - performance.now(),
    0,
    CUSTOMER_PATIENCE_MS
  );

  return remaining / CUSTOMER_PATIENCE_MS;
}

function generateReview(customer, ratio, served) {
  let stars;

  if (!served) {
    stars = randomChance(50) ? 1 : 2;
  } else if (ratio > .8) {
    stars = 5;
  } else if (ratio >= .3) {
    stars = 3;
  } else {
    stars = randomChance(50) ? 1 : 2;
  }

  let text;

  if (!served) {
    text = randomItem(REVIEW_WALKOUT);
  } else if (stars === 5) {
    text = randomItem(REVIEW_FIVE);
  } else if (stars === 3) {
    text = randomItem(REVIEW_THREE);
  } else {
    text = randomItem(REVIEW_LOW);
  }

  if (
    served &&
    customer.anonymous &&
    randomChance(25)
  ) {
    text += " Mình thích không gian xinh xắn của tiệm.";
  }

  return {
    id:
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).slice(2),

    day: state.day,

    name: customer.name,
    gender: customer.gender,
    hairStyle: customer.hairStyle,

    anonymous: customer.anonymous,

    stars,
    text,

    reply: "",

    patienceRatio: ratio,
    served
  };
}

function addReview(customer, ratio, served) {
  const review = generateReview(
    customer,
    ratio,
    served
  );

  state.reviews.unshift(review);

  if (state.reviews.length > 60) {
    state.reviews.length = 60;
  }
}

function serveCustomer() {
  if (!state.isOpen || !state.activeCustomer) {
    return;
  }

  if (state.employeeWorking) {
    return;
  }

  const customer = state.activeCustomer;

  if (!state.build.base) {
    showToast(
      "Thiếu nền kem",
      "Hãy chọn ốc quế hoặc ly trước khi giao.",
      "warning",
      "🥤"
    );

    return;
  }

  if (state.build.flavors.length === 0) {
    showToast(
      "Chưa chọn vị kem",
      "Bạn cần chọn ít nhất một viên kem.",
      "warning",
      "🍨"
    );

    return;
  }

  if (!buildMatchesCustomer(customer)) {
    showToast(
      "Chưa đúng đơn",
      "Hãy làm đúng yêu cầu của khách rồi mới giao nhé.",
      "error",
      "💭"
    );

    return;
  }

  const order = {
    base: state.build.base,
    flavors: [...state.build.flavors],
    topping: state.build.topping
  };

  if (!consumeOrder(order)) {
    showCenterModal({
      title: "Không đủ nguyên liệu",
      message:
        "Một trong các nguyên liệu của món này đã hết. Hãy vào Kho Hàng nhập thêm trước khi tiếp tục bán.",
      icon: "📦",
      danger: true,
      showCancel: false
    });

    return;
  }

  const ratio = getPatienceRatio(customer);

  const revenue = currentIceCreamPrice();

  state.cash += revenue;
  state.dayRevenue += revenue;
  state.servedToday++;

  addReview(customer, ratio, true);

  const servedName = customer.name;

  state.activeCustomer = null;

  state.build = {
    base: null,
    flavors: [],
    topping: null
  };

  saveState();

  showToast(
    "Đã phục vụ thành công",
    `Đã phục vụ thành công cho khách ${servedName}! +${money(revenue)}`,
    "success",
    "🍦"
  );

  renderGame();

  if (state.isOpen) {
    scheduleNextCustomer();
  }

  checkTargetAfterServe();
}

function employeeServe() {
  if (
    !state.isOpen ||
    !state.activeCustomer ||
    state.upgrades.employee <= 0 ||
    state.employeeWorking
  ) {
    return;
  }

  const customerId = state.activeCustomer.id;

  const order = chooseEmployeeOrder(
    state.activeCustomer
  );

  if (!order) {
    showCenterModal({
      title: "Kho chưa đủ hàng",
      message:
        "Nhân viên đã kiểm tra đơn nhưng kho đang thiếu đúng nguyên liệu cần thiết. Hãy nhập thêm hàng.",
      icon: "📦",
      danger: true,
      confirmText: "Mở Kho Hàng",
      cancelText: "Để sau",
      onConfirm: () => {
        state.currentScreen = "warehouse";
        renderGame();
      }
    });

    return;
  }

  state.employeeWorking = true;
  renderGame();

  const speedLevel = state.upgrades.scoopSpeed;

  const prepTime = Math.max(
    900,
    2700 - speedLevel * 420
  );

  setTimeout(() => {
    if (
      !state.isOpen ||
      !state.activeCustomer ||
      state.activeCustomer.id !== customerId
    ) {
      state.employeeWorking = false;
      return;
    }

    const ratio = getPatienceRatio(
      state.activeCustomer
    );

    if (!consumeOrder(order)) {
      state.employeeWorking = false;

      showCenterModal({
        title: "Nguyên liệu vừa hết",
        message:
          "Trong lúc pha chế, một nguyên liệu đã hết. Hãy nhập thêm ở Kho Hàng.",
        icon: "📦",
        danger: true,
        showCancel: false
      });

      return;
    }

    const revenue = currentIceCreamPrice();
    const servedName = state.activeCustomer.name;

    state.cash += revenue;
    state.dayRevenue += revenue;
    state.servedToday++;

    addReview(
      state.activeCustomer,
      ratio,
      true
    );

    state.activeCustomer = null;
    state.employeeWorking = false;

    state.build = {
      base: null,
      flavors: [],
      topping: null
    };

    saveState();

    showToast(
      "Nhân viên đã giao món",
      `Đã phục vụ thành công cho khách ${servedName}! +${money(revenue)}`,
      "success",
      "👩‍🍳"
    );

    renderGame();

    if (state.isOpen) {
      scheduleNextCustomer();
    }

    checkTargetAfterServe();

  }, prepTime);
}

function customerLeavesBecauseOfTimeout(customerId) {
  if (
    !state.activeCustomer ||
    state.activeCustomer.id !== customerId
  ) {
    return;
  }

  const customer = state.activeCustomer;

  state.walkoutsToday++;

  addReview(
    customer,
    0,

  );

  state.activeCustomer = null;

  state.build = {
    base: null,
    flavors: [],

  };

  state.employeeWorking = false;

  );

    scheduleNextCustomer();
  }
}

function customerLeavesBecauseOfClose() {
  if (!state.activeCustomer) {
    return;
  }

  const customer = state.activeCustomer;

  state.walkoutsToday++;

  addReview(
    customer,
    getPatienceRatio(customer),
    false
  );

  state.build = {
    base: null,
    flavors: [],

  };

function checkTargetAfterServe() {
  if (
    state.servedToday >= targetForDay(state.day)
  ) {
    showToast(
      "Đã đạt chỉ tiêu! 🎉",
      `Bạn đã hoàn thành ${targetForDay(state.day)} đơn của Ngày ${state.day}.`,
      "success",
      "🏆"
    );
  }
}

function calculateNetProfit() {
  return (
    state.dayRevenue -
    state.dayStockCosts -
    state.dayUpgradeCosts -
    state.dayStaffCosts
  );
}

function openShop() {
  if (state.isOpen) {
    return;
  }

  if (!canOpenShop()) {
    showCenterModal({
      title: "Chưa thể mở cửa",
      message:
        "Bạn cần mua nguyên liệu ở Kho Hàng trước khi mở bán! Hãy nhập ít nhất một vị kem và một loại ốc quế hoặc ly.",
      icon: "📦",
      danger: true,
      confirmText: "Mở Kho Hàng",
      cancelText: "Để sau",
      onConfirm: () => {
        state.currentScreen = "warehouse";
        renderGame();
      }
    });

    return;
  }

  const employeeLevel = state.upgrades.employee;

  if (employeeLevel > 0) {
    const salary =
      45000 + employeeLevel * 25000;

    if (state.cash < salary) {
      showCenterModal({
        title: "Không đủ tiền trả lương",
        message:
          `Hôm nay cần ${money(salary)} để trả lương nhân viên. Bạn cần kiếm thêm tiền hoặc quản lý chi phí trước khi mở ca.`,
        icon: "💼",
        danger: true,
        confirmText: "Đã hiểu",
        showCancel: false
      });

      return;
    }

    state.cash -= salary;
    state.dayStaffCosts += salary;
  }

  state.isOpen = true;
  state.minutes = GAME_START_MINUTE;

  state.activeCustomer = null;
  state.employeeWorking = false;

  state.build = {
    base: null,
    flavors: [],
    topping: null
  };

  saveState();

  renderGame();
  startGameClock();

  scheduleNextCustomer();

  showToast(
    "Cửa hàng đã mở",
    `Ca làm việc Ngày ${state.day} bắt đầu lúc 09:00. Mục tiêu: ${targetForDay(state.day)} đơn.`,
    "success",
    "🚪"
  );
}

function handleEndOfBusinessDay() {
  if (!state.isOpen) {
    return;
  }

  resetRuntime();

  state.isOpen = false;

  if (state.activeCustomer) {
    customerLeavesBecauseOfClose();
  }

  state.employeeWorking = false;

  const target = targetForDay(state.day);
  const achieved = state.servedToday >= target;

  state.summary = {
    day: state.day,
    target,
    achieved,

    revenue: state.dayRevenue,
    stockCosts: state.dayStockCosts,
    upgradeCosts: state.dayUpgradeCosts,
    staffCosts: state.dayStaffCosts,

    served: state.servedToday,
    walkouts: state.walkoutsToday,

    netProfit: calculateNetProfit()
  };

  saveState();

  renderSummary();

  if (achieved) {
    setTimeout(() => {
      showToast(
        "Ngày kinh doanh hoàn thành",
        `Bạn đã đạt chỉ tiêu ${target} đơn của Ngày ${state.day}.`,
        "success",
        "🏆"
      );
    }, 250);
  }
}

function animateMoneyCounter(element, target) {
  if (!element) {
    return;
  }

  const duration = 900;
  const start = performance.now();

  function frame(now) {
    const progress = clamp(
      (now - start) / duration,
      0,
      1
    );

    const eased =
      1 - Math.pow(1 - progress, 3);

    const value = target * eased;

    element.textContent =
      (value < 0 ? "-" : "") +
      money(Math.abs(value));

    if (progress < 1) {
      requestAnimationFrame(frame);
    }
  }

  requestAnimationFrame(frame);
}

function buyFlavor(key) {
  const item = FLAVORS[key];

  if (!item) {
    return;

  if (state.inventory.flavors[key] + item.units > warehouseCapacity()) {
    showCenterModal({
      title: "Kho đã đầy",
      message:
        `Hũ ${item.name} chỉ chứa tối đa ${warehouseCapacity()} viên ở cấp kho hiện tại. Hãy nâng cấp Kho Hàng trước.`,
      icon: "📦",
      danger: false,
      showCancel: false
    });

    return;
  }

  if (state.cash < item.cartonCost) {
    showCenterModal({
      title: "Không đủ tiền",
      message:
        `Bạn cần ${money(item.cartonCost)} để nhập một thùng ${item.name}, nhưng ví hiện chỉ còn ${money(state.cash)}.`,
      icon: "💸",
      danger: true,
      confirmText: "Đã hiểu",
      showCancel: false
    });

    return;
  }

  state.cash -= item.cartonCost;
  state.inventory.flavors[key] += item.units;
  state.purchasedBefore.flavors[key] = true;
  state.dayStockCosts += item.cartonCost;

  saveState();
  renderGame();

  showToast(
    "Đã nhập kho",
    `+${item.units} viên ${item.name}. Đã trừ ${money(item.cartonCost)}.`,
    "success",
    "📦"
  );
}

      title: "Không đủ vốn nâng cấp",

      icon: "💸",

      confirmText: "Đã hiểu",

    });

    if (state.upgrades.employee >= 2) {

  state.cash -= cost;
  state.upgrades[key]++;
  state.dayUpgradeCosts += cost;

  saveState();

    showToast(
      "Nhân viên đang pha chế",
      "Nhân viên sẽ tự chọn đúng vị theo đơn của khách.",
      "warning",
      "👩‍🍳"
    );

    return;
  }

  if (state.build.flavors.length >= 2) {
    showToast(
      "Đủ số viên",
      "Mỗi món hiện tối đa 2 viên kem.",
      "warning",
      "🍨"
    );

    return;
  }

  state.build.flavors.push(key);

  renderGame();
}

function selectBase(key) {
  if (!BASES[key]) {
    return;
  }

  if (state.upgrades.employee > 0) {
    showToast(
      "Nhân viên đang hỗ trợ",
      "Bạn chỉ cần chọn nền nếu muốn tự pha. Nhân viên sẽ tự động hoàn thành phần còn lại.",
      "warning",
      "👩‍🍳"
    );
  }

  if (state.inventory.bases[key] <= 0) {
    const neverPurchased =
      !state.purchasedBefore.bases[key];

    showToast(
      "Thiếu nền kem",
      neverPurchased
        ? "Bạn chưa mua nguyên liệu này nên chưa thể mở bán."
        : "Đã hết loại nền này, vui lòng nhập thêm ở Kho Hàng!",
      "error",
      "📦"
    );

    return;
  }

  state.build.base = key;

  renderGame();

  if (state.upgrades.employee > 0) {
    employeeServe();
  }
}

function selectTopping(key) {
  if (state.upgrades.employee > 0) {
    showToast(
      "Nhân viên đang pha chế",
      "Nhân viên sẽ tự chọn topping theo đúng đơn.",
      "warning",
      "👩‍🍳"
    );

    return;
  }

  if (!key) {
    state.build.topping = null;
    renderGame();
    return;
  }

  if (!TOPPINGS[key]) {
    return;
  }

  if (state.inventory.toppings[key] <= 0) {
    const neverPurchased =
      !state.purchasedBefore.toppings[key];

    showToast(
      "Thiếu topping",
      neverPurchased
        ? "Bạn chưa mua nguyên liệu này nên chưa thể sử dụng."
        : "Đã hết topping này, vui lòng nhập thêm ở Kho Hàng!",
      "error",
      "📦"
    );

    return;
  }

  state.build.topping = key;

  renderGame();
}

function resetBuild() {
  state.build = {
    base: null,
    flavors: [],
    topping: null
  };

  renderGame();
}

function replyReview(reviewId) {
  const input = document.getElementById(
    "reply-" + reviewId
  );

  if (!input) {
    return;
  }

  const text = input.value.trim();

  if (!text) {
    showToast(
      "Chưa có nội dung",
      "Hãy nhập câu trả lời trước.",
      "warning",
      "💌"
    );

    return;
  }

  const review = state.reviews.find(
    item => item.id === reviewId
  );

  if (!review) {
    return;
  }

  review.reply = text;

  saveState();
  renderGame();

  showToast(
    "Đã trả lời review",
    "Câu trả lời của bạn đã được lưu lại.",
    "success",
    "💗"
  );
}

function handleSwitchScreen(screen) {
  if (
    ![
      "shop",
      "warehouse",
      "upgrades",
      "reviews"
    ].includes(screen)
  ) {
    return;
  }

  state.currentScreen = screen;

  renderGame();

  if (state.isOpen) {
    if (screen === "shop") {
      startPatienceAnimation();
    }
  }
}

function handleClick(event) {
  const button = event.target.closest(
    "[data-action]"
  );

  if (!button) {
    return;
  }

  const action = button.dataset.action;

  if (action === "start-game") {
    const input = document.getElementById("shopNameInput");

    const name = input
      ? input.value.trim()
      : "";

    state.shopName =
      name.length > 0
        ? name
        : "Ngọt Ngào";

    state.started = true;

    state.day = 1;
    state.minutes = GAME_START_MINUTE;

    state.isOpen = false;
    state.currentScreen = "shop";

    state.cash = STARTING_CASH;

    state.activeCustomer = null;

    state.inventory = {
      flavors: {
        chocolate: 0,
        strawberry: 0,
        vanilla: 0,
        matcha: 0,
        butter: 0,
        durian: 0
      },

      toppings: {
        sprinkles: 0,
        strawberrySauce: 0,
        cherry: 0,
        cookie: 0
      },

      bases: {
        cone: 0,
        cup: 0
      }
    };

    state.purchasedBefore = {
      flavors: {},
      toppings: {},
      bases: {}
    };

    state.upgrades = {
      warehouse: 0,
      scoopSpeed: 0,
      price: 0,
      employee: 0
    };

    state.dayRevenue = 0;
    state.dayStockCosts = 0;
    state.dayUpgradeCosts = 0;
    state.dayStaffCosts = 0;

    state.servedToday = 0;
    state.walkoutsToday = 0;

    state.reviews = [];

    state.summary = null;

    saveState();
    renderGame();

    showToast(
      "Tiệm đã sẵn sàng",
      "Bạn có 400.000đ. Hãy vào Kho Hàng nhập nguyên liệu trước khi mở cửa.",
      "success",
      "🌷"
    );

    return;
  }

  if (action === "switch-screen") {
    handleSwitchScreen(
      button.dataset.screen
    );
    return;
  }

  if (action === "open-shop") {
    openShop();
    return;
  }

  if (action === "close-shop") {
    closeShop();
    return;
  }

  if (action === "buy-flavor") {
    buyFlavor(button.dataset.flavor);
    return;
  }

  if (action === "buy-base") {
    buyBase(button.dataset.base);
    return;
  }

  if (action === "buy-topping") {
    buyTopping(button.dataset.topping);
    return;
  }

  if (action === "buy-upgrade") {
    buyUpgrade(button.dataset.upgrade);
    return;
  }

  if (action === "select-flavor") {
    selectFlavor(button.dataset.flavor);
    return;
  }

  if (action === "select-base") {
    selectBase(button.dataset.base);
    return;
  }

  if (action === "select-topping") {
    selectTopping(button.dataset.topping);
    return;
  }

  if (action === "reset-build") {
    resetBuild();
    return;
  }

  if (action === "serve-customer") {
    if (state.upgrades.employee > 0) {
      employeeServe();
    } else {
      serveCustomer();
    }

    return;
  }

  if (action === "reply-review") {
    replyReview(button.dataset.review);
    return;
  }

  if (action === "next-day") {
    advanceToNextDay();
    return;
  }

  if (action === "retry-day") {
    retrySameDay();
    return;
  }
}

app.addEventListener("click", handleClick);

loadState();

window.addEventListener("beforeunload", () => {
  saveState();
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.isOpen) {
    if (state.activeCustomer) {
      const remaining =
        state.activeCustomer.expiresAt -
        performance.now();

      if (remaining <= 0) {
        customerLeavesBecauseOfTimeout(
          state.activeCustomer.id
        );
      } else {
        startPatienceAnimation();
      }
    }
  }
});
</script>

</body>
</html>
