<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffe7ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Tiệm Bán Kem Ngọt Ngào</title>

  <style>
    :root {
      --pink: #f59bb3;
      --pink-dark: #d96f91;
      --pink-soft: #ffe4ec;
      --cream: #fffaf2;
      --cream-2: #fff4df;
      --brown: #765344;
      --brown-dark: #51372f;
      --wood: #b87950;
      --wood-dark: #925a3d;
      --green: #9abf91;
      --green-dark: #709b69;
      --blue: #9fcfe1;
      --yellow: #f4c96c;
      --red: #e77c87;
      --line: rgba(105, 72, 60, .12);
      --shadow: 0 12px 30px rgba(112, 72, 57, .10);
      --shadow-soft: 0 7px 18px rgba(112, 72, 57, .08);
      --radius: 24px;
      --radius-sm: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #ffeef3;
      color: var(--brown-dark);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    #app {
      width: 100%;
      max-width: 540px;
      min-height: 100dvh;
      margin: 0 auto;
      background:
        linear-gradient(
          180deg,
          #fff4f7 0%,
          #fff9f3 52%,
          #fff8ee 100%
        );
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 50px rgba(92, 61, 49, .08);
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       WELCOME
       ========================================================= */

    .welcome {
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        calc(24px + var(--safe-top))
        22px
        calc(26px + var(--safe-bottom));
      background:
        linear-gradient(
          180deg,
          #cfeef7 0%,
          #e9f8fb 42%,
          #fff4e8 100%
        );
    }

    .welcome-cloud {
      position: absolute;
      width: 105px;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.76);
      filter: blur(.2px);
      opacity: .78;
      animation: cloudDrift 18s linear infinite;
    }

    .welcome-cloud::before,
    .welcome-cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .welcome-cloud::before {
      width: 48px;
      height: 48px;
      left: 16px;
      bottom: 9px;
    }

    .welcome-cloud::after {
      width: 58px;
      height: 58px;
      right: 14px;
      bottom: 5px;
    }

    .cloud-1 {
      left: -35px;
      top: 15%;
    }

    .cloud-2 {
      right: -45px;
      top: 30%;
      width: 125px;
      animation-delay: -7s;
    }

    .cloud-3 {
      left: 10%;
      bottom: 11%;
      width: 82px;
      transform: scale(.7);
      animation-delay: -12s;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(-15px); }
      50% { transform: translateX(25px); }
      100% { transform: translateX(-15px); }
    }

    .mini-treat {
      position: absolute;
      font-size: 20px;
      opacity: .68;
      animation:
        miniFloat 4.2s ease-in-out infinite,
        miniSpin 7s linear infinite;
    }

    .mini-treat:nth-of-type(1) {
      left: 12%;
      top: 19%;
      animation-delay: -.4s;
    }

    .mini-treat:nth-of-type(2) {
      right: 13%;
      top: 16%;
      animation-delay: -1.5s;
    }

    .mini-treat:nth-of-type(3) {
      left: 8%;
      bottom: 30%;
      animation-delay: -2.5s;
    }

    .mini-treat:nth-of-type(4) {
      right: 10%;
      bottom: 25%;
      animation-delay: -3.3s;
    }

    .mini-treat:nth-of-type(5) {
      left: 25%;
      top: 10%;
      font-size: 15px;
    }

    .mini-treat:nth-of-type(6) {
      right: 28%;
      bottom: 12%;
      font-size: 15px;
    }

    @keyframes miniFloat {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-13px) rotate(8deg); }
    }

    @keyframes miniSpin {
      0% { rotate: 0deg; }
      100% { rotate: 360deg; }
    }

    .welcome-card {
      width: min(100%, 450px);
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.75);
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      color: #9a6670;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      box-shadow: 0 8px 24px rgba(91, 105, 112, .08);
    }

    .welcome-title {
      margin: 13px 0 2px;
      color: #704e45;
      font-size: clamp(27px, 8vw, 39px);
      line-height: 1.05;
      font-weight: 950;
      letter-spacing: -.8px;
    }

    .welcome-subtitle {
      margin: 7px auto 12px;
      max-width: 330px;
      color: #9b746d;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 650;
    }

    .hero-icecream {
      width: min(61vw, 245px);
      max-width: 245px;
      aspect-ratio: 1 / 1;
      margin: 2px auto 4px;
      animation: iceCreamWobble 4.8s ease-in-out infinite;
      transform-origin: 50% 84%;
      filter: drop-shadow(0 16px 15px rgba(110, 73, 57, .12));
    }

    @keyframes iceCreamWobble {
      0%, 100% {
        transform: rotate(-2deg) translateY(0);
      }
      20% {
        transform: rotate(3deg) translateY(-3px);
      }
      40% {
        transform: rotate(-3deg) translateY(1px);
      }
      60% {
        transform: rotate(2deg) translateY(-2px);
      }
      80% {
        transform: rotate(-1deg) translateY(0);
      }
    }

    .welcome-form {
      width: 100%;
      max-width: 390px;
      margin: 4px auto 0;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 25px;
      padding: 13px;
      box-shadow: 0 15px 35px rgba(94, 72, 63, .09);
      backdrop-filter: blur(8px);
    }

    .shop-name-input {
      width: 100%;
      border: 0;
      outline: 0;
      background: #fffaf6;
      border: 1px solid rgba(125, 87, 73, .09);
      color: var(--brown-dark);
      border-radius: 17px;
      min-height: 51px;
      padding: 0 16px;
      text-align: center;
      font-weight: 750;
      font-size: 15px;
    }

    .shop-name-input::placeholder {
      color: #b99c91;
    }

    .primary-button {
      width: 100%;
      min-height: 53px;
      margin-top: 9px;
      border-radius: 18px;
      background: linear-gradient(180deg, #f6aec1, #ea8fa9);
      color: white;
      font-weight: 900;
      letter-spacing: .2px;
      box-shadow: 0 9px 17px rgba(220, 111, 145, .20);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .primary-button:active {
      transform: translateY(2px) scale(.985);
      box-shadow: 0 5px 11px rgba(220, 111, 145, .18);
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .game-shell {
      min-height: 100dvh;
      padding-bottom: calc(86px + var(--safe-bottom));
    }

    .top-header {
      padding:
        calc(12px + var(--safe-top))
        13px
        10px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 246, 248, .93);
      backdrop-filter: blur(13px);
      border-bottom: 1px solid rgba(114, 76, 62, .07);
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shop-sign {
      flex: 1;
      min-width: 0;
    }

    .shop-sign-label {
      font-size: 10px;
      font-weight: 850;
      color: #ae8279;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .shop-sign-name {
      margin-top: 1px;
      font-size: 18px;
      line-height: 1.1;
      font-weight: 950;
      color: #65483f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cash-pill {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 5px;
      background: #fffdf7;
      border: 1px solid rgba(109, 77, 65, .09);
      border-radius: 15px;
      padding: 9px 11px;
      font-weight: 900;
      font-size: 13px;
      color: #7b604c;
      box-shadow: var(--shadow-soft);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
    }

    .info-pill {
      flex: 1;
      min-width: 0;
      min-height: 33px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid rgba(109, 77, 65, .07);
      color: #85685b;
      font-size: 11px;
      font-weight: 850;
    }

    .target-mini {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b9afa8;
    }

    .status-dot.open {
      background: #7bb877;
    }

    /* =========================================================
       TABS
       ========================================================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 540px);
      z-index: 50;
      padding:
        7px 9px
        calc(8px + var(--safe-bottom));
      background: rgba(255, 250, 247, .94);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(112, 76, 63, .09);
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .nav-button {
      min-height: 58px;
      border-radius: 17px;
      background: transparent;
      color: #aa8a80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-weight: 850;
      font-size: 10px;
    }

    .nav-icon {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
    }

    .nav-button.active {
      background: #fff0f4;
      color: #d47491;
    }

    /* =========================================================
       CONTENT
       ========================================================= */

    .content {
      padding: 12px 12px 22px;
    }

    .screen {
      animation: screenIn .25s ease;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      margin: 5px 3px 10px;
      font-size: 19px;
      font-weight: 950;
      color: #65483f;
    }

    .section-subtitle {
      margin: -5px 3px 12px;
      font-size: 12px;
      color: #a08075;
      font-weight: 650;
      line-height: 1.4;
    }

    /* =========================================================
       SHOP
       ========================================================= */

    .status-card {
      background: #fff;
      border: 1px solid rgba(112, 76, 63, .08);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 11px;
    }

    .status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .shop-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 900;
      font-size: 13px;
    }

    .clock {
      color: #8b6b5d;
      font-size: 13px;
      font-weight: 850;
      background: #fff8ef;
      padding: 7px 10px;
      border-radius: 11px;
    }

    .progress-wrap {
      margin-top: 10px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: #9b7a70;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #f3e8e2;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f0a1b8, #e77f9f);
      transition: width .25s ease;
    }

    .shop-closed-card {
      background:
        linear-gradient(145deg, #fff8f5, #fff);
      border: 1px solid rgba(112, 76, 63, .08);
      border-radius: 27px;
      box-shadow: var(--shadow);
      padding: 18px 15px;
      text-align: center;
      margin-bottom: 12px;
    }

    .closed-art {
      width: 125px;
      height: 90px;
      margin: 0 auto 2px;
    }

    .closed-title {
      font-weight: 950;
      color: #65483f;
      font-size: 20px;
    }

    .closed-text {
      color: #9b7d73;
      font-size: 12px;
      line-height: 1.5;
      margin: 6px auto 12px;
      max-width: 330px;
    }

    .open-button {
      min-height: 54px;
      width: 100%;
      border-radius: 19px;
      color: #fff;
      background: linear-gradient(180deg, #9fc99a, #82ae7b);
      box-shadow: 0 9px 18px rgba(111, 153, 104, .17);
      font-weight: 950;
      letter-spacing: .2px;
    }

    .close-button {
      width: 100%;
      min-height: 50px;
      border-radius: 18px;
      background: #fff0f1;
      color: #c76f7d;
      font-weight: 900;
      border: 1px solid rgba(199,111,125,.12);
    }

    /* =========================================================
       COUNTER
       ========================================================= */

    .counter {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      background: #eecfb5;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      border: 1px solid rgba(107, 72, 58, .1);
    }

    .awning {
      height: 65px;
      background:
        repeating-linear-gradient(
          90deg,
          #fff7f1 0 28px,
          #f5b1bf 28px 56px
        );
      position: relative;
      border-bottom: 3px solid rgba(138, 83, 67, .10);
    }

    .awning::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      height: 18px;
      border-radius: 0 0 50% 50%;
      background: inherit;
      border-bottom: 1px solid rgba(133, 83, 68, .08);
    }

    .counter-scene {
      min-height: 210px;
      position: relative;
      background:
        linear-gradient(180deg, #f7ddc6 0%, #efd0b3 67%, #d59a6f 68%, #bd7952 100%);
    }

    .counter-window {
      position: absolute;
      left: 13px;
      right: 13px;
      top: 15px;
      height: 104px;
      border-radius: 20px;
      background:
        linear-gradient(180deg, #d7f2f7, #f6f7ec);
      border: 6px solid #fff9f0;
      box-shadow: inset 0 -20px 0 rgba(255,255,255,.24);
      overflow: hidden;
    }

    .window-cloud {
      position: absolute;
      width: 72px;
      height: 22px;
      background: rgba(255,255,255,.78);
      border-radius: 999px;
      top: 27px;
      left: 19px;
    }

    .window-cloud::before,
    .window-cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .window-cloud::before {
      width: 30px;
      height: 30px;
      left: 11px;
      bottom: 5px;
    }

    .window-cloud::after {
      width: 38px;
      height: 38px;
      right: 8px;
      bottom: 4px;
    }

    .window-cloud.two {
      top: 57px;
      left: auto;
      right: 22px;
      transform: scale(.7);
    }

    .lanterns {
      position: absolute;
      right: 15px;
      top: 9px;
      display: flex;
      gap: 9px;
    }

    .lantern {
      width: 13px;
      height: 18px;
      background: #f5c66c;
      border-radius: 6px 6px 8px 8px;
      box-shadow: 0 4px 0 rgba(177, 123, 52, .15);
    }

    .counter-cat {
      position: absolute;
      width: 108px;
      height: 105px;
      left: 11px;
      bottom: 23px;
      z-index: 5;
    }

    .cat-z {
      position: absolute;
      color: #9d7e8d;
      font-size: 13px;
      font-weight: 950;
      right: 5px;
      top: -3px;
      animation: zzz 2.4s ease-in-out infinite;
    }

    @keyframes zzz {
      0% { opacity: 0; transform: translate(0, 5px); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(12px, -18px); }
    }

    .jar-row {
      position: absolute;
      left: 126px;
      right: 11px;
      bottom: 25px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      z-index: 4;
    }

    .ice-jar {
      min-width: 0;
      height: 84px;
      position: relative;
      cursor: pointer;
      touch-action: manipulation;
    }

    .jar-lid {
      position: absolute;
      left: 9%;
      right: 9%;
      top: 0;
      height: 15px;
      border-radius: 50%;
      background: linear-gradient(180deg, #dce8e8, #aabcbc);
      border: 2px solid rgba(255,255,255,.75);
      z-index: 2;
    }

    .jar-body {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 9px;
      bottom: 0;
      border-radius: 10px 10px 15px 15px;
      border: 2px solid rgba(255,255,255,.75);
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.35),
          rgba(255,255,255,.08) 35%,
          rgba(255,255,255,.2) 100%
        );
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(90, 77, 67, .12);
    }

    .jar-ice {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 6px;
      height: 48px;
      border-radius: 12px 12px 8px 8px;
    }

    .jar-empty {
      background:
        repeating-linear-gradient(
          135deg,
          rgba(220,215,208,.3) 0 7px,
          rgba(255,255,255,.42) 7px 14px
        );
    }

    .jar-label {
      position: absolute;
      left: 50%;
      bottom: -3px;
      transform: translateX(-50%);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 7px;
      font-weight: 950;
      color: #674c42;
      background: rgba(255,249,239,.88);
      border-radius: 7px;
      padding: 2px 5px;
    }

    .stock-bubble {
      position: absolute;
      top: 16px;
      right: 1px;
      min-width: 23px;
      height: 21px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      padding: 0 5px;
      color: #fff;
      background: #8e796e;
      font-size: 8px;
      font-weight: 950;
      z-index: 4;
      border: 2px solid rgba(255,255,255,.8);
    }

    .stock-bubble.empty {
      background: #c5aaa1;
    }

    .counter-front {
      height: 43px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.10) 0 3px,
          transparent 3px 21px
        ),
        linear-gradient(180deg, #bd7b54, #a76647);
      border-top: 3px solid rgba(255,255,255,.2);
    }

    /* =========================================================
       CUSTOMER
       ========================================================= */

    .customer-card {
      background: #fff;
      border-radius: 26px;
      border: 1px solid rgba(112, 76, 63, .08);
      box-shadow: var(--shadow);
      padding: 13px;
      margin-bottom: 12px;
    }

    .customer-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .customer-avatar {
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      overflow: hidden;
      background: #fff0e9;
      border: 2px solid rgba(255,255,255,.9);
      box-shadow: 0 5px 12px rgba(91, 65, 54, .08);
    }

    .customer-info {
      flex: 1;
      min-width: 0;
    }

    .customer-name {
      font-weight: 950;
      font-size: 15px;
      color: #65483f;
    }

    .customer-tag {
      display: inline-flex;
      margin-top: 4px;
      background: #fff3e8;
      color: #ad806d;
      border-radius: 8px;
      padding: 3px 7px;
      font-size: 9px;
      font-weight: 850;
    }

    .speech {
      position: relative;
      margin-top: 9px;
      padding: 10px 11px;
      border-radius: 15px;
      background: #fff8f1;
      color: #765a4e;
      font-size: 12px;
      line-height: 1.48;
      font-weight: 680;
      border: 1px solid rgba(111, 77, 64, .07);
    }

    .speech::before {
      content: "";
      position: absolute;
      left: 18px;
      top: -7px;

    const app = document.getElementById("app");

    function money(value) {
      return new Intl.NumberFormat("vi-VN").format(Math.max(0, Math.round(value))) + "đ";
    }

    function targetForDay(day) {
      return 20 + ((day - 1) * 10);
    }

    function formatTime(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function saveGame() {
      const copy = JSON.parse(JSON.stringify(state));

      copy.activeCustomer = null;
      copy.employeeWorking = false;
      copy.dayStartedAt = 0;
      copy.dayEndHandled = false;
      copy.isOpen = false;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
    }

    function loadGame() {
      const raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return false;
      }

      try {
        const saved = JSON.parse(raw);

        Object.assign(state, saved);

        state.isOpen = false;
        state.activeCustomer = null;
        state.employeeWorking = false;
        state.dayStartedAt = 0;
        state.dayEndHandled = false;
        state.build = {
          base: null,
          flavors: [],
          topping: null
        };

        return Boolean(state.shopName);
      } catch {
        localStorage.removeItem(STORAGE_KEY);
        return false;
      }
    }

    function resetBuild() {
      state.build = {
        base: null,
        flavors: [],
        topping: null
      };
    }

    function resetDailyStats() {
      state.dayRevenue = 0;
      state.dayStockCosts = 0;
      state.dayUpgradeCosts = 0;
      state.dayStaffCosts = 0;
      state.served = 0;
      state.walkouts = 0;
      state.dayEndHandled = false;
      state.serviceMessage = "";
      state.rushShown = false;
    }

    function initNewGame(shopName) {
      state.shopName = shopName.trim();
      state.day = 1;
      state.minutes = 540;
      state.isOpen = false;
      state.currentScreen = "shop";
      state.activeCustomer = null;
      state.cash = 400000;
      state.inventory.flavors = {
        chocolate: 0,
        strawberry: 0,
        vanilla: 0,
        matcha: 0,
        butter: 0,
        durian: 0
      };
      state.inventory.toppings = {
        sprinkles: 0,
        strawberrySauce: 0,
        cherry: 0,
        cookie: 0
      };
      state.inventory.bases = {
        cone: 0,
        cup: 0
      };
      state.purchased.flavors = {
        chocolate: false,
        strawberry: false,
        vanilla: false,
        matcha: false,
        butter: false,
        durian: false
      };
      state.purchased.toppings = {
        sprinkles: false,
        strawberrySauce: false,
        cherry: false,
        cookie: false
      };
      state.purchased.bases = {
        cone: false,
        cup: false
      };
      state.upgrades = {
        warehouse: 0,
        scoopSpeed: 0,
        price: 0,
        employee: 0
      };
      state.reviews = [];
      resetDailyStats();

      state.initialized = true;

      saveGame();
      render();
    }

    function getCapacity(type) {
      const base =
        type === "flavors"
          ? 12
          : 16;

      return base + (state.upgrades.warehouse * (type === "flavors" ? 6 : 8));
    }

    function getServicePrice() {
      const prices = [10000, 15000, 25000, 50000, 70000];
      return prices[Math.min(state.upgrades.price, prices.length - 1)];
    }

    function getPrepDelay() {
      const delays = [2200, 1800, 1400, 1000, 700];
      return delays[Math.min(state.upgrades.scoopSpeed, delays.length - 1)];
    }

    function employeeWage() {
      if (state.upgrades.employee <= 0) {
        return 0;
      }

      return 35000 + ((state.upgrades.employee - 1) * 10000);
    }

    function canOpenShop() {
      const hasBase =
        state.inventory.bases.cone > 0 ||
        state.inventory.bases.cup > 0;

      const hasFlavor =
        Object.values(state.inventory.flavors).some(value => value > 0);

      return hasBase && hasFlavor;
    }

    function showPopup(title, message, icon = "🍦", buttons = []) {
      clearTimeout(popupTimer);

      const normalizedButtons = buttons.length
        ? buttons
        : [
            {
              label: "Đã hiểu",
              action: "close-popup",
              kind: "primary"
            }
          ];

      const html = `
        <div class="modal-layer" data-popup>
          <div class="modal-card">
            <div class="modal-icon">${icon}</div>
            <div class="modal-title">${escapeHtml(title)}</div>
            <div class="modal-message">${escapeHtml(message)}</div>
            <div class="modal-buttons">
              ${normalizedButtons.map((button) => `
                <button
                  type="button"
                  class="modal-button ${button.kind || "secondary"}"
                  data-action="${button.action}"
                >
                  ${escapeHtml(button.label)}
                </button>
              `).join("")}
            </div>
          </div>
        </div>
      `;

      app.insertAdjacentHTML("beforeend", html);
    }

    function closePopup() {
      const popup = app.querySelector("[data-popup]");
      if (popup) {
        popup.remove();
      }
    }

    function serviceNotice(customerName, amount) {
      showPopup(
        "Phục vụ thành công!",
        `Đã phục vụ thành công cho khách ${customerName}! +${money(amount)}`,
        "🍨"
      );
    }

    function stockError(message) {
      showPopup("Chưa thể thực hiện", message, "📦");
    }

    function startClock() {
      stopClock();

      state.dayStartedAt = Date.now();
      state.dayEndHandled = false;

      timerHandle = setInterval(updateClock, 100);
    }

    function stopClock() {
      if (timerHandle) {
        clearInterval(timerHandle);
        timerHandle = null;
      }

      if (patienceAnimation) {
        cancelAnimationFrame(patienceAnimation);
        patienceAnimation = null;
      }
    }

    function updateClock() {
      if (!state.isOpen || !state.dayStartedAt) {
        return;
      }

      const elapsedSeconds =
        (Date.now() - state.dayStartedAt) / 1000;

      state.minutes = Math.min(
        1260,
        540 + Math.floor(elapsedSeconds)
      );

      updateLiveClock();

      if (state.minutes >= 1260 && !state.dayEndHandled) {
        state.dayEndHandled = true;
        finishAt21();
      }

      updatePatience();
    }

    function updateLiveClock() {
      const clock = document.querySelector("[data-live-clock]");

      if (clock) {
        clock.textContent = formatTime(state.minutes);
      }

      const progress = document.querySelector("[data-target-progress]");

      if (progress) {
        const target = targetForDay(state.day);
        progress.textContent = `${state.served}/${target}`;
      }

      const fill = document.querySelector("[data-target-fill]");

      if (fill) {
        const target = targetForDay(state.day);
        const percent = clamp(
          (state.served / target) * 100,
          0,
          100
        );

        fill.style.width = percent + "%";
      }
    }

    function updatePatience() {
      if (!state.activeCustomer) {
        return;
      }

      const customer = state.activeCustomer;
      const now = Date.now();

      const remainingMs =
        Math.max(0, customer.expiresAt - now);

      const ratio =
        remainingMs / CUSTOMER_PATIENCE_MS;

      const progress = document.querySelector("[data-patience-progress]");
      const percentText = document.querySelector("[data-patience-percent]");
      const rush = document.querySelector("[data-rush-message]");

      if (progress) {
        const circumference = 2 * Math.PI * 24;

        progress.style.strokeDasharray = circumference;
        progress.style.strokeDashoffset =
          circumference * (1 - ratio);

        if (ratio < .3) {
          progress.style.stroke = "#dd747e";
        } else if (ratio < .5) {
          progress.style.stroke = "#e7b05c";
        } else {
          progress.style.stroke = "#e99ab0";
        }
      }

      if (percentText) {
        percentText.textContent =
          Math.round(ratio * 100) + "%";
      }

      if (ratio <= .5 && !state.rushShown) {
        state.rushShown = true;

        if (rush) {
          rush.textContent = randomItem(RUSH_LINES);
          rush.classList.remove("hidden");
        } else {
          render();
        }
      }

      if (remainingMs <= 0) {
        customerTimeout();
      }
    }

    function createCustomer() {
      if (!state.isOpen || state.activeCustomer) {
        return;
      }

      if (state.minutes >= 1260) {
        return;
      }

      const gender =
        Math.random() < .5 ? "male" : "female";

      const name = randomItem(NAMES[gender]);

      const base =
        Math.random() < .55
          ? "cone"
          : "cup";

      const flavorKeys = Object.keys(FLAVORS);

      const availableFlavors = flavorKeys.filter(
        key => state.inventory.flavors[key] > 0
      );

      if (!availableFlavors.length) {
        return;
      }

      let order;

      if (state.day >= 5 && Math.random() < .3) {
        const scoops = Math.random() < .5 ? 1 : 2;

        order = {
          base,
          scoops,
          flavors: [],
          randomFlavors: true,
          topping: null,
          randomTopping: Math.random() < .5
        };
      } else {
        const scoops =
          state.day <= 2
            ? 1
            : (Math.random() < .55 ? 1 : 2);

        const chosen = shuffle(flavorKeys)
          .slice(0, scoops);

        const topping =
          Math.random() < (state.day >= 3 ? .45 : .2)
            ? randomItem(Object.keys(TOPPINGS))
            : null;

        order = {
          base,
          scoops,
          flavors: chosen,
          randomFlavors: false,
          topping,
          randomTopping: false
        };
      }

      order.text = makeOrderText(order);

      const now = Date.now();

      state.activeCustomer = {
        id: Date.now() + Math.random(),
        gender,
        name,
        anonymousReview: Math.random() < .35,
        order,
        createdAt: now,
        expiresAt: now + CUSTOMER_PATIENCE_MS,
        maxPatienceMs: CUSTOMER_PATIENCE_MS
      };

      state.rushShown = false;
      resetBuild();

      render();

      if (state.upgrades.employee > 0) {
        scheduleEmployeeHint();
      }
    }

    function makeOrderText(order) {
      const baseName = BASES[order.base].name;

      if (order.randomFlavors) {
        if (order.randomTopping) {
          return `Shop ơi, cho em ${baseName.toLowerCase()} 2 viên vị bất kỳ tùy shop mix nhé, thêm topping ngon nhất giúp em luôn ạ!`;
        }

        return `Cho mình ${baseName.toLowerCase()} 2 viên vị bất kỳ ngon nhất quán nhé shop, hôm nay mình muốn thử một combo thật bất ngờ!`;
      }

      if (order.scoops === 2) {
        const line = randomItem(TWO_SCOOP_LINES);

        return line
          .replace("{flavor1}", FLAVORS[order.flavors[0]].name)
          .replace("{flavor2}", FLAVORS[order.flavors[1]].name);
      }

      const flavor = FLAVORS[order.flavors[0]].name;
      const line = randomItem(CUSTOMER_LINES);

      return line
        .replace("{base}", baseName.toLowerCase())
        .replace("{flavor}", flavor);
    }

    function scheduleEmployeeHint() {
      setTimeout(() => {
        if (
          state.isOpen &&
          state.activeCustomer &&
          state.upgrades.employee > 0
        ) {
          render();
        }
      }, 50);
    }

    function chooseBase(base) {
      if (!state.activeCustomer) {
        return;
      }

      if (state.inventory.bases[base] <= 0) {
        if (!state.purchased.bases[base]) {
          stockError(
            "Bạn chưa mua nguyên liệu này nên chưa thể mở bán"
          );
        } else {
          stockError(
            "Đã hết loại này, vui lòng nhập thêm ở Kho Hàng!"
          );
        }

        return;
      }

      state.build.base = base;

      if (state.upgrades.employee > 0) {
        employeePrepare();
      } else {
        render();
      }
    }

    function chooseFlavor(flavor) {
      if (!state.activeCustomer || state.employeeWorking) {
        return;
      }

      const desired =
        state.activeCustomer.order.scoops;

      if (state.inventory.flavors[flavor] <= 0) {
        if (!state.purchased.flavors[flavor]) {
          stockError(
            "Bạn chưa mua nguyên liệu này nên chưa thể mở bán"
          );
        } else {
          stockError(
            "Đã hết loại kem này, vui lòng nhập thêm ở Kho Hàng!"
          );
        }

        return;
      }

      if (state.build.flavors.length >= desired) {
        return;
      }

      state.build.flavors.push(flavor);
      render();
    }

    function chooseTopping(topping) {
      if (!state.activeCustomer || state.employeeWorking) {
        return;
      }

      if (state.inventory.toppings[topping] <= 0) {
        if (!state.purchased.toppings[topping]) {
          stockError(
            "Bạn chưa mua nguyên liệu này nên chưa thể mở bán"
          );
        } else {
          stockError(
            "Đã hết topping này, vui lòng nhập thêm ở Kho Hàng!"
          );
        }

        return;
      }

      state.build.topping = topping;
      render();
    }

    function employeePrepare() {
      if (
        !state.activeCustomer ||
        !state.build.base ||
        state.employeeWorking
      ) {
        return;
      }

      state.employeeWorking = true;
      render();

      setTimeout(() => {
        if (!state.isOpen || !state.activeCustomer) {
          state.employeeWorking = false;
          return;
        }

        const order = state.activeCustomer.order;

        let flavors = [];

        if (order.randomFlavors) {
          const available = Object.keys(FLAVORS).filter(
            key => state.inventory.flavors[key] > 0
          );

          if (available.length < order.scoops) {
            state.employeeWorking = false;

            stockError(
              "Nhân viên không tìm đủ nguyên liệu cho đơn này. Vui lòng nhập thêm ở Kho Hàng!"
            );

            render();
            return;
          }

          flavors = shuffle(available).slice(
            0,
            order.scoops
          );
        } else {
          flavors = [...order.flavors];
        }

        const missingFlavor =
          flavors.some(
            flavor =>
              state.inventory.flavors[flavor] <= 0
          );

        if (missingFlavor) {
          state.employeeWorking = false;

          stockError(
            "Đơn này cần loại kem hiện đang hết hàng. Vui lòng nhập thêm ở Kho Hàng!"
          );

          render();
          return;
        }

        let topping = order.topping;

        if (order.randomTopping) {
          const availableToppings =
            Object.keys(TOPPINGS).filter(
              key => state.inventory.toppings[key] > 0
            );

          topping =
            availableToppings.length
              ? randomItem(availableToppings)
              : null;
        }

        if (
          topping &&
          state.inventory.toppings[topping] <= 0
        ) {
          state.employeeWorking = false;

          stockError(
            "Đơn này cần topping hiện đang hết hàng. Vui lòng nhập thêm ở Kho Hàng!"
          );

          render();
          return;
        }

        state.build.flavors = flavors;
        state.build.topping = topping;

        state.employeeWorking = false;

        serveCustomer();
      }, getPrepDelay());
    }

    function buildMatchesOrder() {
      const customer = state.activeCustomer;

      if (!customer || !customer.order) {
        return false;
      }

      const order = customer.order;
      const build = state.build;

      if (build.base !== order.base) {
        return false;
      }

      if (build.flavors.length !== order.scoops) {
        return false;
      }

      const selectedSorted = [...build.flavors].sort();
      const expectedSorted = [...order.flavors].sort();

      if (order.randomFlavors) {
        for (const flavor of selectedSorted) {
          if (!FLAVORS[flavor]) {
            return false;
          }
        }
      } else {
        if (
          JSON.stringify(selectedSorted) !==
          JSON.stringify(expectedSorted)
        ) {
          return false;
        }
      }

      if (order.randomTopping) {
        if (
          build.topping !== null &&
          !TOPPINGS[build.topping]
        ) {
          return false;
        }
      } else {
        if (build.topping !== order.topping) {
          return false;
        }
      }

      return true;
    }

    function inventoryCanConsume() {
      const build = state.build;

      if (
        !build.base ||
        state.inventory.bases[build.base] <= 0
      ) {
        return false;
      }

      for (const flavor of build.flavors) {
        if (
          !FLAVORS[flavor] ||
          state.inventory.flavors[flavor] <= 0
        ) {
          return false;
        }
      }

      if (
        build.topping &&
        state.inventory.toppings[build.topping] <= 0
      ) {
        return false;
      }

      return true;
    }

    function consumeInventory() {
      const build = state.build;

      state.inventory.bases[build.base]--;

      for (const flavor of build.flavors) {
        state.inventory.flavors[flavor]--;
      }

      if (build.topping) {
        state.inventory.toppings[build.topping]--;
      }
    }

    function serveCustomer() {
      if (!state.activeCustomer) {
        return;
      }

      if (!buildMatchesOrder()) {
        showPopup(
          "Chưa đúng đơn",
          "Hãy kiểm tra lại ốc quế/ly, số viên kem, hương vị và topping theo lời gọi món của khách.",
          "📝"
        );

        return;
      }

      if (!inventoryCanConsume()) {
        stockError(
          "Nguyên liệu trong đơn không đủ. Vui lòng nhập thêm ở Kho Hàng!"
        );

        return;
      }

      const customer = state.activeCustomer;

      const remainingRatio = clamp(
        (customer.expiresAt - Date.now()) /
          customer.maxPatienceMs,
        0,
        1
      );

      consumeInventory();

      const amount = getServicePrice();

      state.cash += amount;
      state.dayRevenue += amount;
      state.served++;

      addReview(
        customer,
        getRatingFromPatience(remainingRatio),
        false
      );

      state.activeCustomer = null;
      state.employeeWorking = false;
      state.rushShown = false;

      saveGame();
      render();

      serviceNotice(customer.name, amount);

      setTimeout(() => {
        if (
          state.isOpen &&
          !state.activeCustomer &&
          state.minutes < 1260
        ) {
          createCustomer();
        }
      }, 1300);
    }

    function getRatingFromPatience(ratio) {
      if (ratio > .8) {
        return 5;
      }

      if (ratio >= .3) {
        return 3;
      }

      return Math.random() < .5 ? 1 : 2;
    }

    function customerTimeout() {
      if (!state.activeCustomer) {
        return;
      }

      const customer = state.activeCustomer;

      addReview(
        customer,
        Math.random() < .5 ? 1 : 2,
        true
      );

      state.walkouts++;
      state.activeCustomer = null;
      state.employeeWorking = false;
      state.rushShown = false;

      saveGame();
      render();

      showPopup(
        "Khách đã rời đi",
        `${customer.name} đã chờ quá lâu và phải rời tiệm. Hãy chú ý vòng kiên nhẫn của khách nhé!`,
        "🥺"
      );

      setTimeout(() => {
        if (
          state.isOpen &&
          !state.activeCustomer &&
          state.minutes < 1260
        ) {
          createCustomer();
        }
      }, 1000);
    }

    function addReview(customer, stars, walkedAway) {
      const text =
        walkedAway
          ? randomItem(WALKOUT_TEXT)
          : randomItem(REVIEW_TEXT[stars]);

      state.reviews.unshift({
        id: Date.now() + Math.random(),
        name: customer.name,
        gender: customer.gender,
        anonymous: customer.anonymousReview,
        stars,
        text,
        reply: ""
      });

      if (state.reviews.length > 80) {
        state.reviews.length = 80;
      }
    }

    function resetBuildAndRender() {
      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      render();
    }

    function startShop() {
      if (!canOpenShop()) {
        showPopup(
          "Chưa thể mở cửa",
          "Bạn cần mua nguyên liệu ở Kho Hàng trước khi mở bán!",
          "📦",
          [
            {
              label: "Đến Kho Hàng",
              action: "go-warehouse",
              kind: "primary"
            },
            {
              label: "Để sau",
              action: "close-popup",
              kind: "secondary"
            }
          ]
        );

        return;
      }

      const wage = employeeWage();

      if (wage > state.cash) {
        showPopup(
          "Chưa đủ tiền",
          "Không đủ tiền trả lương nhân viên cho ca hôm nay.",
          "💸"
        );

        return;
      }

      if (wage > 0) {
        state.cash -= wage;
        state.dayStaffCosts += wage;
      }

      state.minutes = 540;
      state.isOpen = true;
      state.activeCustomer = null;
      state.employeeWorking = false;
      state.rushShown = false;
      state.dayStartedAt = Date.now();
      state.dayEndHandled = false;
      resetBuild();

      saveGame();
      render();
      startClock();

      setTimeout(() => {
        if (state.isOpen) {
          createCustomer();
        }
      }, 550);
    }

    function closeShopManually() {
      if (!state.isOpen) {
        return;
      }

      if (state.served >= targetForDay(state.day)) {
        finishDay(true);
        return;
      }

      forceCloseForUnmetTarget();
    }

    function finishAt21() {
      state.isOpen = false;
      stopClock();

      if (state.served >= targetForDay(state.day)) {
        render();

        showSummary();
      } else {
        forceCloseForUnmetTarget();
      }
    }

    function forceCloseForUnmetTarget() {
      state.isOpen = false;
      state.activeCustomer = null;
      state.employeeWorking = false;

      stopClock();
      saveGame();
      render();

      showPopup(
        "Chưa hoàn thành chỉ tiêu",
        `Ngày ${state.day} cần phục vụ đủ ${targetForDay(state.day)} đơn. Hiện bạn mới hoàn thành ${state.served} đơn. Bạn chưa thể sang ngày tiếp theo.`,
        "📋",
        [
          {
            label: "Tiếp tục ngày này",
            action: "continue-same-day",
            kind: "primary"
          },
          {
            label: "Ở lại quản lý",
            action: "close-popup",
            kind: "secondary"
          }
        ]
      );
    }

    function continueSameDay() {
      closePopup();

      if (!canOpenShop()) {
        showPopup(
          "Cần nhập thêm hàng",
          "Bạn cần mua nguyên liệu ở Kho Hàng trước khi mở lại ngày này.",
          "📦",
          [
            {
              label: "Đến Kho Hàng",
              action: "go-warehouse",
              kind: "primary"
            },
            {
              label: "Để sau",
              action: "close-popup",
              kind: "secondary"
            }
          ]
        );

        return;
      }

      startShop();
    }

    function finishDay(success) {
      state.isOpen = false;
      state.activeCustomer = null;
      state.employeeWorking = false;

      stopClock();

      if (success) {
        showSummary();
      }
    }

    function showSummary() {
      const target = targetForDay(state.day);

      const net =

        state.dayStockCosts -
        state.dayUpgradeCosts -

      const nextDay = state.day + 1;

      const html = `
        <div class="modal-layer" data-summary>
          <div class="modal-card summary-card">

            </div>

    function nextDay() {
      const summary = app.querySelector("[data-summary]");

      if (summary) {
        summary.remove();
      }

      state.day++;
      state.minutes = 540;
      state.isOpen = false;
      state.activeCustomer = null;
      state.employeeWorking = false;

      resetDailyStats();

      saveGame();
      render();
    }

    function purchase(type, key) {
      const capacity = getCapacity(type);
      const current = state.inventory[type][key];

      const quantity =
        type === "bases"
          ? 8
          : 6;

      const costTable = {
        flavors: {
          chocolate: 42000,
          strawberry: 39000,
          vanilla: 36000,
          matcha: 45000,
          butter: 43000,
          durian: 56000
        },
        toppings: {
          sprinkles: 18000,
          strawberrySauce: 21000,
          cherry: 24000,
          cookie: 26000
        },
        bases: {
          cone: 24000,
          cup: 22000
        }
      };

      const cost = costTable[type][key];

      if (current + quantity > capacity) {
        showPopup(
          "Kho đã đầy",
          `Không thể nhập thêm. Sức chứa hiện tại của nhóm này là ${capacity} đơn vị.`,
          "📦"
        );

        return;
      }

      if (state.cash < cost) {
        showPopup(
          "Không đủ tiền",
          `Bạn cần ${money(cost)} để nhập lô hàng này nhưng hiện chỉ có ${money(state.cash)}.`,
          "💸"
        );

        return;
      }

      state.cash -= cost;
      state.dayStockCosts += cost;

      state.inventory[type][key] += quantity;
      state.purchased[type][key] = true;

      saveGame();
      render();
    }

    function upgradeWarehouse() {
      buyUpgrade("warehouse");
    }

    function buyUpgrade(type) {
      const definition = UPGRADE_DEFS[type];
      const level = state.upgrades[type];

      if (level >= definition.max) {
        showPopup(
          "Đã đạt cấp tối đa",
          `${definition.name} hiện đã đạt cấp cao nhất.`,
          "✨"
        );

        return;
      }

      const cost = definition.costs[level];

      if (state.cash < cost) {
        showPopup(
          "Không đủ tiền",
          `Cần ${money(cost)} để thực hiện nâng cấp này.`,
          "💸"
        );

        return;
      }

      state.cash -= cost;
      state.dayUpgradeCosts += cost;
      state.upgrades[type]++;

      saveGame();
      render();
    }

    function replyReview(id) {
      const input = app.querySelector(
        `[data-reply-input="${id}"]`
      );

      if (!input) {
        return;
      }

      const text = input.value.trim();

      if (!text) {
        return;
      }

      const review = state.reviews.find(
        item => String(item.id) === String(id)
      );

      if (!review) {
        return;
      }

      review.reply = text;

      saveGame();
      render();
    }

          <div class="welcome-card">
            <div class="welcome-badge">
              🍨 TIỆM KEM NHỎ XINH
            </div>

            <div class="welcome-title">
              TIỆM BÁN KEM<br>
              NGỌT NGÀO
            </div>

            <div class="welcome-subtitle">
              Bắt đầu một tiệm kem thật xinh,
              tự tay quản lý khách hàng, kho hàng
              và từng đơn kem của bạn.
            </div>

            <div class="hero-icecream">
              ${welcomeIceCreamSvg()}
            </div>

            <div class="welcome-form">
              <input
                id="shopNameInput"
                class="shop-name-input"
                type="text"
                maxlength="28"
                autocomplete="off"
                placeholder="Nhập tên tiệm của bạn..."
              >

              <button
                type="button"
                class="primary-button"
                data-action="start-game"
              >
                🍦 Bắt đầu kinh doanh
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderHeader() {
      const target = targetForDay(state.day);
      const progress = clamp(
        (state.served / target) * 100,
        0,
        100
      );

      return `
        <header class="top-header">
          <div class="header-main">
            <div class="shop-sign">
              <div class="shop-sign-label">TIỆM BÁN KEM</div>
              <div class="shop-sign-name">
                ${escapeHtml(state.shopName)}
              </div>
            </div>

            <div class="cash-pill">
              🪙 ${money(state.cash)}
            </div>
          </div>

          <div class="header-info">
            <div class="info-pill">
              🌷 Ngày ${state.day}
            </div>

            <div class="info-pill target-mini">
              🎯 Chỉ tiêu
              <span data-target-progress>${state.served}/${target}</span>
            </div>

            <div class="info-pill">
              <span class="status-dot ${state.isOpen ? "open" : ""}"></span>
              ${state.isOpen ? "Đang mở" : "Đóng cửa"}
            </div>
          </div>
        </header>
      `;
    }

    function renderStatusCard() {
      const target = targetForDay(state.day);
      const percent = clamp(
        (state.served / target) * 100,
        0,
        100
      );

      return `
        <div class="status-card">
          <div class="status-top">
            <div class="shop-status">
              <span class="status-dot ${state.isOpen ? "open" : ""}"></span>
              ${state.isOpen ? "Đang bán hàng" : "Tiệm đang đóng cửa"}
            </div>

            <div class="clock" data-live-clock>
              ${formatTime(state.minutes)}
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-label">
              <span>Chỉ tiêu ngày ${state.day}</span>
              <span data-target-progress>${state.served}/${target}</span>
            </div>

            <div class="progress-track">
              <div
                class="progress-fill"
                data-target-fill
                style="width:${percent}%"
              ></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderClosedShop() {
      return `
        <div class="shop-closed-card">
          <div class="closed-art">
            <svg viewBox="0 0 150 105" width="100%" height="100%">
              <ellipse cx="75" cy="94" rx="48" ry="7" fill="#8d6a5c" opacity=".10"/>
              <rect x="35" y="33" width="80" height="45" rx="12" fill="#f0c6a8"/>
              <path d="M29 38h92l-8-24H37Z" fill="#fff6ef"/>
              <path d="M34 14h82l-6 24H40Z" fill="#f4a9ba"/>
              <path d="M45 14l-3 24M65 14l-1 24M86 14l2 24M105 14l5 24" stroke="#fff6ef" stroke-width="12"/>
              <circle cx="57" cy="55" r="8" fill="#fff"/>
              <circle cx="93" cy="55" r="8" fill="#fff"/>
              <path d="M55 74h40" stroke="#a66e50" stroke-width="5" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="closed-title">
            Tiệm đang đóng cửa
          </div>

          <div class="closed-text">
            Hãy kiểm tra Kho Hàng, mua đủ ốc quế/ly và
            ít nhất một vị kem trước khi bắt đầu ca.
          </div>

          <button
            type="button"
            class="open-button"
            data-action="open-shop"
          >
            🌷 Mở cửa bán hàng
          </button>
        </div>
      `;
    }

    function renderCounter() {
      const jarKeys = Object.keys(FLAVORS);

      return `
        <div class="counter">
          <div class="awning"></div>

          <div class="counter-scene">
            <div class="counter-window">
              <div class="window-cloud"></div>
              <div class="window-cloud two"></div>

              <div class="lanterns">
                <span class="lantern"></span>
                <span class="lantern"></span>
                <span class="lantern"></span>
              </div>
            </div>

            <div class="counter-cat">
              ${catSvg()}
            </div>

            <div class="jar-row">
              ${jarKeys.map(key => {
                const count = state.inventory.flavors[key];

                return `
                  <div
                    class="ice-jar"
                    data-action="quick-flavor"
                    data-flavor="${key}"
                    title="${escapeHtml(FLAVORS[key].name)}"
                  >
                    <div class="jar-lid"></div>

                    <div class="jar-body">
                      <div
                        class="jar-ice ${count <= 0 ? "jar-empty" : ""}"
                        style="${count > 0 ? `background:${FLAVORS[key].color}` : ""}"
                      ></div>
                    </div>

                    <div
                      class="stock-bubble ${count <= 0 ? "empty" : ""}"
                    >
                      ${count}
                    </div>

                    <div class="jar-label">
                      ${escapeHtml(FLAVORS[key].short)}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="counter-front"></div>
        </div>
      `;
    }

    function renderCustomer() {
      if (!state.activeCustomer) {
        return "";
      }

      const customer = state.activeCustomer;
      const ratio = clamp(
        (customer.expiresAt - Date.now()) /
          customer.maxPatienceMs,
        0,
        1
      );

      const circumference = 2 * Math.PI * 24;
      const offset = circumference * (1 - ratio);

      return `
        <div class="customer-card">
          <div class="customer-top">
            <div class="customer-avatar">
              ${customerAvatar(customer.gender)}
            </div>

            <div class="customer-info">
              <div class="customer-name">
                ${escapeHtml(customer.name)}
              </div>

              <div class="customer-tag">
                ${customer.gender === "female" ? "Khách nữ" : "Khách nam"}
              </div>

              <div class="speech">
                “${escapeHtml(customer.order.text)}”
              </div>
            </div>
          </div>

          <div class="patience-row">
            <div class="patience-ring">
              <svg viewBox="0 0 58 58">
                <circle
                  class="patience-track"
                  cx="29"
                  cy="29"
                  r="24"
                ></circle>

                <circle
                  class="patience-progress"
                  data-patience-progress
                  cx="29"
                  cy="29"
                  r="24"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${offset}"
                ></circle>
              </svg>

              <div
                class="patience-center"
                data-patience-percent
              >
                ${Math.round(ratio * 100)}%
              </div>
            </div>

            <div class="patience-copy">
              <div class="patience-title">
                Kiên nhẫn của khách
              </div>

              <div class="patience-hint">
                Khách có khoảng 70 giây để chờ.
                Khi vòng tụt thấp, khách sẽ bắt đầu hối thúc.
              </div>
            </div>
          </div>

          <div
            class="rush-message ${state.rushShown ? "" : "hidden"}"
            data-rush-message
          >
            ${state.rushShown ? escapeHtml(randomItem(RUSH_LINES)) : ""}
          </div>
        </div>
      `;
    }

    function renderBuilder() {
      if (!state.activeCustomer) {
        return "";
      }

      const order = state.activeCustomer.order;
      const employee = state.upgrades.employee > 0;
      const disabledByEmployee = employee;

      const flavorButtons = Object.keys(FLAVORS).map(key => {
        const selectedCount =
          state.build.flavors.filter(item => item === key).length;

        return `
          <button
            type="button"
            class="choice-button ${
              selectedCount > 0 ? "selected" : ""
            }"
            data-action="choose-flavor"
            data-flavor="${key}"
            ${disabledByEmployee ? "disabled" : ""}
          >
            <span class="choice-emoji">
              ${FLAVORS[key].emoji}
            </span>
            ${escapeHtml(FLAVORS[key].name)}
            ${selectedCount ? ` ×${selectedCount}` : ""}
          </button>
        `;
      }).join("");

      const toppingButtons = Object.keys(TOPPINGS).map(key => `
        <button
          type="button"
          class="choice-button ${
            state.build.topping === key ? "selected" : ""
          }"
          data-action="choose-topping"
          data-topping="${key}"
          ${disabledByEmployee ? "disabled" : ""}
        >
          <span class="choice-emoji">
            ${TOPPINGS[key].emoji}
          </span>
          ${escapeHtml(TOPPINGS[key].name)}
        </button>
      `).join("");

      const baseButtons = Object.keys(BASES).map(key => `
        <button
          type="button"
          class="choice-button ${
            state.build.base === key ? "selected" : ""
          }"
          data-action="choose-base"
          data-base="${key}"
          ${state.employeeWorking ? "disabled" : ""}
        >
          <span class="choice-emoji">
            ${BASES[key].emoji}
          </span>
          ${escapeHtml(BASES[key].name)}
        </button>
      `).join("");

      let summary = "Chưa chọn gì";

      if (state.build.base) {
        summary = BASES[state.build.base].name;

        if (state.build.flavors.length) {
          summary +=
            " • " +
            state.build.flavors
              .map(flavor => FLAVORS[flavor].name)
              .join(" + ");
        }

        if (state.build.topping) {
          summary +=
            " • " +
            TOPPINGS[state.build.topping].name;
        }
      }

      return `
        <div class="builder">
          <div class="builder-title">
            🍨 Chuẩn bị đơn cho khách
          </div>

          ${employee ? `
            <div class="warehouse-note">
              🧑‍🍳 Nhân viên đang hỗ trợ pha chế.
              Bạn chỉ cần chọn đúng ốc quế hoặc ly,
              nhân viên sẽ tự chuẩn bị phần còn lại.
            </div>
          ` : ""}

          ${state.employeeWorking ? `
            <div class="warehouse-note">
              🥄 Nhân viên đang pha chế đúng theo đơn khách...
            </div>
          ` : ""}

          <div class="builder-step">
            <div class="step-label">
              <span class="step-number">1</span>
              Chọn nền
            </div>

            <div class="choice-grid">
              ${baseButtons}
            </div>
          </div>

          ${!employee ? `
            <div class="builder-step">
              <div class="step-label">
                <span class="step-number">2</span>
                Chọn ${order.scoops} viên kem
              </div>

              <div class="choice-grid">
                ${flavorButtons}
              </div>
            </div>

            <div class="builder-step">
              <div class="step-label">
                <span class="step-number">3</span>
                Chọn topping
              </div>

              <div class="choice-grid">
                ${toppingButtons}
              </div>
            </div>
          ` : ""}

          <div class="build-summary">
            ${escapeHtml(summary)}
          </div>

          <div class="action-row">
            <button
              type="button"
              class="secondary-button"
              data-action="reset-build"
              ${state.employeeWorking ? "disabled" : ""}
            >
              Làm lại
            </button>

            <button
              type="button"
              class="serve-button"
              data-action="serve"
              ${state.employeeWorking ? "disabled" : ""}
            >
              Giao kem · ${money(getServicePrice())}
            </button>
          </div>
        </div>
      `;
    }

    function renderShop() {
      return `
        <section class="screen">
          ${renderStatusCard()}

          ${
            state.isOpen
              ? renderCounter()
              : renderClosedShop()
          }

          ${
            state.isOpen && state.activeCustomer
              ? renderCustomer()
              : ""
          }

          ${
            state.isOpen && state.activeCustomer
              ? renderBuilder()
              : ""
          }

          ${
            state.isOpen
              ? `
                <div style="margin-top:10px;">
                  <button
                    type="button"
                    class="close-button"
                    data-action="close-shop"
                  >
                    🌙 Đóng cửa ca bán hàng
                  </button>
                </div>
              `
              : ""
          }
        </section>
      `;
    }

    function renderWarehouseCard(type, key) {
      const item =
        type === "flavors"
          ? FLAVORS[key]
          : type === "toppings"
            ? TOPPINGS[key]
            : BASES[key];

      const count = state.inventory[type][key];
      const capacity = getCapacity(type);

      const costTable = {
        flavors: {
          chocolate: 42000,
          strawberry: 39000,
          vanilla: 36000,
          matcha: 45000,
          butter: 43000,
          durian: 56000
        },
        toppings: {
          sprinkles: 18000,
          strawberrySauce: 21000,
          cherry: 24000,
          cookie: 26000
        },
        bases: {
          cone: 24000,
          cup: 22000
        }
      };

      const quantity =
        type === "bases" ? 8 : 6;

      const cost = costTable[type][key];

      return `
        <div class="stock-card">
          <div class="stock-art">
            ${stockArt(type, key)}
          </div>

          <div class="stock-card-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="stock-card-count">
            ${count}/${capacity} đơn vị
          </div>

          <div class="stock-meta">
            <div class="capacity-text">
              +${quantity}/lô
            </div>

            <button
              type="button"
              class="buy-button"
              data-action="buy-stock"
              data-stock-type="${type}"
              data-stock-key="${key}"
            >
              ${money(cost)}
            </button>
          </div>
        </div>
      `;
    }

    function renderWarehouse() {
      return `
        <section class="screen">
          <div class="section-title">
            📦 Kho Hàng
          </div>

          <div class="section-subtitle">
            Nhập hàng trước khi mở cửa. Không có nguyên liệu miễn phí.
            Mỗi lô hàng sẽ bổ sung số lượng cố định vào kho.
          </div>

          <div class="warehouse-note">
            💡 Ngày đầu bạn có ${money(400000)}.
            Hãy cân đối tiền nhập hàng, nâng cấp và doanh thu.
            Không thể mở bán nếu kho chưa có kem và nền.
          </div>

          <div class="warehouse-group">
            <div class="warehouse-group-title">
              <span>🍨 Hũ kem</span>
              <span>+6/lô</span>
            </div>

            <div class="warehouse-grid">
              ${Object.keys(FLAVORS)
                .map(key => renderWarehouseCard("flavors", key))
                .join("")}
            </div>
          </div>

          <div class="warehouse-group">
            <div class="warehouse-group-title">
              <span>🥤 Ốc quế & ly</span>
              <span>+8/lô</span>
            </div>

            <div class="warehouse-grid">
              ${Object.keys(BASES)
                .map(key => renderWarehouseCard("bases", key))
                .join("")}
            </div>
          </div>

          <div class="warehouse-group">
            <div class="warehouse-group-title">
              <span>🍒 Topping</span>
              <span>+6/lô</span>
            </div>

            <div class="warehouse-grid">
              ${Object.keys(TOPPINGS)
                .map(key => renderWarehouseCard("toppings", key))
                .join("")}
            </div>
          </div>

          <div class="capacity-card">
            <div class="capacity-row">
              <div class="capacity-icon">🏬</div>

              <div class="capacity-copy">
                <div class="capacity-title">
                  Sức chứa kho
                </div>

                <div class="capacity-sub">
                  Kem: ${getCapacity("flavors")} •
                  Nền/topping: ${getCapacity("bases")}
                </div>
              </div>

              <button
                type="button"
                class="upgrade-button"
                data-action="upgrade-warehouse"
              >
                Nâng cấp
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function renderUpgrade(type) {
      const definition = UPGRADE_DEFS[type];
      const level = state.upgrades[type];

      const maxed = level >= definition.max;
      const cost =
        maxed
          ? 0
          : definition.costs[level];

      let levelText = `Cấp ${level}/${definition.max}`;

      if (type === "price") {
        levelText += ` • ${money(getServicePrice())}/đơn`;
      }

      if (type === "employee" && level > 0) {
        levelText += ` • Lương ${money(employeeWage())}/ngày`;
      }

      return `
        <div class="upgrade-card">
          <div class="upgrade-top">
            <div class="upgrade-icon">
              ${definition.icon}
            </div>

            <div class="upgrade-copy">
              <div class="upgrade-name">
                ${escapeHtml(definition.name)}
              </div>

              <div class="upgrade-description">
                ${escapeHtml(definition.description)}
              </div>

              <div class="level-badge">
                ${escapeHtml(levelText)}
              </div>
            </div>
          </div>

          <div class="upgrade-bottom">
            <div class="upgrade-price">
              ${maxed ? "Đã tối đa" : money(cost)}
            </div>

            <button
              type="button"
              class="upgrade-button"
              data-action="upgrade"
              data-upgrade="${type}"
              ${maxed ? "disabled" : ""}
            >
              ${maxed ? "Đã tối đa" : "Nâng cấp"}
            </button>
          </div>
        </div>
      `;
    }

    function renderUpgrades() {
      return `
        <section class="screen">
          <div class="section-title">
            🛠️ Nâng Cấp
          </div>

          <div class="section-subtitle">
            Các nâng cấp có giá cao để việc kinh doanh dần trở nên
            hiệu quả hơn khi tiệm phát triển.
          </div>

          ${renderUpgrade("warehouse")}
          ${renderUpgrade("scoopSpeed")}
          ${renderUpgrade("price")}
          ${renderUpgrade("employee")}

          <div class="warehouse-note">
            🧑‍🍳 Nhân viên sẽ làm việc ngay sau khi thuê.
            Khi mở mỗi ngày, tiền lương sẽ được trừ tự động.
          </div>
        </section>
      `;
    }

    function renderReviews() {
      if (!state.reviews.length) {
        return `
          <section class="screen">
            <div class="section-title">
              💌 Đánh Giá
            </div>

            <div class="empty-state">
              Chưa có đánh giá nào.<br>
              Hãy mở cửa, phục vụ khách thật tốt
              và những lời nhận xét đầu tiên sẽ xuất hiện ở đây.
            </div>
          </section>
        `;
      }

      return `
        <section class="screen">
          <div class="section-title">
            💌 Đánh Giá
          </div>

          <div class="section-subtitle">
            Phản hồi được lưu lại để bạn có thể trả lời khách bất cứ lúc nào.
          </div>

          ${state.reviews.map(review => {
            const visibleName =
              review.anonymous
                ? "Ẩn danh"
                : review.name;

            const stars =
              "★".repeat(review.stars) +
              "☆".repeat(5 - review.stars);

            return `
              <div class="review-card">
                <div class="review-head">
                  <div class="review-avatar">
                    ${customerAvatar(
                      review.gender,
                      review.anonymous
                    )}
                  </div>

                  <div class="review-name">
                    ${escapeHtml(visibleName)}
                  </div>

                  <div class="stars">
                    ${[...stars].map((star, index) => `
                      <span class="${
                        index < review.stars
                          ? "star-gold"
                          : "star-white"
                      }">${star}</span>
                    `).join("")}
                  </div>
                </div>

                <div class="review-text">
                  ${escapeHtml(review.text)}
                </div>

                ${
                  review.reply
                    ? `
                      <div class="reply-display">
                        💗 Bạn đã trả lời:
                        ${escapeHtml(review.reply)}
                      </div>
                    `
                    : `
                      <div class="reply-row">
                        <input
                          class="reply-input"
                          data-reply-input="${review.id}"
                          maxlength="180"
                          placeholder="Viết lời trả lời khách..."
                        >

                        <button
                          type="button"
                          class="reply-button"
                          data-action="reply-review"
                          data-review-id="${review.id}"
                        >
                          Gửi
                        </button>
                      </div>
                    `
                }
              </div>
            `;
          }).join("")}
        </section>
      `;
    }

    function renderNavigation() {
      const tabs = [
        {
          id: "shop",
          icon: "🍦",
          label: "Tiệm"
        },
        {
          id: "warehouse",
          icon: "📦",
          label: "Kho"
        },
        {
          id: "upgrades",
          icon: "🛠️",
          label: "Nâng cấp"
        },
        {
          id: "reviews",
          icon: "💌",
          label: "Đánh giá"
        }
      ];

      return `
        <nav class="bottom-nav">
          <div class="nav-grid">
            ${tabs.map(tab => `
              <button
                type="button"
                class="nav-button ${
                  state.currentScreen === tab.id
                    ? "active"
                    : ""
                }"
                data-action="tab"
                data-tab="${tab.id}"
              >
                <span class="nav-icon">${tab.icon}</span>
                <span>${tab.label}</span>
              </button>
            `).join("")}
          </div>
        </nav>
      `;
    }

    function render() {
      if (!state.initialized || !state.shopName) {
        renderWelcome();
        return;
      }

      const screens = {
        shop: renderShop,
        warehouse: renderWarehouse,
        upgrades: renderUpgrades,
        reviews: renderReviews
      };

      const screenRenderer =
        screens[state.currentScreen] || renderShop;

      app.innerHTML = `
        <div class="game-shell">
          ${renderHeader()}

          <main class="content">
            ${screenRenderer()}
          </main>

          ${renderNavigation()}
        </div>
      `;
    }

    function handleAction(actionElement) {
      const action = actionElement.dataset.action;

      switch (action) {
        case "start-game": {
          const input =
            document.getElementById("shopNameInput");

          const shopName =
            input ? input.value.trim() : "";

          if (!shopName) {
            input?.focus();

            showPopup(
              "Đặt tên cho tiệm nhé",
              "Hãy nhập tên tiệm trước khi bắt đầu kinh doanh.",
              "🏡"
            );

            return;
          }

          initNewGame(shopName);
          break;
        }

        case "tab": {
          if (state.isOpen && state.currentScreen === "shop") {
            state.currentScreen = actionElement.dataset.tab;
          } else {
            state.currentScreen = actionElement.dataset.tab;
          }

          render();
          break;
        }

        case "open-shop":
          startShop();
          break;

        case "close-shop":
          closeShopManually();
          break;

        case "go-warehouse":
          closePopup();
          state.currentScreen = "warehouse";
          render();
          break;

        case "continue-same-day":
          continueSameDay();
          break;

        case "close-popup":
          closePopup();
          break;

        case "choose-base":
          chooseBase(actionElement.dataset.base);
          break;

        case "choose-flavor":
          chooseFlavor(actionElement.dataset.flavor);
          break;

        case "choose-topping":
          chooseTopping(actionElement.dataset.topping);
          break;

        case "quick-flavor":
          chooseFlavor(actionElement.dataset.flavor);
          break;

        case "reset-build":
          resetBuildAndRender();
          break;

        case "serve":
          serveCustomer();
          break;

        case "buy-stock":
          purchase(
            actionElement.dataset.stockType,
            actionElement.dataset.stockKey
          );
          break;

        case "upgrade-warehouse":
          upgradeWarehouse();
          break;

        case "upgrade":
          buyUpgrade(actionElement.dataset.upgrade);
          break;

        case "reply-review":
          replyReview(actionElement.dataset.reviewId);
          break;

        case "next-day":
          nextDay();
          break;

        default:
          break;
      }
    }

    app.addEventListener("click", event => {
      const actionElement =
        event.target.closest("[data-action]");

      if (!actionElement) {
        return;
      }

      handleAction(actionElement);
    });

    app.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        event.target.id === "shopNameInput"
      ) {
        event.preventDefault();

        const button =
          app.querySelector('[data-action="start-game"]');

        if (button) {
          button.click();
        }
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (
        document.visibilityState === "hidden" &&
        state.isOpen
      ) {
        saveGame();
      }
    });

    window.addEventListener("beforeunload", () => {
      if (state.shopName) {
        saveGame();
      }
    });

    function boot() {
      const hasSave = loadGame();

      if (hasSave) {
        state.initialized = true;
        state.currentScreen = "shop";
        render();
      } else {
        state.initialized = false;
        renderWelcome();
      }
    }

    boot();
  </script>
</body>
</html>
