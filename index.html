<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffe4ec">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Tiệm Bán Kem Ngọt Ngào</title>

  <style>
    :root {
      --pink-50: #fff8fa;
      --pink-100: #ffeef3;
      --pink-200: #ffdce6;
      --pink-300: #ffc4d3;
      --pink-400: #f69bb4;
      --pink-500: #eb7f9d;

      --cream: #fffaf0;
      --cream-2: #fff3d9;
      --brown: #765448;
      --brown-dark: #543b33;
      --brown-soft: #a77b6b;

      --green: #a8cfad;
      --green-dark: #6e9b77;

      --blue: #acd5e7;
      --yellow: #f5d77d;

      --white: #ffffff;
      --ink: #4d3b37;
      --muted: #9a8580;

      --shadow:
        0 14px 35px rgba(116, 77, 73, 0.11),
        0 3px 10px rgba(116, 77, 73, 0.07);

      --shadow-soft:
        0 7px 20px rgba(116, 77, 73, 0.09);

      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;

      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-height: 76px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.9), transparent 25%),
        linear-gradient(180deg, #fff4f7 0%, #fff9f1 100%);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    input,
    textarea {
      outline: none;
    }

    svg {
      display: block;
    }

    #app {
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.52),
          rgba(255,250,245,.82)
        );
      box-shadow:
        0 0 60px rgba(105, 73, 66, 0.08);
    }

    .screen {
      min-height: 100vh;
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
    }

    /* =========================================================
       WELCOME
    ========================================================= */

    .welcome-screen {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(28px, env(safe-area-inset-top))
        22px
        max(28px, env(safe-area-inset-bottom));
      background:
        linear-gradient(180deg, #fff0f5 0%, #fff8e9 58%, #ffeef4 100%);
    }

    .welcome-cloud {
      position: absolute;
      width: 150px;
      height: 52px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      filter: blur(.2px);
      animation: cloudFloat 13s ease-in-out infinite;
    }

    .welcome-cloud::before,
    .welcome-cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .welcome-cloud::before {
      width: 65px;
      height: 65px;
      left: 22px;
      bottom: 12px;
    }

    .welcome-cloud::after {
      width: 82px;
      height: 82px;
      right: 20px;
      bottom: 8px;
    }

    .welcome-cloud.one {
      top: 11%;
      left: -40px;
    }

    .welcome-cloud.two {
      top: 26%;
      right: -60px;
      transform: scale(.75);
      animation-delay: -5s;
    }

    .welcome-cloud.three {
      bottom: 12%;
      left: -55px;
      transform: scale(.6);
      animation-delay: -8s;
    }

    .floating-treat {
      position: absolute;
      font-size: 26px;
      opacity: .72;
      animation: treatFloat 4s ease-in-out infinite;
      user-select: none;
    }

    .floating-treat:nth-of-type(1) {
      top: 15%;
      left: 11%;
    }

    .floating-treat:nth-of-type(2) {
      top: 23%;
      right: 12%;
      animation-delay: -1s;
    }

    .floating-treat:nth-of-type(3) {
      top: 47%;
      left: 7%;
      animation-delay: -2.2s;
    }

    .floating-treat:nth-of-type(4) {
      top: 53%;
      right: 8%;
      animation-delay: -3s;
    }

    .floating-treat:nth-of-type(5) {
      bottom: 20%;
      left: 16%;
      animation-delay: -1.5s;
    }

    .welcome-card {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .welcome-logo {
      width: 190px;
      height: 210px;
      margin: 0 auto 6px;
      position: relative;
      animation: logoWobble 3.8s ease-in-out infinite;
    }

    .welcome-logo svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .welcome-title {
      margin: 0;
      font-size: clamp(28px, 8vw, 40px);
      line-height: 1.03;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: var(--brown-dark);
    }

    .welcome-title span {
      color: var(--pink-500);
    }

    .welcome-subtitle {
      margin: 10px auto 24px;
      max-width: 330px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .welcome-input-wrap {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(235,127,157,.18);
      border-radius: 20px;
      padding: 6px;
      display: flex;
      box-shadow: var(--shadow-soft);
      margin-bottom: 12px;
    }

    .welcome-input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: 0;
      background: transparent;
      padding: 0 14px;
      color: var(--ink);
      font-weight: 700;
    }

    .welcome-input::placeholder {
      color: #bba9a4;
      font-weight: 500;
    }

    .primary-button {
      min-height: 52px;
      padding: 0 20px;
      border-radius: 17px;
      background: linear-gradient(180deg, #f6a3ba, #eb7f9d);
      color: white;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(235,127,157,.25);
      transition: transform .18s ease, filter .18s ease;
    }

    .primary-button:active {
      transform: scale(.97);
    }

    .welcome-start {
      width: 100%;
      min-height: 56px;
      font-size: 16px;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .top-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding:
        max(10px, env(safe-area-inset-top))
        14px
        10px;
      background: rgba(255,249,247,.92);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(118,84,72,.07);
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-block {
      flex: 1;
      min-width: 0;
    }

    .brand-mini {
      font-size: 11px;
      color: var(--pink-500);
      font-weight: 900;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .shop-name {
      font-size: 18px;
      font-weight: 900;
      color: var(--brown-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-pill {
      flex-shrink: 0;
      padding: 7px 10px;
      background: var(--cream-2);
      border: 1px solid rgba(118,84,72,.08);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: var(--brown);
    }

    .cash-pill {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      background: #fff;
      border: 1px solid rgba(118,84,72,.08);
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(118,84,72,.05);
      font-size: 12px;
      font-weight: 900;
      color: var(--green-dark);
    }

    .coin-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f3d274;
      border: 2px solid #d5af4e;
      display: grid;
      place-items: center;
      color: #876c26;
      font-size: 11px;
      font-weight: 900;
    }

    /* =========================================================
       COMMON
    ========================================================= */

    .content {
      padding: 14px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 2px 12px;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: var(--brown-dark);
    }

    .section-caption {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(118,84,72,.07);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .empty-card {
      text-align: center;
      padding: 34px 20px;
      color: var(--muted);
    }

    .small-button {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      background: var(--pink-100);
      color: var(--pink-500);
    }

    .small-button.secondary {
      background: #f6f0ed;
      color: var(--brown);
    }

    .small-button.green {
      background: #e8f4e9;
      color: var(--green-dark);
    }

    .small-button:active {
      transform: scale(.96);
    }

    .danger-text {
      color: #d47777;
    }

    /* =========================================================
       SHOP SCENE
    ========================================================= */

    .shop-scene {
      overflow: hidden;
      border-radius: 26px;
      position: relative;
      min-height: 400px;
      background:
        linear-gradient(180deg, #fff8ef 0%, #fff4ed 52%, #f9e5d4 52%, #efd1b7 100%);
      border: 1px solid rgba(118,84,72,.08);
      box-shadow: var(--shadow);
    }

    .scene-cloud {
      position: absolute;
      top: 34px;
      width: 80px;
      height: 28px;
      background: rgba(255,255,255,.8);
      border-radius: 999px;
    }

    .scene-cloud::before,
    .scene-cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .scene-cloud::before {
      width: 36px;
      height: 36px;
      left: 10px;
      bottom: 7px;
    }

    .scene-cloud::after {
      width: 42px;
      height: 42px;
      right: 8px;
      bottom: 5px;
    }

    .scene-cloud.one {
      left: 22px;
    }

    .scene-cloud.two {
      right: 28px;
      transform: scale(.7);
    }

    .awning {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 92px;
      background:
        repeating-linear-gradient(
          90deg,
          #fff 0 27px,
          #f7a7bb 27px 54px
        );
      border-bottom-left-radius: 35px;
      border-bottom-right-radius: 35px;
      border-bottom: 4px solid #d993a6;
      box-shadow: 0 8px 14px rgba(118,84,72,.09);
    }

    .awning::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -8px;
      height: 13px;
      background: #f7a7bb;
      border-radius: 0 0 20px 20px;
    }

    .shop-sign {
      position: absolute;
      z-index: 3;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: 76%;
      padding: 12px 14px;
      border-radius: 18px;
      background: #fffaf1;
      border: 3px solid #e8b6a0;
      box-shadow: 0 7px 12px rgba(118,84,72,.12);
      text-align: center;
    }

    .shop-sign-main {
      font-size: 16px;
      line-height: 1.1;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .shop-sign-sub {
      margin-top: 3px;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--pink-500);
      font-weight: 900;
    }

    .hanging-lantern {
      position: absolute;
      z-index: 4;
      top: 94px;
      width: 13px;
      height: 22px;
      background: #f4d67d;
      border-radius: 5px 5px 9px 9px;
      border: 2px solid #d2ad55;
    }

    .hanging-lantern::before {
      content: "";
      position: absolute;
      width: 2px;
      height: 18px;
      top: -19px;
      left: 50%;
      background: #92705e;
    }

    .hanging-lantern.left {
      left: 19%;
    }

    .hanging-lantern.right {
      right: 19%;
    }

    .jars {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 134px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      z-index: 5;
    }

    .jar {
      position: relative;
      min-height: 90px;
      border-radius: 14px 14px 12px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.86), rgba(236,230,222,.72));
      border: 2px solid rgba(163,147,136,.38);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.45);
      overflow: hidden;
    }

    .jar-lid {
      position: absolute;
      left: 10%;
      right: 10%;
      top: -4px;
      height: 15px;
      border-radius: 999px;
      background: #c7beb7;
      border: 2px solid #a69b94;
    }

    .jar-ice {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 10px;
      height: 45px;
      border-radius: 50% 50% 12px 12px;
    }

    .jar-label {
      position: absolute;
      left: 50%;
      bottom: 3px;
      transform: translateX(-50%);
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      font-size: 8px;
      font-weight: 900;
      white-space: nowrap;
    }

    .scene-counter {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 80px;
      height: 100px;
      background:
        linear-gradient(180deg, #c78f68, #a96e4d);
      border-top: 8px solid #e5b08b;
      box-shadow:
        inset 0 6px 0 rgba(255,255,255,.18),
        0 -7px 16px rgba(118,84,72,.12);
      z-index: 6;
    }

    .counter-front {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 16px;
      height: 40px;
      border-radius: 8px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.07) 0 7px,
          transparent 7px 24px
        );
    }

    .cat-area {
      position: absolute;
      z-index: 9;
      right: 12px;
      bottom: 107px;
      width: 140px;
      height: 125px;
      pointer-events: none;
    }

    .cat-cushion {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 5px;
      height: 54px;
      border-radius: 50%;
      background: #f5a8bc;
      border: 3px solid #db879e;
      transform: rotate(-4deg);
    }

    .cat-body {
      position: absolute;
      left: 25px;
      bottom: 29px;
      width: 93px;
      height: 67px;
      border-radius: 48% 52% 48% 52%;
      background: #e8d4c4;
      border: 3px solid #c7ae9d;
      transform: rotate(-5deg);
    }

    .cat-head {
      position: absolute;
      left: 23px;
      bottom: 59px;
      width: 67px;
      height: 57px;
      border-radius: 48% 48% 45% 45%;
      background: #ead8c9;
      border: 3px solid #c7ae9d;
      z-index: 2;
    }

    .cat-ear {
      position: absolute;
      top: -5px;
      width: 27px;
      height: 30px;
      background: #e6d0bf;
      border: 3px solid #c7ae9d;
      border-radius: 65% 35% 55% 45%;
    }

    .cat-ear.left {
      left: 3px;
      transform: rotate(-24deg);
    }

    .cat-ear.right {
      right: 3px;
      transform: scaleX(-1) rotate(-24deg);
    }

    .cat-face {
      position: absolute;
      left: 0;
      right: 0;
      top: 17px;
      text-align: center;
    }

    .cat-eye {
      display: inline-block;
      width: 13px;
      height: 5px;
      border-bottom: 2px solid #5d4a43;
      border-radius: 50%;
      margin: 0 3px;
    }

    .cat-nose {
      width: 7px;
      height: 5px;
      border-radius: 50%;
      background: #d98b9e;
      margin: 6px auto 0;
    }

    .cat-cheek {
      position: absolute;
      top: 29px;
      width: 12px;
      height: 7px;
      background: rgba(235,137,157,.38);
      border-radius: 50%;
    }

    .cat-cheek.left {
      left: 8px;
    }

    .cat-cheek.right {
      right: 8px;
    }

    .cat-tail {
      position: absolute;
      width: 46px;
      height: 46px;
      right: 8px;
      bottom: 34px;
      border: 11px solid #e8d4c4;
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(34deg);
    }

    .zzz {
      position: absolute;
      right: 7px;
      top: 0;
      color: #b08b9b;
      font-weight: 1000;
      animation: zzzFloat 3s ease-in-out infinite;
    }

    .zzz span {
      display: block;
      line-height: 1;
    }

    .zzz .z1 {
      font-size: 14px;
    }

    .zzz .z2 {
      margin-left: 11px;
      font-size: 11px;
      animation-delay: -1s;
    }

    .zzz .z3 {
      margin-left: 22px;
      font-size: 8px;
      animation-delay: -2s;
    }

    .shop-status-panel {
      position: absolute;
      z-index: 10;
      left: 12px;
      bottom: 96px;
    }

    .closed-badge,
    .open-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 1000;
      box-shadow: 0 5px 12px rgba(80,55,48,.12);
    }

    .closed-badge {
      background: #fff;
      color: #9c7670;
    }

    .open-badge {
      background: #eaf5ea;
      color: var(--green-dark);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .scene-floor-detail {
      position: absolute;
      left: 12px;
      bottom: 22px;
      width: 55px;
      height: 25px;
      border-radius: 50%;
      background: rgba(145,95,67,.13);
    }

    /* =========================================================
       CUSTOMER
    ========================================================= */

    .customer-card {
      margin-top: 14px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .customer-head {
      display: flex;
      gap: 11px;
      align-items: center;
    }

    .avatar {
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #f0d5d0;
      background: #fff1ed;
    }

    .avatar svg {
      width: 100%;
      height: 100%;
    }

    .customer-meta {
      min-width: 0;
      flex: 1;
    }

    .customer-name {
      font-size: 15px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .customer-order-label {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .patience-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .patience-svg {
      width: 64px;
      height: 64px;
      transform: rotate(-90deg);
    }

    .patience-bg {
      fill: none;
      stroke: #f0e7e4;
      stroke-width: 6;
    }

    .patience-progress {
      fill: none;
      stroke: #8ec29a;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke .3s ease;
    }

    .patience-wrap.warning .patience-progress {
      stroke: #e99b84;
    }

    .patience-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .speech {
      margin-top: 12px;
      padding: 12px 14px;
      background: #fff7df;
      border: 1px solid #f2dfad;
      border-radius: 15px;
      font-size: 13px;
      line-height: 1.5;
      color: #665047;
      position: relative;
    }

    .speech::before {
      content: "";
      position: absolute;
      left: 25px;
      top: -7px;
      width: 13px;
      height: 13px;
      background: #fff7df;
      border-left: 1px solid #f2dfad;
      border-top: 1px solid #f2dfad;
      transform: rotate(45deg);
    }

    .hurry-note {
      margin-top: 8px;
      color: #c87568;
      font-size: 11px;
      font-weight: 800;
    }

    /* =========================================================
       OPEN/CLOSE
    ========================================================= */

    .management-card {
      margin-top: 14px;
      padding: 16px;
    }

    .management-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .management-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 16px;
      background: var(--pink-100);
      display: grid;
      place-items: center;
      color: var(--pink-500);
    }

    .management-info {
      flex: 1;
      min-width: 0;
    }

    .management-title {
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .management-description {
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
    }

    .open-button {
      min-height: 46px;
      padding: 0 15px;
      border-radius: 14px;
      background: #8dbf98;
      color: white;
      font-weight: 1000;
      box-shadow: 0 7px 15px rgba(110,155,119,.18);
    }

    .close-button {
      min-height: 46px;
      padding: 0 15px;
      border-radius: 14px;
      background: #f3e5df;
      color: #8d6256;
      font-weight: 1000;
    }

    .target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px dashed rgba(118,84,72,.13);
      font-size: 12px;
    }

    .target-progress {
      height: 8px;
      background: #f0e8e5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 7px;
    }

    .target-progress > div {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f5a4b9, #df8aa4);
      transition: width .3s ease;
    }

    /* =========================================================
       ICE CREAM MAKER
    ========================================================= */

    .maker-card {
      margin-top: 14px;
      padding: 14px;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .step-item {
      position: relative;
      text-align: center;
      padding: 8px 4px;
      border-radius: 12px;
      background: #faf4f1;
      color: #b09b95;
      font-size: 10px;
      font-weight: 900;
    }

    .step-item.active {
      background: var(--pink-100);
      color: var(--pink-500);
    }

    .step-number {
      width: 22px;
      height: 22px;
      margin: 0 auto 4px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eee4e1;
      font-size: 10px;
    }

    .step-item.active .step-number,
    .step-item.done .step-number {
      background: var(--pink-400);
      color: white;
    }

    .dessert-preview {
      height: 190px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.8), transparent 25%),
        linear-gradient(180deg, #fff8f1, #fff1e6);
      border: 1px dashed rgba(118,84,72,.12);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 17px;
    }

    .dessert-base {
      position: relative;
      width: 70px;
      height: 92px;
      background:
        repeating-linear-gradient(
          135deg,
          #d99b64 0 6px,
          #c98a53 6px 11px
        );
      clip-path: polygon(8% 0, 92% 0, 58% 100%, 42% 100%);
      border-radius: 5px;
      opacity: 0;
      transform: translateY(20px) scale(.8);
      transition: opacity .3s ease, transform .3s ease;
    }

    .dessert-base.cup {
      width: 84px;
      height: 72px;
      clip-path: none;
      border-radius: 8px 8px 24px 24px;
      background: linear-gradient(90deg, #d8eef0, #fff, #d8eef0);
      border: 2px solid #a6ced0;
    }

    .dessert-base.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .scoop {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid rgba(116,84,72,.1);
      bottom: 76px;
      box-shadow:
        inset -6px -5px 0 rgba(0,0,0,.05);
      animation: scoopAppear .3s ease both;
    }

    .scoop.one {
      left: calc(50% - 48px);
    }

    .scoop.two {
      left: calc(50% - 7px);
      bottom: 84px;
    }

    .dessert-topping {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 25px;
      animation: toppingAppear .3s ease both;
    }

    .choice-section {
      margin-top: 13px;
    }

    .choice-title {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .choice {
      min-height: 57px;
      border: 1px solid rgba(118,84,72,.09);
      background: #fff;
      border-radius: 14px;
      padding: 7px 5px;
      text-align: center;
      transition: transform .16s ease, border .16s ease, background .16s ease;
    }

    .choice.selected {
      border: 2px solid #ee99af;
      background: #fff0f4;
      transform: translateY(-1px);
    }

    .choice:active {
      transform: scale(.96);
    }

    .choice-emoji {
      display: block;
      font-size: 22px;
      line-height: 1.05;
    }

    .choice-label {
      display: block;
      margin-top: 3px;
      font-size: 9px;
      font-weight: 900;
      color: var(--brown);
    }

    .choice-count {
      display: block;
      margin-top: 2px;
      font-size: 8px;
      color: var(--muted);
    }

    .maker-actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
      margin-top: 13px;
    }

    .reset-button {
      min-height: 49px;
      border-radius: 15px;
      background: #f3eeeb;
      color: var(--brown);
      font-weight: 1000;
    }

    .serve-button {
      min-height: 49px;
      border-radius: 15px;
      background: linear-gradient(180deg, #ef9fb5, #e783a1);
      color: white;
      font-weight: 1000;
      box-shadow: 0 8px 15px rgba(231,131,161,.2);
    }

    .serve-button:disabled {
      opacity: .48;
      cursor: not-allowed;
      box-shadow: none;
    }

    .employee-mode {
      padding: 12px;
      border-radius: 14px;
      background: #edf7ee;
      color: var(--green-dark);
      font-size: 11px;
      line-height: 1.45;
      margin-bottom: 12px;
      font-weight: 800;
    }

    /* =========================================================
       WAREHOUSE
    ========================================================= */

    .warehouse-banner {
      padding: 15px;
      background: linear-gradient(135deg, #fff3e6, #fff8f3);
      border-radius: 20px;
      border: 1px solid rgba(118,84,72,.07);
      box-shadow: var(--shadow-soft);
    }

    .warehouse-banner-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .warehouse-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: #f8dfc5;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    .warehouse-info {
      flex: 1;
    }

    .warehouse-title {
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .warehouse-sub {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .capacity-bar {
      height: 7px;
      background: #eadfd9;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .capacity-bar > div {
      height: 100%;
      background: #d89c77;
      border-radius: inherit;
    }

    .inventory-group {
      margin-top: 16px;
    }

    .inventory-group-title {
      font-size: 14px;
      font-weight: 1000;
      color: var(--brown-dark);
      margin: 0 0 9px 2px;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .stock-card {
      padding: 12px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid rgba(118,84,72,.07);
      box-shadow: var(--shadow-soft);
    }

    .stock-top {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .stock-art {
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: #faf1eb;
      display: grid;
      place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .stock-meta {
      min-width: 0;
      flex: 1;
    }

    .stock-name {
      font-size: 12px;
      font-weight: 1000;
      color: var(--brown-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stock-quantity {
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
    }

    .stock-buy {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .stock-price {
      font-size: 9px;
      color: #9a8177;
      line-height: 1.3;
    }

    .buy-button {
      min-height: 34px;
      padding: 0 9px;
      border-radius: 10px;
      background: #f3dca7;
      color: #715b2b;
      font-size: 9px;
      font-weight: 1000;
    }

    .purchased-tag {
      color: var(--green-dark);
      font-size: 9px;
      font-weight: 900;
    }

    /* =========================================================
       UPGRADES
    ========================================================= */

    .upgrade-grid {
      display: grid;
      gap: 10px;
    }

    .upgrade-card {
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .upgrade-art {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      border-radius: 16px;
      background: var(--pink-100);
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    .upgrade-info {
      min-width: 0;
      flex: 1;
    }

    .upgrade-name {
      font-size: 13px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .upgrade-level {
      margin-top: 3px;
      color: var(--pink-500);
      font-size: 10px;
      font-weight: 900;
    }

    .upgrade-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .upgrade-action {
      min-width: 76px;
      min-height: 40px;
      padding: 0 8px;
      border-radius: 12px;
      background: #f4d89b;
      color: #6e5828;
      font-size: 10px;
      font-weight: 1000;
    }

    .upgrade-action.maxed {
      background: #e8f2e8;
      color: var(--green-dark);
    }

    /* =========================================================
       REVIEWS
    ========================================================= */

    .reviews-summary {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 13px;
      padding: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .review-score-box {
      text-align: center;
      padding-right: 13px;
      border-right: 1px dashed rgba(118,84,72,.13);
    }

    .review-count {
      font-size: 11px;
      color: var(--muted);
    }

    .review-summary-stars {
      margin-top: 4px;
      font-size: 17px;
      letter-spacing: 1px;
      color: #e7b83e;
    }

    .review-summary-text {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }

    .review-list {
      display: grid;
      gap: 11px;
    }

    .review-card {
      padding: 14px;
    }

    .review-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .review-avatar {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      overflow: hidden;
      flex-shrink: 0;
      background: #f4efec;
      border: 1px solid rgba(118,84,72,.08);
    }

    .review-avatar svg {
      width: 100%;
      height: 100%;
    }

    .review-user {
      min-width: 0;
      flex: 1;
    }

    .review-name {
      font-size: 13px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .review-date {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .stars {
      white-space: nowrap;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .star-gold {
      color: #e8b83f;
    }

    .star-empty {
      color: #e3ddd9;
    }

    .review-text {
      margin-top: 11px;
      font-size: 12px;
      line-height: 1.55;
      color: #5f4b45;
    }

    .review-reply {
      margin-top: 11px;
      padding: 10px;
      background: #fff5f7;
      border-left: 3px solid #ee9eb2;
      border-radius: 9px;
      font-size: 11px;
      line-height: 1.45;
      color: #79575f;
    }

    .review-reply strong {
      color: var(--pink-500);
    }

    .reply-area {
      margin-top: 12px;
    }

    .reply-suggestions {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none;
    }

    .reply-suggestions::-webkit-scrollbar {
      display: none;
    }

    .suggestion-button {
      flex-shrink: 0;
      min-height: 31px;
      padding: 0 9px;
      border-radius: 999px;
      background: #f8f2ee;
      color: #806960;
      font-size: 9px;
      font-weight: 800;
    }

    .reply-row {
      display: flex;
      gap: 6px;
      margin-top: 7px;
    }

    .reply-input {
      min-width: 0;
      flex: 1;
      height: 40px;
      border-radius: 11px;
      border: 1px solid #eadfda;
      background: #fff;
      padding: 0 11px;
      font-size: 11px;
      color: var(--ink);
    }

    .reply-send {
      min-width: 53px;
      height: 40px;
      border-radius: 11px;
      background: var(--pink-400);
      color: white;
      font-size: 11px;
      font-weight: 1000;
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    .bottom-nav {
      position: fixed;
      z-index: 50;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 100%);
      padding:
        7px
        8px
        calc(7px + var(--safe-bottom));
      background: rgba(255,250,249,.96);
      backdrop-filter: blur(18px);
      border-top: 1px solid rgba(118,84,72,.08);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      box-shadow: 0 -7px 25px rgba(118,84,72,.08);
    }

    .nav-button {
      min-height: 58px;
      border-radius: 15px;
      background: transparent;
      color: #a99590;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 900;
    }

    .nav-button.active {
      color: var(--pink-500);
      background: var(--pink-100);
    }

    .nav-icon {
      width: 23px;
      height: 23px;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(73,50,46,.34);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-layer.hidden {
      display: none;
    }

    .modal {
      width: min(410px, 100%);
      padding: 22px;
      background: #fffaf7;
      border-radius: 25px;
      border: 1px solid rgba(118,84,72,.08);
      box-shadow: 0 25px 70px rgba(63,43,39,.22);
      animation: modalIn .22s ease both;
      text-align: center;
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 11px;
      border-radius: 20px;
      background: var(--pink-100);
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    .modal-title {
      margin: 0;
      font-size: 19px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .modal-message {
      margin: 9px 0 0;
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
    }

    .modal-actions {
      display: grid;
      gap: 8px;
      margin-top: 17px;
    }

    .modal-button {
      min-height: 47px;
      border-radius: 14px;
      font-weight: 1000;
    }

    .modal-button.primary {
      background: var(--pink-400);
      color: white;
    }

    .modal-button.secondary {
      background: #f1e9e5;
      color: var(--brown);
    }

    /* =========================================================
       TOAST
    ========================================================= */

    .toast-container {
      position: fixed;
      z-index: 200;
      left: 50%;
      top: max(16px, env(safe-area-inset-top));
      transform: translateX(-50%);
      width: min(430px, calc(100% - 28px));
      pointer-events: none;
    }

    .toast {
      background: #4f403b;
      color: white;
      border-radius: 16px;
      padding: 13px 15px;
      box-shadow: 0 12px 28px rgba(60,42,37,.25);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
      animation: toastIn .24s ease both;
      margin-bottom: 8px;
      pointer-events: none;
    }

    .toast.success {
      background: #5e8869;
    }

    .toast.warning {
      background: #a46e54;
    }

    /* =========================================================
       SUMMARY
    ========================================================= */

    .summary-card {
      padding: 21px;
      text-align: center;
    }

    .summary-emoji {
      font-size: 42px;
    }

    .summary-title {
      margin: 8px 0 0;
      font-size: 24px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .summary-subtitle {
      margin: 6px auto 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .summary-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .summary-stat {
      padding: 12px;
      border-radius: 14px;
      background: #fff5f0;
    }

    .summary-stat-label {
      font-size: 9px;
      color: var(--muted);
    }

    .summary-stat-value {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 1000;
      color: var(--brown-dark);
    }

    .summary-profit {
      margin-top: 13px;
      padding: 15px;
      border-radius: 17px;
      background: #edf7ed;
    }

    .summary-profit-label {
      font-size: 10px;
      color: var(--green-dark);
      font-weight: 900;
    }

    .summary-profit-value {
      margin-top: 3px;
      font-size: 24px;
      color: var(--green-dark);
      font-weight: 1000;
    }

    .summary-button {
      width: 100%;
      margin-top: 14px;
    }

    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes logoWobble {
      0%, 100% {
        transform: rotate(-2deg) translateY(0);
      }
      50% {
        transform: rotate(2deg) translateY(-5px);
      }
    }

    @keyframes cloudFloat {
      0%, 100% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(25px);
      }
    }

    @keyframes treatFloat {
      0%, 100% {
        transform: translateY(0) rotate(-4deg);
      }
      50% {
        transform: translateY(-13px) rotate(5deg);
      }
    }

    @keyframes zzzFloat {
      0%, 100% {
        transform: translateY(4px);
        opacity: .35;
      }
      50% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    @keyframes scoopAppear {
      from {
        opacity: 0;
        transform: translateY(13px) scale(.7);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toppingAppear {
      from {
        opacity: 0;
        transform: translate(-50%, 10px) scale(.7);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 370px) {
      .content {
        padding: 11px;
      }

      .shop-name {
        font-size: 16px;
      }

      .cash-pill {
        padding: 6px 7px;
      }

      .jars {
        gap: 5px;
      }

      .jar {
        min-height: 78px;
      }

      .choice-grid {
        gap: 5px;
      }

      .choice {
        min-height: 53px;
      }

      .cat-area {
        transform: scale(.86);
        transform-origin: bottom right;
      }
    }
  </style>
</head>

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn("Không thể lưu dữ liệu game:", error);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          state = createFreshState();
          return;
        }

        const parsed = JSON.parse(raw);
        const fresh = createFreshState();

        state = mergeDeep(fresh, parsed);

        state.isOpen = false;
        state.activeCustomer = null;
        state.minutes = GAME_START_MINUTE;
        state.build = {
          base: null,
          flavors: [],
          topping: null
        };
        state.currentScreen = "shop";
      } catch (error) {
        console.warn("Dữ liệu cũ không hợp lệ, tạo game mới:", error);
        state = createFreshState();
      }
    }

    function mergeDeep(target, source) {
      if (!source || typeof source !== "object") {
        return target;
      }

      Object.keys(source).forEach(key => {
        if (
          source[key] &&
          typeof source[key] === "object" &&
          !Array.isArray(source[key]) &&
          target[key] &&
          typeof target[key] === "object" &&
          !Array.isArray(target[key])
        ) {
          target[key] = mergeDeep(target[key], source[key]);
        } else if (key in target) {
          target[key] = source[key];
        }
      });

      return target;
    }

    /* =========================================================

    ========================================================= */

    function formatMoney(value) {
      return Math.round(value).toLocaleString("vi-VN") + "đ";
    }

    function formatClock(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;

      return (
        String(h).padStart(2, "0") +
        ":" +
        String(m).padStart(2, "0")
      );
    }

    function targetForDay(day) {
      return 20 + (day - 1) * 10;
    }

    function randomFrom(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function allInventoryCount() {
      return (
        Object.values(state.inventory.flavors).reduce((a, b) => a + b, 0) +
        Object.values(state.inventory.toppings).reduce((a, b) => a + b, 0) +
        Object.values(state.inventory.bases).reduce((a, b) => a + b, 0)
      );
    }

    function inventoryCapacity() {
      const level = state.upgrades.warehouse;

      return {
        flavors: 12 + level * 6,
        toppings: 16 + level * 8,
        bases: 16 + level * 8
      };
    }

    function categoryCount(category) {
      return Object.values(state.inventory[category]).reduce(
        (sum, value) => sum + value,
        0
      );
    }

    function upgradePrice(key) {
      const level = state.upgrades[key];

      const prices = {
        warehouse: [95000, 145000, 210000, 290000],
        scoopSpeed: [80000, 125000, 185000, 255000],
        price: [75000, 115000, 175000, 245000],
        employee: [145000, 210000, 290000]
      };

      return prices[key] && prices[key][level] !== undefined
        ? prices[key][level]
        : null;
    }

    function sellingPrice() {
      const prices = [
        10000,
        15000,
        25000,
        50000,
        70000,
        90000
      ];

      return prices[clamp(state.upgrades.price, 0, prices.length - 1)];
    }

    function isEmployeeActive() {
      return state.upgrades.employee > 0;
    }

    function employeeWage() {
      return 45000 + Math.max(0, state.upgrades.employee - 1) * 15000;
    }

    function canOpenShop() {
      const hasFlavor = Object.values(state.inventory.flavors)
        .some(value => value > 0);

      const hasBase = Object.values(state.inventory.bases)
        .some(value => value > 0);

      return hasFlavor && hasBase;
    }

    function hasSpecificOrderIngredient(order) {
      if (state.inventory.bases[order.base] <= 0) {
        return false;
      }

      if (!order.randomFlavors) {
        const required = {};

        order.flavors.forEach(flavor => {
          required[flavor] = (required[flavor] || 0) + 1;
        });

        for (const flavor of Object.keys(required)) {
          if (
            (state.inventory.flavors[flavor] || 0) <
            required[flavor]
          ) {
            return false;
          }
        }
      } else {
        const availableFlavorCount = Object.values(state.inventory.flavors)
          .reduce((sum, count) => sum + count, 0);

        if (availableFlavorCount < order.scoops) {
          return false;
        }
      }

      if (order.topping) {
        if (
          order.randomTopping
        ) {
          const totalToppings = Object.values(state.inventory.toppings)
            .reduce((sum, count) => sum + count, 0);

          if (totalToppings <= 0) {
            return false;
          }
        } else if (
          state.inventory.toppings[order.topping] <= 0
        ) {
          return false;
        }
      }

      return true;
    }

    function resetBuild() {
      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      saveState();
      render();
    }

    function getSelectedFlavorCounts() {
      const counts = {};

      state.build.flavors.forEach(flavor => {
        counts[flavor] = (counts[flavor] || 0) + 1;
      });

      return counts;
    }

    function arraysEqualMultiset(a, b) {
      if (a.length !== b.length) {
        return false;
      }

      const aa = [...a].sort();
      const bb = [...b].sort();

      return aa.every((value, index) => value === bb[index]);
    }

    function renderCustomer(customer) {
      if (!customer) {
        return `
          <section class="customer-card card empty-card">
            Đang chờ khách tiếp theo...
          </section>
        `;
      }

      const ratio = getPatienceRatio(customer);
      const circumference = 2 * Math.PI * 25;
      const offset = circumference * (1 - ratio);

      return `
        <section class="customer-card card">
          <div class="customer-head">

            <div class="avatar">
              ${
                customer.gender === "male"
                  ? maleAvatarSVG()
                  : femaleAvatarSVG()
              }
            </div>

            <div class="customer-meta">
              <div class="customer-name">
                ${escapeHTML(customer.name)}
              </div>

              <div class="customer-order-label">
                Khách đang chờ phục vụ
              </div>
            </div>

            <div
              class="patience-wrap ${ratio <= .5 ? "warning" : ""}"
              aria-label="Mức độ kiên nhẫn"
            >
              <svg class="patience-svg" viewBox="0 0 64 64">
                <circle
                  class="patience-bg"
                  cx="32"
                  cy="32"
                  r="25"
                />
                <circle
                  class="patience-progress"
                  cx="32"
                  cy="32"
                  r="25"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${offset}"
                />
              </svg>

              <div class="patience-face">
                ${
                  ratio > .5
                    ? "😊"
                    : ratio > .2
                      ? "😳"
                      : "🥺"
                }
              </div>
            </div>
          </div>

          <div class="speech">
            ${escapeHTML(customer.order.text)}
          </div>

          ${
            customer.hurrySent
              ? `
                <div class="hurry-note">
                  💬 Khách đang hơi vội, tốc độ kiên nhẫn giảm nhanh hơn.
                </div>
              `
              : ""
          }
        </section>
      `;
    }

                        <span class="choice-label">${flavor.name}</span>
                        <span class="choice-count">

                </div>

                <div class="choice-section">
                  <div class="choice-title">

                  <div class="choice-grid">

                      class="choice ${

    function renderStockCard(key, item, category, bulk) {
      const stock = state.inventory[category][key];
      const purchased = state.purchased[category][key];
      const capacity = inventoryCapacity()[category];

      const canBuy =
        stock + bulk <= capacity &&
        state.cash >= item.price;

      return `
        <article class="stock-card">
          <div class="stock-top">
            <div class="stock-art">
              ${item.emoji}
            </div>

            <div class="stock-meta">
              <div class="stock-name">
                ${item.name}
              </div>

              <div class="stock-quantity">
                Tồn kho: ${stock}
              </div>
            </div>
          </div>

          <div class="stock-buy">
            <div class="stock-price">
              +${bulk} cái<br>
              ${formatMoney(item.price)}
            </div>

            ${
              purchased
                ? `
                  <span class="purchased-tag">
                    Đã nhập
                  </span>
                `
                : ""
            }

            <button
              type="button"
              class="buy-button"
              data-action="buy-stock"
              data-category="${category}"
              data-key="${key}"
              ${
                canBuy
                  ? ""
                  : "disabled"
              }
            >
              Nhập sỉ
            </button>
          </div>
        </article>
      `;
    }

    function renderUpgrades() {
      const upgrades = [

          key: "employee",
          emoji: "👩‍🍳",
          name: "Thuê Nhân Viên Pha Chế",

        }
      ];

      return `
        <main class="content">
          <div class="section-title-row">
            <div>
              <h2 class="section-title">Nâng Cấp</h2>
              <p class="section-caption">
                Đầu tư để tiệm vận hành hiệu quả hơn.
              </p>
            </div>
          </div>

          <div class="upgrade-grid">
            ${upgrades.map(item => {
              const level = state.upgrades[item.key];
              const price = upgradePrice(item.key);
              const maxed = price === null;

              return `
                <article class="upgrade-card card">
                  <div class="upgrade-art">
                    ${item.emoji}
                  </div>

                  <div class="upgrade-info">
                    <div class="upgrade-name">
                      ${item.name}
                    </div>

                    <div class="upgrade-level">

                    </div>

                    <div class="upgrade-desc">

                    </div>

                  <button
                    type="button"
                    class="upgrade-action ${maxed ? "maxed" : ""}"

    function renderReviews() {
      const reviews = [...state.reviews].reverse();

      const average =
        reviews.length
          ? reviews.reduce((sum, review) => sum + review.rating, 0) /
            reviews.length
          : 0;

      return `
        <main class="content">
          <div class="section-title-row">
            <div>
              <h2 class="section-title">Đánh Giá</h2>
              <p class="section-caption">
                Phản hồi từ những vị khách đã ghé tiệm.
              </p>
            </div>
          </div>

          <section class="reviews-summary card">
            <div class="review-score-box">
              <div style="font-size:26px;font-weight:1000;color:#604943">
                ${average ? average.toFixed(1) : "—"}
              </div>

              <div class="review-summary-stars">
                ★
              </div>

              <div class="review-count">
                ${reviews.length} đánh giá
              </div>
            </div>

            <div class="review-summary-text">
              Điểm đánh giá được quyết định bởi mức độ kiên nhẫn

            </div>
          </section>

          <div class="review-list">
            ${
              reviews.length
                ? reviews.map(renderReviewCard).join("")
                : `
                  <div class="empty-card card">
                    Chưa có đánh giá nào.
                    Hãy mở cửa và phục vụ những vị khách đầu tiên nhé! 🍦
                  </div>
                `
            }
          </div>

      `;

    function renderReviewCard(review) {
      const anonymous =
        review.anonymous === true;

      return `
        <article class="review-card card">
          <div class="review-head">

            <div class="review-avatar">
              ${
                anonymous
                  ? anonymousAvatarSVG()
                  : review.gender === "male"
                    ? maleAvatarSVG()
                    : femaleAvatarSVG()
              }
            </div>

            <div class="review-user">
              <div class="review-name">
                ${
                  anonymous
                    ? "Khách ẩn danh"
                    : escapeHTML(review.name)
                }
              </div>

              <div class="review-date">
                Ngày ${Number(review.day) || 1}
              </div>
            </div>

            <div class="stars">
              ${renderStars(review.rating)}
            </div>
          </div>

          <div class="review-text">
            ${escapeHTML(review.text)}
          </div>

          ${
            review.reply
              ? `
                <div class="review-reply">
                  <strong>Tiệm trả lời:</strong>
                  ${escapeHTML(review.reply)}
                </div>
              `
              : `
                <div class="reply-area">
                  <div class="reply-suggestions">
                    ${renderReplySuggestions(review)}
                  </div>

                  <div class="reply-row">
                    <input
                      class="reply-input"
                      id="reply-${review.id}"
                      data-reply-input="${review.id}"
                      maxlength="180"
                      autocomplete="off"
                      placeholder="Viết phản hồi cho khách..."
                    >

                    <button
                      type="button"
                      class="reply-send"
                      data-action="send-reply"
                      data-review-id="${review.id}"
                    >
                      Gửi
                    </button>
                  </div>
                </div>
              `
          }
        </article>
      `;
    }

    function renderStars(rating) {
      let html = "";

      for (let i = 1; i <= 5; i++) {
        html += `
          <span class="${i <= rating ? "star-gold" : "star-empty"}">
            ★
          </span>
        `;
      }

      return html;
    }

    function renderReplySuggestions(review) {
      const suggestions = review.rating >= 4
        ? [
            "Dạ cảm ơn bạn nhiều nha, hẹn gặp lại quán lần sau ạ! ❤️",
            "Cảm ơn bạn đã ghé tiệm và để lại lời khen dễ thương ạ! 🍦"
          ]
        : [
            "Dạ tiệm xin lỗi vì sự bất tiện này, lần sau quán sẽ cố gắng phục vụ nhanh hơn ạ!",
            "Dạ cảm ơn bạn đã góp ý, tiệm sẽ cố gắng cải thiện hơn ạ!"
          ];

      return suggestions.map(text => `
        <button
          type="button"
          class="suggestion-button"
          data-action="use-suggestion"
          data-review-id="${review.id}"
          data-text="${escapeHTML(text)}"
        >
          ${text}
        </button>
      `).join("");
    }
