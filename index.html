<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#ffe6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Tiệm Bán Kem Ngọt Ngào</title>

<style>
:root{
  --pink:#f7a9bc;
  --pink-dark:#dc718d;
  --pink-soft:#fff0f4;
  --cream:#fff9f0;
  --cream-2:#fffdf8;
  --brown:#65483e;
  --brown-soft:#8a6b60;
  --oak:#b97d51;
  --oak-dark:#945c38;
  --mint:#a9dcca;
  --blue:#a8d7ee;
  --yellow:#f5d978;
  --red:#df6d78;
  --green:#70b995;
  --shadow:0 12px 30px rgba(99,68,61,.12);
  --shadow-small:0 5px 14px rgba(99,68,61,.10);
  --radius:22px;
  --nav-height:74px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    ui-rounded,
    "SF Pro Rounded",
    "Nunito",
    "Trebuchet MS",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
  color:var(--brown);
  background:#ffeef2;
}

body{
  min-height:100dvh;
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

button:active{
  transform:scale(.97);
}

input,
textarea{
  outline:none;
}

#app{
  min-height:100dvh;
}

/* =========================================================
   GENERAL
========================================================= */

.screen-shell{
  width:100%;
  min-height:100dvh;
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:520px;
  min-height:100dvh;
  position:relative;
  background:
    radial-gradient(circle at 15% 5%,rgba(255,255,255,.8),transparent 24%),
    linear-gradient(180deg,#fff3f6 0%,#fff9f2 55%,#fff5ee 100%);
  overflow:hidden;
}

.hidden{
  display:none!important;
}

.no-scroll{
  overflow:hidden!important;
}

.card{
  background:rgba(255,255,255,.86);
  border:1px solid rgba(183,125,81,.10);
  border-radius:var(--radius);
  box-shadow:var(--shadow-small);
}

.primary-btn{
  width:100%;
  min-height:50px;
  border-radius:17px;
  background:linear-gradient(180deg,#f9b4c6,#ee91aa);
  color:white;
  font-weight:900;
  letter-spacing:.2px;
  box-shadow:0 7px 15px rgba(220,113,141,.22);
}

.secondary-btn{
  min-height:44px;
  border-radius:15px;
  padding:0 15px;
  background:#fff;
  border:1px solid #f0d8dc;
  font-weight:800;
}

.soft-btn{
  min-height:42px;
  border-radius:14px;
  padding:0 14px;
  background:#fff1f4;
  color:#a45368;
  font-weight:800;
}

.danger-btn{
  min-height:44px;
  border-radius:15px;
  padding:0 15px;
  background:#fff0f0;
  color:#c65c68;
  font-weight:900;
}

.section-title{
  margin:0;
  font-size:18px;
  font-weight:950;
}

.section-subtitle{
  margin:4px 0 0;
  font-size:12px;
  color:#9a7c73;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  min-height:100dvh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    max(30px,env(safe-area-inset-top))
    22px
    max(30px,env(safe-area-inset-bottom));
}

.welcome-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.cloud{
  position:absolute;
  width:100px;
  height:32px;
  border-radius:40px;
  background:rgba(255,255,255,.72);
  opacity:.72;
  animation:cloudMove 18s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud:before{
  width:42px;
  height:42px;
  left:17px;
  top:-19px;
}

.cloud:after{
  width:52px;
  height:52px;
  right:15px;
  top:-25px;
}

.cloud.one{
  top:13%;
  left:-110px;
}

.cloud.two{
  top:27%;
  left:-180px;
  transform:scale(.72);
  animation-delay:-7s;
}

.cloud.three{
  top:43%;
  left:-150px;
  transform:scale(.55);
  animation-delay:-13s;
}

@keyframes cloudMove{
  from{transform:translateX(0) scale(var(--cloud-scale,1))}
  to{transform:translateX(720px) scale(var(--cloud-scale,1))}
}

.treat-particle{
  position:absolute;
  font-size:20px;
  animation:floatTreat 5s ease-in-out infinite;
}

.treat-particle.p1{left:10%;top:16%;animation-delay:-1s}
.treat-particle.p2{right:11%;top:22%;animation-delay:-2.5s}
.treat-particle.p3{left:15%;bottom:25%;animation-delay:-3.4s}
.treat-particle.p4{right:12%;bottom:18%;animation-delay:-4s}
.treat-particle.p5{left:5%;top:52%;animation-delay:-2s}
.treat-particle.p6{right:5%;top:58%;animation-delay:-1.3s}

@keyframes floatTreat{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-13px) rotate(7deg)}
}

.welcome-content{
  position:relative;
  z-index:2;
  width:min(100%,390px);
  text-align:center;
}

.welcome-logo{
  margin-bottom:4px;
}

.welcome-logo small{
  display:block;
  color:#b17b7e;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
}

.welcome-logo h1{
  margin:4px 0 0;
  font-size:30px;
  line-height:1.02;
  font-weight:1000;
  color:#7c5149;
}

.hero-icecream{
  width:205px;
  height:260px;
  margin:12px auto 5px;
  animation:heroWobble 3.6s ease-in-out infinite;
}

@keyframes heroWobble{
  0%,100%{transform:rotate(-2deg) translateY(0)}
  50%{transform:rotate(2deg) translateY(-6px)}
}

.shop-name-input{
  width:100%;
  height:54px;
  border-radius:18px;
  border:2px solid #f4d8df;
  background:rgba(255,255,255,.92);
  padding:0 18px;
  text-align:center;
  color:var(--brown);
  font-weight:800;
  box-shadow:var(--shadow-small);
}

.shop-name-input::placeholder{
  color:#c5a7a3;
}

.welcome-note{
  margin:10px 0 14px;
  font-size:12px;
  color:#a08077;
}

.welcome-btn{
  min-height:56px;
  font-size:16px;
}

/* =========================================================
   MAIN HEADER
========================================================= */

.main-layout{
  min-height:100dvh;
  padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom) + 12px);
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  padding:
    max(12px,env(safe-area-inset-top))
    14px
    10px;
  background:rgba(255,247,248,.93);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(196,139,126,.10);
}

.topbar-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.shop-title-area{
  min-width:0;
}

.shop-title{
  font-size:17px;
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.day-label{
  margin-top:2px;
  font-size:11px;
  color:#a27d75;
  font-weight:800;
}

.money-pill{
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  min-height:40px;
  padding:0 11px;
  background:#fff;
  border:1px solid #f0ded7;
  border-radius:15px;
  box-shadow:var(--shadow-small);
  font-weight:1000;
  color:#a86638;
}

.coin-icon{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#f3cf68;
  border:3px solid #e8b84b;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:12px;
}

/* =========================================================
   CONTENT
========================================================= */

.content{
  padding:12px 13px 0;
}

.tab-page{
  display:none;
}

.tab-page.active{
  display:block;
}

/* =========================================================
   SHOP / CLOSED
========================================================= */

.closed-card{
  min-height:calc(100dvh - 190px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:22px;
  background:
    radial-gradient(circle at 50% 20%,#fff 0%,#fff7f3 44%,#ffeef2 100%);
  border-radius:28px;
}

.closed-inner{
  width:100%;
  max-width:370px;
}

.closed-sign{
  margin:0 auto 15px;
  width:190px;
  border-radius:24px;
  padding:18px;
  background:#fff;
  border:4px solid #d49b70;
  box-shadow:0 10px 0 #bd7c4d, var(--shadow);
  transform:rotate(-1deg);
}

.closed-sign .tiny{
  color:#bd8570;
  font-size:10px;
  font-weight:1000;
  letter-spacing:2px;
}

.closed-sign strong{
  display:block;
  margin-top:5px;
  font-size:26px;
  color:#d56881;
}

.closed-title{
  font-size:22px;
  font-weight:1000;
  margin:10px 0 6px;
}

.closed-text{
  font-size:13px;
  color:#97766e;
  line-height:1.55;
  margin-bottom:18px;
}

.open-button{
  min-height:56px;
  font-size:16px;
}

/* =========================================================
   SHOP INTERIOR
========================================================= */

.shop-scene{
  overflow:hidden;
  border-radius:26px;
  background:
    linear-gradient(180deg,#dff1f2 0 24%,#fff4df 24% 100%);
  border:1px solid #efd9ca;
  box-shadow:var(--shadow);
}

.shop-wall{
  position:relative;
  min-height:250px;
  padding:13px 11px 0;
}

.awning{
  height:50px;
  display:flex;
  overflow:hidden;
  border-radius:18px 18px 7px 7px;
  border-bottom:4px solid #c98572;
  background:#fff;
}

.awning span{
  flex:1;
  transform:skewX(-5deg);
}

.awning span:nth-child(odd){
  background:#fff;
}

.awning span:nth-child(even){
  background:#f6a9bb;
}

.shop-sign{
  position:absolute;
  z-index:4;
  top:38px;
  left:50%;
  transform:translateX(-50%);
  min-width:185px;
  max-width:76%;
  padding:10px 18px;
  border-radius:16px;
  background:#fffaf1;
  border:3px solid #d69b6d;
  box-shadow:0 6px 0 #bd7d4f;
  text-align:center;
}

.shop-sign strong{
  display:block;
  font-size:16px;
  font-weight:1000;
  color:#865648;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.shop-sign small{
  display:block;
  font-size:8px;
  font-weight:1000;
  letter-spacing:2px;
  color:#d1858e;
}

.hanging-lights{
  position:absolute;
  top:88px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
}

.lantern{
  width:17px;
  height:25px;
  border-radius:8px 8px 11px 11px;
  background:#f7d58b;
  border:2px solid #dfb76a;
}

.counter{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:108px;
  background:
    linear-gradient(180deg,#cb9162,#a96843);
  border-top:6px solid #e2b27f;
}

.counter-top{
  position:absolute;
  top:-13px;
  left:4px;
  right:4px;
  height:20px;
  border-radius:12px;
  background:#d6a172;
  box-shadow:0 3px 0 #a96743;
}

.jar-row{
  position:absolute;
  z-index:5;
  left:15px;
  right:15px;
  top:-5px;
  display:flex;
  justify-content:space-between;
  gap:7px;
}

.ice-jar{
  width:47px;
  height:61px;
  position:relative;
  border-radius:11px 11px 14px 14px;
  background:rgba(255,255,255,.55);
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 4px 7px rgba(75,49,39,.12);
  overflow:hidden;
}

.ice-jar:before{
  content:"";
  position:absolute;
  left:3px;
  right:3px;
  top:3px;
  height:11px;
  border-radius:8px;
  background:rgba(255,255,255,.78);
  border:1px solid #c8aaa0;
}

.ice-jar .ice{
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  height:37px;
  border-radius:8px 8px 10px 10px;
}

.ice-jar .label{
  position:absolute;
  left:2px;
  right:2px;
  bottom:1px;
  font-size:6px;
  text-align:center;
  font-weight:1000;
  color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.18);
}

.jar-chocolate{background:#795042}
.jar-strawberry{background:#f49eaa}
.jar-vanilla{background:#f7df9b}
.jar-matcha{background:#9dc895}
.jar-butter{background:#e5b86b}
.jar-durian{background:#d9dd83}

.cactus{
  position:absolute;
  right:15px;
  bottom:52px;
  width:24px;
  height:38px;
  border-radius:13px 13px 8px 8px;
  background:#8bc89b;
  border:2px solid #68a77a;
}

.cactus:before,
.cactus:after{
  content:"";
  position:absolute;
  background:#8bc89b;
  border:2px solid #68a77a;
}

.cactus:before{
  width:12px;
  height:20px;
  left:-10px;
  top:11px;
  border-right:0;
  border-radius:10px 0 0 10px;
}

.cactus:after{
  width:11px;
  height:17px;
  right:-9px;
  top:5px;
  border-left:0;
  border-radius:0 10px 10px 0;
}

/* =========================================================
   CAT
========================================================= */

.cat-bed{
  position:absolute;
  z-index:7;
  left:24px;
  bottom:12px;
  width:112px;
  height:70px;
}

.cat-cushion{
  position:absolute;
  left:2px;
  right:2px;
  bottom:0;
  height:43px;
  border-radius:50%;
  background:#f5b1c5;
  border:3px solid #df91ab;
  box-shadow:inset 0 -5px 0 rgba(188,98,130,.12);
}

.cat-svg{
  position:absolute;
  left:8px;
  bottom:18px;
  width:100px;
  height:72px;
  animation:catBreath 3.5s ease-in-out infinite;
}

@keyframes catBreath{
  0%,100%{transform:scaleY(1)}
  50%{transform:scaleY(1.025)}
}

.zzz{
  position:absolute;
  right:-1px;
  top:-9px;
  font-size:14px;
  font-weight:1000;
  color:#886c8e;
  animation:zzzFloat 2.8s ease-in-out infinite;
}

.zzz:before{
  content:"Zzz";
}

@keyframes zzzFloat{
  0%{opacity:0;transform:translate(0,8px) rotate(4deg)}
  30%{opacity:1}
  100%{opacity:0;transform:translate(9px,-22px) rotate(9deg)}
}

/* =========================================================
   CUSTOMER
========================================================= */

.customer-card{
  margin-top:10px;
  padding:11px;
  background:#fff;
  border-radius:21px;
  border:1px solid #f0dfdf;
  box-shadow:var(--shadow-small);
}

.customer-top{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:58px;
  height:58px;
  flex:none;
  border-radius:19px;
  overflow:hidden;
  background:#ffe6df;
  border:2px solid #f1c7c2;
}

.customer-info{
  flex:1;
  min-width:0;
}

.customer-name{
  font-size:15px;
  font-weight:1000;
}

.customer-status{
  font-size:11px;
  color:#a2847b;
  margin-top:2px;
}

.patience{
  width:54px;
  height:54px;
  position:relative;
  flex:none;
}

.patience svg{
  width:54px;
  height:54px;
  transform:rotate(-90deg);
}

.patience-track{
  fill:none;
  stroke:#f2e3e3;
  stroke-width:5;
}

.patience-value{
  fill:none;
  stroke:#83c6a3;
  stroke-width:5;
  stroke-linecap:round;
  transition:stroke .25s ease;
}

.patience-value.warn{
  stroke:#e5b45f;
}

.patience-value.danger{
  stroke:#df707c;
}

.speech{
  margin-top:9px;
  position:relative;
  padding:11px 13px;
  border-radius:15px;
  background:#fff7f0;
  border:1px solid #f2dfd3;
  font-size:12px;
  line-height:1.45;
  font-weight:750;
}

.speech:before{
  content:"";
  position:absolute;
  top:-7px;
  left:22px;
  width:13px;
  height:13px;
  transform:rotate(45deg);
  background:#fff7f0;
  border-left:1px solid #f2dfd3;
  border-top:1px solid #f2dfd3;
}

.hurry-message{
  margin-top:7px;
  padding:7px 9px;
  border-radius:11px;
  background:#fff1d9;
  color:#9c7044;
  font-size:10px;
  font-weight:900;
}

/* =========================================================
   ICE CREAM BUILDER
========================================================= */

.builder{
  margin-top:10px;
  padding:11px;
  border-radius:22px;
  background:#fff;
  border:1px solid #efdfdc;
  box-shadow:var(--shadow-small);
}

.step-indicator{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-bottom:9px;
}

.step-chip{
  min-height:31px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:#f7f0ee;
  color:#a98b82;
  font-size:9px;
  font-weight:1000;
  text-align:center;
}

.step-chip.active{
  background:#ffe3ea;
  color:#c7607a;
}

.step-chip.done{
  background:#e7f5ed;
  color:#5b9b7c;
}

.dessert-preview{
  height:120px;
  position:relative;
  border-radius:17px;
  background:
    linear-gradient(180deg,#fff8f2,#fff0e5);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  margin-bottom:9px;
}

.dessert-base{
  position:absolute;
  bottom:11px;
  width:65px;
  height:77px;
  transform:perspective(80px) rotateX(-3deg);
  clip-path:polygon(8% 0,92% 0,64% 100%,36% 100%);
  background:
    repeating-linear-gradient(
      45deg,
      #d49a5e 0 5px,
      #bd804b 5px 8px
    );
  border:2px solid #a96d3e;
}

.dessert-cup{
  position:absolute;
  bottom:10px;
  width:76px;
  height:62px;
  border-radius:5px 5px 17px 17px;
  background:#fff;
  border:3px solid #e4a4ad;
  box-shadow:inset 0 -8px 0 #f8dce0;
}

.dessert-cup:after{
  content:"NGỌT";
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  text-align:center;
  font-size:7px;
  font-weight:1000;
  color:#d58a98;
}

.preview-scoop{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  border:2px solid rgba(100,60,45,.12);
  z-index:4;
  box-shadow:inset -4px -5px 0 rgba(0,0,0,.07);
  animation:scoopAppear .25s ease-out;
}

@keyframes scoopAppear{
  from{transform:translateY(-12px) scale(.7);opacity:0}
  to{transform:translateY(0) scale(1);opacity:1}
}

.preview-scoop.s1{
  bottom:50px;
  margin-left:-20px;
}

.preview-scoop.s2{
  bottom:68px;
  margin-left:20px;
}

.preview-scoop.s3{
  bottom:84px;
  margin-left:0;
}

.preview-topping{
  position:absolute;
  z-index:8;
  bottom:85px;
  font-size:21px;
  letter-spacing:3px;
  animation:toppingDrop .3s ease-out;
}

@keyframes toppingDrop{
  from{transform:translateY(-10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.choice-area{
  min-height:77px;
}

.choice-title{
  font-size:11px;
  font-weight:1000;
  margin-bottom:6px;
}

.choice-grid{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:none;
}

.choice-grid::-webkit-scrollbar{
  display:none;
}

.choice{
  flex:none;
  min-width:72px;
  min-height:53px;
  padding:5px 6px;
  border-radius:13px;
  background:#fff8f6;
  border:1px solid #efdeda;
  text-align:center;
  font-size:9px;
  font-weight:900;
}

.choice.selected{
  border:2px solid #e38aa0;
  background:#fff0f4;
  color:#c35c77;
}

.choice:disabled{
  opacity:.38;
}

    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

    console.warn("Không thể lưu dữ liệu:",error);
  }

function loadGame(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      state = freshState();
      return;
    }

    const saved = JSON.parse(raw);
    const fresh = freshState();

    state = deepMerge(fresh,saved);

    state.isOpen = false;
    state.activeCustomer = null;
    state.build = {
      base:null,

    };
    state.minutes = OPENING_MINUTE;

function deepMerge(target,source){
  if(!source || typeof source !== "object"){
    return target;
  }

  Object.keys(source).forEach(key=>{
    if(
      source[key] &&
      typeof source[key] === "object" &&
      !Array.isArray(source[key]) &&
      target[key] &&
      typeof target[key] === "object" &&
      !Array.isArray(target[key])
    ){
      deepMerge(target[key],source[key]);
    }else{
      target[key] = source[key];
    }
  });

  return target;
}

/* =========================================================

function money(value){

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function randomItem(array){
  return array[Math.floor(Math.random() * array.length)];
}

function randomInt(min,max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array){
  const result = array.slice();

  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }

  return result;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatTime(minutes){
  const hour = Math.floor(minutes / 60);
  const minute = minutes % 60;

  return String(hour).padStart(2,"0") + ":" + String(minute).padStart(2,"0");
}

  return 12 + state.upgrades.warehouse * 6;
}

function baseCapacity(){
  return 16 + state.upgrades.warehouse * 8;
}

function toppingCapacity(){
  return 16 + state.upgrades.warehouse * 8;
}

function pricePerOrder(){
  const levels = [
    10000,
    15000,
    25000,
    50000,
    70000,
    90000
  ];

  return levels[Math.min(state.upgrades.price,levels.length - 1)];
}

function upgradeCost(type){
  const costs = {
    warehouse:[70000,110000,170000,250000],
    scoopSpeed:[90000,150000,240000,360000],
    price:[80000,130000,210000,320000],
    employee:[145000,230000,340000]
  };

  const list = costs[type] || [];

  return list[state.upgrades[type]] || null;
}

function isEmployeeActive(){
  return state.upgrades.employee > 0;
}

function staffWage(){
  return 42000 + Math.max(0,state.upgrades.employee - 1) * 12000;
}

function serviceDelay(){
  const base = 2300;
  const reduction = state.upgrades.scoopSpeed * 330;
  return Math.max(900,base - reduction);
}

function totalInventory(){
  let total = 0;

  Object.values(state.inventory.flavors).forEach(v=>total += v);
  Object.values(state.inventory.toppings).forEach(v=>total += v);
  Object.values(state.inventory.bases).forEach(v=>total += v);

  return total;
}

function hasAnyBase(){
  return Object.values(state.inventory.bases).some(v=>v > 0);
}

function hasAnyFlavor(){
  return Object.values(state.inventory.flavors).some(v=>v > 0);
}

function canOpenShop(){
  return hasAnyBase() && hasAnyFlavor();
}

function currentPatiencePercent(){
  if(!state.activeCustomer){
    return 100;
  }

  const remaining = state.activeCustomer.expiresAt - Date.now();

  return clamp(
    remaining / MAX_PATIENCE_MS * 100,
    0,
    100
  );
}

function getCapacity(type){
  if(type === "flavor"){
    return warehouseCapacity();

  if(type === "base"){

function renderBuilder(){

  const currentStep =
    !state.build.base
      ? 1
      : state.build.flavors.length < customer.order.scoops
        ? 2
        : 3;

  const baseChoices = Object.keys(BASES).map(key=>{
    const disabled = state.inventory.bases[key] <= 0;

    return `
      <button
        type="button"
        class="choice ${state.build.base === key ? "selected" : ""}"
        data-action="select-base"
        data-key="${key}"
        ${disabled ? "disabled" : ""}

          key === "cone"

          : `<div class="base-mini cup"></div>`
        }

        <small>${state.inventory.bases[key]} cái</small>
      </button>`;
  }).join("");

  const flavorChoices = Object.keys(FLAVORS).map(key=>{
    const selectedCount = state.build.flavors.filter(x=>x === key).length;

    const disabled =
      state.inventory.flavors[key] <= selectedCount ||
      state.build.flavors.length >= customer.order.scoops;

    return `

  const toppingChoices = `

          ${escapeHTML(TOPPINGS[key].name)}

  return `

        <div class="step-chip ${currentStep === 1 ? "active" : state.build.base ? "done" : ""}">
          1 · ỐC QUẾ / LY
        </div>

        <div class="step-chip ${currentStep === 2 ? "active" : state.build.flavors.length === customer.order.scoops ? "done" : ""}">
          2 · CHỌN VỊ
        </div>

        <div class="step-chip ${currentStep === 3 ? "active" : state.build.topping !== null ? "done" : ""}">
          3 · TOPPING
        </div>
      </div>

      ${renderDessertPreview()}

      ${
        currentStep === 1
        ? `
          <div class="choice-area">
            <div class="choice-title">
              Bước 1 · Chọn ốc quế hoặc ly giấy
            </div>

            <div class="choice-grid">
              ${baseChoices}
            </div>
          </div>
        `
        : ""
      }

      ${
        currentStep === 2
        ? `
          <div class="choice-area">
            <div class="choice-title">
              Bước 2 · Chọn ${customer.order.scoops} viên kem
            </div>

            <div class="choice-grid">
              ${flavorChoices}
            </div>
          </div>

      ${

        ? `

            <div class="choice-grid">

/* =========================================================
   REVIEW SYSTEM
========================================================= */

function reviewStars(rating){
  let result = "";

  for(let i=1;i<=5;i++){
    result += `
      <span class="star ${i <= rating ? "gold" : "white"}">★</span>
    `;
  }

  return result;
}

function reviewReplySuggestions(review){
  if(review.rating >= 4){
    return [
      "Dạ cảm ơn bạn nhiều nha, hẹn gặp lại quán lần sau ạ! ❤️",
      "Cảm ơn bạn đã ủng hộ tiệm, chúc bạn một ngày thật ngọt ngào! 🍦"
    ];
  }

  if(review.rating >= 3){
    return [
      "Dạ cảm ơn bạn đã góp ý, tiệm sẽ cố gắng phục vụ nhanh hơn ạ!",
      "Dạ cảm ơn bạn đã ghé tiệm, lần sau quán sẽ chăm chút hơn nha! ❤️"
    ];
  }

  return [
    "Dạ tiệm xin lỗi vì sự bất tiện này, lần sau quán sẽ cố gắng phục vụ nhanh hơn ạ!",
    "Tiệm rất tiếc vì trải nghiệm chưa tốt, cảm ơn bạn đã góp ý để quán cải thiện ạ."
  ];
}

function renderReview(review){
  const anonymous = review.anonymous === true;

  return `
    <article class="review-card card">

      <div class="review-head">

        <div class="review-avatar">
          ${
            anonymous
            ? anonymousAvatar()
            : review.gender === "male"
              ? maleAvatar()
              : femaleAvatar()
          }
        </div>

        <div class="review-meta">
          <div class="review-name">
            ${
              anonymous
              ? "Khách ẩn danh"
              : escapeHTML(review.name)
            }
          </div>

          <div class="review-day">
            Ngày ${Number(review.day) || 1}
          </div>
        </div>

        <div class="stars">
          ${reviewStars(review.rating)}
        </div>

      </div>

      <div class="review-text">
        ${escapeHTML(review.text)}
      </div>

      ${
        review.reply
        ? `
          <div class="review-reply">
            <div class="reply-label">Tiệm trả lời</div>
            ${escapeHTML(review.reply)}
          </div>
        `
        : `
          <div class="reply-box">
            <input
              class="reply-input"
              data-review-input="${escapeHTML(review.id)}"
              maxlength="250"
              placeholder="Viết phản hồi cho khách..."
              autocomplete="off"
            >

            <button
              type="button"
              class="reply-send"
              data-action="send-review-reply"
              data-review-id="${escapeHTML(review.id)}"
            >
              Gửi
            </button>
          </div>

          <div class="quick-replies">
            ${reviewReplySuggestions(review).map(text=>{
              return `
                <button
                  type="button"
                  class="quick-reply"

                  data-text="${escapeHTML(text)}"

            }).join("")}

}

function showToast(message,type=""){
  const container = document.getElementById("toastContainer");

  if(!container){
    return;
  }

  const toast = document.createElement("div");

  toast.className = "toast " + type;
  toast.textContent = message;

  container.appendChild(toast);

  const timer = setTimeout(()=>{
    toast.remove();
  },3200);

  toastTimers.push(timer);
}

/* =========================================================
   START GAME
========================================================= */

function startGame(){
  const input = document.getElementById("shopNameInput");

  if(!input){
    return;
  }

  const name = input.value.trim();

  if(!name){
    input.focus();
    return;
  }

  state.shopName = name;
  state.currentScreen = "shop";
  state.isOpen = false;
  state.minutes = OPENING_MINUTE;

  saveGame();
  render();

  showToast(
    "Tiệm đã sẵn sàng! Hãy vào Kho Hàng nhập nguyên liệu trước khi mở cửa.",
    "success"
  );
}

/* =========================================================
   OPEN SHOP
========================================================= */

function openShop(){
  if(state.isOpen){
    return;
  }

  if(!canOpenShop()){
    showMessage(
      "Chưa thể mở cửa",
      "Bạn cần nhập sỉ nguyên liệu ở Kho Hàng trước khi mở bán!",
      "📦"
    );

    return;
  }

  if(state.pausedForDayFailure){
    state.pausedForDayFailure = false;
  }

  const payrollDue =
    isEmployeeActive() &&
    state.day - state.staffLastPaidDay >= 2;

  if(payrollDue){
    const wage = staffWage();

    if(state.cash < wage){
      showMessage(
        "Không đủ tiền trả lương",
        "Bạn chưa đủ tiền để thanh toán lương nhân viên cho chu kỳ này. Hãy kiếm thêm vốn trước khi mở cửa.",
        "👩‍🍳"
      );

      return;
    }

    state.cash -= wage;
    state.dayStaffCosts += wage;
    state.staffLastPaidDay = state.day;
    state.staffDaysSincePay = 0;

    showToast(
      "Đã thanh toán lương nhân viên " + money(wage) + ".",
      "warning"
    );
  }

  state.isOpen = true;
  state.minutes = OPENING_MINUTE;
  state.dayEndHandled = false;
  state.activeCustomer = null;
  resetBuild();

  saveGame();
  render();

  scheduleNextCustomer(500);
}

/* =========================================================
   CLOSE SHOP
========================================================= */

function closeShop(){
  if(!state.isOpen){
    return;
  }

  state.isOpen = false;

  clearCustomerTimer();

  if(state.served >= dayTarget()){
    state.activeCustomer = null;
    saveGame();

    modalState = {
      type:"summary",
      title:"Ngày kinh doanh hoàn thành! 🎉"
    };

    render();

    return;
  }

  state.pausedForDayFailure = true;
  state.activeCustomer = null;
  saveGame();

  modalState = {
    type:"failure"
  };

  render();
}

/* =========================================================
   INVENTORY PURCHASE
========================================================= */

function buyStock(type,key){
  let quantity = 0;
  let cost = 0;
  let capacity = 0;
  let current = 0;

  if(type === "flavor"){
    quantity = 6;
    cost = FLAVORS[key].price;
    capacity = warehouseCapacity();
    current = state.inventory.flavors[key];
  }

  if(type === "base"){
    quantity = 8;
    cost = BASES[key].price;
    capacity = baseCapacity();
    current = state.inventory.bases[key];
  }

  if(type === "topping"){
    quantity = 8;
    cost = TOPPINGS[key].price;
    capacity = toppingCapacity();
    current = state.inventory.toppings[key];
  }

  if(current + quantity > capacity){
    showMessage(
      "Kho không đủ chỗ",
      "Không thể nhập thêm vì số lượng sẽ vượt quá sức chứa hiện tại.",
      "📦"
    );

    return;
  }

  if(state.cash < cost){
    showMessage(
      "Không đủ tiền",
      "Số dư hiện tại không đủ để nhập lô nguyên liệu này.",
      "💰"
    );

    return;
  }

  state.cash -= cost;

  if(type === "flavor"){
    state.inventory.flavors[key] += quantity;
    state.purchased.flavors[key] = true;
  }

  if(type === "base"){
    state.inventory.bases[key] += quantity;
    state.purchased.bases[key] = true;
  }

  if(type === "topping"){
    state.inventory.toppings[key] += quantity;
    state.purchased.toppings[key] = true;
  }

  state.dayStockCosts += cost;

  saveGame();
  render();

  showToast(
    "Đã nhập +" + quantity + " " +
    (
      type === "flavor"
      ? FLAVORS[key].name
      : type === "base"
        ? BASES[key].name
        : TOPPINGS[key].name
    ) +
    " với giá " + money(cost) + ".",
    "success"
  );
}

/* =========================================================
   BUILD ORDER
========================================================= */

function resetBuild(){
  state.build = {
    base:null,
    flavors:[],
    topping:null
  };
}

function selectBase(key){
  if(!state.activeCustomer){
    return;
  }

  if(!BASES[key]){
    return;
  }

  if(state.inventory.bases[key] <= 0){
    openOutOfStockChat("base",key);
    return;
  }

  state.build.base = key;

  saveGame();
  render();
}

function selectFlavor(key){
  if(!state.activeCustomer){
    return;
  }

  if(!FLAVORS[key]){
    return;
  }

  const needed =
    state.activeCustomer.order.scoops;

  if(state.build.flavors.length >= needed){
    return;
  }

  const selectedCount =
    state.build.flavors.filter(x=>x === key).length;

  if(state.inventory.flavors[key] <= selectedCount){
    openOutOfStockChat("flavor",key);
    return;
  }

  state.build.flavors.push(key);

  saveGame();
  render();
}

function selectTopping(key){
  if(!state.activeCustomer){
    return;
  }

  if(key === "none"){
    state.build.topping = null;
    saveGame();
    render();
    return;
  }

  if(!TOPPINGS[key]){
    return;
  }

  if(state.inventory.toppings[key] <= 0){
    openOutOfStockChat("topping",key);
    return;
  }

  state.build.topping = key;

  saveGame();
  render();
}

/* =========================================================
   ORDER MATCHING
========================================================= */

function arraysEqualMultiset(a,b){
  if(a.length !== b.length){
    return false;
  }

  const aa = a.slice().sort();
  const bb = b.slice().sort();

  return aa.every((value,index)=>value === bb[index]);
}

function buildMatchesOrder(){
  const customer = state.activeCustomer;

  if(!customer){
    return false;
  }

  if(state.build.base !== customer.order.base){
    return false;
  }

  if(state.build.flavors.length !== customer.order.scoops){
    return false;
  }

  if(customer.order.randomFlavors){
    const uniqueAvailable = state.build.flavors.every(
      key=>FLAVORS[key]
    );

    if(!uniqueAvailable){
      return false;
    }
  }else{
    if(!arraysEqualMultiset(
      state.build.flavors,
      customer.order.flavors
    )){
      return false;
    }
  }

  if(customer.order.randomTopping){
    if(customer.order.topping !== null){
      return state.build.topping === customer.order.topping;
    }

    return true;
  }

  if(customer.order.topping !== state.build.topping){
    return false;
  }

  return true;
}

/* =========================================================
   INVENTORY CONSUMPTION
========================================================= */

function consumeBuildInventory(){
  const base = state.build.base;

  if(base){
    state.inventory.bases[base] -= 1;
  }

  state.build.flavors.forEach(key=>{
    state.inventory.flavors[key] -= 1;
  });

  if(state.build.topping){
    state.inventory.toppings[state.build.topping] -= 1;
  }
}

/* =========================================================
   OUT OF STOCK CHAT
========================================================= */

function openOutOfStockChat(type,key){
  let label = "";

  if(type === "flavor"){
    label = FLAVORS[key]?.name || "vị kem";
  }

  if(type === "base"){
    label = BASES[key]?.name || "dụng cụ";
  }

  if(type === "topping"){
    label = TOPPINGS[key]?.name || "topping";
  }

  modalState = {
    type:"chat",
    label
  };

}

/* =========================================================
   CUSTOMER GENERATION
========================================================= */

function generateCustomer(){
  const gender = Math.random() < .5 ? "male" : "female";

  const name = gender === "male"
    ? randomItem(MALE_NAMES)
    : randomItem(FEMALE_NAMES);

  let base = Math.random() < .55 ? "cone" : "cup";

  const availableBases = Object.keys(state.inventory.bases)
    .filter(key=>state.inventory.bases[key] > 0);

  if(availableBases.length > 0){
    base = randomItem(availableBases);
  }

  let scoops = 1;

  if(state.day >= 3 && Math.random() < .45){
    scoops = 2;
  }

  if(state.day >= 5 && Math.random() < .18){
    scoops = 3;
  }

  const availableFlavors = Object.keys(state.inventory.flavors)
    .filter(key=>state.inventory.flavors[key] > 0);

  if(availableFlavors.length === 0){
    return null;
  }

  while(availableFlavors.length < scoops){
    scoops = availableFlavors.length;

    if(scoops <= 0){
      return null;
    }
  }

  const creative =
    state.day >= 5 &&
    Math.random() < .28;

  let flavors = [];

  if(creative){
    for(let i=0;i<scoops;i++){
      flavors.push(randomItem(availableFlavors));
    }
  }else{
    for(let i=0;i<scoops;i++){
      flavors.push(randomItem(availableFlavors));
    }
  }

  let topping = null;

  const availableToppings = Object.keys(state.inventory.toppings)
    .filter(key=>state.inventory.toppings[key] > 0);

  if(availableToppings.length > 0 && Math.random() < .55){
    topping = randomItem(availableToppings);
  }

  const randomFlavors =
    creative &&
    Math.random() < .72;

  const randomTopping =
    creative &&
    Math.random() < .45;

  const order = {
    base,
    scoops,
    flavors,
    randomFlavors,
    topping,
    randomTopping,
    text:""
  };

  if(randomFlavors){
    order.text =
      "Cho mình " +
      scoops +
      " viên vị bất kỳ tùy shop mix nhé!";
  }else{
    const flavorText = flavors
      .map(key=>FLAVORS[key].name)
      .join(" + ");

    order.text =
      "Cho mình " +
      flavorText +
      " " +
      (base === "cone" ? "ốc quế" : "ly") +
      (topping ? " thêm " + TOPPINGS[topping].name : "") +
      " nha!";
  }

  if(randomTopping){
    order.text += " Topping tùy shop chọn giúp mình cũng được ạ.";
  }

  const customer = {
    id:
      Date.now().toString(36) +
      Math.random().toString(36).slice(2,8),

    gender,
    name,

    order,

    createdAt:Date.now(),
    expiresAt:Date.now() + MAX_PATIENCE_MS,

    maxPatienceMs:MAX_PATIENCE_MS,

    hurrySent:false,
    hurryText:"",

    wrongCount:0
  };

  const openingLine =
    Math.random() < .45
      ? randomItem(CUSTOMER_LINES.normal)
      : "";

  if(openingLine){
    customer.order.text =
      openingLine +
      " " +
      customer.order.text;
  }

  return customer;
}

/* =========================================================
   SPAWN CUSTOMER
========================================================= */

function scheduleNextCustomer(delay){
  clearCustomerTimer();

  customerTimeout = setTimeout(()=>{
    if(!state.isOpen){
      return;
    }

    if(state.minutes >= CLOSING_MINUTE){
      handleEndOfDay();
      return;
    }

    spawnCustomer();

  },delay);
}

function spawnCustomer(){
  if(!state.isOpen){
    return;
  }

  if(state.activeCustomer){
    return;
  }

  if(state.minutes >= CLOSING_MINUTE){
    handleEndOfDay();
    return;
  }

  const customer = generateCustomer();

  if(!customer){
    showMessage(
      "Kho nguyên liệu trống",
      "Tiệm không còn đủ nguyên liệu để tiếp khách. Hãy vào Kho Hàng nhập thêm.",
      "📦"
    );

    return;
  }

  customer.expiresAt = Date.now() + MAX_PATIENCE_MS;

  state.activeCustomer = customer;

  resetBuild();

  saveGame();
  render();
}

function clearCustomerTimer(){
  if(customerTimeout){
    clearTimeout(customerTimeout);
    customerTimeout = null;
  }
}

/* =========================================================
   PATIENCE
========================================================= */

function updatePatience(){
  if(!state.isOpen || !state.activeCustomer){
    return;
  }

  const customer = state.activeCustomer;
  const remaining = customer.expiresAt - Date.now();

  const percent =
    clamp(
      remaining / MAX_PATIENCE_MS * 100,
      0,
      100
    );

  if(percent <= 50 && !customer.hurrySent){
    customer.hurrySent = true;

    customer.hurryText =
      randomItem(CUSTOMER_LINES.hurry);

    saveGame();
    render();
  }

  if(remaining <= 0){
    handleCustomerTimeout();
  }
}

/* =========================================================
   TIME LOOP
========================================================= */

let lastClockUpdate = 0;

function gameTick(){
  const now = Date.now();

  if(
    now - lastClockUpdate >= 100
  ){
    lastClockUpdate = now;

    if(state.isOpen){

      const elapsed =
        Math.floor(
          (now - window.gameDayRealStart) /
          GAME_MINUTE_MS
        );

      state.minutes =
        clamp(
          OPENING_MINUTE + elapsed,
          OPENING_MINUTE,
          CLOSING_MINUTE
        );

      updatePatience();

      if(
        state.minutes >= CLOSING_MINUTE &&
        !state.dayEndHandled
      ){
        handleEndOfDay();
      }else{
        updateOpenClockOnly();
      }
    }
  }

  gameLoop = requestAnimationFrame(gameTick);
}

function startClockLoop(){
  if(gameLoop){
    cancelAnimationFrame(gameLoop);
  }

  gameLoop = requestAnimationFrame(gameTick);
}

function updateOpenClockOnly(){
  const timeElement = document.querySelector(".customer-progress-line span");

  if(timeElement){
    timeElement.textContent =
      "⏰ " + formatTime(state.minutes);
  }

  const progressElement =
    document.querySelector(".customer-progress-line span:nth-child(2)");

  if(progressElement){
    progressElement.textContent =
      "Phục vụ " + state.served + "/" + dayTarget();
  }

  if(state.activeCustomer){
    const patience = currentPatiencePercent();

    const circle =
      document.querySelector(".patience-value");

    if(circle){
      const circumference = 2 * Math.PI * 21;
      circle.style.strokeDashoffset =
        circumference * (1 - patience / 100);

      circle.classList.toggle(
        "warn",
        patience <= 50 && patience > 25
      );

      circle.classList.toggle(
        "danger",
        patience <= 25
      );
    }
  }
}

/* =========================================================
   END OF DAY
========================================================= */

function handleEndOfDay(){
  if(state.dayEndHandled){
    return;
  }

  state.dayEndHandled = true;
  state.isOpen = false;

  clearCustomerTimer();

  if(state.activeCustomer){
    handleCustomerTimeout(true);
  }

  state.activeCustomer = null;

  if(state.served >= dayTarget()){
    modalState = {
      type:"summary",
      title:"Ngày kinh doanh hoàn thành! 🎉"
    };
  }else{
    state.pausedForDayFailure = true;

    modalState = {
      type:"failure"
    };
  }

  saveGame();
  render();
}

      "Kem ngon và làm rất nhanh, mình thích tiệm này!",

    ]);
  }else if(rating === 4){
    text = randomItem([
      "Kem ngon, mọi thứ ổn áp, mình sẽ quay lại nha!",
      "Kem khá ngon, phục vụ ổn, mình hài lòng!",
      "Tiệm dễ thương, chỉ cần nhanh thêm một chút là tuyệt rồi."

/* =========================================================
   PATIENCE -> RATING
========================================================= */

function ratingFromPatience(percent){
  if(percent > 80){
    return 5;
  }

  if(percent > 60){
    return 4;
  }

  if(percent > 35){
    return 3;
  }

  if(percent > 15){
    return 2;
  }

  return 1;
}

/* =========================================================
   SUCCESS SERVICE
========================================================= */

function serveOrder(){
  const customer = state.activeCustomer;

  if(!customer){
    return;
  }

  if(
    !state.build.base ||
    state.build.flavors.length !== customer.order.scoops
  ){
    showToast(
      "Hãy hoàn thành đủ các bước làm kem trước khi giao.",
      "warning"
    );

    return;
  }

  if(!buildMatchesOrder()){
    wrongOrder();
    return;
  }

  const patience = currentPatiencePercent();

  state.lastServicePatience = patience;

  consumeBuildInventory();

  const revenue = pricePerOrder();

  state.cash += revenue;
  state.dayRevenue += revenue;
  state.served += 1;

  const rating =
    ratingFromPatience(patience);

  const review =
    createReviewFromCustomer(
      customer,
      rating,
      "served"
    );

  state.reviews.push(review);

  const customerName = customer.name;

  state.lastServiceResult = {
    type:"success",
    customerName,
    revenue
  };

  state.activeCustomer = null;
  resetBuild();

  saveGame();
  render();

  showToast(
    "Đã phục vụ thành công cho khách " +
    customerName +
    "! +" +
    money(revenue),
    "success"
  );

  if(state.served >= dayTarget()){
    setTimeout(()=>{
      if(
        state.isOpen &&
        !state.dayEndHandled
      ){
        closeShop();
      }
    },850);

    return;
  }

  scheduleNextCustomer(
    Math.max(900,serviceDelay() - 700)
  );
}

/* =========================================================
   EMPLOYEE SERVICE
========================================================= */

function employeeCanFulfill(){
  const customer = state.activeCustomer;

  if(!customer){
    return false;
  }

  if(
    !state.build.base ||
    state.inventory.bases[state.build.base] <= 0
  ){
    return false;
  }

  const availableFlavors =
    Object.keys(state.inventory.flavors)
      .filter(key=>state.inventory.flavors[key] > 0);

  if(availableFlavors.length === 0){
    return false;
  }

  if(customer.order.randomFlavors){
    return true;
  }

  return customer.order.flavors.every(key=>{
    return state.inventory.flavors[key] > 0;
  });
}

function employeeChooseExactOrder(){
  const customer = state.activeCustomer;

  if(!customer){
    return;
  }

  if(customer.order.randomFlavors){
    const available =
      Object.keys(state.inventory.flavors)
        .filter(key=>state.inventory.flavors[key] > 0);

    if(available.length === 0){
      return;
    }

    const chosen = [];

    for(let i=0;i<customer.order.scoops;i++){
      chosen.push(randomItem(available));
    }

    state.build.flavors = chosen;
  }else{
    state.build.flavors =
      customer.order.flavors.slice();
  }

  if(customer.order.randomTopping){
    const available =
      Object.keys(state.inventory.toppings)
        .filter(key=>state.inventory.toppings[key] > 0);

    if(
      available.length > 0 &&
      Math.random() < .75
    ){
      state.build.topping =
        randomItem(available);
    }else{
      state.build.topping = null;
    }
  }else{
    state.build.topping =
      customer.order.topping;
  }
}

function serveWithEmployee(){
  if(!isEmployeeActive()){
    serveOrder();
    return;
  }

  const customer = state.activeCustomer;

  if(!customer){
    return;
  }

  if(!state.build.base){
    showToast(
      "Bạn vẫn cần chọn ốc quế hoặc ly cho đơn này.",
      "warning"
    );

    return;
  }

  if(!employeeCanFulfill()){
    openOutOfStockChat(
      "flavor",
      customer.order.flavors[0] || "chocolate"
    );

    return;
  }

  employeeChooseExactOrder();

  if(
    customer.order.topping &&
    !customer.order.randomTopping &&
    state.inventory.toppings[customer.order.topping] <= 0
  ){
    openOutOfStockChat(
      "topping",
      customer.order.topping
    );

    return;
  }

  render();

  setTimeout(()=>{
    if(
      !state.activeCustomer ||
      state.activeCustomer.id !== customer.id
    ){
      return;
    }

    serveOrder();

  },serviceDelay());
}

/* =========================================================
   WRONG ORDER
========================================================= */

function wrongOrder(){
  const customer = state.activeCustomer;

  if(!customer){
    return;
  }

  customer.wrongCount =
    (customer.wrongCount || 0) + 1;

  const remaining =
    customer.expiresAt - Date.now();

  customer.expiresAt =
    Date.now() +
    Math.max(
      5000,
      remaining * .5
    );

  state.wrongOrders += 1;

  state.lastServicePatience =
    currentPatiencePercent();

  saveGame();
  render();

  showToast(
    "Sai đơn! Thanh kiên nhẫn của khách đã giảm 50%.",
    "error"
  );

  if(customer.wrongCount >= 2){
    setTimeout(()=>{
      if(
        state.activeCustomer &&
        state.activeCustomer.id === customer.id
      ){
        handleCustomerTimeout();
      }
    },350);
  }
}

/* =========================================================
   CUSTOMER TIMEOUT / WALKOUT
========================================================= */

function handleCustomerTimeout(fromClosing=false){
  const customer = state.activeCustomer;

  if(!customer){
    return;
  }

  state.lastServicePatience = 0;

  state.walkouts += 1;

  const review =
    createReviewFromCustomer(
      customer,
      randomInt(1,2),
      "walkout"
    );

  state.reviews.push(review);

  const name = customer.name;

  state.activeCustomer = null;
  resetBuild();

  clearCustomerTimer();

  saveGame();
  render();

  if(!fromClosing){
    showToast(
      name + " đã rời tiệm vì chờ quá lâu.",
      "error"
    );
  }

  checkBankruptcy();

  if(
    state.isOpen &&
    state.served < dayTarget()
  ){
    scheduleNextCustomer(900);
  }
}

/* =========================================================
   BANKRUPTCY
========================================================= */

function checkBankruptcy(){
  const seriousWalkouts =
    state.walkouts >= 8;

  const seriousWrongOrders =
    state.wrongOrders >= 6;

  if(
    seriousWalkouts ||
    seriousWrongOrders
  ){
    triggerBankruptcy();
  }
}

function triggerBankruptcy(){
  clearCustomerTimer();

  if(gameLoop){
    cancelAnimationFrame(gameLoop);
    gameLoop = null;
  }

  const newState = freshState();

  newState.bankruptcyCount =
    state.bankruptcyCount + 1;

  state = newState;

  modalState = {
    type:"bankruptcy"
  };

  saveGame();
  render();
}

function restartGame(){
  clearCustomerTimer();

  if(gameLoop){
    cancelAnimationFrame(gameLoop);
    gameLoop = null;
  }

  state = freshState();
  modalState = null;

  localStorage.removeItem(STORAGE_KEY);

  render();
}

/* =========================================================
   CUSTOMER CHAT
========================================================= */

function customerChat(kind){
  const customer = state.activeCustomer;

  if(!customer){
    closeModal();
    return;
  }

  if(kind === "rude"){
    const review = createReviewFromCustomer(
      customer,
      1,
      "wrong"
    );

    review.text =
      "Thái độ nhắn tin của tiệm làm mình rất khó chịu. Mình xin phép đánh giá 1 sao.";

    review.anonymous = true;

    state.reviews.push(review);

    state.walkouts += 1;

    state.activeCustomer = null;
    resetBuild();

    modalState = null;

    saveGame();
    render();

    showToast(
      "Khách rất tức giận và để lại đánh giá 1 sao.",
      "error"
    );

    checkBankruptcy();

    if(state.isOpen){
      scheduleNextCustomer(800);
    }

    return;
  }

  if(kind === "polite"){
    const review = createReviewFromCustomer(
      customer,
      3,
      "walkout"
    );

    review.text =
      "Tiệm đã giải thích lịch sự nên mình thông cảm, dù hôm nay chưa mua được món.";

    review.anonymous = false;

    state.reviews.push(review);

    state.walkouts += 1;
    state.activeCustomer = null;
    resetBuild();

    modalState = null;

    saveGame();
    render();

    showToast(
      "Khách nhẹ nhàng rời tiệm sau khi nhận được lời giải thích.",
      "success"
    );

    if(state.isOpen){
      scheduleNextCustomer(800);
    }

    return;
  }

  if(kind === "alternative"){
    modalState = null;
    render();

    showToast(
      "Khách đang chờ bạn chọn một vị khác đang còn hàng.",
      "warning"
    );

    return;
  }
}

function sendCustomCustomerChat(){
  const input =
    document.getElementById("customerChatInput");

  if(!input){
    return;
  }

  const message = input.value.trim();

  if(!message){
    return;
  }

  const badWords = [
    "đm",
    "dm",
    "địt",
    "dit",
    "fuck",
    "cc",
    "cút",
    "cut",
    "ngu",
    "mẹ mày"
  ];

  const rude =
    badWords.some(word=>
      message.toLowerCase().includes(word)
    );

  customerChat(
    rude ? "rude" : "polite"
  );
}

/* =========================================================
   UPGRADES
========================================================= */

function upgrade(type){
  if(!state.upgrades.hasOwnProperty(type)){
    return;
  }

  const cost = upgradeCost(type);

  if(cost === null){
    showToast(
      "Nâng cấp này đã đạt cấp tối đa.",
      "warning"
    );

    return;
  }

  if(state.cash < cost){
    showMessage(
      "Chưa đủ tiền",
      "Bạn chưa đủ vốn cho nâng cấp này.",
      "💰"
    );

    return;
  }

  if(type === "employee"){
    if(isEmployeeActive()){
      showToast(
        "Nhân viên đã được thuê rồi.",
        "warning"
      );

      return;
    }
  }

  state.cash -= cost;
  state.upgrades[type] += 1;

  state.dayUpgradeCosts += cost;

  if(type === "employee"){
    state.staffLastPaidDay = state.day;
    state.staffDaysSincePay = 0;
  }

  saveGame();
  render();

  showToast(
    "Nâng cấp thành công!",
    "success"
  );
}

/* =========================================================
   REVIEW REPLY
========================================================= */

function getReviewById(id){
  return state.reviews.find(review=>
    String(review.id) === String(id)
  );
}

function sendReviewReply(id){
  const review = getReviewById(id);

  if(!review){
    return;
  }

  const input =
    document.querySelector(
      `[data-review-input="${CSS.escape(String(id))}"]`
    );

  if(!input){
    return;
  }

  const text = input.value.trim();

  if(!text){
    showToast(
      "Hãy nhập nội dung phản hồi trước khi gửi.",
      "warning"
    );

    input.focus();
    return;
  }

  review.reply = text;

  saveGame();
  render();

  showToast(
    "Đã gửi phản hồi cho khách.",
    "success"
  );
}

function quickReviewReply(id,text){
  const review = getReviewById(id);

  if(!review){
    return;
  }

  review.reply = text;

  saveGame();
  render();

  showToast(
    "Đã gửi câu trả lời mẫu.",
    "success"
  );
}

/* =========================================================
   EVENT DELEGATION
========================================================= */

document.addEventListener("click",event=>{
  const button =
    event.target.closest("[data-action]");

  if(!button){
    return;
  }

  const action =
    button.dataset.action;

  if(action === "start-game"){
    startGame();
    return;
  }

  if(action === "navigate"){
    const screen = button.dataset.screen;

    if(
      screen === "shop" ||
      screen === "warehouse" ||
      screen === "upgrades" ||
      screen === "reviews"
    ){
      state.currentScreen = screen;

      saveGame();
      render();
    }

    return;
  }

  if(action === "open-shop"){
    openShop();
    return;
  }

  if(action === "select-base"){
    selectBase(button.dataset.key);
    return;
  }

  if(action === "select-flavor"){
    selectFlavor(button.dataset.key);
    return;
  }

  if(action === "select-topping"){
    selectTopping(button.dataset.key);
    return;
  }

  if(action === "reset-build"){
    resetBuild();
    saveGame();
    render();
    return;
  }

  if(action === "serve-order"){
    if(isEmployeeActive()){
      serveWithEmployee();
    }else{
      serveOrder();
    }

    return;
  }

  if(action === "buy-stock"){
    buyStock(
      button.dataset.type,
      button.dataset.key
    );

    return;
  }

  if(action === "upgrade"){
    upgrade(button.dataset.type);
    return;
  }

  if(action === "send-review-reply"){
    sendReviewReply(button.dataset.reviewId);
    return;
  }

  if(action === "quick-review-reply"){
    quickReviewReply(
      button.dataset.reviewId,
      button.dataset.text
    );

    return;
  }

  if(action === "customer-chat"){
    customerChat(button.dataset.kind);
    return;
  }

  if(action === "send-custom-chat"){
    sendCustomCustomerChat();
    return;
  }

  if(action === "close-modal"){
    closeModal();
    return;
  }

  if(action === "next-day"){
    nextDay();
    return;
  }

  if(action === "continue-same-day"){
    continueSameDay();
    return;
  }

  if(action === "restart-game"){
    restartGame();
    return;
  }
});

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",event=>{
  if(event.key === "Enter"){
    const target = event.target;

    if(
      target &&
      target.id === "shopNameInput"
    ){
      startGame();
    }

    if(
      target &&
      target.id === "customerChatInput"
    ){
      sendCustomCustomerChat();
    }
  }
});

/* =========================================================
   VISIBILITY / RESUME
========================================================= */

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    saveGame();
    return;
  }

  if(state.isOpen){
    /*
      Không cộng thời gian sai khi quay lại.
      Game sử dụng mốc thực tế window.gameDayRealStart.
    */
    if(
      !window.gameDayRealStart ||
      state.minutes >= CLOSING_MINUTE
    ){
      window.gameDayRealStart =
        Date.now();
    }
  }

  saveGame();
});

/* =========================================================
   PATCH OPEN SHOP REAL-TIME CLOCK START
========================================================= */

const originalOpenShop = openShop;

openShop = function(){
  if(state.isOpen){
    return;
  }

  if(!canOpenShop()){
    showMessage(
      "Chưa thể mở cửa",
      "Bạn cần nhập sỉ nguyên liệu ở Kho Hàng trước khi mở bán!",
      "📦"
    );

    return;
  }

  const payrollDue =
    isEmployeeActive() &&
    state.day - state.staffLastPaidDay >= 2;

  if(payrollDue){
    const wage = staffWage();

    if(state.cash < wage){
      showMessage(
        "Không đủ tiền trả lương",
        "Bạn chưa đủ tiền để thanh toán lương nhân viên cho chu kỳ này. Hãy kiếm thêm vốn trước khi mở cửa.",
        "👩‍🍳"
      );

      return;
    }

    state.cash -= wage;
    state.dayStaffCosts += wage;
    state.staffLastPaidDay = state.day;
    state.staffDaysSincePay = 0;

    showToast(
      "Đã thanh toán lương nhân viên " + money(wage) + ".",
      "warning"
    );
  }

  state.isOpen = true;
  state.minutes = OPENING_MINUTE;
  state.dayEndHandled = false;
  state.activeCustomer = null;
  state.pausedForDayFailure = false;

  resetBuild();

  window.gameDayRealStart = Date.now();

  saveGame();
  render();

  scheduleNextCustomer(650);
};

openShop = openShop;

/* =========================================================
   INITIALIZATION
========================================================= */

loadGame();

if(!state.shopName){
  state = freshState();
}

render();

startClockLoop();

/* =========================================================
   PERIODIC SAVE
========================================================= */

setInterval(()=>{
  saveGame();
},3000);

/* =========================================================
   SAFETY: IF A CUSTOMER IS ACTIVE AFTER RESTORE
========================================================= */

if(state.isOpen){
  state.isOpen = false;
  state.activeCustomer = null;
  state.minutes = OPENING_MINUTE;
  saveGame();
  render();
}

/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener("beforeunload",()=>{
  saveGame();
});
</script>
