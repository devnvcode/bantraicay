<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f6e2d7">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Tiệm Bán Kem Ngọt Ngào</title>

  <style>
    :root {
      --bg: #f6e7df;
      --bg-soft: #fff8f3;
      --paper: #fffdfb;
      --cream: #fff4df;
      --brown: #684c40;
      --brown-dark: #49352d;
      --brown-soft: #94786a;
      --pink: #e9a9b9;
      --pink-dark: #c9788d;
      --pink-soft: #f8dfe5;
      --rose: #d98b9e;
      --green: #8eb8a2;
      --green-dark: #5f9077;
      --yellow: #f0c86b;
      --orange: #dc9b62;
      --red: #c86d70;
      --line: #eadbd2;
      --shadow: 0 8px 22px rgba(105, 76, 64, 0.12);
      --shadow-small: 0 4px 12px rgba(105, 76, 64, 0.10);
      --radius: 20px;
      --nav-height: 76px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--brown);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    input,
    textarea {
      outline: none;
    }

    #app {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .game-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 8%, rgba(255,255,255,.7), transparent 28%),
        linear-gradient(180deg, #f7e8df 0%, #f4e0d8 100%);
    }

    .game-main {
      width: min(100%, 540px);
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* -------------------------------------------------------
       WELCOME
    ------------------------------------------------------- */

    .welcome-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(22px, env(safe-area-inset-top))
        18px
        max(22px, env(safe-area-inset-bottom));
      position: relative;
      background:
        radial-gradient(circle at 20% 15%, #fff8f2 0 7%, transparent 8%),
        radial-gradient(circle at 83% 28%, #f8dfe4 0 8%, transparent 9%),
        linear-gradient(160deg, #f8e9df, #f2d8d2);
    }

    .welcome-cloud {
      position: absolute;
      width: 100px;
      height: 34px;
      background: rgba(255,255,255,.68);
      border-radius: 30px;
      animation: cloudMove 10s linear infinite;
    }

    .welcome-cloud::before,
    .welcome-cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .welcome-cloud::before {
      width: 42px;
      height: 42px;
      left: 18px;
      bottom: 8px;
    }

    .welcome-cloud::after {
      width: 55px;
      height: 55px;
      right: 13px;
      bottom: 4px;
    }

    .welcome-cloud.cloud-one {
      top: 13%;
      left: -20px;
    }

    .welcome-cloud.cloud-two {
      top: 26%;
      right: -40px;
      transform: scale(.72);
      animation-delay: -4s;
    }

    .welcome-card {
      width: min(100%, 430px);
      padding: 24px 20px 20px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 32px;
      background: rgba(255,253,250,.82);
      box-shadow: 0 20px 50px rgba(105,76,64,.16);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .welcome-title {
      margin: 0;
      color: var(--brown-dark);
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.05;
      letter-spacing: -1px;
      font-weight: 900;
    }

    .welcome-subtitle {
      margin: 7px 0 10px;
      color: var(--brown-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .welcome-dessert {
      height: 235px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .welcome-icecream {
      width: 170px;
      height: 205px;
      position: relative;
      animation: welcomeWobble 3.2s ease-in-out infinite;
    }

    .welcome-scoop {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      left: 49px;
      box-shadow: inset -8px -8px 0 rgba(100,70,60,.08);
    }

    .welcome-scoop.one {
      top: 25px;
      background: #f1adbb;
    }

    .welcome-scoop.two {
      top: 67px;
      left: 35px;
      background: #f7cf82;
    }

    .welcome-scoop.three {
      top: 67px;
      left: 63px;
      background: #b9d9bc;
    }

    .welcome-cone {
      position: absolute;
      top: 120px;
      left: 48px;
      width: 76px;
      height: 85px;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(126,83,46,.15) 0 4px,
          transparent 4px 11px
        ),
        linear-gradient(180deg, #e7ae67, #c98748);
      clip-path: polygon(8% 0, 92% 0, 58% 100%, 42% 100%);
      border-radius: 8px;
    }

    .welcome-cherry {
      position: absolute;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #cf6674;
      top: 15px;
      left: 75px;
    }

    .welcome-cherry::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 12px;
      border-top: 3px solid #71926d;
      border-radius: 50%;
      transform: rotate(-30deg);
      top: -8px;
      left: 5px;
    }

    .welcome-sparkle {
      position: absolute;
      font-size: 18px;
      color: #d998a8;
      animation: floatMini 3s ease-in-out infinite;
    }

    .welcome-sparkle.s1 { left: 12%; top: 20%; }
    .welcome-sparkle.s2 { right: 12%; top: 44%; animation-delay: -1s; }
    .welcome-sparkle.s3 { left: 17%; bottom: 10%; animation-delay: -2s; }

    .welcome-form {
      display: grid;
      gap: 10px;
    }

    .shop-name-input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 0 15px;
      text-align: center;
      color: var(--brown-dark);
      font-weight: 800;
    }

    .primary-button {
      min-height: 50px;
      padding: 0 18px;
      border-radius: 16px;
      background: var(--brown-dark);
      color: #fff;
      font-weight: 900;
      box-shadow: var(--shadow-small);
      transition: transform .16s ease, opacity .16s ease;
    }

    .primary-button:active,
    .secondary-button:active,
    .danger-button:active,
    .nav-button:active,
    .choice-button:active,
    .stock-button:active,
    .upgrade-button:active {
      transform: scale(.97);
    }

    .primary-button:disabled,
    .secondary-button:disabled,
    .choice-button:disabled,
    .stock-button:disabled,
    .upgrade-button:disabled {
      opacity: .48;
      cursor: not-allowed;
      transform: none;
    }

    /* -------------------------------------------------------
       HEADER
    ------------------------------------------------------- */

    .top-header {
      flex: 0 0 auto;
      padding:
        max(9px, env(safe-area-inset-top))
        12px
        8px;
      background: rgba(255,251,247,.94);
      border-bottom: 1px solid rgba(220,198,188,.72);
      z-index: 20;
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .day-info {
      min-width: 0;
    }

    .day-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 900;
      color: var(--brown-soft);
    }

    .day-number {
      color: var(--brown-dark);
      font-size: 16px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 900;
      background: #f4e8e1;
      color: var(--brown-soft);
      white-space: nowrap;
    }

    .status-pill.open {
      background: #e2f0e5;
      color: var(--green-dark);
    }

    .money-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 14px;
      background: #fff3cf;
      color: #8b6635;
      font-weight: 900;
      font-size: 13px;
      white-space: nowrap;
    }

    .money-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e8bd5d;
      display: grid;
      place-items: center;
      color: #fff6dc;
      font-size: 11px;
      font-weight: 900;
      box-shadow: inset 0 -2px rgba(121,83,28,.15);
    }

    .shop-title-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 3px;
      max-width: 180px;
    }

    .shop-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--brown-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edit-shop {
      width: 23px;
      height: 23px;
      border-radius: 8px;
      background: #f7e5df;
      color: var(--pink-dark);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .edit-shop svg {
      width: 12px;
      height: 12px;
    }

    .rating-summary {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      color: #9a6e35;
      font-size: 10px;
      font-weight: 800;
    }

    .rating-summary .star {
      color: #d9a947;
      font-size: 12px;
    }

    /* -------------------------------------------------------
       CONTENT AREA
    ------------------------------------------------------- */

    .content-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 8px 10px;
      display: none;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      animation: screenIn .18s ease-out;
    }

    /* -------------------------------------------------------
       SHOP / COUNTER
    ------------------------------------------------------- */

    .shop-screen {
      gap: 7px;
    }

    .shop-front {
      flex: 0 0 auto;
      height: clamp(128px, 22vh, 170px);
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          #fff5ed 0 27%,
          #f3d4c4 27% 31%,
          #a9755b 31% 100%
        );
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.8);
    }

    .awning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background:
        repeating-linear-gradient(
          90deg,
          #f5c4ce 0 30px,
          #fff4ef 30px 60px
        );
      border-bottom: 2px solid rgba(151,102,84,.18);
      border-radius: 0 0 18px 18px;
    }

    .awning::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      height: 9px;
      background: repeating-linear-gradient(
        90deg,
        #f2b7c2 0 30px,
        #ffefe8 30px 60px
      );
      border-radius: 0 0 12px 12px;
    }

    .shop-sign {
      position: absolute;
      left: 50%;
      top: 39px;
      transform: translateX(-50%);
      min-width: 205px;
      max-width: 70%;
      height: 32px;
      padding: 0 14px;
      border-radius: 12px;
      background: #fff9f2;
      border: 1px solid #ead6c9;
      box-shadow: 0 4px 10px rgba(92,59,48,.10);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 3;
    }

    .shop-sign-name {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 950;
      color: var(--brown-dark);
    }

    .shop-sign-sub {
      font-size: 7px;
      letter-spacing: 1.5px;
      font-weight: 900;
      color: var(--pink-dark);
    }

    .ingredient-row {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 36px;
      height: 52px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 4px;
      z-index: 2;
    }

    .mini-jar {
      width: 40px;
      height: 48px;
      border-radius: 9px 9px 12px 12px;
      background: rgba(255,255,255,.88);
      border: 2px solid rgba(105,76,64,.15);
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4px;
      box-shadow: 0 3px 7px rgba(65,45,38,.12);
    }

    .mini-jar::before {
      content: "";
      position: absolute;
      width: 28px;
      height: 7px;
      border-radius: 50%;
      top: -4px;
      background: #f7e9df;
      border: 2px solid rgba(105,76,64,.14);
    }

    .jar-fill {
      width: 25px;
      height: 31px;
      border-radius: 7px 7px 10px 10px;
    }

    .jar-label {
      position: absolute;
      bottom: -14px;
      width: 52px;
      text-align: center;
      font-size: 7px;
      font-weight: 800;
      color: #fffaf7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .counter-top {
      position: absolute;
      bottom: 27px;
      left: 0;
      right: 0;
      height: 9px;
      background: #c58e70;
      box-shadow: 0 -2px rgba(87,55,44,.13);
    }

    .cat-zone {
      position: absolute;
      right: 12px;
      bottom: 30px;
      width: 110px;
      height: 80px;
      z-index: 5;
      pointer-events: none;
    }

    .cat-cushion {
      position: absolute;
      width: 94px;
      height: 34px;
      left: 8px;
      bottom: 2px;
      border-radius: 50%;
      background: #ecaebb;
      box-shadow: inset 0 -5px rgba(165,91,108,.12);
    }

    .cat-body {
      position: absolute;
      width: 72px;
      height: 55px;
      left: 20px;
      bottom: 14px;
      border-radius: 48% 52% 52% 48%;
      background: #ead0bc;
      box-shadow:
        inset -8px -5px rgba(126,84,69,.10),
        0 3px 7px rgba(71,48,40,.12);
    }

    .cat-head {
      position: absolute;
      width: 52px;
      height: 47px;
      left: 13px;
      top: 8px;
      border-radius: 48% 48% 46% 46%;
      background: #eed5c3;
      box-shadow: inset -5px -4px rgba(126,84,69,.08);
      z-index: 2;
    }

    .cat-ear {
      position: absolute;
      width: 22px;
      height: 23px;
      background: #e4c3ad;
      top: 1px;
      z-index: -1;
    }

    .cat-ear.left {
      left: 1px;
      border-radius: 60% 30% 45% 25%;
      transform: rotate(-22deg);
    }

    .cat-ear.right {
      right: 1px;
      border-radius: 30% 60% 25% 45%;
      transform: rotate(22deg);
    }

    .cat-ear-inner {
      position: absolute;
      width: 10px;
      height: 11px;
      background: #efabb8;
      top: 6px;
      border-radius: 60% 30% 45% 25%;
    }

    .cat-ear-inner.left {
      left: 6px;
      transform: rotate(-22deg);
    }

    .cat-ear-inner.right {
      right: 6px;
      transform: rotate(22deg);
    }

    .cat-eye {
      position: absolute;
      width: 12px;
      height: 5px;
      border-top: 2px solid #74564c;
      border-radius: 50%;
      top: 24px;
    }

    .cat-eye.left { left: 10px; transform: rotate(-5deg); }
    .cat-eye.right { right: 10px; transform: rotate(5deg); }

    .cat-nose {
      position: absolute;
      width: 6px;
      height: 5px;
      border-radius: 50%;
      background: #d78e9d;
      top: 31px;
      left: 23px;
    }

    .cat-mouth {
      position: absolute;
      width: 10px;
      height: 5px;
      border-bottom: 2px solid #8b6358;
      border-radius: 50%;
      top: 34px;
      left: 21px;
    }

    .cat-cheek {
      position: absolute;
      width: 11px;
      height: 6px;
      border-radius: 50%;
      background: rgba(236,144,160,.48);
      top: 31px;
    }

    .cat-cheek.left { left: 3px; }
    .cat-cheek.right { right: 3px; }

    .cat-tail {
      position: absolute;
      width: 35px;
      height: 33px;
      right: -4px;
      bottom: 20px;
      border: 10px solid #e7c8b4;
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(25deg);
    }

    .cat-z {
      position: absolute;
      right: 7px;
      top: -3px;
      color: #fff7f2;
      font-weight: 950;
      animation: zzzFloat 2.5s ease-in-out infinite;
      text-shadow: 0 1px rgba(90,60,50,.15);
    }

    .cat-z.z2 {
      right: -2px;
      top: -19px;
      font-size: 11px;
      animation-delay: -.8s;
    }

    .cat-z.z3 {
      right: 13px;
      top: -30px;
      font-size: 9px;
      animation-delay: -1.5s;
    }

    .front-lights {
      position: absolute;
      bottom: 31px;
      left: 9px;
      display: flex;
      gap: 5px;
    }

    .front-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5d783;
      border: 2px solid rgba(100,70,55,.12);
    }

    /* -------------------------------------------------------
       CLOSED SHOP
    ------------------------------------------------------- */

    .closed-card {
      flex: 1 1 auto;
      min-height: 0;
      border-radius: 20px;
      background: rgba(255,252,248,.82);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: var(--shadow-small);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .closed-inner {
      width: min(100%, 340px);
      text-align: center;
    }

    .closed-illustration {
      width: 90px;
      height: 70px;
      margin: 0 auto 8px;
      position: relative;
    }

    .closed-cup {
      position: absolute;
      width: 48px;
      height: 44px;
      left: 21px;
      top: 21px;
      background: #fff;
      border: 2px solid #dbc5ba;
      border-radius: 7px 7px 13px 13px;
      transform: skew(-4deg);
    }

    .closed-cup::before {
      content: "";
      position: absolute;
      width: 39px;
      height: 24px;
      left: 2px;
      top: -18px;
      border-radius: 50%;
      background: #e8a9b7;
      border: 2px solid #d596a5;
    }

    .closed-sign {
      position: absolute;
      right: 0;
      top: 0;
      padding: 4px 7px;
      border-radius: 7px;
      background: #684c40;
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      transform: rotate(6deg);
    }

    .closed-title {
      margin: 0 0 5px;
      color: var(--brown-dark);
      font-size: 17px;
      font-weight: 950;
    }

    .closed-text {
      margin: 0 0 13px;
      color: var(--brown-soft);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 700;
    }

    /* -------------------------------------------------------
       OPEN WORKSPACE
    ------------------------------------------------------- */

    .open-workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .customer-card {
      flex: 0 0 auto;
      min-height: 94px;
      max-height: 115px;
      border-radius: 18px;
      background: rgba(255,253,250,.93);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-small);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
    }

    .customer-avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 18px;
      background: #f7dedc;
      overflow: hidden;
      position: relative;
    }

    .avatar-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .customer-middle {
      flex: 1 1 auto;
      min-width: 0;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .customer-name-line {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .customer-name {
      font-size: 12px;
      font-weight: 950;
      color: var(--brown-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gender-label {
      font-size: 8px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 6px;
      background: #f7e9e4;
      color: var(--brown-soft);
    }

    .order-bubble {
      min-width: 0;
      padding: 5px 7px;
      border-radius: 10px 10px 10px 3px;
      background: #f8eee9;
      color: #72574c;
      font-size: 9px;
      line-height: 1.35;
      font-weight: 700;
      max-height: 45px;
      overflow: hidden;
    }

    .patience-box {
      width: 45px;
      flex: 0 0 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .patience-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background: conic-gradient(var(--green) var(--patience), #eadfd9 0);
    }

    .patience-ring::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #fffdfa;
    }

    .patience-ring.warning {
      background: conic-gradient(var(--red) var(--patience), #eadfd9 0);
    }

    .patience-inner {
      position: relative;
      z-index: 1;
      font-size: 8px;
      font-weight: 950;
      color: var(--brown);
    }

    .step-panel {
      flex: 1 1 auto;
      min-height: 0;
      border-radius: 18px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-small);
      padding: 7px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .step-tabs {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 6px;
    }

    .step-tab {
      min-height: 31px;
      border-radius: 10px;
      background: #f5ebe6;
      color: #9a7c70;
      font-size: 9px;
      font-weight: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .step-tab.active {
      background: #f2d5da;
      color: #9c596b;
    }

    .step-tab.done {
      background: #e6efe7;
      color: #63856e;
    }

    .builder-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      gap: 7px;
    }

    .dessert-preview {
      width: 40%;
      min-width: 112px;
      border-radius: 15px;
      background:
        radial-gradient(circle at 50% 30%, #fff 0 2%, transparent 3%),
        #fbf1e8;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dessert-stage {
      width: 108px;
      height: 170px;
      position: relative;
      transform: scale(.76);
      transform-origin: center;
    }

    .dessert-base {
      position: absolute;
      width: 67px;
      height: 75px;
      left: 20px;
      bottom: 4px;
      z-index: 2;
      display: none;
    }

    .dessert-base.visible {
      display: block;
    }

    .dessert-base.cone {
      clip-path: polygon(5% 0, 95% 0, 60% 100%, 40% 100%);
      border-radius: 8px;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(126,83,46,.15) 0 4px,
          transparent 4px 11px
        ),
        linear-gradient(180deg, #eab66f, #c98447);
    }

    .dessert-base.cup {
      height: 60px;
      bottom: 5px;
      border-radius: 7px 7px 17px 17px;
      background: linear-gradient(90deg, #fff, #f8e7e0);
      border: 2px solid #dfc8bd;
    }

    .dessert-base.cup::after {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: 9px;
      height: 3px;
      border-radius: 4px;
      background: #edb0bc;
    }

    .preview-scoop {
      position: absolute;
      width: 60px;
      height: 60px;
      left: 24px;
      border-radius: 50%;
      z-index: 3;
      box-shadow:
        inset -8px -8px rgba(91,63,52,.09),
        0 3px 5px rgba(72,50,42,.12);
      animation: scoopPop .25s ease-out;
    }

    .preview-scoop.scoop-1 {
      bottom: 55px;
    }

    .preview-scoop.scoop-2 {
      bottom: 92px;
    }

    .preview-scoop.scoop-3 {
      bottom: 129px;
    }

    .preview-topping {
      position: absolute;
      z-index: 5;
      font-size: 22px;
      display: none;
      left: 42px;
      top: 13px;
      animation: scoopPop .25s ease-out;
    }

    .preview-topping.visible {
      display: block;
    }

    .preview-placeholder {
      text-align: center;
      color: #b79c90;
      font-size: 9px;
      font-weight: 900;
      line-height: 1.4;
      padding: 10px;
    }

    .builder-options {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .option-heading {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 950;
      color: var(--brown-dark);
      margin-bottom: 5px;
    }

    .option-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      align-content: start;
      overflow: hidden;
    }

    .choice-button {
      min-width: 0;
      min-height: 42px;
      padding: 4px 3px;
      border-radius: 11px;
      background: #f8f0ec;
      border: 1px solid transparent;
      color: #775b50;
      font-size: 8px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: relative;
    }

    .choice-button.selected {
      border-color: #d78d9d;
      background: #fae2e6;
      color: #9a5668;
    }

    .choice-button.empty {
      opacity: .45;
    }

    .choice-icon {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .choice-stock {
      position: absolute;
      right: 3px;
      top: 3px;
      min-width: 13px;
      height: 13px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 7px;
      background: rgba(105,76,64,.1);
      color: #775d52;
    }

    .builder-footer {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }

    .secondary-button,
    .danger-button {
      min-height: 38px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 950;
    }

    .secondary-button {
      background: #f2e7e2;
      color: #785c50;
    }

    .danger-button {
      background: #d48a91;
      color: #fff;
    }

    .open-footer {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
    }

    .close-shop-button {
      flex: 1;
      min-height: 34px;
      border-radius: 11px;
      background: #f2e5df;
      color: #80655a;
      font-size: 9px;
      font-weight: 950;
    }

    .daily-progress {
      width: 55%;
      min-width: 0;
      border-radius: 11px;
      background: rgba(255,253,250,.9);
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-label {
      white-space: nowrap;
      font-size: 8px;
      font-weight: 950;
      color: #8d7065;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      border-radius: 5px;
      background: #eaded8;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: #8eb8a2;
      transition: width .25s ease;
    }

    /* -------------------------------------------------------
       WAREHOUSE
    ------------------------------------------------------- */

    .panel-title-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .panel-title {
      margin: 0;
      font-size: 17px;
      font-weight: 950;
      color: var(--brown-dark);
    }

    .panel-subtitle {
      margin: 2px 0 0;
      color: #96786b;
      font-size: 9px;
      font-weight: 700;
    }

    .capacity-pill {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 10px;
      background: #fff1db;
      color: #9b733f;
      font-size: 9px;
      font-weight: 950;
    }

    .warehouse-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .warehouse-section {
      flex: 0 0 auto;
      border-radius: 16px;
      background: rgba(255,253,250,.9);
      border: 1px solid var(--line);
      padding: 7px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .section-heading strong {
      font-size: 10px;
      font-weight: 950;
      color: var(--brown-dark);
    }

    .section-heading span {
      font-size: 8px;
      color: #a18478;
      font-weight: 800;
    }

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .stock-card {
      min-width: 0;
      min-height: 70px;
      border-radius: 11px;
      background: #faf2ed;
      padding: 5px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(224,207,198,.8);
    }

    .stock-visual {
      width: 27px;
      height: 29px;
      border-radius: 7px 7px 10px 10px;
      border: 2px solid rgba(93,67,56,.13);
      position: relative;
    }

    .stock-visual::before {
      content: "";
      position: absolute;
      width: 19px;
      height: 5px;
      border-radius: 50%;
      left: 2px;
      top: -4px;
      background: #f5e5dc;
      border: 1px solid rgba(93,67,56,.15);
    }

    .stock-name {
      width: 100%;
      text-align: center;
      font-size: 8px;
      font-weight: 900;
      color: #775b50;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stock-amount {
      font-size: 8px;
      color: #9c7c70;
      font-weight: 800;
    }

    .stock-button {
      width: 100%;
      height: 23px;
      border-radius: 7px;
      background: #e7b1bc;
      color: #fff;
      font-size: 7px;
      font-weight: 950;
    }

    .warehouse-bottom {
      margin-top: auto;
      flex: 0 0 auto;
      border-radius: 15px;
      padding: 8px;
      background: #fff9ef;
      border: 1px solid #f0dfc1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .warehouse-note {
      font-size: 8px;
      line-height: 1.4;
      color: #987858;
      font-weight: 800;
    }

    .warehouse-upgrade {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 10px;
      background: #d9a65e;
      color: #fff;
      font-size: 8px;
      font-weight: 950;
    }

    /* -------------------------------------------------------
       UPGRADE
    ------------------------------------------------------- */

    .upgrade-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .upgrade-card {
      min-height: 0;
      border-radius: 17px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-small);
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .upgrade-icon {
      width: 35px;
      height: 35px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: #f6e0dc;
      color: #b66e7d;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .upgrade-name {
      font-size: 11px;
      font-weight: 950;
      color: var(--brown-dark);
    }

    .upgrade-description {
      margin-top: 4px;
      color: #9a7d71;
      font-size: 8px;
      line-height: 1.4;
      font-weight: 700;
      flex: 1;
    }

    .upgrade-level {
      margin: 7px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 8px;
      font-weight: 900;
      color: #94776c;
    }

    .upgrade-button {
      min-height: 31px;
      border-radius: 9px;
      background: #684c40;
      color: #fff;
      font-size: 8px;
      font-weight: 950;
    }

    .employee-active {
      background: #e4efe7;
      color: #60816d;
    }

    /* -------------------------------------------------------
       PRICE
    ------------------------------------------------------- */

    .price-card {
      flex: 0 0 auto;
      border-radius: 18px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      padding: 11px;
      box-shadow: var(--shadow-small);
      margin-bottom: 7px;
    }

    .price-current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .price-current-label {
      color: #977a6d;
      font-size: 9px;
      font-weight: 800;
    }

    .price-current-value {
      font-size: 22px;
      color: var(--brown-dark);
      font-weight: 950;
    }

    .price-slider {
      width: 100%;
      accent-color: var(--pink-dark);
    }

    .price-options {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      overflow: hidden;
    }

    .price-option {
      border-radius: 17px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-small);
      padding: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .price-option strong {
      font-size: 12px;
      color: var(--brown-dark);
    }

    .price-option span {
      color: #9c7d71;
      font-size: 8px;
      line-height: 1.4;
      font-weight: 700;
    }

    .price-select {
      min-height: 31px;
      border-radius: 9px;
      background: #f3dce0;
      color: #9b5c6d;
      font-size: 8px;
      font-weight: 950;
    }

    /* -------------------------------------------------------
       REVIEWS
    ------------------------------------------------------- */

    .reviews-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reviews-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .review-card {
      border-radius: 16px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      padding: 8px;
      margin-bottom: 6px;
      box-shadow: var(--shadow-small);
    }

    .review-head {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .review-avatar {
      width: 37px;
      height: 37px;
      flex: 0 0 37px;
      border-radius: 12px;
      overflow: hidden;
      background: #f5dfda;
    }

    .review-info {
      flex: 1;
      min-width: 0;
    }

    .review-name {
      font-size: 10px;
      font-weight: 950;
      color: var(--brown-dark);
    }

    .review-day {
      margin-top: 1px;
      color: #a18478;
      font-size: 7px;
      font-weight: 700;
    }

    .stars {
      white-space: nowrap;
      font-size: 10px;
      letter-spacing: 0;
    }

    .gold-star {
      color: #d9aa4f;
    }

    .empty-star {
      color: #ddd5d0;
    }

    .review-text {
      margin: 7px 0;
      font-size: 9px;
      line-height: 1.45;
      color: #765a50;
      font-weight: 750;
    }

    .review-reply {
      margin: 5px 0 0 20px;
      padding: 6px 8px;
      border-left: 2px solid #e3a4b1;
      border-radius: 0 9px 9px 0;
      background: #fbefed;
      color: #8d665c;
      font-size: 8px;
      line-height: 1.4;
      font-weight: 750;
    }

    .reply-suggestions {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .reply-suggestion {
      flex: 0 0 auto;
      min-height: 25px;
      padding: 0 7px;
      border-radius: 8px;
      background: #f1e6e1;
      color: #80665c;
      font-size: 7px;
      font-weight: 800;
    }

    .reply-row {
      display: flex;
      gap: 5px;
    }

    .reply-input {
      min-width: 0;
      flex: 1;
      height: 31px;
      border: 1px solid #e6d6cf;
      background: #fff;
      border-radius: 9px;
      padding: 0 8px;
      font-size: 8px;
      color: var(--brown-dark);
    }

    .reply-send {
      width: 45px;
      height: 31px;
      border-radius: 9px;
      background: var(--brown-dark);
      color: #fff;
      font-size: 8px;
      font-weight: 950;
    }

    .anonymous-avatar {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: #171514;
      color: #eee;
      font-size: 15px;
      font-weight: 900;
    }

    .empty-reviews {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      color: #a18478;
      font-size: 10px;
      font-weight: 800;
    }

    /* -------------------------------------------------------
       SUMMARY
    ------------------------------------------------------- */

    .summary-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .summary-hero {
      border-radius: 20px;
      background: #684c40;
      color: #fff;
      padding: 14px;
      margin-bottom: 7px;
      box-shadow: var(--shadow);
    }

    .summary-hero small {
      display: block;
      color: #eadbd4;
      font-size: 9px;
      font-weight: 800;
    }

    .summary-profit {
      margin-top: 3px;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -.8px;
    }

    .summary-profit.negative {
      color: #ffc2c2;
    }

    .summary-periods {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 7px;
    }

    .summary-period {
      min-height: 42px;
      border-radius: 11px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .summary-period strong {
      font-size: 10px;
      color: var(--brown-dark);
    }

    .summary-period span {
      font-size: 7px;
      color: #9d7f73;
      font-weight: 800;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 7px;
    }

    .stat-card {
      min-height: 67px;
      border-radius: 15px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      padding: 9px;
    }

    .stat-label {
      color: #9d8074;
      font-size: 8px;
      font-weight: 800;
    }

    .stat-value {
      margin-top: 4px;
      color: var(--brown-dark);
      font-size: 17px;
      font-weight: 950;
    }

    .sales-card {
      border-radius: 16px;
      background: rgba(255,253,250,.94);
      border: 1px solid var(--line);
      padding: 9px;
    }

    .sales-title {
      font-size: 10px;
      font-weight: 950;
      color: var(--brown-dark);
      margin-bottom: 7px;
    }

    .sales-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }

    .sales-row:last-child {
      margin-bottom: 0;
    }

    .sales-name {
      width: 70px;
      font-size: 8px;
      font-weight: 800;
      color: #85685d;
    }

    .sales-track {
      flex: 1;
      height: 6px;
      border-radius: 5px;
      background: #eee2dc;
      overflow: hidden;
    }

    .sales-fill {
      height: 100%;
      background: #e4a9b5;
      border-radius: inherit;
    }

    .sales-number {
      width: 22px;
      text-align: right;
      font-size: 8px;
      font-weight: 900;
      color: #8c6d62;
    }

    /* -------------------------------------------------------
       NAV
    ------------------------------------------------------- */

    .bottom-nav {
      flex: 0 0 auto;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding:
        7px
        7px
        calc(7px + var(--safe-bottom));
      background: rgba(255,251,247,.97);
      border-top: 1px solid rgba(220,198,188,.72);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      z-index: 30;
    }

    .nav-button {
      min-width: 0;
      border-radius: 15px;
      background: transparent;
      color: #a18478;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }

    .nav-button.active {
      background: #f4dce0;
      color: #a45f70;
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      font-size: 17px;
      line-height: 1;
    }

    .nav-label {
      font-size: 7px;
      font-weight: 950;
      white-space: nowrap;
    }

    /* -------------------------------------------------------
       MODALS
    ------------------------------------------------------- */

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(71,51,44,.36);
      backdrop-filter: blur(4px);
    }

    .modal-layer.visible {
      display: flex;
      animation: fadeIn .15s ease-out;
    }

    .modal-card {
      width: min(100%, 370px);
      max-height: 88vh;
      overflow: hidden;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function money(value) {
      const rounded = Math.round(Number(value) || 0);

      if (rounded >= 1000000) {
        const millions = rounded / 1000000;
        return millions.toFixed(millions % 1 === 0 ? 0 : 1) + "tr";
      }

      if (rounded >= 1000) {
        const thousands = rounded / 1000;
        return thousands.toFixed(thousands % 1 === 0 ? 0 : 1) + "k";
      }

      return rounded.toLocaleString("vi-VN") + "đ";
    }

    function moneyFull(value) {
      return Math.round(Number(value) || 0).toLocaleString("vi-VN") + "đ";
    }

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function dayTarget() {
      return DAY_TARGET_BASE + (state.day - 1) * 10;
    }

    function pricePerOrder() {
      const prices = [10000, 15000, 25000, 50000, 70000, 90000];
      return prices[clamp(state.upgrades.price, 0, prices.length - 1)];
    }

    function warehouseCapacity() {
      return 12 + state.upgrades.warehouse * 6;
    }

    function staffActive() {
      return state.upgrades.employee > 0;
    }

    function staffWage() {
      return 45000 + Math.max(0, state.upgrades.employee - 1) * 10000;
    }

    function getRatingAverage() {
      if (!state.reviews.length) {
        return 0;
      }

      const total = state.reviews.reduce(function(sum, review) {
        return sum + Number(review.rating || 0);
      }, 0);

      return total / state.reviews.length;
    }

    function getRatingText() {
      if (!state.reviews.length) {
        return "Chưa có";
      }

      return getRatingAverage().toFixed(1);
    }

    function getCurrentDateLabel(day) {
      return "Ngày " + (Number.isFinite(Number(day)) ? Number(day) : 1);
    }

    function formatClock(minutes) {
      const safeMinutes = clamp(Math.floor(minutes), OPEN_MINUTE, CLOSE_MINUTE);
      const hours = Math.floor(safeMinutes / 60);
      const mins = safeMinutes % 60;

      return (
        String(hours).padStart(2, "0") +
        ":" +
        String(mins).padStart(2, "0")
      );
    }

    function saveState() {
      try {
        const copy = JSON.parse(JSON.stringify(state));

        copy.isOpen = false;
        copy.activeCustomer = null;
        copy.customerTimerId = null;
        copy.clockTimerId = null;
        copy.dayStartReal = null;
        copy.chat = {
          open: false,
          messages: []
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
      } catch (error) {
        console.warn("Không thể lưu dữ liệu:", error);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return false;
        }

        const parsed = JSON.parse(saved);

        if (!parsed || typeof parsed !== "object") {
          return false;
        }

        const fresh = createDefaultState();

        Object.assign(state, fresh, parsed);

        state.isOpen = false;
        state.activeCustomer = null;
        state.customerTimerId = null;
        state.clockTimerId = null;
        state.dayStartReal = null;
        state.endHandled = false;

        if (!state.inventory) {
          state.inventory = fresh.inventory;
        }

        if (!state.purchased) {
          state.purchased = fresh.purchased;
        }

        if (!state.upgrades) {
          state.upgrades = fresh.upgrades;
        }

        if (!Array.isArray(state.reviews)) {
          state.reviews = [];
        }

        if (!Array.isArray(state.dailyHistory)) {
          state.dailyHistory = [];
        }

        if (!state.build) {
          state.build = fresh.build;
        }

        state.build = {
          base: null,
          flavors: [],
          topping: null
        };

        if (!state.shopName) {
          return false;
        }

        return true;
      } catch (error) {
        console.warn("Không thể đọc dữ liệu:", error);
        return false;
      }
    }

      const loaded = loadState();

      if (!loaded) {
        Object.assign(state, createDefaultState());
      }

      if (!state.shopName) {
        renderWelcome();
        return;
      }

      state.isOpen = false;
      state.activeCustomer = null;
      state.currentScreen = "shop";

      renderGame();
      saveState();
    }

    function scheduleRender() {
      if (renderScheduled) {
        return;
      }

      renderScheduled = true;

      requestAnimationFrame(function() {
        renderScheduled = false;
        renderGame();

            <div class="welcome-form">
              <input
                id="welcomeShopName"
                class="shop-name-input"
                maxlength="28"
                autocomplete="off"

    /* =========================================================
       MAIN RENDER
       ========================================================= */

    function renderGame() {
      const app = document.getElementById("app");

      app.innerHTML = `
        <div class="game-shell">
          <main class="game-main">
            ${renderHeader()}

            <section class="content-area">
              ${renderShopScreen()}
              ${renderWarehouseScreen()}
              ${renderUpgradeScreen()}
              ${renderPriceScreen()}
              ${renderReviewScreen()}
              ${renderSummaryScreen()}
            </section>

            ${renderBottomNav()}
          </main>

          <div id="modalLayer" class="modal-layer"></div>
          <div id="toastContainer" class="toast-container"></div>
        </div>
      `;

      updateActiveScreen();
    }

    function renderHeader() {
      const statusText = state.isOpen ? "Đang mở cửa" : "Chuẩn bị";
      const statusClass = state.isOpen ? "open" : "";

      return `
        <header class="top-header">
          <div class="header-main">

            <div class="day-info">
              <div class="day-line">
                <span class="day-number">Ngày ${state.day}</span>
                <span class="status-pill ${statusClass}">
                  ${statusText}
                </span>
              </div>

              <div class="shop-title-row">
                <div class="shop-title">
                  ${escapeHtml(state.shopName)}
                </div>

                <button
                  type="button"
                  class="edit-shop"
                  data-action="open-rename"
                  aria-label="Đổi tên tiệm"
                >
                  <svg viewBox="0 0 24 24" fill="none">
                    <path
                      d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linejoin="round"
                    />
                    <path
                      d="m13.5 6.5 4 4"
                      stroke="currentColor"
                      stroke-width="2"
                    />
                  </svg>
                </button>
              </div>

              <div class="rating-summary">
                <span class="star">★</span>
                <span>${getRatingText()}</span>
                <span>·</span>
                <span>${state.reviews.length} đánh giá</span>
              </div>
            </div>

            <div class="money-box">
              <span class="money-icon">đ</span>
              <span>${money(state.cash)}</span>
            </div>

          </div>
        </header>
      `;
    }

    function renderBottomNav() {
      const tabs = [
        {
          id: "shop",
          label: "Tiệm",
          icon: "🏪"
        },
        {
          id: "warehouse",
          label: "Kho",
          icon: "📦"
        },
        {
          id: "upgrade",
          label: "Nâng cấp",
          icon: "⬆"
        },
        {
          id: "price",
          label: "Giá bán",
          icon: "🏷"
        },
        {
          id: "reviews",
          label: "Đánh giá",
          icon: "★"
        }
      ];

      return `
        <nav class="bottom-nav" aria-label="Điều hướng">
          ${tabs.map(function(tab) {
            const active = state.currentScreen === tab.id ? "active" : "";

            return `
              <button
                type="button"
                class="nav-button ${active}"
                data-action="navigate"
                data-screen="${tab.id}"
              >
                <span class="nav-icon">${tab.icon}</span>
                <span class="nav-label">${tab.label}</span>
              </button>
            `;
          }).join("")}
        </nav>
      `;
    }

    function updateActiveScreen() {
      const screens = document.querySelectorAll(".screen");

      screens.forEach(function(screen) {
        screen.classList.toggle(
          "active",
          screen.dataset.screen === state.currentScreen
        );
      });

      const buttons = document.querySelectorAll(".nav-button");

      buttons.forEach(function(button) {
        button.classList.toggle(
          "active",
          button.dataset.screen === state.currentScreen
        );
      });
    }

    /* =========================================================
       SHOP SCREEN
       ========================================================= */

    function renderShopScreen() {
      return `
        <section
          class="screen shop-screen"
          data-screen="shop"
        >
          ${renderShopFront()}

          ${
            state.isOpen
              ? renderOpenWorkspace()
              : renderClosedWorkspace()
          }
        </section>
      `;
    }

    function renderShopFront() {
      const jarItems = Object.keys(FLAVORS);

      return `
        <div class="shop-front">
          <div class="awning"></div>

          <div class="shop-sign">
            <div class="shop-sign-name">
              ${escapeHtml(state.shopName)}
            </div>
            <div class="shop-sign-sub">
              ICE CREAM & SWEETS
            </div>
          </div>

          <div class="ingredient-row">
            ${jarItems.map(function(key) {
              const item = FLAVORS[key];

              return `
                <div class="mini-jar">
                  <div
                    class="jar-fill"
                    style="background:${item.color}"
                  ></div>
                  <div class="jar-label">
                    ${escapeHtml(item.name)}
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="cat-zone">
            <div class="cat-cushion"></div>

            <div class="cat-body">
              <div class="cat-tail"></div>
            </div>

            <div class="cat-head">
              <div class="cat-ear left">
                <div class="cat-ear-inner left"></div>
              </div>

              <div class="cat-ear right">
                <div class="cat-ear-inner right"></div>
              </div>

              <div class="cat-eye left"></div>
              <div class="cat-eye right"></div>
              <div class="cat-cheek left"></div>
              <div class="cat-cheek right"></div>
              <div class="cat-nose"></div>
              <div class="cat-mouth"></div>
            </div>

            <span class="cat-z z1">Zzz</span>
            <span class="cat-z z2">z</span>
            <span class="cat-z z3">z</span>
          </div>

          <div class="front-lights">
            <span class="front-light"></span>
            <span class="front-light"></span>
            <span class="front-light"></span>
          </div>

          <div class="counter-top"></div>
        </div>
      `;
    }

    function renderClosedWorkspace() {
      return `
        <div class="closed-card">
          <div class="closed-inner">
            <div class="closed-illustration">
              <div class="closed-cup"></div>
              <div class="closed-sign">CLOSED</div>
            </div>

            <h2 class="closed-title">
              Tiệm đang đóng cửa
            </h2>

            <p class="closed-text">
              Hãy nhập sỉ nguyên liệu trong Kho trước khi mở bán.
              Ngày ${state.day}: mục tiêu ${dayTarget()} khách được phục vụ.
            </p>

            <button
              type="button"
              class="primary-button"
              data-action="open-shop"
            >
              Mở Cửa
            </button>
          </div>
        </div>
      `;
    }

    function renderOpenWorkspace() {
      if (!state.activeCustomer) {
        return `
          <div class="open-workspace">
            <div class="customer-card">
              <div class="customer-avatar">
                ${femaleAvatarSvg()}
              </div>

              <div class="customer-middle">
                <div class="customer-name-line">
                  <span class="customer-name">Đang tìm khách mới</span>
                </div>

                <div class="order-bubble">
                  Tiệm đang chuẩn bị đón vị khách tiếp theo.
                  Bạn có thể kiểm tra kho trong lúc chờ.
                </div>
              </div>

              <div class="patience-box">
                <div
                  class="patience-ring"
                  style="--patience:100%"
                >
                  <div class="patience-inner">♡</div>
                </div>
              </div>
            </div>

            ${renderBuilder()}

            ${renderOpenFooter()}
          </div>
        `;
      }

      return `
        <div class="open-workspace">
          ${renderCustomerCard()}
          ${renderBuilder()}
          ${renderOpenFooter()}
        </div>
      `;
    }

    function renderCustomerCard() {
      const customer = state.activeCustomer;

      if (!customer) {
        return "";
      }

      const now = Date.now();
      const elapsed = now - customer.createdAt;
      const patience = clamp(
        1 - elapsed / CUSTOMER_PATIENCE_MS,
        0,
        1
      );

      const patiencePercent = Math.round(patience * 100);
      const warning = patience <= .35 ? "warning" : "";

      return `
        <div class="customer-card">
          <div class="customer-avatar">
            ${
              customer.gender === "male"
                ? maleAvatarSvg()
                : femaleAvatarSvg()
            }
          </div>

          <div class="customer-middle">
            <div class="customer-name-line">
              <span class="customer-name">
                ${escapeHtml(customer.name)}
              </span>

              <span class="gender-label">
                ${customer.gender === "male" ? "Nam" : "Nữ"}
              </span>
            </div>

            <div class="order-bubble">
              ${escapeHtml(customer.order.text)}
            </div>
          </div>

          <div class="patience-box">
            <div
              class="patience-ring ${warning}"
              style="--patience:${patiencePercent}%"
            >
              <div class="patience-inner">
                ${patiencePercent}%
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBuilder() {
      const build = state.build;

      let activeStep = 1;

      if (build.base) {
        activeStep = 2;
      }

      if (build.base && build.flavors.length > 0) {
        activeStep = 3;
      }

      const step1Done = Boolean(build.base);
      const step2Done = build.flavors.length > 0;
      const step3Done = Boolean(build.topping);

      return `
        <div class="step-panel">
          <div class="step-tabs">
            <div class="step-tab ${activeStep === 1 ? "active" : ""} ${step1Done ? "done" : ""}">
              ① Đế
            </div>

            <div class="step-tab ${activeStep === 2 ? "active" : ""} ${step2Done ? "done" : ""}">
              ② Kem
            </div>

            <div class="step-tab ${activeStep === 3 ? "active" : ""} ${step3Done ? "done" : ""}">
              ③ Topping
            </div>
          </div>

          <div class="builder-content">
            ${renderDessertPreview()}
            ${renderBuilderOptions(activeStep)}
          </div>

          <div class="builder-footer">
            <button
              type="button"
              class="secondary-button"
              data-action="reset-build"
            >
              LÀM LẠI
            </button>

            <button
              type="button"
              class="danger-button"
              data-action="serve-order"
              ${state.activeCustomer ? "" : "disabled"}
            >
              GIAO KEM
            </button>
          </div>
        </div>
      `;
    }

    function renderDessertPreview() {
      const build = state.build;

      const scoops = build.flavors.map(function(flavorKey, index) {
        const flavor = FLAVORS[flavorKey];

        return `
          <div
            class="preview-scoop scoop-${index + 1}"
            style="background:${flavor.color}"
            title="${escapeHtml(flavor.name)}"
          ></div>
        `;
      }).join("");

      let toppingEmoji = "";

      if (build.topping && TOPPINGS[build.topping]) {
        toppingEmoji = TOPPINGS[build.topping].emoji;
      }

      return `
        <div class="dessert-preview">
          <div class="dessert-stage">

            <div
              class="dessert-base ${build.base || ""} ${build.base ? "visible" : ""}"
            ></div>

            ${scoops}

            <div class="preview-topping ${build.topping ? "visible" : ""}">
              ${toppingEmoji}
            </div>

            ${
              !build.base
                ? `
                  <div class="preview-placeholder">
                    Chọn ốc quế hoặc ly<br>
                    để bắt đầu làm kem
                  </div>
                `
                : ""
            }
          </div>
        </div>
      `;
    }

    function renderBuilderOptions(activeStep) {
      if (activeStep === 1) {
        return `
          <div class="builder-options">
            <div class="option-heading">
              Bước 1 · Chọn ốc quế hoặc ly
            </div>

            <div class="option-grid">
              ${Object.keys(BASES).map(function(key) {
                const item = BASES[key];
                const stock = state.inventory.bases[key];

                return `
                  <button
                    type="button"
                    class="choice-button ${state.build.base === key ? "selected" : ""} ${stock <= 0 ? "empty" : ""}"
                    data-action="choose-base"
                    data-key="${key}"
                    ${stock <= 0 ? "disabled" : ""}
                  >
                    <span
                      class="choice-icon"
                      style="background:${key === "cone" ? "#dfa15e" : "#fff;border:2px solid #dfc8bd"}"
                    ></span>
                    <span>${escapeHtml(item.name)}</span>
                    <span class="choice-stock">${stock}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      if (activeStep === 2) {
        return `
          <div class="builder-options">
            <div class="option-heading">
              Bước 2 · Chọn kem · ${state.build.flavors.length}/3 viên
            </div>

            <div class="option-grid">
              ${Object.keys(FLAVORS).map(function(key) {
                const item = FLAVORS[key];
                const stock = state.inventory.flavors[key];
                const selectedCount = state.build.flavors.filter(function(value) {
                  return value === key;
                }).length;

                return `
                  <button
                    type="button"
                    class="choice-button ${
                      selectedCount > 0 ? "selected" : ""
                    } ${stock <= 0 ? "empty" : ""}"
                    data-action="choose-flavor"
                    data-key="${key}"
                    ${stock <= 0 || state.build.flavors.length >= 3 ? "disabled" : ""}
                  >
                    <span
                      class="choice-icon"
                      style="background:${item.color}"
                    ></span>

                    <span>${escapeHtml(item.name)}</span>

                    <span class="choice-stock">
                      ${stock}
                    </span>

                    ${
                      selectedCount > 0
                        ? `
                          <span
                            style="
                              position:absolute;
                              left:3px;
                              bottom:3px;
                              min-width:13px;
                              height:13px;
                              border-radius:7px;
                              background:#684c40;
                              color:#fff;
                              display:grid;
                              place-items:center;
                              font-size:7px;
                            "
                          >
                            ${selectedCount}
                          </span>
                        `
                        : ""
                    }
                  </button>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      return `
        <div class="builder-options">
          <div class="option-heading">
            Bước 3 · Thêm topping
          </div>

          <div class="option-grid">
            <button
              type="button"
              class="choice-button ${!state.build.topping ? "selected" : ""}"
              data-action="choose-topping"
              data-key=""
            >
              <span class="choice-icon" style="background:#fff;border:1px solid #e0d0c8"></span>
              <span>Không có</span>
            </button>

            ${Object.keys(TOPPINGS).map(function(key) {
              const item = TOPPINGS[key];
              const stock = state.inventory.toppings[key];

              return `
                <button
                  type="button"
                  class="choice-button ${state.build.topping === key ? "selected" : ""} ${stock <= 0 ? "empty" : ""}"
                  data-action="choose-topping"
                  data-key="${key}"
                  ${stock <= 0 ? "disabled" : ""}
                >
                  <span class="choice-icon" style="background:#fff">${item.emoji}</span>
                  <span>${escapeHtml(item.name)}</span>
                  <span class="choice-stock">${stock}</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderOpenFooter() {
      const progress = clamp(
        state.served / dayTarget(),
        0,
        1
      ) * 100;

      return `
        <div class="open-footer">
          <div class="daily-progress">
            <span class="progress-label">
              ${state.served}/${dayTarget()}
            </span>

            <div class="progress-track">
              <div
                class="progress-fill"
                style="width:${progress}%"
              ></div>
            </div>

            <span class="progress-label">
              ${formatClock(state.minutes)}
            </span>
          </div>

          <button
            type="button"
            class="close-shop-button"
            data-action="close-shop"
          >
            Đóng ca
          </button>
        </div>
      `;
    }

    /* =========================================================
       WAREHOUSE
       ========================================================= */

    function renderWarehouseScreen() {
      return `
        <section
          class="screen"
          data-screen="warehouse"
        >
          <div class="panel-title-row">
            <div>
              <h2 class="panel-title">Kho Hàng</h2>

              <button

    function renderFlavorStockCard(key) {
      const item = FLAVORS[key];
      const stock = state.inventory.flavors[key];
      const cost = item.cost;

      return `
        <div class="stock-card">
          <div
            class="stock-visual"
            style="background:${item.color}"

          >
            +6 · ${money(cost)}
          </button>
        </div>
      `;
    }

    function renderBaseStockCard(key) {
      const item = BASES[key];
      const stock = state.inventory.bases[key];
      const cost = item.cost;

      return `
        <div class="stock-card">
          <div
            class="stock-visual"
            style="
              background:${
                key === "cone"
                  ? "linear-gradient(180deg,#e9b86f,#c98346)"

          ></div>

          <div class="stock-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="stock-amount">
            ${stock} cái
          </div>

          <button
            type="button"
            class="stock-button"
            data-action="buy-stock"
            data-category="bases"
            data-key="${key}"
            ${state.cash < cost ? "disabled" : ""}
          >
            +8 · ${money(cost)}
          </button>
        </div>
      `;
    }

    function renderToppingStockCard(key) {
      const item = TOPPINGS[key];
      const stock = state.inventory.toppings[key];
      const cost = item.cost;

      return `
        <div class="stock-card">
          <div
            class="stock-visual"
            style="
              background:#fff;
              display:grid;
              place-items:center;
              font-size:13px;
            "
          >
            ${item.emoji}
          </div>

          <div class="stock-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="stock-amount">
            ${stock} cái
          </div>

          <button
            type="button"
            class="stock-button"
            data-action="buy-stock"
            data-category="toppings"
            data-key="${key}"
            ${state.cash < cost ? "disabled" : ""}
          >
            +8 · ${money(cost)}
          </button>
        </div>
      `;
    }

    function warehouseUpgradeCost() {
      return 110000 + state.upgrades.warehouse * 85000;
    }

    /* =========================================================
       UPGRADES
       ========================================================= */

    function renderUpgradeScreen() {
      const upgrades = [
        {
          key: "warehouse",
          icon: "📦",
          name: "Kho rộng hơn",
          description: "Tăng sức chứa kho thêm 6 đơn vị mỗi cấp.",
          level: state.upgrades.warehouse,
          cost: warehouseUpgradeCost(),
          action: "upgrade-warehouse"
        },
        {
          key: "scoopSpeed",
          icon: "🍨",
          name: "Pha kem nhanh",
          description: "Rút ngắn thời gian thao tác pha kem thủ công.",
          level: state.upgrades.scoopSpeed,
          cost: 130000 + state.upgrades.scoopSpeed * 100000,
          action: "upgrade-scoop"
        },
        {
          key: "price",
          icon: "🏷",
          name: "Giá bán",
          description: "Tăng doanh thu nhận được cho mỗi đơn phục vụ thành công.",
          level: state.upgrades.price,
          cost: 150000 + state.upgrades.price * 125000,
          action: "upgrade-price"
        },
        {
          key: "employee",
          icon: "🧑‍🍳",
          name: "Nhân viên pha chế",
          description: staffActive()
            ? "Nhân viên tự chọn đúng vị và topping. Bạn chỉ cần chọn đế."
            : "Thuê nhân viên có thể tự pha đúng phần kem khách gọi.",
          level: state.upgrades.employee,
          cost: staffActive()
            ? 180000 + state.upgrades.employee * 140000
            : 150000,
          action: "upgrade-employee"
        }
      ];

      return `
        <section
          class="screen"
          data-screen="upgrade"
        >
          <div class="panel-title-row">
            <div>
              <h2 class="panel-title">Nâng Cấp</h2>
              <p class="panel-subtitle">
                Đầu tư để tiệm vận hành hiệu quả hơn
              </p>
            </div>
          </div>

          <div class="upgrade-list">
            ${upgrades.map(function(item) {

       REVIEWS
       ========================================================= */

    function renderReviewScreen() {
      return `
        <section
          class="screen"
          data-screen="reviews"
        >
          <div class="panel-title-row">
            <div>
              <h2 class="panel-title">Đánh Giá & Phản Hồi</h2>
              <p class="panel-subtitle">
                ${getRatingText()} sao · ${state.reviews.length} đánh giá

            </div>
          </div>

          <div class="reviews-list">
            ${
              state.reviews.length
                ? `
                  <div class="reviews-scroll">
                    ${state.reviews.map(renderReviewCard).join("")}
