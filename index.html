<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff3f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Tiệm Bán Kem Ngọt Ngào</title>

  <style>
    :root {
      --pink-50: #fff8fa;
      --pink-100: #fff0f4;
      --pink-200: #ffdce6;
      --pink-300: #ffc3d2;
      --pink-400: #f59ab0;
      --pink-500: #e97996;
      --pink-600: #cf5d7c;

      --cream: #fffaf1;
      --cream-2: #fff3dc;
      --vanilla: #fff7c9;
      --brown: #8b5e4a;
      --brown-dark: #5e3e34;
      --oak: #b87952;
      --oak-light: #d99b71;

      --mint: #ccefe1;
      --mint-dark: #5f9d88;

      --blue: #cfe8ff;
      --blue-dark: #6798c7;

      --purple: #e7d8ff;
      --purple-dark: #8767b4;

      --gold: #f2bd45;
      --gold-soft: #fff0b7;

      --red: #df7180;
      --green: #5aa884;

      --ink: #543e43;
      --muted: #987d84;

      --shadow-soft:
        0 12px 30px rgba(122, 75, 91, 0.09),
        0 3px 9px rgba(122, 75, 91, 0.06);

      --shadow-card:
        0 10px 24px rgba(122, 75, 91, 0.10),
        0 2px 6px rgba(122, 75, 91, 0.06);

      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 17px;
      --radius-sm: 13px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.95), transparent 30%),
        linear-gradient(145deg, #fff7f9, #fffdf7 55%, #f8f3ff);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    input {
      outline: none;
    }

    #app {
      width: 100%;
      min-height: 100dvh;
    }

    .game-shell {
      width: min(100%, 540px);
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          #fff9fb 0%,
          #fffdf9 48%,
          #fff8f3 100%
        );
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100dvh;
      animation: screenIn .35s ease both;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-screen {
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background:
        linear-gradient(
          180deg,
          #fff7fa 0%,
          #fffdf9 55%,
          #f8f2ff 100%
        );
    }

    .welcome-cloud {
      position: absolute;
      width: 125px;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      filter: blur(.2px);
      box-shadow: 0 8px 20px rgba(144,117,131,.06);
      animation: cloudMove 15s linear infinite;
    }

    .welcome-cloud::before,
    .welcome-cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .welcome-cloud::before {
      width: 53px;
      height: 53px;
      left: 20px;
      bottom: 5px;
    }

    .welcome-cloud::after {
      width: 40px;
      height: 40px;
      right: 19px;
      bottom: 4px;
    }

    .cloud-1 {
      top: 12%;
      left: -140px;
    }

    .cloud-2 {
      top: 25%;
      right: -145px;
      width: 105px;
      animation-delay: -7s;
      animation-duration: 19s;
    }

    .cloud-3 {
      top: 67%;
      left: -120px;
      width: 90px;
      opacity: .55;
      animation-delay: -11s;
      animation-duration: 21s;
    }

    @keyframes cloudMove {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(100vw + 300px));
      }
    }

    .float-pearl {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(244,179,197,.48);
      box-shadow:
        0 2px 6px rgba(212,129,153,.15),
        inset 2px 2px 4px rgba(255,255,255,.9);
      animation: floatPearl 4s ease-in-out infinite;
    }

    .pearl-1 {
      left: 14%;
      top: 20%;
    }

    .pearl-2 {
      right: 17%;
      top: 34%;
      width: 7px;
      height: 7px;
      animation-delay: -1.2s;
    }

    .pearl-3 {
      left: 22%;
      bottom: 20%;
      width: 8px;
      height: 8px;
      animation-delay: -2.1s;
    }

    .pearl-4 {
      right: 12%;
      bottom: 15%;
      width: 12px;
      height: 12px;
      animation-delay: -.6s;
    }

    @keyframes floatPearl {
      0%, 100% {
        transform: translateY(0) rotate(0);
      }
      50% {
        transform: translateY(-13px) rotate(12deg);
      }
    }

    .welcome-card {
      width: min(100%, 410px);
      position: relative;
      z-index: 3;
      padding: 38px 26px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 34px;
      background: rgba(255,255,255,.79);
      backdrop-filter: blur(16px);
      box-shadow:
        0 25px 70px rgba(120,75,93,.11),
        0 3px 10px rgba(120,75,93,.05);
    }

    .welcome-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 19px;
      position: relative;
      border-radius: 22px;
      background: linear-gradient(145deg, #ffe1ea, #fff2d9);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 10px 25px rgba(221,126,151,.12);
      display: grid;
      place-items: center;
    }

    .welcome-mark::before {
      content: "";
      width: 30px;
      height: 30px;
      border: 3px solid #e99aae;
      border-radius: 50%;
      border-bottom-color: transparent;
      transform: rotate(-35deg);
    }

    .welcome-mark::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: #e99aae;
      bottom: 16px;
      left: 23px;
      transform: rotate(-9deg);
    }

    .welcome-kicker {
      margin-bottom: 8px;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--pink-500);
      font-weight: 800;
    }

    .welcome-title {
      margin: 0;
      font-size: clamp(28px, 8vw, 38px);
      line-height: 1.08;
      letter-spacing: -.045em;
      color: var(--brown-dark);
    }

    .welcome-subtitle {
      margin: 13px auto 26px;
      max-width: 310px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .name-label {
      display: block;
      text-align: left;
      margin: 0 0 8px 5px;
      font-size: 12px;
      color: var(--brown);
      font-weight: 800;
    }

    .shop-name-input {
      width: 100%;
      height: 54px;
      border: 1px solid #f2dbe1;
      border-radius: 17px;
      padding: 0 17px;
      background: rgba(255,255,255,.95);
      color: var(--ink);
      box-shadow: inset 0 1px 3px rgba(109,65,80,.04);
      transition: .2s ease;
    }

    .shop-name-input:focus {
      border-color: var(--pink-300);
      box-shadow:
        0 0 0 4px rgba(245,154,176,.11),
        inset 0 1px 3px rgba(109,65,80,.04);
    }

    .primary-button {
      width: 100%;
      min-height: 54px;
      border-radius: 17px;
      color: #fff;
      font-weight: 900;
      letter-spacing: .01em;
      background: linear-gradient(135deg, #e985a0, #d96e8c);
      box-shadow:
        0 9px 18px rgba(211,103,135,.22),
        inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .primary-button:active:not(:disabled) {
      transform: translateY(2px) scale(.99);
      box-shadow:
        0 4px 10px rgba(211,103,135,.18);
    }

    .welcome-button {
      margin-top: 13px;
    }

    .welcome-note {
      margin-top: 16px;
      font-size: 11px;
      color: #ad949b;
      line-height: 1.5;
    }

    .game-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding:
        calc(10px + env(safe-area-inset-top))
        13px
        10px;
      background: rgba(255,250,251,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(236,213,220,.75);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-block {
      min-width: 0;
    }

    .brand-mini {
      font-size: 9px;
      letter-spacing: .16em;
      color: var(--pink-500);
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .shop-sign {
      margin: 0;
      max-width: 245px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 18px;
      letter-spacing: -.025em;
      color: var(--brown-dark);
    }

    .wallet {
      flex-shrink: 0;
      min-width: 105px;
      padding: 8px 11px;
      text-align: right;
      border-radius: 15px;
      background: #fff;
      border: 1px solid #f1dce1;
      box-shadow: 0 4px 13px rgba(105,71,82,.06);
    }

    .wallet-label {
      font-size: 8px;
      color: #b2979d;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .wallet-value {
      font-size: 14px;
      color: var(--brown-dark);
      font-weight: 900;
      margin-top: 1px;
    }

    .day-strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      margin-top: 10px;
    }

    .day-pill {
      min-height: 34px;
      border-radius: 11px;
      background: #fff;
      border: 1px solid #f2e1e5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #8d747b;
      font-size: 10px;
      font-weight: 800;
    }

    .day-pill strong {
      color: var(--brown-dark);
      font-size: 11px;
    }

    .nav-tabs {
      position: sticky;
      top: 99px;
      z-index: 25;
      padding: 9px 10px;
      background: rgba(255,250,251,.93);
      backdrop-filter: blur(13px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border-bottom: 1px solid rgba(239,220,225,.75);
    }

    .tab-button {
      min-width: 0;
      min-height: 42px;
      padding: 5px 3px;
      border-radius: 13px;
      background: #fff;
      color: #987f85;
      border: 1px solid #f1e0e4;
      font-size: 9px;
      line-height: 1.15;
      font-weight: 900;
      transition: .18s ease;
    }

    .tab-icon {
      display: block;
      font-size: 15px;
      line-height: 1;
      margin-bottom: 3px;
    }

    .tab-button.active {
      color: #b84f6d;
      background: #fff0f4;
      border-color: #f6c8d4;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.65);
    }

    .content {
      flex: 1;
      padding: 13px 12px 30px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 3px 3px 10px;
    }

    .section-title h2 {
      margin: 0;
      color: var(--brown-dark);
      font-size: 18px;
      letter-spacing: -.025em;
    }

    .section-title small {
      color: #ad949a;
      font-size: 10px;
      line-height: 1.3;
      text-align: right;
    }

    .status-card {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #f1e0e5;
      box-shadow: var(--shadow-soft);
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #bbb;
      box-shadow: 0 0 0 4px rgba(187,187,187,.12);
    }

    .status-dot.open {
      background: #63b88c;
      box-shadow: 0 0 0 4px rgba(99,184,140,.14);
    }

    .status-dot.closed {
      background: #db8492;
      box-shadow: 0 0 0 4px rgba(219,132,146,.12);
    }

    .status-main {
      font-weight: 900;
      font-size: 12px;
      color: var(--brown-dark);
    }

    .status-clock {
      font-size: 19px;
      font-weight: 950;
      letter-spacing: -.04em;
      color: var(--pink-600);
    }

    .status-help {
      margin-top: 7px;
      color: #a68e94;
      font-size: 10px;
      line-height: 1.5;
    }

    .shop-scene {
      overflow: hidden;
      position: relative;
      min-height: 318px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, #fff7ef 0%, #fffaf4 60%, #f7eadf 60%, #f4e2d5 100%);
      border: 1px solid #eeddd3;
      box-shadow: var(--shadow-card);
    }

    .scene-wall {
      position: absolute;
      inset: 0 0 auto;
      height: 64%;
      background:
        radial-gradient(circle at 17% 19%, rgba(255,255,255,.9) 0 3px, transparent 4px),
        radial-gradient(circle at 74% 24%, rgba(255,255,255,.85) 0 3px, transparent 4px),
        linear-gradient(180deg, #fff8f5, #fff5ef);
    }

    .mini-cloud {
      position: absolute;
      width: 55px;
      height: 17px;
      border-radius: 20px;
      background: rgba(255,255,255,.8);
    }

    .mini-cloud::before,
    .mini-cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .mini-cloud::before {
      width: 24px;
      height: 24px;
      left: 8px;
      bottom: 2px;
    }

    .mini-cloud::after {
      width: 18px;
      height: 18px;
      right: 9px;
      bottom: 2px;
    }

    .mini-cloud.a {
      top: 29px;
      left: 25px;
    }

    .mini-cloud.b {
      top: 44px;
      right: 31px;
      transform: scale(.75);
    }

    .hanging-lantern {
      position: absolute;
      top: 11px;
      width: 11px;
      height: 25px;
      border-radius: 7px 7px 9px 9px;
      background: #f4bdca;
      box-shadow: 0 5px 13px rgba(221,126,151,.18);
    }

    .hanging-lantern::before {
      content: "";
      position: absolute;
      width: 1px;
      height: 10px;
      background: #c39c9e;
      left: 5px;
      top: -10px;
    }

    .hanging-lantern.one {
      left: 18%;
    }

    .hanging-lantern.two {
      right: 17%;
      background: #f4d59c;
    }

    .awning {
      position: absolute;
      top: 69px;
      left: 9px;
      right: 9px;
      height: 42px;
      border-radius: 18px 18px 13px 13px;
      background:
        repeating-linear-gradient(
          90deg,
          #f6a9ba 0 20px,
          #fff2f4 20px 40px
        );
      border: 2px solid rgba(224,139,159,.5);
      box-shadow:
        0 8px 15px rgba(126,79,73,.08),
        inset 0 1px 0 rgba(255,255,255,.8);
      z-index: 3;
    }

    .awning::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -7px;
      height: 13px;
      border-radius: 0 0 15px 15px;
      background:
        radial-gradient(
          circle at 10px 0,
          #f7aabc 0 11px,
          transparent 12px
        ) repeat-x;
      background-size: 40px 20px;
    }

    .counter-back {
      position: absolute;
      top: 103px;
      left: 20px;
      right: 20px;
      height: 74px;
      border-radius: 12px 12px 7px 7px;
      background: linear-gradient(180deg, #dba47a, #b87850);
      border: 1px solid rgba(121,75,48,.22);
      box-shadow:
        inset 0 3px 0 rgba(255,255,255,.2),
        0 8px 15px rgba(105,66,45,.11);
      z-index: 2;
    }

    .counter-front {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 82px;
      border-radius: 15px 15px 0 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08), transparent 18%, transparent 80%, rgba(255,255,255,.06)),
        linear-gradient(180deg, #cb8b61, #a96848);
      border-top: 5px solid #edc19f;
      box-shadow: inset 0 10px 20px rgba(103,60,40,.07);
      z-index: 8;
    }

    .wood-line {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 28px;
      height: 1px;
      background: rgba(91,57,43,.13);
      z-index: 9;
    }

    .jar-row {
      position: absolute;
      top: 120px;
      left: 27px;
      right: 27px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      z-index: 5;
    }

    .jar {
      position: relative;
      height: 58px;
      padding: 0;
      border-radius: 8px 8px 10px 10px;
      border: 1px solid rgba(112,78,66,.17);
      background: rgba(255,255,255,.6);
      overflow: visible;
      box-shadow:
        inset 0 4px 7px rgba(255,255,255,.75),
        0 4px 7px rgba(92,59,46,.08);
    }

    .jar::before {
      content: "";
      position: absolute;
      left: -2px;
      right: -2px;
      top: -5px;
      height: 8px;
      border-radius: 8px 8px 4px 4px;
      background: linear-gradient(180deg, #eef3f2, #bcc9c6);
      border: 1px solid rgba(104,119,115,.25);
      box-shadow: 0 2px 3px rgba(61,71,68,.09);
    }

    .jar-fill {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 5px;
      height: var(--fill, 0%);
      max-height: 44px;
      border-radius: 5px;
      background: var(--jar-color, #fff);
      opacity: .82;
      transition: height .3s ease;
    }

    .jar-empty {
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 8px;
      height: 35px;
      border-radius: 5px;
      background: rgba(255,255,255,.66);
      border: 1px dashed rgba(161,132,139,.25);
    }

    .jar-name {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -17px;
      font-size: 7px;
      line-height: 1;
      color: #80666d;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jar-stock {
      position: absolute;
      right: -5px;
      top: -9px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 99px;
      background: #fff;
      border: 1px solid #ecd9de;
      font-size: 8px;
      font-weight: 900;
      color: #80656c;
      display: grid;
      place-items: center;
      z-index: 4;
    }

    .jar.unavailable {
      filter: saturate(.3);
    }

    .jar.selected {
      box-shadow:
        0 0 0 2px #efa1b5,
        0 5px 10px rgba(215,104,133,.14);
    }

    .cat-area {
      position: absolute;
      z-index: 11;
      left: 50%;
      top: 160px;
      width: 120px;
      height: 115px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .cat-cushion {
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 4px;
      height: 43px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 28%, #ffe9ef, #f4b9c9 65%, #e8a5b9);
      box-shadow:
        inset 0 4px 7px rgba(255,255,255,.45),
        0 8px 13px rgba(119,73,80,.1);
    }

    .cat-svg {
      position: absolute;
      left: 0;
      top: -1px;
      width: 120px;
      height: 108px;
      overflow: visible;
    }

    .cat-z {
      position: absolute;
      right: 3px;
      top: -8px;
      color: #c98ba0;
      font-size: 12px;
      font-weight: 900;
      animation: zFloat 2.5s ease-in-out infinite;
    }

    .cat-z.two {
      right: -2px;
      top: 12px;
      font-size: 9px;
      animation-delay: -.9s;
    }

    @keyframes zFloat {
      0%,100% {
        opacity: .3;
        transform: translateY(4px) scale(.92);
      }
      50% {

    function money(value) {
      return Math.max(0, Math.round(value)).toLocaleString("vi-VN") + "đ";
    }

    function signedMoney(value) {
      const rounded = Math.round(value);
      return (rounded >= 0 ? "+" : "-") + money(Math.abs(rounded));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function formatTime(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function saveGame() {
      try {
        const save = JSON.parse(JSON.stringify(state));

        save.activeCustomer = null;
        save.customerToken = 0;
        save.customerTimer = null;
        save.nextCustomerTimer = null;
        save.patienceFrame = null;
        save.summaryVisible = false;

        if (save.isOpen) {
          save.isOpen = false;
          save.minutes = GAME_START_MINUTE;
          save.clockStartedAt = 0;
          save.clockBaseMinute = GAME_START_MINUTE;
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
      } catch (error) {
      }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return;
        }

        const saved = JSON.parse(raw);

        if (!saved || typeof saved !== "object") {
          return;
        }

        Object.keys(saved).forEach(key => {
          if (key in state && key !== "activeCustomer") {
            state[key] = saved[key];
          }
        });

        state.isOpen = false;
        state.currentScreen = "shop";
        state.activeCustomer = null;
        state.minutes = GAME_START_MINUTE;
        state.clockStartedAt = 0;
        state.clockBaseMinute = GAME_START_MINUTE;
        state.summaryVisible = false;

        if (!state.inventory) {
          state.inventory = {
            flavors: {},
            bases: {},
            toppings: {}
          };
        }

        Object.keys(FLAVORS).forEach(key => {
          if (typeof state.inventory.flavors[key] !== "number") {
            state.inventory.flavors[key] = 0;
          }
        });

        Object.keys(BASES).forEach(key => {
          if (typeof state.inventory.bases[key] !== "number") {
            state.inventory.bases[key] = 0;
          }
        });

        Object.keys(TOPPINGS).forEach(key => {
          if (typeof state.inventory.toppings[key] !== "number") {
            state.inventory.toppings[key] = 0;
          }
        });
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function showToast(message, type = "") {
      const container = document.querySelector(".toast-container");

      if (!container) {
        return;
      }

      const toast = document.createElement("div");
      toast.className = "toast " + type;
      toast.textContent = message;

      container.innerHTML = "";
      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentNode) {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(7px)";

          setTimeout(() => {
            toast.remove();
          }, 180);
        }
      }, 2400);
    }

    function createCustomer() {
      const gender = Math.random() < .5 ? "female" : "male";

      const name = gender === "female"
        ? randomItem(FEMALE_NAMES)
        : randomItem(MALE_NAMES);

      const id = Date.now() + "_" + Math.random().toString(36).slice(2);

      const flavorKeys = Object.keys(FLAVORS);
      const toppingKeys = Object.keys(TOPPINGS);
      const baseKeys = Object.keys(BASES);

      const customer = {
        id,
        gender,
        name,
        base: randomItem(baseKeys),
        flavors: [],
        topping: null,
        randomFlavors: false,
        randomTopping: false,
        orderText: "",
        createdAt: performance.now(),
        expiresAt: performance.now() + CUSTOMER_PATIENCE_MS,
        served: false
      };

      if (state.day <= 2) {
        customer.flavors = [
          randomItem(flavorKeys)
        ];

        if (Math.random() < .3) {
          customer.topping = randomItem(toppingKeys);
        }
      } else if (state.day <= 4) {
        const scoopCount = Math.random() < .68 ? 1 : 2;

        customer.flavors = [];

        for (let i = 0; i < scoopCount; i++) {
          customer.flavors.push(randomItem(flavorKeys));
        }

        if (Math.random() < .55) {
          customer.topping = randomItem(toppingKeys);
        }
      } else {
        const creative = Math.random();

        if (creative < .20) {
          customer.flavors = [];
          customer.randomFlavors = true;
          customer.base = Math.random() < .55 ? "cup" : "cone";
          customer.orderText =
            "Cho mình 2 viên vị bất kỳ tùy shop mix nhé!";
        } else if (creative < .39) {
          customer.flavors = [];
          customer.randomFlavors = true;
          customer.randomTopping = true;
          customer.base = "cup";
          customer.orderText =
            "Làm giúp em 1 ly kem vị ngẫu nhiên ngon nhất quán!";
        } else {
          const scoopCount = Math.random() < .55 ? 1 : 2;

          for (let i = 0; i < scoopCount; i++) {
            customer.flavors.push(randomItem(flavorKeys));
          }

          if (Math.random() < .62) {
            customer.topping = randomItem(toppingKeys);
          }
        }
      }

      if (!customer.orderText) {
        const baseText = customer.base === "cone"
          ? "ốc quế"
          : "ly";

        const flavorText = customer.flavors
          .map(key => FLAVORS[key].short)
          .join(" + ");

        let toppingText = "";

        if (customer.topping) {
          toppingText = ", thêm " + TOPPINGS[customer.topping].name;
        }

        customer.orderText =
          `Cho mình ${baseText} kem ${flavorText}${toppingText} nhé!`;
      }

      return customer;
    }

            style="

            stock <= 0
              ? `<div class="jar-empty"></div>`

          }

          <div class="jar-stock">${stock}</div>

          <div class="jar-name">
            ${escapeHtml(item.short)}
          </div>

        capacity = getWarehouseCapacity();

        item = BASES[key];
        stock = state.inventory.bases[key];
        capacity = getBaseCapacity();
      } else {
        item = TOPPINGS[key];
        stock = state.inventory.toppings[key];
        capacity = getToppingCapacity();

      const cost = item.price;
      const percentage = clamp(stock / capacity * 100, 0, 100);

      return `

          <div class="inventory-card-top">

              class="ingredient-icon"
              style="

        app.innerHTML = welcomeHtml();

      if (state.summaryVisible) {
        app.innerHTML = summaryHtml();
        return;
      }

      if (state.currentScreen === "warehouse") {
        app.innerHTML = warehouseHtml();
        return;
      }

      if (state.currentScreen === "upgrades") {
        app.innerHTML = upgradesHtml();
        return;
      }

      if (state.currentScreen === "reviews") {
        app.innerHTML = reviewsScreenHtml();
        return;
      }

      app.innerHTML = shopScreenHtml();

        startPatienceAnimation();
      }

    function renderAndSave() {
      saveGame();
      render();
    }

    function showConfirm(title, text, onConfirm) {
      const existing = document.querySelector(".modal-backdrop");

      if (existing) {
        existing.remove();
      }

      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";

      backdrop.innerHTML = `
        <div class="modal">
          <h3 class="modal-title">
            ${escapeHtml(title)}
          </h3>

          <div class="modal-text">
            ${escapeHtml(text)}
          </div>

          <div class="modal-actions">
            <button
              type="button"
              class="small-button cancel"
              data-modal="cancel"
            >
              HỦY
            </button>

            <button
              type="button"
              class="small-button confirm"
              data-modal="confirm"
            >
              XÁC NHẬN
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(backdrop);

      const cancel = backdrop.querySelector('[data-modal="cancel"]');
      const confirm = backdrop.querySelector('[data-modal="confirm"]');

      cancel.addEventListener("click", () => {
        backdrop.remove();
      });

      confirm.addEventListener("click", () => {
        backdrop.remove();
        onConfirm();
      });
    }

    function startGame() {
      const input = document.getElementById("shopNameInput");

      if (!input) {
        return;
      }

      const value = input.value.trim();

      state.shopName = value || "Ngọt Ngào";

      state.day = 1;
      state.cash = 400000;

      state.isOpen = false;
      state.currentScreen = "shop";

      state.minutes = GAME_START_MINUTE;

      state.dayRevenue = 0;
      state.dayStockCosts = 0;
      state.dayUpgradeCosts = 0;
      state.dayStaffCosts = 0;

      state.served = 0;
      state.walkouts = 0;

      state.reviews = [];

      state.upgrades = {
        warehouse: 0,
        scoopSpeed: 0,
        price: 0,
        employee: 0
      };

      Object.keys(FLAVORS).forEach(key => {
        state.inventory.flavors[key] = 0;
        state.purchased.flavors[key] = false;
      });

      Object.keys(BASES).forEach(key => {
        state.inventory.bases[key] = 0;
        state.purchased.bases[key] = false;
      });

      Object.keys(TOPPINGS).forEach(key => {
        state.inventory.toppings[key] = 0;
        state.purchased.toppings[key] = false;
      });

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      saveGame();
      render();
    }

    function openShop() {
      if (state.isOpen) {
        return;
      }

      if (!canOpenShop()) {
        showToast(
          "Bạn cần mua nguyên liệu ở Kho Hàng trước khi mở bán!",
          "error"
        );
        return;
      }

      const wage = EMPLOYEE_WAGES[state.upgrades.employee] || 0;

      if (wage > 0 && state.cash < wage) {
        showToast(
          `Không đủ tiền trả lương ca hôm nay: ${money(wage)}.`,
          "error"
        );
        return;
      }

      if (wage > 0) {
        state.cash -= wage;
        state.dayStaffCosts += wage;
      }

      state.isOpen = true;
      state.currentScreen = "shop";
      state.minutes = GAME_START_MINUTE;
      state.clockBaseMinute = GAME_START_MINUTE;
      state.clockStartedAt = performance.now();

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      state.activeCustomer = null;
      state.customerToken++;

      saveGame();
      render();

      spawnCustomer();
      startGameClock();
    }

    function startGameClock() {
      stopGameClock();

      state.clockStartedAt = performance.now();
      state.clockBaseMinute = state.minutes;

      state.clockTimer = setInterval(() => {
        if (!state.isOpen) {
          return;
        }

        const elapsedSeconds =
          (performance.now() - state.clockStartedAt) / 1000;

        const gameMinutesPassed =
          Math.floor(elapsedSeconds / REAL_SECONDS_PER_GAME_MINUTE);

        const nextMinute =
          state.clockBaseMinute + gameMinutesPassed;

        state.minutes = Math.min(
          GAME_END_MINUTE,
          nextMinute
        );

        updateClockOnly();

        if (state.minutes >= GAME_END_MINUTE) {
          stopGameClock();
          closeShop(true);
        }
      }, 250);
    }

    function stopGameClock() {
      if (state.clockTimer) {
        clearInterval(state.clockTimer);
        state.clockTimer = null;
      }
    }

    function updateClockOnly() {
      const clockElements = document.querySelectorAll(".status-clock");

      clockElements.forEach(element => {
        element.textContent = formatTime(state.minutes);
      });
    }

    function spawnCustomer() {
      if (!state.isOpen) {
        return;
      }

      if (state.activeCustomer) {
        return;
      }

      if (state.nextCustomerTimer) {
        clearTimeout(state.nextCustomerTimer);
        state.nextCustomerTimer = null;
      }

      const customer = createCustomer();

      customer.createdAt = performance.now();
      customer.expiresAt =
        performance.now() + CUSTOMER_PATIENCE_MS;

      state.activeCustomer = customer;
      state.customerToken++;

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      render();

      if (employeeActive()) {
        employeeAutoServe(customer);
      } else {
        startCustomerPatience(customer.id);
      }
    }

    function scheduleNextCustomer() {
      if (!state.isOpen) {
        return;
      }

      if (state.nextCustomerTimer) {
        clearTimeout(state.nextCustomerTimer);
      }

      const delay = 850 + Math.random() * 1050;

      state.nextCustomerTimer = setTimeout(() => {
        state.nextCustomerTimer = null;

        if (state.isOpen && !state.activeCustomer) {
          spawnCustomer();
        }
      }, delay);
    }

    function startCustomerPatience(customerId) {
      stopPatienceAnimation();

      const loop = () => {
        if (!state.isOpen || !state.activeCustomer) {
          stopPatienceAnimation();
          return;
        }

        if (state.activeCustomer.id !== customerId) {
          stopPatienceAnimation();
          return;
        }

        const customer = state.activeCustomer;

        const remaining =
          customer.expiresAt - performance.now();

        const ratio =
          clamp(
            remaining / CUSTOMER_PATIENCE_MS,
            0,
            1
          );

        const progress =
          document.getElementById("patienceProgress");

        const face =
          document.getElementById("patienceFace");

        if (progress) {
          const circumference = 113.1;
          progress.style.strokeDasharray = circumference;
          progress.style.strokeDashoffset =
            circumference * (1 - ratio);

          if (ratio > .55) {
            progress.style.stroke = "#79bd98";
          } else if (ratio > .28) {
            progress.style.stroke = "#e5b75c";
          } else {
            progress.style.stroke = "#dc7687";
          }
        }

        if (face) {
          if (ratio > .55) {
            face.textContent = "♡";
          } else if (ratio > .28) {
            face.textContent = "•";
          } else {
            face.textContent = "!";
          }
        }

        if (remaining <= 0) {
          stopPatienceAnimation();
          customerLeaves();
          return;
        }

        state.patienceFrame =
          requestAnimationFrame(loop);
      };

      state.patienceFrame =
        requestAnimationFrame(loop);
    }

    function stopPatienceAnimation() {
      if (state.patienceFrame) {
        cancelAnimationFrame(state.patienceFrame);
        state.patienceFrame = null;
      }
    }

    function currentPatienceRatio(customer) {
      if (!customer) {
        return 0;
      }

      return clamp(
        (customer.expiresAt - performance.now()) /
          CUSTOMER_PATIENCE_MS,
        0,
        1
      );
    }

    function customerLeaves(closedByShop = false) {
      const customer = state.activeCustomer;

      if (!customer) {
        return;
      }

      stopPatienceAnimation();

      state.walkouts++;

      addReview({
        customer,
        stars: Math.random() < .5 ? 1 : 2,
        walkedOut: true,
        correct: false,
        ratio: 0
      });

      state.activeCustomer = null;

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      render();

      if (!closedByShop && state.isOpen) {
        scheduleNextCustomer();
      }
    }

    function getAvailableFlavorKeys() {
      return Object.keys(FLAVORS)
        .filter(key => state.inventory.flavors[key] > 0);
    }

    function chooseRandomAvailableFlavors(count) {
      const available = getAvailableFlavorKeys();

      if (!available.length) {
        return null;
      }

      const result = [];

      for (let i = 0; i < count; i++) {
        const candidates = available.filter(
          key => state.inventory.flavors[key] > 0
        );

        if (!candidates.length) {
          return null;
        }

        const key = randomItem(candidates);

        result.push(key);
      }

      return result;
    }

    function chooseAvailableTopping() {
      const available = Object.keys(TOPPINGS)
        .filter(key => state.inventory.toppings[key] > 0);

      return available.length
        ? randomItem(available)
        : null;
    }

    function buildForCustomerAutomatically(customer) {
      const base =
        state.inventory.bases[customer.base] > 0
          ? customer.base
          : Object.keys(BASES)
              .find(key => state.inventory.bases[key] > 0);

      if (!base) {
        return null;
      }

      let flavors;

      if (customer.randomFlavors) {
        flavors = chooseRandomAvailableFlavors(
          customer.orderText.includes("2 viên") ? 2 : 1
        );
      } else {
        flavors = [...customer.flavors];

        const enough = flavors.every(
          key => state.inventory.flavors[key] >= 1
        );

        if (!enough) {
          return null;
        }
      }

      if (!flavors || flavors.length === 0) {
        return null;
      }

      let topping = null;

      if (customer.randomTopping) {
        topping = chooseAvailableTopping();
      } else {
        topping = customer.topping;

        if (
          topping &&
          state.inventory.toppings[topping] <= 0
        ) {
          return null;
        }
      }

      return {
        base,
        flavors,
        topping
      };
    }

    function employeeAutoServe(customer) {
      startPatienceAnimation(customer.id);

      const automaticBuild =
        buildForCustomerAutomatically(customer);

      if (!automaticBuild) {
        render();

        showToast(
          "Nhân viên chưa thể hoàn thành đơn vì kho đang thiếu nguyên liệu. Hãy nhập thêm ở Kho Hàng!",
          "error"
        );

        return;
      }

      state.build = automaticBuild;
      render();

      const prepTime =
        getEmployeePrepTime() + 450;

      setTimeout(() => {
        if (!state.isOpen) {
          return;
        }

        if (
          !state.activeCustomer ||
          state.activeCustomer.id !== customer.id
        ) {
          return;
        }

        serveCustomer(true);
      }, prepTime);
    }

    function arraysEqualMultiset(a, b) {
      if (a.length !== b.length) {
        return false;
      }

      const aa = [...a].sort();
      const bb = [...b].sort();

      return aa.every((value, index) => value === bb[index]);
    }

    function buildCanBeServed() {
      const customer = state.activeCustomer;

      if (!customer) {
        return false;
      }

      if (!state.build.base) {
        return false;
      }

      if (state.inventory.bases[state.build.base] <= 0) {
        return false;
      }

      if (
        state.build.flavors.length !==
        (customer.randomFlavors
          ? customer.orderText.includes("2 viên")
            ? 2
            : 1
          : customer.flavors.length)
      ) {
        return false;
      }

      for (const flavor of state.build.flavors) {
        if (
          !state.inventory.flavors[flavor] ||
          state.inventory.flavors[flavor] <= 0
        ) {
          return false;
        }
      }

      if (customer.randomFlavors) {
        if (customer.randomFlavors && !state.build.flavors.length) {
          return false;
        }
      } else if (
        !arraysEqualMultiset(
          state.build.flavors,
          customer.flavors
        )
      ) {
        return false;
      }

      if (customer.randomTopping) {
        if (
          state.build.topping &&
          state.inventory.toppings[state.build.topping] <= 0
        ) {
          return false;
        }
      } else {
        if (customer.topping !== state.build.topping) {
          return false;
        }

        if (
          customer.topping &&
          state.inventory.toppings[customer.topping] <= 0
        ) {
          return false;
        }
      }

      return true;
    }

    function consumeBuild() {
      const base = state.build.base;

      state.inventory.bases[base]--;

      state.build.flavors.forEach(flavor => {
        state.inventory.flavors[flavor]--;
      });

      if (state.build.topping) {
        state.inventory.toppings[state.build.topping]--;
      }
    }

    function serveCustomer(fromEmployee = false) {
      const customer = state.activeCustomer;

      if (!customer) {
        return;
      }

      if (!fromEmployee && !buildCanBeServed()) {
        if (!state.build.base) {
          showToast(
            "Hãy chọn ốc quế hoặc ly trước.",
            "error"
          );
          return;
        }

        showToast(
          "Món kem chưa khớp chính xác với order của khách.",
          "error"
        );

        return;
      }

      const ratio =
        currentPatienceRatio(customer);

      consumeBuild();

      const revenue = getUnitPrice();

      state.cash += revenue;
      state.dayRevenue += revenue;
      state.served++;

      addReview({
        customer,
        stars: reviewStarsFromPatience(ratio),
        walkedOut: false,
        correct: true,
        ratio
      });

      stopPatienceAnimation();

      state.activeCustomer = null;

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      render();

      showToast(
        `Đã giao kem cho ${customer.name} · +${money(revenue)}`,
        "success"
      );

      if (state.isOpen) {
        scheduleNextCustomer();
      }

      saveGame();
    }

    function reviewStarsFromPatience(ratio) {
      if (ratio > .80) {
        return 5;
      }

      if (ratio >= .30) {
        return 3;
      }

      return Math.random() < .5 ? 1 : 2;
    }

    function addReview({
      customer,
      stars,
      walkedOut,
      correct,
      ratio
    }) {
      let text;

      if (walkedOut) {
        text = randomItem(REVIEW_TEXT.low);
      } else if (!correct) {
        text = randomItem(REVIEW_TEXT.wrong);
      } else if (ratio > .80) {
        text = randomItem(REVIEW_TEXT.five);
      } else if (ratio >= .30) {
        text = randomItem(REVIEW_TEXT.three);
      } else {
        text = randomItem(REVIEW_TEXT.low);
      }

      const review = {
        id:
          Date.now().toString(36) +
          Math.random().toString(36).slice(2),

        day: state.day,

        customer: {
          id: customer.id,
          name: customer.name,
          gender: customer.gender
        },

        stars,
        text,
        reply: "",
        walkedOut,
        correct,
        ratio
      };

      state.reviews.push(review);

      if (state.reviews.length > 100) {
        state.reviews.shift();
      }
    }

    function closeShop(auto = false) {
      if (!state.isOpen) {
        return;
      }

      stopGameClock();
      stopPatienceAnimation();

      if (state.nextCustomerTimer) {
        clearTimeout(state.nextCustomerTimer);
        state.nextCustomerTimer = null;
      }

      if (state.activeCustomer) {
        customerLeaves(true);
      }

      state.isOpen = false;
      state.activeCustomer = null;
      state.summaryVisible = true;
      state.currentScreen = "shop";

      saveGame();
      render();

      animateSummaryMoney();
    }

    function animateSummaryMoney() {
      const element =
        document.getElementById("summaryProfit");

      if (!element) {
        return;
      }

      const target =
        Number(element.dataset.target || 0);

      const duration = 900;
      const start = performance.now();

      const tick = now => {
        const progress =
          clamp(
            (now - start) / duration,
            0,
            1
          );

        const eased =
          1 - Math.pow(1 - progress, 3);

        const value =
          Math.round(target * eased);

        element.textContent =
          signedMoney(value);

        if (progress < 1) {
          requestAnimationFrame(tick);
        }
      };

      requestAnimationFrame(tick);
    }

    function nextDay() {
      state.day++;

      state.minutes = GAME_START_MINUTE;
      state.clockStartedAt = 0;
      state.clockBaseMinute = GAME_START_MINUTE;

      state.isOpen = false;
      state.activeCustomer = null;

      state.dayRevenue = 0;
      state.dayStockCosts = 0;
      state.dayUpgradeCosts = 0;
      state.dayStaffCosts = 0;

      state.served = 0;
      state.walkouts = 0;

      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      state.summaryVisible = false;
      state.currentScreen = "shop";

      saveGame();
      render();
    }

    function buyStock(type, key) {
      let item;
      let inventory;
      let capacity;

      if (type === "flavor") {
        item = FLAVORS[key];
        inventory = state.inventory.flavors;
        capacity = getWarehouseCapacity();
      } else if (type === "base") {
        item = BASES[key];
        inventory = state.inventory.bases;
        capacity = getBaseCapacity();
      } else {
        item = TOPPINGS[key];
        inventory = state.inventory.toppings;
        capacity = getToppingCapacity();
      }

      const quantity = item.carton || 8;

      if (inventory[key] + quantity > capacity) {
        showToast(
          "Kho đã đầy. Hãy nâng cấp Kho Hàng trước.",
          "error"
        );
        return;
      }

      if (state.cash < item.price) {
        showToast(
          `Không đủ tiền. Cần ${money(item.price)}.`,
          "error"
        );
        return;
      }

      state.cash -= item.price;
      inventory[key] += quantity;

      if (type === "flavor") {
        state.purchased.flavors[key] = true;
      } else if (type === "base") {
        state.purchased.bases[key] = true;
      } else {
        state.purchased.toppings[key] = true;
      }

      state.dayStockCosts += item.price;

      renderAndSave();

      showToast(
        `Đã nhập ${quantity} phần ${item.name}.`,
        "success"
      );
    }

    function upgrade(type) {
      if (type === "warehouse") {
        const level = state.upgrades.warehouse;

        if (level >= 3) {
          return;
        }

        const cost =
          WAREHOUSE_COSTS[level + 1];

        if (state.cash < cost) {
          showToast(
            `Không đủ tiền. Cần ${money(cost)}.`,
            "error"
          );
          return;
        }

        state.cash -= cost;
        state.upgrades.warehouse++;
        state.dayUpgradeCosts += cost;

        renderAndSave();

        showToast(
          "Kho Hàng đã được mở rộng.",
          "success"
        );

        return;
      }

      if (type === "scoop") {
        const level = state.upgrades.scoopSpeed;

        if (level >= 3) {
          return;
        }

        const cost =
          SCOOP_SPEED_COSTS[level + 1];

        if (state.cash < cost) {
          showToast(
            `Không đủ tiền. Cần ${money(cost)}.`,
            "error"
          );
          return;
        }

        state.cash -= cost;
        state.upgrades.scoopSpeed++;
        state.dayUpgradeCosts += cost;

        renderAndSave();

        showToast(
          "Tốc độ múc kem đã được nâng cấp.",
          "success"
        );

        return;
      }

      if (type === "price") {
        const level = state.upgrades.price;

        if (level >= PRICE_LEVELS.length - 1) {
          return;
        }

        const cost =
          PRICE_UPGRADE_COSTS[level + 1];

        if (state.cash < cost) {
          showToast(
            `Không đủ tiền. Cần ${money(cost)}.`,
            "error"
          );
          return;
        }

        state.cash -= cost;
        state.upgrades.price++;
        state.dayUpgradeCosts += cost;

        renderAndSave();

        showToast(
          `Giá bán mới: ${money(getUnitPrice())}/món.`,
          "success"
        );

        return;
      }

      if (type === "employee") {
        const level = state.upgrades.employee;

        if (level >= 2) {
          return;
        }

        const cost =
          EMPLOYEE_COSTS[level + 1];

        if (state.cash < cost) {
          showToast(
            `Không đủ tiền. Cần ${money(cost)}.`,
            "error"
          );
          return;
        }

        state.cash -= cost;
        state.upgrades.employee++;
        state.dayUpgradeCosts += cost;

        renderAndSave();

        showToast(
          `Đã thuê nhân viên cấp ${state.upgrades.employee}.`,
          "success"
        );
      }
    }

    function selectFlavor(key) {
      if (!state.isOpen || !state.activeCustomer) {
        return;
      }

      const stock = state.inventory.flavors[key];

      if (stock <= 0) {
        if (!state.purchased.flavors[key]) {
          showToast(
            "Bạn chưa mua nguyên liệu này nên chưa thể mở bán",
            "error"
          );
        } else {
          showToast(
            "Đã hết loại kem này, vui lòng nhập thêm ở Kho Hàng!",
            "error"
          );
        }

        return;
      }

      if (state.build.flavors.length >= 2) {
        showToast(
          "Một món chỉ tối đa 2 viên trong quầy hiện tại.",
          "error"
        );
        return;
      }

      state.build.flavors.push(key);

      render();
    }

    function selectBuildFlavor(key) {
      if (!state.isOpen || !state.activeCustomer) {
        return;
      }

      if (state.inventory.flavors[key] <= 0) {
        if (!state.purchased.flavors[key]) {
          showToast(
            "Bạn chưa mua nguyên liệu này nên chưa thể mở bán",
            "error"
          );
        } else {
          showToast(
            "Đã hết loại kem này, vui lòng nhập thêm ở Kho Hàng!",
            "error"
          );
        }

        return;
      }

      const customer = state.activeCustomer;

      const wantedCount =
        customer.randomFlavors
          ? customer.orderText.includes("2 viên")
            ? 2
            : 1
          : customer.flavors.length;

      if (state.build.flavors.length >= wantedCount) {
        showToast(
          "Đã đủ số viên theo order.",
          "error"
        );
        return;
      }

      state.build.flavors.push(key);
      render();
    }

    function selectBase(key) {
      if (!state.isOpen || !state.activeCustomer) {
        return;
      }

      if (state.inventory.bases[key] <= 0) {
        if (!state.purchased.bases[key]) {
          showToast(
            "Bạn chưa mua ốc quế/ly này ở Kho Hàng.",
            "error"
          );
        } else {
          showToast(
            "Đã hết loại nền này, vui lòng nhập thêm ở Kho Hàng!",
            "error"
          );
        }

        return;
      }

      state.build.base = key;
      render();
    }

    function selectTopping(key) {
      if (!state.isOpen || !state.activeCustomer) {
        return;
      }

      if (!key) {
        state.build.topping = null;
        render();
        return;
      }

      if (state.inventory.toppings[key] <= 0) {
        if (!state.purchased.toppings[key]) {
          showToast(
            "Bạn chưa mua topping này ở Kho Hàng.",
            "error"
          );
        } else {
          showToast(
            "Topping này đã hết, vui lòng nhập thêm ở Kho Hàng!",
            "error"
          );
        }

        return;
      }

      state.build.topping = key;
      render();
    }

    function resetBuild() {
      state.build = {
        base: null,
        flavors: [],
        topping: null
      };

      render();
    }

    function replyReview(id) {
      const input =
        document.getElementById("reply-" + id);

      if (!input) {
        return;
      }

      const value = input.value.trim();

      if (!value) {
        showToast(
          "Hãy viết nội dung phản hồi trước nhé.",
          "error"
        );
        return;
      }

      const review =
        state.reviews.find(item => item.id === id);

      if (!review) {
        return;
      }

      review.reply = value;

      renderAndSave();

      showToast(
        "Đã lưu phản hồi cho khách.",
        "success"
      );
    }

    function changeTab(screen) {
      if (state.summaryVisible) {
        return;
      }

      state.currentScreen = screen;

      render();
      saveGame();
    }

    document.addEventListener("click", event => {
      const actionTarget =
        event.target.closest("[data-action]");

      if (!actionTarget) {
        return;
      }

      const action =
        actionTarget.dataset.action;

      if (action === "start-game") {
        event.preventDefault();
        startGame();
        return;
      }

      if (action === "open-shop") {
        event.preventDefault();
        openShop();
        return;
      }

      if (action === "close-shop") {
        event.preventDefault();

        showConfirm(
          "Đóng cửa hôm nay?",
          "Khách đang chờ sẽ được tính là đã bỏ về và nhận review theo thời gian chờ. Sau đó game chuyển sang tổng kết ngày.",
          () => closeShop(false)
        );

        return;
      }

      if (action === "tab") {
        changeTab(actionTarget.dataset.screen);
        return;
      }

      if (action === "buy-stock") {
        buyStock(
          actionTarget.dataset.type,
          actionTarget.dataset.key
        );
        return;
      }

      if (action === "select-flavor") {
        selectFlavor(actionTarget.dataset.key);
        return;
      }

      if (action === "select-build-flavor") {
        selectBuildFlavor(actionTarget.dataset.key);
        return;
      }

      if (action === "select-base") {
        selectBase(actionTarget.dataset.key);
        return;
      }

      if (action === "select-topping") {
        selectTopping(actionTarget.dataset.key);
        return;
      }

      if (action === "reset-build") {
        resetBuild();
        return;
      }

      if (action === "deliver") {
        serveCustomer(false);
        return;
      }

      if (action === "upgrade-warehouse") {
        upgrade("warehouse");
        return;
      }

      if (action === "upgrade-scoop") {
        upgrade("scoop");
        return;
      }

      if (action === "upgrade-price") {
        upgrade("price");
        return;
      }

      if (action === "upgrade-employee") {
        upgrade("employee");
        return;
      }

      if (action === "reply-review") {
        replyReview(actionTarget.dataset.id);
        return;
      }

      if (action === "next-day") {
        nextDay();
      }
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        event.target &&
        event.target.id === "shopNameInput"
      ) {
        event.preventDefault();
        startGame();
      }
    });

    window.addEventListener("beforeunload", () => {
      saveGame();
      stopGameClock();
      stopPatienceAnimation();
    });

    loadGame();
    render();
  </script>
</body>
</html>
