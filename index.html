<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff1f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tiệm Bán Kem Ngọt Ngào</title>

<style>
:root{
  --pink:#f59ab0;
  --pink2:#ffd6df;
  --pink3:#fff0f4;
  --cream:#fffaf1;
  --cream2:#fff4df;
  --brown:#72584d;
  --brown2:#9a7768;
  --green:#9dc9aa;
  --blue:#a9d8e8;
  --yellow:#f4c96b;
  --red:#df8292;
  --shadow:0 12px 35px rgba(126,88,75,.12);
  --shadow2:0 5px 16px rgba(126,88,75,.10);
  --radius:22px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:
    ui-rounded,
    "SF Pro Rounded",
    "Arial Rounded MT Bold",
    system-ui,
    sans-serif;
  color:var(--brown);
  background:#fff3f6;
}

body{
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

#app{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
}

.screen{
  width:100%;
  height:100%;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.9),transparent 25%),
    radial-gradient(circle at 85% 70%,rgba(255,215,227,.65),transparent 28%),
    linear-gradient(180deg,#cfeefa 0%,#eaf8fa 45%,#fff5f3 100%);
}

.welcome::after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:35%;
  background:linear-gradient(180deg,transparent,#fff1ed);
  pointer-events:none;
}

.cloud{
  position:absolute;
  width:130px;
  height:42px;
  border-radius:50px;
  background:rgba(255,255,255,.72);
  filter:blur(.2px);
  opacity:.8;
  animation:cloudMove linear infinite;
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:inherit;
}

.cloud::before{
  width:62px;
  height:62px;
  left:20px;
  top:-27px;
}

.cloud::after{
  width:75px;
  height:75px;
  right:18px;
  top:-36px;
}

.cloud.c1{
  top:13%;
  left:-180px;
  animation-duration:34s;
}

.cloud.c2{
  top:28%;
  left:-240px;
  transform:scale(.7);
  animation-duration:43s;
  animation-delay:-15s;
}

.cloud.c3{
  top:7%;
  left:-220px;
  transform:scale(.55);
  animation-duration:50s;
  animation-delay:-25s;
}

@keyframes cloudMove{
  from{transform:translateX(0) scale(1)}
  to{transform:translateX(calc(100vw + 450px)) scale(1)}
}

.welcome-particle{
  position:absolute;
  font-size:20px;
  opacity:.55;
  animation:floatParticle 5s ease-in-out infinite;
}

.p1{left:9%;top:31%;animation-delay:-1s}
.p2{left:83%;top:24%;animation-delay:-3s}
.p3{left:18%;top:70%;animation-delay:-2s}
.p4{left:76%;top:76%;animation-delay:-4s}
.p5{left:52%;top:13%;animation-delay:-.5s}
.p6{left:91%;top:52%;animation-delay:-2.8s}

@keyframes floatParticle{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-15px) rotate(7deg)}
}

.welcome-card{
  position:relative;
  z-index:5;
  width:min(92%,430px);
  padding:28px 23px 25px;
  border-radius:34px;
  background:rgba(255,255,255,.74);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 25px 70px rgba(111,144,155,.18);
  backdrop-filter:blur(18px);
  text-align:center;
}

.mini-logo{
  width:58px;
  height:58px;
  margin:0 auto 10px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#fff,#ffe2ea);
  box-shadow:var(--shadow2);
  font-size:30px;
}

.welcome-card h1{
  margin:4px 0 7px;
  font-size:29px;
  letter-spacing:-1px;
  color:#684f48;
}

.welcome-card p{
  margin:0 auto 20px;
  max-width:310px;
  line-height:1.6;
  color:#a17d72;
  font-size:13px;
}

.welcome-form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.shop-input{
  width:100%;
  padding:15px 17px;
  border:1px solid #f2d8dd;
  border-radius:17px;
  outline:none;
  background:rgba(255,255,255,.9);
  color:var(--brown);
  text-align:center;
  transition:.2s;
}

.shop-input:focus{
  border-color:#eda7b8;
  box-shadow:0 0 0 4px rgba(245,154,176,.12);
}

.start-btn{
  width:100%;
  padding:15px 18px;
  border-radius:17px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,#f29bad,#e9859e);
  box-shadow:0 9px 20px rgba(224,125,148,.22);
  transition:.2s;
}

.start-btn:hover{
  filter:brightness(1.03);
}

.welcome-note{
  margin-top:14px!important;
  margin-bottom:0!important;
  font-size:11px!important;
  color:#b6978e!important;
}

/* =========================================================
   MAIN APP
========================================================= */

.game{
  display:flex;
  flex-direction:column;
  background:#fff8f5;
}

.topbar{
  flex:0 0 auto;
  padding:
    calc(10px + env(safe-area-inset-top))
    12px
    10px;
  background:rgba(255,250,247,.94);
  border-bottom:1px solid #f1ded8;
  box-shadow:0 2px 14px rgba(110,75,65,.06);
  z-index:20;
}

.topbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.brand{
  min-width:0;
}

.brand-name{
  font-size:16px;
  font-weight:950;
  color:#674e47;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-day{
  margin-top:2px;
  font-size:10px;
  color:#aa877c;
}

.stats{
  display:flex;
  gap:6px;
}

.stat{
  min-width:68px;
  padding:7px 9px;
  border-radius:13px;
  background:#fff;
  border:1px solid #f1e1dc;
  text-align:center;
}

.stat-label{
  display:block;
  font-size:8px;
  color:#b4958b;
}

.stat-value{
  display:block;
  margin-top:2px;
  font-size:11px;
  font-weight:900;
  color:#765a50;
}

.clock-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:10px;
}

.clock{
  display:flex;
  align-items:center;
  gap:7px;
}

.clock-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#82c696;
  box-shadow:0 0 0 4px rgba(130,198,150,.13);
}

.clock-time{
  font-size:17px;
  font-weight:950;
}

.clock-label{
  font-size:9px;
  color:#a88a81;
}

.close-btn{
  padding:9px 13px;
  border-radius:13px;
  background:#fff;
  color:#bd6978;
  border:1px solid #f0d2d7;
  font-size:11px;
  font-weight:900;
}

.nav{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:8px 9px;
  background:#fffaf8;
  border-bottom:1px solid #f0e1dd;
  z-index:15;
}

.nav-btn{
  min-width:0;
  padding:9px 4px;
  border-radius:13px;
  color:#a38379;
  background:transparent;
  font-size:10px;
  font-weight:800;
}

.nav-btn.active{
  color:#704f47;
  background:#ffe3e9;
  box-shadow:inset 0 0 0 1px #f5c8d1;
}

.content{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:10px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom));
}

/* =========================================================
   SHOP
========================================================= */

.shop-scene{
  position:relative;
  min-height:100%;
}

.awning{
  position:relative;
  height:59px;
  border-radius:22px 22px 9px 9px;
  overflow:hidden;
  background:
    repeating-linear-gradient(
      90deg,
      #f9aabc 0 28px,
      #fff1f0 28px 56px
    );
  border:3px solid #fff;
  box-shadow:var(--shadow2);
}

.awning::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-12px;
  height:22px;
  border-radius:0 0 50% 50%;
  background:inherit;
}

.sign{
  position:absolute;
  z-index:3;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  min-width:200px;
  max-width:75%;
  padding:8px 14px;
  border-radius:15px;
  background:#fffdf8;
  border:2px solid #f2d9c7;
  box-shadow:0 5px 15px rgba(110,78,65,.12);
  text-align:center;
  font-size:13px;
  font-weight:950;
  color:#74564c;
}

.counter{
  position:relative;
  margin-top:25px;
  min-height:155px;
  border-radius:22px;
  background:
    linear-gradient(180deg,#d6a67c 0 76%,#b87e58 76%);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.counter-front{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:34px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.08) 0 18px,
      transparent 18px 36px
    ),
    #a9714f;
}

.jar-row{
  position:absolute;
  left:10px;
  right:10px;
  top:13px;
  display:flex;
  gap:7px;
  overflow:hidden;
  align-items:flex-end;
}

.jar{
  position:relative;
  flex:1;
  min-width:47px;
  height:82px;
  border-radius:12px 12px 15px 15px;
  background:linear-gradient(90deg,#dfe5e8,#fff,#c9d1d5);
  border:2px solid #bfc9cc;
  box-shadow:inset 0 5px 8px rgba(255,255,255,.8),0 4px 8px rgba(90,60,50,.13);
  overflow:hidden;
}

.jar-lid{
  position:absolute;
  top:-2px;
  left:3px;
  right:3px;
  height:17px;
  border-radius:12px 12px 7px 7px;
  background:rgba(255,255,255,.85);
  border:1px solid #cbd2d4;
  z-index:3;
}

.jar-ice{
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  height:55px;
  border-radius:9px;
  background:var(--ice,#fff);
  transition:.3s;
}

.jar.empty .jar-ice{
  background:#fff;
  opacity:.65;
}

.jar-label{
  position:absolute;
  z-index:4;
  left:3px;
  right:3px;
  bottom:7px;
  padding:3px 2px;
  border-radius:7px;
  background:rgba(255,255,255,.82);
  font-size:7px;
  font-weight:900;
  text-align:center;
  color:#80665d;
}

.cat-bed{
  position:absolute;
  right:9px;
  bottom:22px;
  width:91px;
  height:57px;
  border-radius:50%;
  background:#f3b9ca;
  box-shadow:inset 0 -5px 8px rgba(173,94,116,.13);
}

.cat-svg{
  position:absolute;
  width:91px;
  height:83px;
  right:4px;
  bottom:29px;
  z-index:5;
}

.zzz{
  position:absolute;
  right:1px;
  top:-12px;
  z-index:6;
  font-weight:950;
  color:#987a8e;
  font-size:14px;
  animation:zzzFloat 2.8s ease-in-out infinite;
}

@keyframes zzzFloat{
  0%,100%{transform:translate(0,5px) scale(.9);opacity:.5}
  50%{transform:translate(5px,-5px) scale(1);opacity:1}
}

/* =========================================================
   CUSTOMER
========================================================= */

.customer-panel{
  margin-top:10px;
  padding:13px;
  border-radius:22px;
  background:#fff;
  border:1px solid #f0e1dd;
  box-shadow:var(--shadow2);
}

.customer-head{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  flex:0 0 67px;
  width:67px;
  height:67px;
  border-radius:22px;
  background:#fff0f3;
  overflow:hidden;
  border:2px solid #fff;
  box-shadow:0 4px 10px rgba(100,70,60,.1);
}

.avatar svg{
  width:100%;
  height:100%;
  display:block;
}

.customer-info{
  min-width:0;
  flex:1;
}

.customer-name{
  font-size:14px;
  font-weight:950;
}

.customer-sub{
  margin-top:3px;
  font-size:9px;
  color:#aa8980;
}

.order-bubble{
  margin-top:11px;
  padding:11px 12px;
  border-radius:16px;
  background:#fff5ef;
  border:1px solid #f3dfd4;
  font-size:12px;
  line-height:1.5;
  color:#74584f;
}

.patience-wrap{
  display:flex;
  align-items:center;
  gap:11px;
  margin-top:11px;
}

.ring{
  position:relative;
  width:46px;
  height:46px;
  flex:0 0 46px;
}

.ring svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.ring-track{
  fill:none;
  stroke:#f1e8e5;
  stroke-width:5;
}

.ring-progress{
  fill:none;
  stroke:#8ec99b;
  stroke-width:5;
  stroke-linecap:round;
  transition:stroke .3s;
}

.patience-copy{
  flex:1;
}

.patience-title{
  font-size:10px;
  font-weight:900;
}

.patience-bar{
  height:7px;
  margin-top:5px;
  overflow:hidden;
  border-radius:10px;
  background:#f2e9e6;
}

.patience-fill{
  height:100%;
  width:100%;
  border-radius:10px;
  background:#8ec99b;
  transition:width .08s linear,background .3s;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  margin-top:10px;
  padding:13px;
  border-radius:22px;
  background:#fff;
  border:1px solid #f0e1dd;
  box-shadow:var(--shadow2);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
  font-size:13px;
  font-weight:950;
}

.section-hint{
  font-size:9px;
  color:#ae9086;
  font-weight:600;
}

.step{
  margin-top:9px;
}

.step-title{
  margin-bottom:6px;
  font-size:9px;
  font-weight:950;
  color:#98776c;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.choice{
  position:relative;
  min-height:49px;
  padding:8px;
  border-radius:13px;
  background:#fffaf8;
  border:1px solid #eee0db;
  color:#775c53;
  text-align:left;
  transition:.18s;
}

.choice.selected{
  background:#ffe7ec;
  border-color:#edafbc;
  box-shadow:inset 0 0 0 1px #f6cbd4;
}

.choice.disabled{
  opacity:.45;
}

.choice-main{
  font-size:11px;
  font-weight:900;
}

.choice-sub{
  margin-top:2px;
  font-size:8px;
  color:#a68b82;
}

.employee-lock{
  padding:12px;
  border-radius:14px;
  background:#f7f1ed;
  color:#92766d;
  font-size:10px;
  line-height:1.5;
}

.build-preview{
  margin-top:11px;
  min-height:120px;
  border-radius:18px;
  background:linear-gradient(180deg,#fffaf7,#fff2e9);
  border:1px dashed #e8d2c7;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.serve-visual{
  position:relative;
  width:65px;
  height:78px;
}

.cup{
  position:absolute;
  bottom:0;
  left:7px;
  width:51px;
  height:49px;
  border-radius:7px 7px 17px 17px;
  background:linear-gradient(90deg,#f8a9bc,#ffd7df,#ee8fa8);
  border:2px solid #e58ba2;
}

.cone{
  position:absolute;
  bottom:0;
  left:12px;
  width:43px;
  height:57px;
  clip-path:polygon(9% 0,91% 0,70% 100%,30% 100%);
  background:
    linear-gradient(45deg,transparent 45%,rgba(150,99,65,.3) 46% 51%,transparent 52%),
    linear-gradient(-45deg,transparent 45%,rgba(150,99,65,.3) 46% 51%,transparent 52%),
    #e8b77d;
}

.scoop{
  position:absolute;
  width:36px;
  height:36px;
  border-radius:50%;
  left:14px;
  bottom:38px;
  background:var(--scoop,#fff);
  box-shadow:inset -4px -5px 0 rgba(0,0,0,.04);
}

.scoop.two{
  left:27px;
  bottom:49px;
}

.topping-dot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#f29bad;
}

.preview-text{
  margin-top:7px;
  font-size:9px;
  color:#a2867c;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1.5fr;
  gap:7px;
  margin-top:10px;
}

.reset-btn,
.serve-btn{
  padding:13px 10px;
  border-radius:15px;
  font-weight:950;
}

.reset-btn{
  color:#9c7d73;
  background:#f8f0ed;
}

.serve-btn{
  color:#fff;
  background:linear-gradient(135deg,#f39bae,#df7f98);
  box-shadow:0 8px 18px rgba(219,117,143,.2);
}

.serve-btn:disabled{
  opacity:.42;
  box-shadow:none;
}

/* =========================================================
   WAREHOUSE / UPGRADES / REVIEWS
========================================================= */

.card{
  margin-bottom:10px;
  padding:14px;
  border-radius:21px;
  background:#fff;
  border:1px solid #f0e1dd;
  box-shadow:var(--shadow2);
}

.card h2{
  margin:0;
  font-size:16px;
}

.card-desc{
  margin:5px 0 12px;
  font-size:10px;
  line-height:1.5;
  color:#a4877e;
}

.stock-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stock-card{
  padding:11px;
  border-radius:16px;
  background:#fffaf8;
  border:1px solid #eee0db;
}

.stock-top{
  display:flex;
  justify-content:space-between;
  gap:4px;
  align-items:center;
}

.stock-name{
  font-size:11px;
  font-weight:950;
}

.stock-count{
  font-size:9px;
  color:#9e8178;
}

.stock-color{
  width:100%;
  height:28px;
  margin:8px 0;
  border-radius:10px;
  background:var(--ice,#fff);
  border:1px solid rgba(100,80,70,.08);
}

.buy-btn{
  width:100%;
  padding:9px;
  border-radius:11px;
  background:#ffe5eb;
  color:#9c596b;
  font-size:9px;
  font-weight:950;
}

.buy-btn:disabled{
  opacity:.4;
}

.upgrade{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #f1e6e2;
}

.upgrade:last-child{
  border-bottom:0;
}

.upgrade-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:#fff0f3;
  font-size:21px;
}

.upgrade-info{
  flex:1;
}

.upgrade-name{
  font-size:11px;
  font-weight:950;
}

.upgrade-desc{
  margin-top:3px;
  font-size:8px;
  line-height:1.4;
  color:#a3877e;
}

.upgrade-level{
  margin-top:4px;
  font-size:8px;
  color:#b17b87;
  font-weight:800;
}

.upgrade-btn{
  padding:9px 10px;
  border-radius:11px;
  background:#f5dfcf;
  color:#79594d;
  font-size:9px;
  font-weight:950;
}

.review{
  padding:13px 0;
  border-bottom:1px solid #f0e5e1;
}

.review:last-child{
  border-bottom:0;
}

.review-head{
  display:flex;
  align-items:center;
  gap:9px;
}

.review-mini-avatar{
  width:40px;
  height:40px;
  overflow:hidden;
  border-radius:14px;
  background:#fff0f3;
}

.review-mini-avatar svg{
  width:100%;
  height:100%;
}

.review-name{
  font-size:10px;
  font-weight:950;
}

.stars{
  margin-top:3px;
  font-size:12px;
  letter-spacing:1px;

function resetInventory(){
  state.inventory = {};
  FLAVORS.forEach(f => state.inventory[f.id] = 0);

/* =========================================================

========================================================= */

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(n){
  return new Intl.NumberFormat("vi-VN").format(Math.round(n)) + "đ";
}

function random(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function formatTime(minutes){
  const h = Math.floor(minutes/60);
  const m = minutes%60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

function getPrice(){
  const prices = [10000,15000,25000,50000,70000,90000];
  return prices[Math.min(state.upgrades.price,prices.length-1)];
}

function getWarehouseCapacity(){
  return 0 + state.upgrades.warehouse * 8;
}

function totalStock(){
  return Object.values(state.inventory).reduce((a,b)=>a+b,0)
    + Object.values(state.toppingInventory).reduce((a,b)=>a+b,0);
}

function toast(message){
  const el = document.querySelector(".toast");
  if(!el) return;

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(state.toastTimer);

  state.toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2600);
}

/* =========================================================
   CUSTOMER GENERATION
========================================================= */

function createCustomer(){
  const female = Math.random() < .55;

  const first = female ? random(FIRST_NAMES_F) : random(FIRST_NAMES_M);
  const fullName =
    random(LAST_NAMES) + " " +
    random(MIDDLE_NAMES) + " " +
    first;

  let scoops = 1;
  let randomOrder = false;
  let requestedFlavor = null;
  let requestedTopping = null;
  let requestedBase = null;
  let text = "";

  if(state.day <= 2){
    scoops = 1;
    requestedFlavor = random(FLAVORS).id;

    const toppingChance = Math.random();

    if(toppingChance < .35){
      requestedTopping = null;
      text = `Cho mình 1 viên vị ${getFlavor(requestedFlavor).name} nhé!`;
    }else{
      requestedTopping = random(TOPPINGS).id;
      text =
        `Cho mình 1 viên vị ${getFlavor(requestedFlavor).name}, ` +
        `thêm ${getTopping(requestedTopping).name.toLowerCase()} nha!`;
    }

  }else if(state.day <= 4){
    scoops = Math.random() < .35 ? 2 : 1;
    requestedFlavor = random(FLAVORS).id;

    if(scoops === 2){
      const second = random(FLAVORS).id;
      requestedFlavor = [requestedFlavor,second];
    }

    requestedTopping =
      Math.random() < .5 ? random(TOPPINGS).id : null;

    if(Array.isArray(requestedFlavor)){
      text =
        `Cho mình 2 viên ${getFlavor(requestedFlavor[0]).name} + ` +
        `${getFlavor(requestedFlavor[1]).name}` +
        (requestedTopping
          ? `, thêm ${getTopping(requestedTopping).name.toLowerCase()} nhé!`
          : " nhé!");
    }else{
      text =
        `Cho mình vị ${getFlavor(requestedFlavor).name}` +
        (requestedTopping
          ? `, thêm ${getTopping(requestedTopping).name.toLowerCase()} nha!`
          : " nhé!");
    }

  }else{
    const creative = Math.random() < .48;

    if(creative){
      randomOrder = true;

      if(Math.random() < .5){
        scoops = 2;
        text = random(RANDOM_REQUESTS);
      }else{
        scoops = 1;
        text = "Làm giúp em 1 ly kem vị ngẫu nhiên ngon nhất quán!";
      }

      requestedFlavor = null;
      requestedTopping = null;

    }else{
      scoops = Math.random() < .45 ? 2 : 1;

      if(scoops === 2){
        requestedFlavor = [
          random(FLAVORS).id,
          random(FLAVORS).id
        ];
      }else{
        requestedFlavor = random(FLAVORS).id;
      }

      requestedTopping =
        Math.random() < .65 ? random(TOPPINGS).id : null;

      if(Array.isArray(requestedFlavor)){
        text =
          `Cho mình 2 viên ${getFlavor(requestedFlavor[0]).name} + ` +
          `${getFlavor(requestedFlavor[1]).name}` +
          (requestedTopping
            ? ` và ${getTopping(requestedTopping).name.toLowerCase()} nhé!`
            : " nhé!");
      }else{
        text =
          `Cho mình vị ${getFlavor(requestedFlavor).name}` +
          (requestedTopping
            ? ` và ${getTopping(requestedTopping).name.toLowerCase()} nhé!`
            : " nhé!");
      }
    }
  }

  if(Math.random() < .15){
    requestedBase = random(BASES).id;
    text += requestedBase === "cone"
      ? " Cho mình ốc quế nhé."
      : " Cho mình ly nhé.";
  }

  return {
    id:Date.now() + Math.random(),
    name:fullName,
    gender:female ? "female" : "male",
    avatarSeed:Math.floor(Math.random()*10),
    scoops,
    randomOrder,
    requestedFlavor,
    requestedTopping,
    requestedBase,
    text,
    createdAt:performance.now(),
    expiresAt:performance.now() + 70000,
    servedAt:null,
    patienceAtService:null
  };
}

function getFlavor(id){
  return FLAVORS.find(x=>x.id===id);
}

function getTopping(id){
  return TOPPINGS.find(x=>x.id===id);
}

/* =========================================================
   ORDER VALIDATION
========================================================= */

function chooseRandomFlavors(count){
  const available = FLAVORS.filter(f => state.inventory[f.id] > 0);

  if(available.length === 0) return [];

  const result = [];

  for(let i=0;i<count;i++){
    const pool = available.filter(f => state.inventory[f.id] > 0);
    if(!pool.length) break;

    const selected = random(pool);
    result.push(selected.id);
  }

  return result;
}

function chooseRandomTopping(){
  const available = TOPPINGS.filter(t => state.toppingInventory[t.id] > 0);
  if(!available.length) return null;
  return random(available).id;
}

function hasFlavorStock(id){
  return !!id && (state.inventory[id] || 0) > 0;
}

function hasToppingStock(id){
  return !!id && (state.toppingInventory[id] || 0) > 0;
}

function validateBuild(customer){
  const build = state.build;

  if(!build.base){
    return {
      ok:false,
      reason:"Bạn hãy chọn ốc quế hoặc ly kem trước nhé!"
    };
  }

  if(customer.requestedBase && build.base !== customer.requestedBase){
    return {
      ok:false,
      reason:"Khách đã yêu cầu loại đế khác rồi."
    };
  }

  if(build.flavors.length !== customer.scoops){
    return {
      ok:false,
      reason:`Khách đang gọi ${customer.scoops} viên kem.`
    };
  }

  if(customer.requestedFlavor){
    const expected = Array.isArray(customer.requestedFlavor)
      ? customer.requestedFlavor
      : [customer.requestedFlavor];

    if(expected.length !== build.flavors.length){
      return {ok:false,reason:"Số viên kem chưa đúng yêu cầu."};
    }

    for(let i=0;i<expected.length;i++){
      if(build.flavors[i] !== expected[i]){
        return {
          ok:false,
          reason:"Vị kem chưa đúng với yêu cầu của khách."
        };
      }
    }
  }

  if(customer.requestedTopping !== null){
    if(build.topping !== customer.requestedTopping){
      return {
        ok:false,
        reason:"Topping chưa đúng yêu cầu của khách."
      };
    }
  }

  return {ok:true};
}

/* =========================================================
   REVIEW
========================================================= */

function makeReview(customer,patience,correct){
  let stars;
  let text;

  if(!correct){
    stars = patience > .8 ? 3 : patience > .3 ? 2 : 1;
    text =
      patience > .5
        ? "Kem đã được phục vụ nhưng chưa đúng món mình gọi."
        : "Mình chờ khá lâu mà phần kem còn chưa đúng yêu cầu.";
  }else if(patience > .8){
    stars = 5;
    text = random(PRAISE_REVIEWS);
  }else if(patience >= .3){
    stars = 3;
    text = random(MID_REVIEWS);
  }else{
    stars = patience > 0 ? 2 : 1;
    text = random(BAD_REVIEWS);
  }

  return {
    id:"r" + Date.now() + Math.random(),
    name:customer.name,
    gender:customer.gender,
    avatarSeed:customer.avatarSeed,
    stars,
    text,
    reply:""
  };
}

/* =========================================================
   CUSTOMER FLOW
========================================================= */

function spawnCustomer(){
  if(!state.isOpen || state.closed || state.activeCustomer) return;

  const c = createCustomer();
  state.activeCustomer = c;

  startPatienceLoop();
  render();
}

function scheduleCustomer(delay=700){
  clearTimeout(state.customerTimer);

  if(!state.isOpen || state.closed) return;

  state.customerTimer = setTimeout(()=>{
    if(state.isOpen && !state.closed && !state.activeCustomer){
      spawnCustomer();
    }
  },delay);
}

function customerTimeout(){
  if(!state.activeCustomer || state.closed) return;

  const c = state.activeCustomer;

  state.walkouts++;
  state.reviews.unshift(makeReview(c,0,false));

  state.activeCustomer = null;
  state.build = {base:null,flavors:[],topping:null};

  stopPatienceLoop();

  toast(`${c.name} đã rời đi vì phải chờ quá lâu.`);

  render();
  scheduleCustomer(700);
}

function startPatienceLoop(){
  stopPatienceLoop();

  const tick = ()=>{
    if(!state.activeCustomer || state.closed){
      return;
    }

    const c = state.activeCustomer;
    const remaining = c.expiresAt - performance.now();
    const max = 70000;

    const pct = clamp(remaining/max,0,1);

    updatePatienceVisual(pct);

    if(remaining <= 0){
      customerTimeout();
      return;
    }

    state.patienceFrame = requestAnimationFrame(tick);
  };

  state.patienceFrame = requestAnimationFrame(tick);
}

function stopPatienceLoop(){
  if(state.patienceFrame){
    cancelAnimationFrame(state.patienceFrame);
    state.patienceFrame = null;
  }
}

function updatePatienceVisual(pct){
  const ring = document.querySelector(".ring-progress");
  const fill = document.querySelector(".patience-fill");

  if(!ring || !fill) return;

  const circumference = 2 * Math.PI * 18;
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference * (1-pct);

  fill.style.width = (pct*100) + "%";

  let color = "#8ec99b";

  if(pct <= .25){
    color = "#dd7786";
  }else if(pct <= .5){
    color = "#e8b75e";
  }

  ring.style.stroke = color;
  fill.style.background = color;
}

/* =========================================================
   SERVICE
========================================================= */

function serviceCustomer(){
  if(state.serving || state.employeeWorking) return;

  const c = state.activeCustomer;

  if(!c) return;

  const result = validateBuild(c);

  if(!result.ok){
    toast(result.reason);
    return;
  }

  if(!state.build.flavors.every(hasFlavorStock)){
    toast("Đã hết một trong các vị kem này, vui lòng nhập thêm ở Kho Hàng!");
    return;
  }

  if(state.build.topping && !hasToppingStock(state.build.topping)){
    toast("Đã hết topping này, vui lòng nhập thêm ở Kho Hàng!");
    return;
  }

  serveAfterPreparation();
}

function consumeBuildStock(){
  state.build.flavors.forEach(id=>{
    state.inventory[id] = Math.max(0,state.inventory[id]-1);
  });

  if(state.build.topping){
    state.toppingInventory[state.build.topping] =
      Math.max(0,state.toppingInventory[state.build.topping]-1);
  }
}

function serveAfterPreparation(){
  state.serving = true;
  render();

  const speedLevel = state.upgrades.scoopSpeed;
  const duration = Math.max(450,1000 - speedLevel*130);

  setTimeout(()=>{
    if(!state.activeCustomer || state.closed){
      state.serving = false;
      return;
    }

    const c = state.activeCustomer;
    const remaining = clamp(
      c.expiresAt-performance.now(),
      0,
      70000
    );

    const patience = remaining/70000;
    const correct = validateBuild(c).ok;

    consumeBuildStock();

    c.servedAt = performance.now();
    c.patienceAtService = patience;

    state.served++;

    const revenue = getPrice();
    state.cash += revenue;
    state.dayRevenue += revenue;

    state.reviews.unshift(makeReview(c,patience,correct));

    state.activeCustomer = null;
    state.build = {base:null,flavors:[],topping:null};
    state.serving = false;

    stopPatienceLoop();

    toast(
      correct
        ? `Đã giao kem cho ${c.name}! +${money(revenue)}`
        : `Đã giao món cho ${c.name}.`
    );

    render();
    scheduleCustomer(700);

  },duration);
}

/* =========================================================
   EMPLOYEE
========================================================= */

function employeeCanWork(){
  return state.upgrades.employee > 0;
}

function employeeAutoPrepare(){
  const c = state.activeCustomer;

  if(!c || !state.build.base || !employeeCanWork()) return;
  if(state.employeeWorking || state.serving) return;

  state.employeeWorking = true;
  render();

  setTimeout(()=>{
    if(!state.activeCustomer || state.closed){
      state.employeeWorking = false;
      return;
    }

    const customer = state.activeCustomer;

    let flavors = [];

    if(customer.randomOrder || !customer.requestedFlavor){
      flavors = chooseRandomFlavors(customer.scoops);
    }else{
      flavors = Array.isArray(customer.requestedFlavor)
        ? [...customer.requestedFlavor]
        : [customer.requestedFlavor];
    }

    if(
      flavors.length !== customer.scoops ||
      !flavors.every(hasFlavorStock)
    ){
      state.employeeWorking = false;
      toast("Nhân viên không tìm đủ nguyên liệu yêu cầu. Hãy nhập thêm ở Kho Hàng!");
      render();
      return;
    }

    let topping = customer.requestedTopping;

    if(customer.randomOrder){
      topping = chooseRandomTopping();
    }

    if(topping && !hasToppingStock(topping)){
      state.employeeWorking = false;
      toast("Nhân viên tìm thấy vị kem nhưng topping đã hết. Hãy nhập thêm ở Kho Hàng!");
      render();
      return;
    }

    state.build.flavors = flavors;
    state.build.topping = topping;

    state.employeeWorking = false;

    setTimeout(()=>{
      if(state.activeCustomer && !state.closed){
        serveAfterPreparation();
      }
    },250);

  },700);
}

/* =========================================================
   BUILD CONTROLS
========================================================= */

function selectBase(id){
  if(!state.isOpen || state.closed) return;

  state.build.base = id;

  if(employeeCanWork()){

  }

}

function selectFlavor(id){
  if(!state.isOpen || state.closed) return;
  if(employeeCanWork()) return;

  if(!hasFlavorStock(id)){
    toast("Bạn chưa mua nguyên liệu này nên chưa thể mở bán.");
    return;
  }

  const needed = state.activeCustomer?.scoops || 1;

  if(state.build.flavors.length >= needed){
    toast(`Khách chỉ gọi ${needed} viên kem.`);
    return;
  }

  state.build.flavors.push(id);
  render();
}

function selectTopping(id){
  if(!state.isOpen || state.closed) return;
  if(employeeCanWork()) return;

  if(!hasToppingStock(id)){
    toast("Bạn chưa mua topping này nên chưa thể sử dụng.");
    return;
  }

  state.build.topping =
    state.build.topping === id ? null : id;

  render();
}

function resetBuild(){
  if(state.serving || state.employeeWorking) return;

  state.build = {
    base:null,
    flavors:[],
    topping:null
  };

  render();
}

/* =========================================================
   CLOCK
========================================================= */

function startClock(){
  stopClock();

  state.dayStartReal = performance.now();
  state.lastClockMinute = 540;

  state.clockTimer = setInterval(()=>{
    if(!state.isOpen || state.closed) return;

    const elapsed = performance.now() - state.dayStartReal;

    /*
      1 real second = 1 game minute.
      09:00 -> 21:00 = 12 real minutes.
    */
    const newMinute = 540 + Math.floor(elapsed/1000);

    state.minutes = Math.min(1260,newMinute);

    if(state.minutes >= 1260){
      state.minutes = 1260;
      closeShop("time");
      return;
    }

    if(state.minutes !== state.lastClockMinute){
      state.lastClockMinute = state.minutes;

      const timeEl = document.querySelector(".clock-time");
      if(timeEl){
        timeEl.textContent = formatTime(state.minutes);
      }
    }
  },200);
}

function stopClock(){
  if(state.clockTimer){
    clearInterval(state.clockTimer);
    state.clockTimer = null;
  }
}

/* =========================================================
   OPEN / CLOSE
========================================================= */

function startBusiness(){
  const input = document.querySelector("#shopNameInput");

  let name = input?.value?.trim() || "";

  if(!name){
    name = "Ngọt Ngào";
  }

  state.shopName = name;
  state.isOpen = true;
  state.closed = false;
  state.minutes = 540;
  state.lastClockMinute = 540;
  state.currentTab = "shop";
  state.screen = "game";

  startClock();

  render();

  setTimeout(()=>{
    if(state.isOpen && !state.activeCustomer){
      spawnCustomer();
    }
  },500);
}

function closeShop(reason="manual"){
  if(state.closed) return;

  state.closed = true;
  state.isOpen = false;

  stopClock();
  stopPatienceLoop();
  clearTimeout(state.customerTimer);

  if(state.activeCustomer){
    state.walkouts++;

    state.reviews.unshift(
      makeReview(state.activeCustomer,0,false)
    );

    state.activeCustomer = null;
  }

  state.build = {
    base:null,
    flavors:[],
    topping:null
  };

  state.summaryNet =
    state.dayRevenue
    - state.dayStockCosts
    - state.dayUpgradeCosts
    - state.dayStaffCosts;

  state.screen = "summary";

  render();
}

/* =========================================================
   SUMMARY / NEW DAY
========================================================= */

function newDay(){
  state.day++;

  state.minutes = 540;
  state.isOpen = true;
  state.closed = false;

  state.dayRevenue = 0;
  state.dayStockCosts = 0;
  state.dayUpgradeCosts = 0;
  state.dayStaffCosts = 0;
  state.served = 0;
  state.walkouts = 0;

  state.activeCustomer = null;
  state.build = {
    base:null,
    flavors:[],
    topping:null
  };

  state.screen = "game";
  state.currentTab = "shop";

  if(employeeCanWork()){
    const wage = 20000 * state.upgrades.employee;
    state.cash -= wage;
    state.dayStaffCosts += wage;
  }

  startClock();
  render();

  setTimeout(()=>{
    if(state.isOpen){
      spawnCustomer();
    }
  },500);
}

/* =========================================================
   WAREHOUSE
========================================================= */

function buyFlavor(id){
  const item = getFlavor(id);

  const carton = 6;
  const cost = item.cost * carton;

  if(totalStock() + carton > getWarehouseCapacity()){
    toast(
      state.upgrades.warehouse === 0
        ? "Kho hiện chưa có sức chứa. Hãy nâng cấp kho trước."
        : "Kho đã đầy, hãy nâng cấp sức chứa."
    );
    return;
  }

  if(state.cash < cost){
    toast("Không đủ tiền để nhập thùng nguyên liệu này.");
    return;
  }

  state.cash -= cost;
  state.dayStockCosts += cost;
  state.inventory[id] += carton;

  toast(`Đã nhập ${carton} phần ${item.name}.`);

  render();
}

function buyTopping(id){
  const item = getTopping(id);

  const carton = 8;
  const cost = item.cost * carton;

  if(totalStock() + carton > getWarehouseCapacity()){
    toast("Kho đã đầy, hãy nâng cấp sức chứa.");
    return;
  }

  if(state.cash < cost){
    toast("Không đủ tiền để nhập topping.");
    return;
  }

  state.cash -= cost;
  state.dayStockCosts += cost;
  state.toppingInventory[id] += carton;

  toast(`Đã nhập ${carton} phần ${item.name}.`);

  render();
}

      max:3
    },
    {
      id:"price",
      icon:"🏷️",
      name:"Nâng cấp giá bán kem",

    },

      levels:[70000],
      max:1
    }
  ];
}

function buyUpgrade(id){
  const item = upgradeData().find(x=>x.id===id);
  if(!item) return;

  const level = state.upgrades[id];

  if(level >= item.max){
    toast("Nâng cấp này đã đạt cấp tối đa.");
    return;
  }

  const cost = item.levels[level];

  if(state.cash < cost){
    toast("Không đủ tiền để nâng cấp.");
    return;
  }

  state.cash -= cost;
  state.dayUpgradeCosts += cost;

  state.upgrades[id]++;

  if(id === "employee"){
    toast("Đã thuê nhân viên! Từ giờ bạn chỉ cần chọn đế kem.");
  }else{
    toast(`Đã nâng cấp ${item.name}.`);
  }

  render();
}

function bindWelcome(){
  const button = document.querySelector("#startBusinessBtn");
  const input = document.querySelector("#shopNameInput");

  if(!button) return;

  /*
    Dùng pointerup + click fallback.
    Không dùng event handler inline để tránh lỗi DOM.
  */
  let fired = false;

  const start = e=>{
    e.preventDefault();

    if(fired) return;
    fired = true;

    startBusiness();

    setTimeout(()=>{
      fired = false;
    },500);
  };

  button.addEventListener("pointerup",start,{passive:false});
  button.addEventListener("click",start);

  input?.addEventListener("keydown",e=>{
    if(e.key === "Enter"){
      e.preventDefault();
      startBusiness();
    }
  });
}

      <div class="step-title">Bước 1 · Chọn đế</div>

      <div class="choice-grid">
        ${BASES.map(b=>`
          <button
            class="choice ${state.build.base===b.id?"selected":""}"
            type="button"
            data-base="${b.id}"
          >
            <div class="choice-main">
              ${b.emoji} ${b.name}
            </div>
            <div class="choice-sub">
              ${state.build.base===b.id ? "Đã chọn" : "Chạm để chọn"}
            </div>
          </button>
        `).join("")}
      </div>
    </div>

    <div class="step">

      <div class="step-title">
        Bước 2 · Chọn vị kem
      </div>

      ${
        employee
          ? `
            <div class="employee-lock">
              👩‍🍳 Nhân viên sẽ tự động chọn đúng
              ${c ? c.scoops : 1} viên theo yêu cầu của khách
              sau khi bạn chọn đế.
            </div>
          `
          : `
            <div class="choice-grid">
              ${FLAVORS.map(f=>`
                <button
                  class="choice ${state.build.flavors.includes(f.id)?"selected":""}
                  ${!hasFlavorStock(f.id)?"disabled":""}"
                  type="button"
                  data-flavor="${f.id}"
                >
                  <div class="choice-main">
                    ${f.emoji} ${esc(f.name)}
                  </div>
                  <div class="choice-sub">
                    Còn ${state.inventory[f.id]} phần
                  </div>
                </button>
              `).join("")}
            </div>
          `
      }

    </div>

    <div class="step">

      <div class="step-title">
        Bước 3 · Topping
      </div>

      ${
        employee
          ? `
            <div class="employee-lock">
              Nhân viên sẽ tự chọn topping nếu khách có yêu cầu
              hoặc nếu khách gọi món ngẫu nhiên.
            </div>
          `
          : `
            <div class="choice-grid">
              ${TOPPINGS.map(t=>`
                <button
                  class="choice ${state.build.topping===t.id?"selected":""}
                  ${!hasToppingStock(t.id)?"disabled":""}"
                  type="button"
                  data-topping="${t.id}"
                >
                  <div class="choice-main">
                    ${t.emoji} ${esc(t.name)}
                  </div>
                  <div class="choice-sub">
                    Còn ${state.toppingInventory[t.id]} phần
                  </div>
                </button>
              `).join("")}
            </div>
          `
      }

    </div>

    ${
      state.employeeWorking
        ? `
          <div class="employee-working">
            👩‍🍳 Nhân viên đang pha đúng công thức cho khách...
          </div>
        `
        : ""
    }

    ${renderPreview()}

    <div class="action-row">

      <button
        class="reset-btn"
        type="button"
        data-action="reset"
        ${state.serving || state.employeeWorking ? "disabled":""}
      >
        LÀM LẠI
      </button>

      <button
        class="serve-btn"
        type="button"
        data-action="serve"
        ${
          !c ||
          state.serving ||
          state.employeeWorking ||
          !state.build.base ||
          state.build.flavors.length !== c?.scoops
            ? "disabled"
            : ""
        }
      >
        ${state.serving ? "ĐANG LÀM..." : "GIAO KEM"}
      </button>

    </div>

  </section>
  `;
}

function renderPreview(){
  const base = state.build.base;
  const flavors = state.build.flavors;

  const mainFlavor = flavors[0]
    ? getFlavor(flavors[0])
    : null;

  const secondFlavor = flavors[1]
    ? getFlavor(flavors[1])
    : null;

  return `
  <div class="build-preview">

    <div class="serve-visual">

      ${
        base === "cone"
          ? `<div class="cone"></div>`
          : `<div class="cup"></div>`
      }

      ${
        mainFlavor
          ? `<div
              class="scoop"
              style="--scoop:${mainFlavor.color}"
            ></div>`
          : ""
      }

      ${
        secondFlavor
          ? `<div
              class="scoop two"
              style="--scoop:${secondFlavor.color}"
            ></div>`
          : ""
      }

      ${
        state.build.topping
          ? `
            <span class="topping-dot" style="left:19px;top:27px"></span>
            <span class="topping-dot" style="left:35px;top:34px"></span>
            <span class="topping-dot" style="left:28px;top:20px"></span>
            <span class="topping-dot" style="left:43px;top:27px"></span>
          `
          : ""
      }

    </div>

    <div class="preview-text">
      ${
        base
          ? BASES.find(b=>b.id===base).name
          : "Chưa chọn đế"
      }
      ·
      ${
        flavors.length
          ? flavors.map(id=>getFlavor(id).name).join(" + ")
          : "chưa có vị"
      }
      ${
        state.build.topping
          ? " · " + getTopping(state.build.topping).name
          : ""
      }
    </div>

  </div>
  `;
}

function renderReview(r){
  let stars = "";

  for(let i=1;i<=5;i++){
    stars += `
      <span class="${i<=r.stars ? "star-gold":"star-white"}">★</span>
    `;
  }

  return `
  <article class="review">

    <div class="review-head">

      <div class="review-mini-avatar">
        ${
          r.gender==="female"
            ? femaleAvatar(r.avatarSeed)
            : maleAvatar(r.avatarSeed)
        }
      </div>

      <div>
        <div class="review-name">
          ${esc(r.name)}
        </div>

        <div class="stars">
          ${stars}
        </div>
      </div>

    </div>

    <div class="review-text">
      ${esc(r.text)}
    </div>

    ${
      r.reply
        ? `

            ${esc(r.reply)}
          </div>
        `
        : `

              placeholder="Trả lời khách..."

}

function animateSummaryMoney(){
  const el = document.querySelector("#summaryMoney");
  if(!el) return;

  const target = Number(el.dataset.target || 0);
  const duration = 850;
  const start = performance.now();

  function frame(now){
    const p = clamp((now-start)/duration,0,1);
    const eased = 1-Math.pow(1-p,3);
    const value = target * eased;

    el.textContent =
      (target < 0 ? "-" : "") +
      money(Math.abs(value));

    if(p < 1){
      requestAnimationFrame(frame);
    }
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   GAME EVENTS
========================================================= */

function bindGame(){
  const root = document.querySelector(".game");
  if(!root) return;

  root.addEventListener("click",handleGameClick);
}

function handleGameClick(e){
  const tab = e.target.closest("[data-tab]");
  if(tab){
    state.currentTab = tab.dataset.tab;
    render();
    return;
  }

  const action = e.target.closest("[data-action]");
  if(action){
    const type = action.dataset.action;

    if(type === "close"){
      closeShop("manual");
      return;
    }

    if(type === "serve"){
      serviceCustomer();
      return;
    }

    if(type === "reset"){
      resetBuild();
      return;
    }

    if(type === "next-day"){
      newDay();
      return;
    }
  }

  const base = e.target.closest("[data-base]");
  if(base){
    selectBase(base.dataset.base);
    return;
  }

  const flavor = e.target.closest("[data-flavor]");
  if(flavor){
    selectFlavor(flavor.dataset.flavor);
    return;
  }

  const topping = e.target.closest("[data-topping]");
  if(topping){
    selectTopping(topping.dataset.topping);
    return;
  }

  const buyFlavorButton = e.target.closest("[data-buy-flavor]");
  if(buyFlavorButton){
    buyFlavor(buyFlavorButton.dataset.buyFlavor);
    return;
  }

  const buyToppingButton = e.target.closest("[data-buy-topping]");
  if(buyToppingButton){
    buyTopping(buyToppingButton.dataset.buyTopping);
    return;
  }

  const upgrade = e.target.closest("[data-upgrade]");
  if(upgrade){
    buyUpgrade(upgrade.dataset.upgrade);
    return;
  }

  const reply = e.target.closest("[data-reply]");
  if(reply){
    sendReply(reply.dataset.reply);
    return;
  }
}

/* =========================================================
   REPLY
========================================================= */

function sendReply(reviewId){
  const input = document.querySelector(
    `[data-reply-input="${CSS.escape(reviewId)}"]`
  );

  if(!input) return;

  const value = input.value.trim();

  if(!value){
    toast("Hãy viết nội dung trả lời khách trước nhé.");
    return;
  }

  const review = state.reviews.find(r=>r.id===reviewId);

  if(!review) return;

  review.reply = value;

  render();
}
