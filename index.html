<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff0f4">
<title>Tiệm Bán Kem Ngọt Ngào</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --pink:#f39aaa;
  --pink-dark:#d96d82;
  --pink-soft:#fff0f4;
  --cream:#fffaf3;
  --brown:#8b604d;
  --brown-dark:#5f4237;
  --oak:#b9825f;
  --oak-light:#d9a27b;
  --green:#8bb49b;
  --green-dark:#668d77;
  --yellow:#f5c96b;
  --blue:#9bbfd8;
  --ink:#503b36;
  --muted:#987f77;
  --white:#ffffff;
  --shadow:0 12px 30px rgba(102,67,56,.10);
  --shadow-soft:0 6px 18px rgba(102,67,56,.08);
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#fff4f6;
  color:var(--ink);
  font-family:
    -apple-system,BlinkMacSystemFont,"Segoe UI",
    "Helvetica Neue",Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

#app{
  min-height:100dvh;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  position:relative;
  min-height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    max(28px,env(safe-area-inset-top))
    20px
    max(28px,env(safe-area-inset-bottom));
  background:
    linear-gradient(180deg,#fff5f8 0%,#fffaf1 58%,#f8eee5 100%);
}

.welcome::before{
  content:"";
  position:absolute;
  inset:auto -10% -90px;
  height:210px;
  background:#f3dfd1;
  border-radius:50% 50% 0 0;
}

.welcome-cloud{
  position:absolute;
  width:120px;
  height:42px;
  background:rgba(255,255,255,.86);
  border-radius:50px;
  filter:blur(.2px);
  opacity:.85;
  animation:cloudMove 17s linear infinite;
}

.welcome-cloud::before,
.welcome-cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.welcome-cloud::before{
  width:52px;
  height:52px;
  left:18px;
  top:-22px;
}

.welcome-cloud::after{
  width:70px;
  height:70px;
  right:15px;
  top:-32px;
}

.cloud-a{
  top:12%;
  left:-140px;
}

.cloud-b{
  top:25%;
  left:-180px;
  width:90px;
  transform:scale(.75);
  animation-duration:23s;
  animation-delay:-8s;
}

.cloud-c{
  top:8%;
  left:-200px;
  transform:scale(.55);
  animation-duration:28s;
  animation-delay:-13s;
}

@keyframes cloudMove{
  from{transform:translateX(-160px)}
  to{transform:translateX(calc(100vw + 260px))}
}

.welcome-mini{
  position:absolute;
  animation:floatMini 4s ease-in-out infinite;
  user-select:none;
}

.mini-1{left:8%;top:20%;animation-delay:-1s}
.mini-2{right:9%;top:18%;animation-delay:-2s}
.mini-3{left:13%;bottom:24%;animation-delay:-3s}
.mini-4{right:12%;bottom:26%;animation-delay:-.5s}
.mini-5{left:28%;top:11%;animation-delay:-2.5s}

@keyframes floatMini{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-12px) rotate(5deg)}
}

.welcome-card{
  position:relative;
  z-index:5;
  width:min(100%,470px);
  text-align:center;
}

.welcome-hero{
  width:250px;
  height:270px;
  margin:0 auto 4px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:wobble 4.2s ease-in-out infinite;
  transform-origin:50% 88%;
}

@keyframes wobble{
  0%,100%{transform:rotate(0deg) translateY(0)}
  25%{transform:rotate(2deg) translateY(-4px)}
  50%{transform:rotate(-2.5deg) translateY(1px)}
  75%{transform:rotate(1.5deg) translateY(-3px)}
}

.welcome-title{
  margin:2px 0 4px;
  font-size:clamp(29px,8vw,42px);
  line-height:1;
  font-weight:900;
  letter-spacing:-1.5px;
  color:#875a4b;
}

.welcome-sub{
  margin:0 auto 20px;
  max-width:340px;
  color:#a28379;
  font-size:14px;
  line-height:1.55;
}

.name-box{
  display:flex;
  gap:9px;
  background:rgba(255,255,255,.82);
  padding:7px;
  border:1px solid rgba(139,96,77,.09);
  border-radius:20px;
  box-shadow:var(--shadow);
}

.name-box input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  padding:12px 14px;
  color:var(--ink);
}

.name-box input::placeholder{
  color:#bca69e;
}

.primary-btn{
  min-height:48px;
  padding:0 18px;
  border-radius:16px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(180deg,#f5a9b7,#e78397);
  box-shadow:0 7px 0 #cf7284;
  transition:.16s ease;
}

.primary-btn:active{
  transform:translateY(4px);
  box-shadow:0 3px 0 #cf7284;
}

/* =========================================================
   APP SHELL
========================================================= */

.game-shell{
  width:min(100%,540px);
  min-height:100dvh;
  margin:0 auto;
  background:#fff8f4;
  position:relative;
  overflow:hidden;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  padding:
    max(12px,env(safe-area-inset-top))
    14px
    11px;
  background:rgba(255,248,244,.95);
  border-bottom:1px solid rgba(130,93,75,.08);
  backdrop-filter:blur(12px);
}

.topbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.shop-brand{
  min-width:0;
}

.shop-brand small{
  display:block;
  color:#b08f83;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.shop-brand strong{
  display:block;
  max-width:210px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:17px;
}

.money{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border-radius:15px;
  background:#fff;
  box-shadow:var(--shadow-soft);
  font-weight:900;
  color:#765041;
  white-space:nowrap;
}

.money-icon{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#f8d681;
  color:#79572b;
  font-size:14px;
}

.main{
  padding:12px 12px 98px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin:8px 3px 10px;
}

.section-head h2{
  margin:0;
  font-size:20px;
  letter-spacing:-.5px;
}

.section-head p{
  margin:3px 0 0;
  color:#a1887e;
  font-size:12px;
}

.day-pill{
  padding:7px 10px;
  background:#fff;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  box-shadow:var(--shadow-soft);
}

/* =========================================================
   STATUS
========================================================= */

.status-card{
  padding:12px;
  background:#fff;
  border-radius:21px;
  box-shadow:var(--shadow-soft);
  margin-bottom:12px;
}

.status-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.status-badge{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:900;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#d3bfb6;
}

.status-dot.open{
  background:#75ad87;
}

.clock{
  font-size:17px;
  font-weight:900;
  letter-spacing:.4px;
}

.target{
  margin-top:10px;
}

.target-label{
  display:flex;
  justify-content:space-between;
  color:#91776d;
  font-size:11px;
  font-weight:800;
  margin-bottom:5px;
}

.progress{
  height:8px;
  border-radius:99px;
  background:#f1e5df;
  overflow:hidden;
}

.progress > span{
  display:block;
  height:100%;
  width:0;
  border-radius:inherit;
  background:linear-gradient(90deg,#ef9eae,#e77c94);
  transition:width .25s ease;
}

/* =========================================================
   SHOP COUNTER
========================================================= */

.counter{
  position:relative;
  min-height:245px;
  overflow:hidden;
  border-radius:26px;
  background:
    linear-gradient(180deg,#fff9f3 0 68%,#b77e5b 68% 100%);
  box-shadow:var(--shadow);
  border:1px solid rgba(112,76,58,.08);
  margin-bottom:12px;
}

.awning{
  height:62px;
  background:
    repeating-linear-gradient(
      90deg,
      #f5aab7 0 35px,
      #fff7f0 35px 70px
    );
  border-radius:0 0 35px 35px;
  box-shadow:0 5px 0 rgba(114,78,61,.08);
  position:relative;
}

.awning::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-10px;
  height:20px;
  background:
    repeating-linear-gradient(
      90deg,
      #f5aab7 0 35px,
      #fff7f0 35px 70px
    );
  border-radius:0 0 40px 40px;
}

.counter-sign{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 16px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 5px 12px rgba(100,60,50,.12);
  font-size:12px;
  font-weight:900;
  color:#795547;
  z-index:3;
  white-space:nowrap;
}

.jars{
  position:absolute;
  left:12px;
  right:12px;
  top:78px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}

.jar{
  min-width:0;
  text-align:center;
}

.jar-body{
  position:relative;
  height:72px;
  border:3px solid #d4d0cb;
  border-top-width:5px;
  border-radius:12px 12px 16px 16px;
  background:#fff;
  overflow:hidden;
  box-shadow:inset 0 5px 7px rgba(255,255,255,.9);
}

.jar-body::before{
  content:"";
  position:absolute;
  top:0;
  left:8px;
  width:7px;
  height:100%;
  background:rgba(255,255,255,.55);
  border-radius:10px;
}

.jar-lid{
  position:absolute;
  width:calc(100% - 5px);
  height:9px;
  top:-4px;
  left:2.5px;
  border-radius:9px;
  background:#bcb8b2;
}

.jar-fill{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:0;
  transition:height .3s ease;
}

.jar-name{
  margin-top:4px;
  font-size:8px;
  font-weight:800;
  color:#76584b;
}

.jar-stock{
  font-size:8px;
  color:#ad9185;
}

.cat-area{
  position:absolute;
  right:18px;
  bottom:10px;
  width:105px;
  height:90px;
  z-index:5;
}

.cat-svg{
  width:100%;
  height:100%;
}

.zzz{
  animation:zzz 2.8s ease-in-out infinite;
  transform-origin:center;
}

.zzz2{
  animation-delay:1s;
}

@keyframes zzz{
  0%{opacity:0;transform:translate(0,8px) scale(.75)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(12px,-27px) scale(1.05)}
}

.counter-decoration{
  position:absolute;
  left:18px;
  bottom:16px;
  display:flex;
  gap:8px;
}

.sticker{
  width:25px;
  height:25px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#fff5c9;
  font-size:13px;
  box-shadow:0 3px 8px rgba(80,50,40,.09);
}

/* =========================================================
   CUSTOMER
========================================================= */

.customer-card{
  background:#fff;
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:13px;
  margin-bottom:12px;
}

.customer-top{
  display:flex;
  align-items:flex-start;
  gap:11px;
}

.customer-avatar{
  width:65px;
  height:65px;
  flex:0 0 65px;
  border-radius:20px;
  background:#fff1e9;
  overflow:hidden;
}

.customer-info{
  min-width:0;
  flex:1;
}

.customer-name{
  font-weight:900;
  font-size:15px;
}

.customer-type{
  color:#ae8e83;
  font-size:10px;
  margin-top:2px;
}

.speech{
  margin-top:8px;
  position:relative;
  padding:10px 11px;
  border-radius:15px 15px 15px 5px;
  background:#fff5ef;
  color:#695148;
  font-size:12px;
  line-height:1.5;
}

.speech::before{
  content:"";
  position:absolute;
  left:-5px;
  top:11px;
  width:10px;
  height:10px;
  background:#fff5ef;
  transform:rotate(45deg);
}

.hurry{
  margin-top:6px;
  color:#d97888;
  font-size:11px;
  font-weight:800;
  animation:hurryPulse 1.2s ease-in-out infinite;
}

@keyframes hurryPulse{
  50%{opacity:.55}
}

.patience-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:12px;
}

.patience-ring{
  width:48px;
  height:48px;
  position:relative;
  flex:0 0 48px;
}

.patience-ring svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.ring-bg{
  fill:none;
  stroke:#eee2dc;
  stroke-width:5;
}

.ring-value{
  fill:none;
  stroke:#83ad91;
  stroke-width:5;
  stroke-linecap:round;
  stroke-dasharray:125.66;
  stroke-dashoffset:0;
}

.patience-copy{
  flex:1;
}

.patience-copy strong{
  display:block;
  font-size:12px;
}

.patience-copy span{
  display:block;
  margin-top:3px;
  color:#a58b82;
  font-size:10px;
}

/* =========================================================
   PREP AREA
========================================================= */

.prep-card{
  background:#fff;
  border-radius:24px;
  padding:13px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:13px;
}

.step{
  text-align:center;
  padding:8px 4px;
  border-radius:12px;
  background:#f7efeb;
  color:#aa8e83;
  font-size:9px;
  font-weight:900;
}

.step.active{
  background:#ffe0e6;
  color:#c9697d;
}

.ice-preview{
  min-height:145px;
  border-radius:19px;
  background:
    radial-gradient(circle at 25% 25%,rgba(255,255,255,.85),transparent 22%),
    linear-gradient(145deg,#fff8f3,#f8ebe1);
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:12px;
  overflow:hidden;
}

.ice-preview svg{
  width:145px;
  height:145px;
  transition:.3s ease;
}

.step-title{
  margin:0 0 9px;
  font-size:13px;
  font-weight:900;
}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.choice{
  min-height:62px;
  border-radius:15px;
  background:#faf5f1;
  border:1px solid #eee1da;
  padding:7px 4px;
  color:#76584d;
  transition:.16s ease;
}

.choice:active{
  transform:scale(.97);
}

.choice.selected{
  border-color:#e993a5;
  background:#fff0f3;
  box-shadow:inset 0 0 0 2px rgba(233,147,165,.16);
}

.choice .emoji{
  display:block;
  font-size:21px;
  line-height:23px;
}

.choice .label{
  display:block;
  font-size:9px;
  font-weight:900;
  margin-top:3px;
}

.choice .stock{
  display:block;
  color:#ad9187;
  font-size:8px;
  margin-top:2px;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.secondary-btn,
.serve-btn{
  min-height:48px;
  border-radius:15px;
  font-weight:900;
}

.secondary-btn{
  background:#f2e7e0;
  color:#795c50;
}

.serve-btn{
  background:linear-gradient(180deg,#f4a7b5,#e47f94);
  color:#fff;
  box-shadow:0 5px 0 #cf7183;
}

.serve-btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #cf7183;
}

.serve-btn:disabled{
  opacity:.5;
  box-shadow:none;
}

/* =========================================================
   CLOSED
========================================================= */

.closed-card{
  text-align:center;
  background:#fff;
  border-radius:26px;
  box-shadow:var(--shadow);
  padding:24px 18px;
  margin-bottom:12px;
}

.closed-icon{
  width:65px;
  height:65px;
  margin:0 auto 10px;
  border-radius:21px;
  background:#fff0e9;
  display:grid;
  place-items:center;
  font-size:29px;
}

.closed-card h3{
  margin:0;
  font-size:19px;
}

.closed-card p{
  margin:7px auto 17px;
  max-width:330px;
  color:#9c8379;
  font-size:12px;
  line-height:1.55;
}

.open-btn{
  width:100%;
  min-height:51px;
  border-radius:17px;
  background:#8eaf98;
  color:#fff;
  font-weight:900;
  box-shadow:0 5px 0 #6d9079;
}

.open-btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #6d9079;
}

/* =========================================================
   WAREHOUSE
========================================================= */

.warehouse-note{
  padding:12px;
  border-radius:18px;
  background:#fff4df;
  color:#886b45;
  font-size:11px;
  line-height:1.5;
  margin-bottom:12px;
}

.stock-section{
  margin-bottom:16px;
}

.stock-section h3{
  font-size:14px;
  margin:0 3px 8px;
}

.stock-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.stock-card{
  background:#fff;
  border-radius:19px;
  padding:10px;
  box-shadow:var(--shadow-soft);
  border:1px solid rgba(120,80,65,.06);
}

.stock-art{
  height:78px;
  border-radius:14px;
  background:#f8f0e9;
  display:grid;
  place-items:center;
  margin-bottom:8px;
}

.box-art{
  position:relative;
  width:55px;
  height:48px;
  background:#dca879;
  border-radius:7px;
  border:3px solid #b87e58;
  box-shadow:inset 0 8px 0 rgba(255,255,255,.18);
}

.box-art::before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:17px;
  height:4px;
  background:#f8e1c7;
  border-radius:4px;
}

.box-art::after{
  content:"";
  position:absolute;
  left:21px;
  top:7px;
  width:10px;
  height:28px;
  border-left:3px solid #b87e58;
  border-right:3px solid #b87e58;
}

.cone-art{
  width:0;
  height:0;
  border-left:23px solid transparent;
  border-right:23px solid transparent;
  border-top:55px solid #d9a56f;
  position:relative;
}

.cone-art::after{
  content:"";
  position:absolute;
  left:-16px;
  top:-42px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#f5b4bf;
}

.cup-art{
  width:49px;
  height:54px;
  border:3px solid #c8a99c;
  border-radius:6px 6px 14px 14px;
  background:linear-gradient(90deg,#fff,#f7e9df,#fff);
  position:relative;
}

.cup-art::before{
  content:"";
  position:absolute;
  left:4px;
  right:4px;
  top:-8px;
  height:10px;
  border-radius:50%;
  background:#d9d2ca;
}

.stock-name{
  font-size:12px;
  font-weight:900;
}

.stock-info{
  display:flex;
  justify-content:space-between;
  gap:4px;
  margin:4px 0 8px;
  color:#a0887e;
  font-size:9px;
}

.buy-btn{
  width:100%;
  min-height:35px;
  border-radius:11px;
  background:#f0e6df;
  color:#73574c;
  font-size:10px;
  font-weight:900;
}

.buy-btn:active{
  transform:scale(.98);
}

/* =========================================================
   UPGRADES
========================================================= */

.upgrade-grid{
  display:grid;
  gap:10px;
}

.upgrade-card{
  display:flex;
  gap:12px;
  align-items:center;
  background:#fff;
  border-radius:20px;
  padding:13px;
  box-shadow:var(--shadow-soft);
}

function money(value){
  return new Intl.NumberFormat("vi-VN").format(Math.round(value)) + "đ";
}

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function targetForDay(day){
  return 20 + (day-1)*10;
}

function warehouseCapacity(){
  return 12 + state.upgrades.warehouse*6;
}

function baseCapacity(){
  return 16 + state.upgrades.warehouse*8;
}

  return 16 + state.upgrades.warehouse*8;
}

function servicePrice(){
  const prices = [10000,15000,25000,50000,70000,90000,110000];
  return prices[Math.min(state.upgrades.price,prices.length-1)];
}

function prepDelay(){
  const delays = [2300,1900,1550,1250,1000];
  return delays[Math.min(state.upgrades.scoopSpeed,delays.length-1)];
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;

    const parsed = JSON.parse(raw);
    const fresh = freshState();

    state = {
      ...fresh,
      ...parsed,
      inventory:{
        ...fresh.inventory,
        ...(parsed.inventory||{}),
        flavors:{
          ...fresh.inventory.flavors,
          ...((parsed.inventory||{}).flavors||{})
        },
        toppings:{
          ...fresh.inventory.toppings,
          ...((parsed.inventory||{}).toppings||{})
        },
        bases:{
          ...fresh.inventory.bases,
          ...((parsed.inventory||{}).bases||{})
        }
      },
      purchased:{
        ...fresh.purchased,
        ...(parsed.purchased||{}),
        flavors:{
          ...fresh.purchased.flavors,
          ...((parsed.purchased||{}).flavors||{})
        },
        toppings:{
          ...fresh.purchased.toppings,
          ...((parsed.purchased||{}).toppings||{})
        },
        bases:{
          ...fresh.purchased.bases,
          ...((parsed.purchased||{}).bases||{})
        }
      },
      upgrades:{
        ...fresh.upgrades,
        ...(parsed.upgrades||{})
      },
      employee:{
        ...fresh.employee,
        ...(parsed.employee||{})
      },
      build:{
        ...fresh.build,
        ...(parsed.build||{})
      },
      reviews:Array.isArray(parsed.reviews)?parsed.reviews:[]
    };

    state.isOpen=false;
    state.activeCustomer=null;
    state.build=fresh.build;
    state.minutes=540;
  }catch(e){
    state=freshState();
  }
}

function resetBuild(){
  state.build={
    base:null,
    flavors:[],
    topping:null
  };
}

function flavorStock(key){
  return state.inventory.flavors[key]||0;
}

function toppingStock(key){
  return state.inventory.toppings[key]||0;
}

function baseStock(key){
  return state.inventory.bases[key]||0;
}

function hasAnyBase(){
  return Object.values(state.inventory.bases).some(v=>v>0);
}

function hasAnyFlavor(){
  return Object.values(state.inventory.flavors).some(v=>v>0);
}

function canOpenShop(){
  return hasAnyBase() && hasAnyFlavor();
}

function availableFlavorKeys(){
  return Object.keys(FLAVORS).filter(k=>flavorStock(k)>0);
}

function availableToppingKeys(){
  return Object.keys(TOPPINGS).filter(k=>toppingStock(k)>0);
}

function selectedFlavorCount(){
  return state.build.flavors.length;
}

/* =========================================================
   CUSTOMER GENERATION
========================================================= */

function buildOrder(){
  const base = Math.random()<.55 ? "cone" : "cup";

  let scoops=1;
  let randomFlavors=false;
  let randomTopping=false;

  if(state.day>=3 && Math.random()<.55){
    scoops=2;
  }

  if(state.day>=5 && Math.random()<.30){
    randomFlavors=true;
    scoops=2;
  }

  let flavors=[];

  if(!randomFlavors){
    const pool=Object.keys(FLAVORS);
    flavors=[randomItem(pool)];

    if(scoops===2){
      flavors.push(randomItem(pool));
    }
  }

  let topping=null;

  if(state.day>=3 && Math.random()<.55){
    topping=randomItem(Object.keys(TOPPINGS));
  }

  if(state.day>=5 && Math.random()<.18){
    randomTopping=true;
    topping=null;
  }

  return {
    base,
    scoops,
    flavors,
    randomFlavors,
    topping,
    randomTopping
  };
}

function orderText(order, gender){
  const base=BASES[order.base].name;

  let flavorText;

  if(order.randomFlavors){
    flavorText="vị bất kỳ do shop lựa chọn";
  }else{
    flavorText=order.flavors.map(k=>FLAVORS[k].short).join(" và ");
  }

  let toppingText="";

  if(order.randomTopping){
    toppingText=" và thêm một loại topping phù hợp";
  }else if(order.topping){
    toppingText=" cùng " + TOPPINGS[order.topping].name;
  }

  const pool=gender==="female"?FEMALE_TALKS:MALE_TALKS;
  return randomItem(pool)
    .replaceAll("{flavor}",flavorText)
    .replaceAll("{base}",base)
    .replaceAll("{topping}",toppingText || "một chút topping");
}

function createCustomer(){
  if(!state.isOpen || state.activeCustomer) return;

  const gender=Math.random()<.5?"female":"male";
  const name=gender==="female"
    ? randomItem(FEMALE_NAMES)
    : randomItem(MALE_NAMES);

  const order=buildOrder();

  state.activeCustomer={
    id:Date.now()+"_"+Math.random(),
    gender,
    name,
    anonymousReview:Math.random()<.28,
    order,
    text:orderText(order,gender),
    hurrySent:false,
    createdAt:Date.now(),
    expiresAt:Date.now()+customerMaxMs
  };

  customerStartTime=Date.now();

  resetBuild();
  saveState();
  render();
}

/* =========================================================
   INVENTORY / ORDER
========================================================= */

function exactFlavorMatch(selected,requested){
  if(selected.length!==requested.length) return false;

  const a=[...selected].sort();
  const b=[...requested].sort();

  return a.every((v,i)=>v===b[i]);
}

function resolveRandomFlavors(count){
  const available=availableFlavorKeys();

  if(available.length===0) return null;

  if(available.length===1){
    if(flavorStock(available[0])>=count){
      return Array(count).fill(available[0]);
    }
    return null;
  }

  const shuffled=[...available].sort(()=>Math.random()-.5);

  for(let i=0;i<shuffled.length;i++){
    for(let j=0;j<shuffled.length;j++){
      const candidate=[shuffled[i],shuffled[j]];

      if(count===1) candidate.splice(1,1);

      const ok=candidate.every((key,index)=>{
        return candidate.filter(x=>x===key).length<=flavorStock(key);
      });

      if(ok && candidate.length===count){
        return candidate;
      }
    }
  }

  return null;
}

function orderMatches(){
  const customer=state.activeCustomer;
  if(!customer) return {ok:false,reason:"Chưa có khách hàng."};

  const order=customer.order;

  if(state.build.base!==order.base){
    return {
      ok:false,
      reason:"Bạn đang chọn sai loại đế mà khách yêu cầu."
    };
  }

  if(state.build.flavors.length!==order.scoops){
    return {
      ok:false,
      reason:"Số viên kem chưa đúng với đơn của khách."
    };
  }

  if(order.randomFlavors){
    const counts={};

    for(const f of state.build.flavors){
      counts[f]=(counts[f]||0)+1;
    }

    for(const [key,count] of Object.entries(counts)){
      if(flavorStock(key)<count){
        return {
          ok:false,
          reason:`Đã hết ${FLAVORS[key].name}, vui lòng nhập thêm ở Kho Hàng!`
        };
      }
    }
  }else{
    if(!exactFlavorMatch(state.build.flavors,order.flavors)){
      return {
        ok:false,
        reason:"Vị kem chưa đúng với yêu cầu của khách."
      };
    }
  }

  if(order.randomTopping){
    if(!state.build.topping){
      return {
        ok:false,
        reason:"Khách đang yêu cầu thêm một loại topping."
      };
    }
  }else{
    if(state.build.topping!==order.topping){
      return {
        ok:false,
        reason:"Topping chưa đúng với yêu cầu của khách."
      };
    }
  }

  return {ok:true};
}

function inventoryCanConsume(){
  const check=orderMatches();

  if(!check.ok) return check;

  if(baseStock(state.build.base)<=0){
    return {
      ok:false,
      reason:`Đã hết ${BASES[state.build.base].name}, vui lòng nhập thêm ở Kho Hàng!`
    };
  }

  for(const f of state.build.flavors){
    if(flavorStock(f)<=0){
      return {
        ok:false,
        reason:`Đã hết ${FLAVORS[f].name}, vui lòng nhập thêm ở Kho Hàng!`
      };
    }
  }

  if(state.build.topping && toppingStock(state.build.topping)<=0){
    return {
      ok:false,
      reason:`Đã hết ${TOPPINGS[state.build.topping].name}, vui lòng nhập thêm ở Kho Hàng!`
    };
  }

  return {ok:true};
}

function consumeInventory(){
  state.inventory.bases[state.build.base]--;

  for(const f of state.build.flavors){
    state.inventory.flavors[f]--;
  }

  if(state.build.topping){
    state.inventory.toppings[state.build.topping]--;
  }
}

/* =========================================================
   EMPLOYEE
========================================================= */

function employeeCanWork(){
  return state.employee.hired && state.upgrades.employee>0;
}

function employeePrepare(){
  if(!employeeCanWork()) return false;
  if(!state.activeCustomer) return false;
  if(!state.build.base) return false;

  const order=state.activeCustomer.order;

  let flavors;

  if(order.randomFlavors){
    flavors=resolveRandomFlavors(order.scoops);
    if(!flavors){
      showModal(
        "Kho nguyên liệu",
        "Nhân viên không tìm đủ nguyên liệu phù hợp cho đơn này. Vui lòng nhập thêm hàng.",
        "📦",
        [
          {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
          {label:"Đóng",action:closeModal}
        ]
      );
      return false;
    }
  }else{
    flavors=[...order.flavors];
  }

  const topping=order.randomTopping
    ? randomItem(availableToppingKeys())
    : order.topping;

  if(order.randomTopping && !topping){
    showModal(
      "Thiếu topping",
      "Nhân viên cần ít nhất một loại topping còn hàng để hoàn thành đơn.",
      "🍒",
      [
        {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
        {label:"Đóng",action:closeModal}
      ]
    );
    return false;
  }

  const requiredBase=state.build.base;

  if(baseStock(requiredBase)<=0){
    showModal(
      "Hết đế kem",
      `Đã hết ${BASES[requiredBase].name}. Vui lòng nhập thêm ở Kho Hàng.`,
      "📦",
      [
        {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
        {label:"Đóng",action:closeModal}
      ]
    );
    return false;
  }

  const counts={};

  for(const f of flavors){
    counts[f]=(counts[f]||0)+1;
  }

  for(const [key,count] of Object.entries(counts)){
    if(flavorStock(key)<count){
      showModal(
        "Hết nguyên liệu",
        `Đã hết ${FLAVORS[key].name}. Vui lòng nhập thêm ở Kho Hàng.`,
        "🍨",
        [
          {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
          {label:"Đóng",action:closeModal}
        ]
      );
      return false;
    }
  }

  if(topping && toppingStock(topping)<=0){
    showModal(
      "Hết topping",
      `Đã hết ${TOPPINGS[topping].name}. Vui lòng nhập thêm ở Kho Hàng.`,
      "🍒",
      [
        {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
        {label:"Đóng",action:closeModal}
      ]
    );
    return false;
  }

  resetBuild();
  state.build.base=requiredBase;
  state.build.flavors=flavors;
  state.build.topping=topping;

  render();

  employeeTimer=setTimeout(()=>{
    if(!state.activeCustomer || !state.isOpen) return;

    const valid=inventoryCanConsume();

    if(!valid.ok){
      showModal(
        "Không thể hoàn thành",
        valid.reason,
        "📦",
        [
          {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
          {label:"Đóng",action:closeModal}
        ]
      );
      return;
    }

    serveCustomer(true);
  },prepDelay());

  return true;
}

/* =========================================================
   SERVICE
========================================================= */

function calculateStars(remainingRatio){
  if(remainingRatio>.8) return 5;
  if(remainingRatio>=.3) return 3;
  return Math.random()<.5?1:2;
}

function createReview(customer,stars,walkout=false){
  let anonymous=false;

  if(walkout){
    anonymous=true;
  }else{
    anonymous=stars<=2 ? Math.random()<.72 : Math.random()<.12;
  }

  let text;

  if(anonymous){
    text=randomItem(ANON_COMPLAINTS);
  }else{
    const pool=REVIEW_TEXT[stars]||REVIEW_TEXT[3];
    text=randomItem(pool);
  }

  state.reviews.unshift({
    id:Date.now()+"_"+Math.random(),
    customerName:customer.name,
    gender:customer.gender,
    anonymous,
    stars,
    text,
    reply:"",
    day:state.day,
    createdAt:Date.now()
  });

  if(state.reviews.length>80){
    state.reviews=state.reviews.slice(0,80);
  }
}

function serveCustomer(fromEmployee=false){
  if(!state.activeCustomer) return;

  const check=inventoryCanConsume();

  if(!check.ok){
    showModal(
      "Chưa thể giao kem",
      check.reason,
      "🍨",
      [
        {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
        {label:"Đóng",action:closeModal}
      ]
    );
    return;
  }

  const now=Date.now();
  const remaining=Math.max(
    0,
    (state.activeCustomer.expiresAt-now)/customerMaxMs
  );

  consumeInventory();

  const revenue=servicePrice();

  state.cash+=revenue;
  state.dayRevenue+=revenue;
  state.served++;

  createReview(
    state.activeCustomer,
    calculateStars(remaining),
    false
  );

  const customerName=state.activeCustomer.name;

  clearCustomer();

  state.serviceMessage=`Đã phục vụ thành công cho khách ${customerName}! +${money(revenue)}`;

  saveState();
  render();

  setTimeout(()=>{
    state.serviceMessage="";
    if(state.isOpen && !state.activeCustomer){
      createCustomer();
    }
  },1300);
}

function clearCustomer(){
  state.activeCustomer=null;
  resetBuild();

  if(customerTimer){
    cancelAnimationFrame(customerTimer);
    customerTimer=null;
  }

  if(employeeTimer){
    clearTimeout(employeeTimer);
    employeeTimer=null;
  }
}

function customerWalkout(){
  if(!state.activeCustomer) return;

  const customer=state.activeCustomer;

  state.walkouts++;

  createReview(customer,Math.random()<.5?1:2,true);

  clearCustomer();

  state.serviceMessage=`${customer.name} đã rời đi vì phải chờ quá lâu.`;

  saveState();
  render();

  setTimeout(()=>{
    state.serviceMessage="";
    if(state.isOpen && !state.activeCustomer){
      createCustomer();
    }
  },900);
}

/* =========================================================
   CLOCK / PATIENCE
========================================================= */

function startClock(){
  stopClock();

  let realStart=Date.now();

  clockTimer=setInterval(()=>{
    if(!state.isOpen) return;

    const elapsed=Math.floor((Date.now()-realStart)/1000);

    state.minutes=540+elapsed;

    if(state.minutes>=1260){
      state.minutes=1260;
      stopClock();
      handleDayEnd();
    }

    saveState();
    render();
  },1000);
}

function stopClock(){
  if(clockTimer){
    clearInterval(clockTimer);
    clockTimer=null;
  }
}

function formatGameTime(){
  const h=Math.floor(state.minutes/60);
  const m=state.minutes%60;

  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

function patienceRatio(){
  if(!state.activeCustomer) return 1;

  return Math.max(
    0,
    Math.min(
      1,
      (state.activeCustomer.expiresAt-Date.now())/customerMaxMs
    )
  );
}

function patienceLoop(){
  if(state.activeCustomer && state.isOpen){
    const ratio=patienceRatio();

    if(ratio<=0){
      customerWalkout();
      return;
    }

    if(
      ratio<.5 &&
      !state.activeCustomer.hurrySent
    ){
      state.activeCustomer.hurrySent=true;
      state.activeCustomer.text+="\n\n"+randomItem(HURRY_MESSAGES);
      saveState();
      render();
    }
  }

  requestAnimationFrame(patienceLoop);
}

function startPatienceLoop(){
  requestAnimationFrame(patienceLoop);
}

/* =========================================================
   DAY / OPEN / CLOSE
========================================================= */

function payEmployeeIfNeeded(){
  if(!state.employee.hired) return true;

  if(state.day-state.employeePaidDay<2){
    return true;
  }

  const wage=state.upgrades.employee>=2 ? 50000 : 40000;

  if(state.cash<wage){
    return false;
  }

  state.cash-=wage;
  state.dayStaffCosts+=wage;
  state.employeePaidDay=state.day;

  return true;
}

function openShop(){
  if(!canOpenShop()){
    showModal(
      "Chưa thể mở cửa",
      "Bạn cần mua nguyên liệu ở Kho Hàng trước khi mở bán!",
      "📦",
      [
        {label:"Đến Kho Hàng",primary:true,action:()=>{state.screen="warehouse";closeModal();render();}},
        {label:"Đóng",action:closeModal}
      ]
    );
    return;
  }

  if(state.employee.hired){
    const shouldPay =
      state.employeePaidDay===0 ||
      state.day-state.employeePaidDay>=2;

    if(shouldPay){
      const wage=state.upgrades.employee>=2 ? 50000 : 40000;

      if(state.cash<wage){
        showModal(
          "Chưa đủ tiền",
          `Không đủ tiền trả lương nhân viên. Cần ${money(wage)} cho kỳ lương hiện tại.`,
          "💰",
          [
            {label:"Đóng",primary:true,action:closeModal}
          ]
        );
        return;
      }

      state.cash-=wage;
      state.dayStaffCosts+=wage;
      state.employeePaidDay=state.day;
    }
  }

  state.isOpen=true;
  state.minutes=540;
  state.dayEndHandled=false;
  state.screen="shop";
  state.serviceMessage="";

  saveState();
  render();
  startClock();

  setTimeout(()=>{
    if(state.isOpen && !state.activeCustomer){
      createCustomer();
    }
  },700);
}

function closeShop(){
  if(!state.isOpen) return;

  if(state.served<targetForDay(state.day)){
    state.isOpen=false;
    stopClock();
    clearCustomer();

    showModal(
      "Chưa hoàn thành chỉ tiêu",
      `Ngày ${state.day} cần phục vụ ${targetForDay(state.day)} đơn. Hiện bạn mới đạt ${state.served} đơn. Bạn chưa thể sang ngày mới.`,
      "📋",
      [
        {
          label:"Tiếp tục ngày này",
          primary:true,
          action:()=>{
            closeModal();
            state.minutes=540;
            state.isOpen=false;
            saveState();
            render();
          }
        },
        {
          label:"Ở lại quản lý",
          action:closeModal
        }
      ]
    );

    return;
  }

  finishDay();
}

function handleDayEnd(){
  if(state.dayEndHandled) return;

  state.dayEndHandled=true;
  state.isOpen=false;
  clearCustomer();

  if(state.served<targetForDay(state.day)){
    saveState();
    render();

    showModal(
      "Chưa đạt chỉ tiêu hôm nay",
      `Đã đến 21:00 nhưng bạn mới phục vụ ${state.served}/${targetForDay(state.day)} đơn. Bạn cần tiếp tục ngày ${state.day}, chưa được sang ngày tiếp theo.`,
      "🌙",
      [
        {
          label:"Tiếp tục ngày này",
          primary:true,
          action:()=>{
            closeModal();
            state.minutes=540;
            state.dayEndHandled=false;
            state.isOpen=false;
            saveState();
            render();
          }
        },
        {
          label:"Ở lại quản lý",
          action:closeModal
        }
      ]
    );
  }else{
    finishDay();
  }
}

function finishDay(){
  state.isOpen=false;
  stopClock();
  clearCustomer();
  saveState();
  render();

  const revenue=state.dayRevenue;
  const costs=state.dayStockCosts+state.dayUpgradeCosts+state.dayStaffCosts;
  const profit=revenue-costs;

  showModal(
    `Hoàn thành Ngày ${state.day}`,
    `
      <div class="summary-box">
        <div class="summary-target">
          Chỉ tiêu: ${state.served}/${targetForDay(state.day)} đơn

        <div class="summary-list">
          <div class="summary-row">
            <span>Doanh thu</span>
            <strong>${money(revenue)}</strong>
          </div>
          <div class="summary-row">
            <span>Tiền nhập hàng</span>
            <strong>-${money(state.dayStockCosts)}</strong>
          </div>
          <div class="summary-row">
            <span>Tiền nâng cấp</span>
            <strong>-${money(state.dayUpgradeCosts)}</strong>
          </div>
          <div class="summary-row">
            <span>Lương nhân viên</span>
            <strong>-${money(state.dayStaffCosts)}</strong>
          </div>
          <div class="summary-row">
            <span>Khách rời đi</span>
            <strong>${state.walkouts}</strong>
          </div>
        </div>
      </div>
    `,
    "🎉",
    [
      {
        label:`Sang Ngày ${state.day+1}`,
        primary:true,
        action:()=>{
          closeModal();

          state.day++;
          state.minutes=540;
          state.dayRevenue=0;
          state.dayStockCosts=0;
          state.dayUpgradeCosts=0;
          state.dayStaffCosts=0;

          state.walkouts=0;
          state.dayEndHandled=false;
          state.isOpen=false;
          state.screen="shop";

          saveState();
          render();
        }
      }
    ]
  );
}

function buyUpgrade(type){
  const level=state.upgrades[type];
  const config=UPGRADE_CONFIG[type];

  if(level>=config.costs.length){
    showModal(
      "Đã đạt cấp tối đa",
      "Nâng cấp này hiện đã đạt cấp cao nhất.",
      "⭐",
      [{label:"Đóng",primary:true,action:closeModal}]
    );
    return;
  }

  const cost=config.costs[level];

  if(state.cash<cost){
    showModal(
      "Không đủ tiền",
      `Bạn cần ${money(cost)} để mua nâng cấp này.`,
      "💰",
      [{label:"Đóng",primary:true,action:closeModal}]
    );
    return;
  }

  state.cash-=cost;
  state.dayUpgradeCosts+=cost;
  state.upgrades[type]++;

  if(type==="employee"){
    state.employee.hired=true;
  }

  saveState();
  render();
}

/* =========================================================
   MODAL SYSTEM
========================================================= */

let modalElement=null;

function closeModal(){
  if(modalElement){
    modalElement.remove();
    modalElement=null;
  }
}

function showModal(title,body,icon,actions){
  closeModal();

  modalElement=document.createElement("div");
  modalElement.className="modal-backdrop";

  modalElement.innerHTML=`
    <div class="modal">
      <div class="modal-icon">${icon}</div>
      <h3>${title}</h3>
      <div>${body}</div>
      <div class="modal-actions">
        ${actions.map((a,i)=>`
          <button
            type="button"
            class="${a.primary?"modal-primary":"modal-secondary"}"
            data-modal-index="${i}">
            ${escapeHTML(a.label)}
          </button>
        `).join("")}
      </div>
    </div>
  `;

  actions.forEach((a,i)=>{
    modalElement.querySelector(
      `[data-modal-index="${i}"]`
    ).addEventListener("click",a.action);
  });

  document.body.appendChild(modalElement);
}

      </div>
    </div>

    <div class="stock-section">
      <h3>🥤 Ốc quế & Ly</h3>

      <div class="stock-grid">
        ${Object.entries(BASES).map(([key,item])=>`
          <div class="stock-card">
            <div class="stock-art">
              ${key==="cone"
                ? `<div class="cone-art"></div>`
                : `<div class="cup-art"></div>`}
            </div>

            <div class="stock-name">${item.name}</div>

            <div class="stock-info">
              <span>Tồn: ${baseStock(key)}</span>
              <span>+8</span>
            </div>

            <button
              type="button"
              class="buy-btn"
              data-action="buy-base"
              data-key="${key}">
              Nhập · ${money(22000)}
            </button>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="stock-section">
      <h3>🍒 Topping</h3>

      <div class="stock-grid">
        ${Object.entries(TOPPINGS).map(([key,item])=>`
          <div class="stock-card">
            <div class="stock-art">
              <div style="font-size:38px">${item.emoji}</div>
            </div>

            <div class="stock-name">${item.name}</div>

            <div class="stock-info">
              <span>Tồn: ${toppingStock(key)}</span>
              <span>+8</span>
            </div>

            <button
              type="button"
              class="buy-btn"
              data-action="buy-topping"
              data-key="${key}">
              Nhập · ${money(item.price)}
            </button>
          </div>
        `).join("")}
      </div>
    </div>
  </section>`;
}

/* =========================================================
   RENDER UPGRADES
========================================================= */

function renderUpgrades(){
  return `
  <section>
    <div class="section-head">
      <div>
        <h2>Nâng Cấp Tiệm</h2>
        <p>Đầu tư lớn để vận hành hiệu quả hơn.</p>
      </div>
    </div>

    <div class="upgrade-grid">
      ${Object.entries(UPGRADE_CONFIG).map(([type,cfg])=>{
        const level=state.upgrades[type];
        const max=level>=cfg.costs.length;
        const cost=max?null:cfg.costs[level];

        let description=cfg.description;

        if(type==="price"){
          description+=` Giá hiện tại: ${money(servicePrice())}/đơn.`;
        }

        if(type==="employee"){
          description+=state.employee.hired
            ?` Đã thuê. Cấp hiện tại: ${level}.`
            :" Khi thuê, nhân viên sẽ tự pha món sau khi bạn chọn đế.";
        }

        return `
        <div class="upgrade-card">
          <div class="upgrade-icon">${cfg.icon}</div>

          <div class="upgrade-info">
            <strong>
              ${cfg.name}
              · Lv.${level}
            </strong>

            <p>${description}</p>
          </div>

          <button
            type="button"
            class="upgrade-btn"
            data-action="buy-upgrade"
            data-key="${type}"
            ${max?"disabled":""}>
            ${max?"MAX":money(cost)}
          </button>
        </div>`;
      }).join("")}
    </div>

    <div class="warehouse-note" style="margin-top:12px">
      👩‍🍳 Nhân viên được trả lương theo chu kỳ <strong>2 ngày làm việc/lần</strong>.
      Mức lương hiện tại:
      <strong>${state.upgrades.employee>=2?money(50000):money(40000)}</strong>.
    </div>
  </section>`;
}

/* =========================================================
   RENDER REVIEWS
========================================================= */

function starsHTML(stars){
  let output="";

  for(let i=1;i<=5;i++){
    output+=`<span class="${i<=stars?"star-gold":"star-white"}">★</span>`;
  }

  return output;
}

function renderReviews(){
  if(!state.reviews.length){
    return `
    <section>
      <div class="section-head">
        <div>
          <h2>Đánh Giá</h2>
          <p>Phản hồi của những vị khách đã ghé tiệm.</p>
        </div>
      </div>

      <div class="empty">
        ⭐ Chưa có đánh giá nào.<br>
        Hãy phục vụ những vị khách đầu tiên!
      </div>
    </section>`;
  }

  return `
  <section>
    <div class="section-head">
      <div>
        <h2>Đánh Giá</h2>
        <p>Phản hồi của khách hàng.</p>
      </div>
    </div>

    <div class="review-list">
      ${state.reviews.map(r=>{
        const name=r.anonymous?"Ẩn danh":r.customerName;

        return `
        <div class="review-card">
          <div class="review-head">
            <div class="review-avatar">
              ${customerSVG(r.gender,r.anonymous)}
            </div>

            <div>
              <div class="review-name">${escapeHTML(name)}</div>
              <div class="review-date">
                Ngày ${r.day}
              </div>
            </div>

            <div class="stars">
              ${starsHTML(r.stars)}
            </div>
          </div>

          <div class="review-text">
            ${escapeHTML(r.text)}
          </div>

          ${
            r.reply
            ? `
              <div class="review-reply">
                <strong>Tiệm:</strong>
                ${escapeHTML(r.reply)}
              </div>
            `
            : `
              <div class="reply-row">
                <input
                  type="text"
                  maxlength="160"
                  placeholder="Viết phản hồi cho khách..."
                  data-review-input="${r.id}">
                <button
                  type="button"
                  data-action="reply-review"
                  data-id="${r.id}">
                  Gửi
                </button>
              </div>
            `
          }
        </div>`;
      }).join("")}
    </div>
  </section>`;
}

/* =========================================================
   MAIN RENDER
========================================================= */

function render(){
  const app=document.getElementById("app");

  if(!state.started){
    app.innerHTML=renderWelcome();
    return;
  }

  app.innerHTML=`
    <div class="game-shell">
      ${renderHeader()}

      <main class="main">
        ${
          state.screen==="shop"
          ? renderShop()
          : state.screen==="warehouse"
          ? renderWarehouse()
          : state.screen==="upgrades"
          ? renderUpgrades()
          : renderReviews()
        }
      </main>

      <nav class="bottom-nav">
        <button
          type="button"
          class="nav-btn ${state.screen==="shop"?"active":""}"
          data-action="nav"
          data-screen="shop">
          <span class="nav-icon">🍦</span>
          <span>Tiệm</span>
        </button>

        <button
          type="button"
          class="nav-btn ${state.screen==="warehouse"?"active":""}"
          data-action="nav"
          data-screen="warehouse">
          <span class="nav-icon">📦</span>
          <span>Kho Hàng</span>
        </button>

        <button
          type="button"
          class="nav-btn ${state.screen==="upgrades"?"active":""}"
          data-action="nav"
          data-screen="upgrades">
          <span class="nav-icon">🛠️</span>
          <span>Nâng Cấp</span>
        </button>

        <button
          type="button"
          class="nav-btn ${state.screen==="reviews"?"active":""}"
          data-action="nav"
          data-screen="reviews">
          <span class="nav-icon">♡</span>
          <span>Đánh Giá</span>
        </button>
      </nav>
    </div>
  `;
}

/* =========================================================
   EVENT HANDLING
========================================================= */

document.addEventListener("click",event=>{
  const button=event.target.closest("[data-action]");
  if(!button) return;

  const action=button.dataset.action;
  const key=button.dataset.key;

  if(action==="start-game"){
    const input=document.getElementById("shopNameInput");
    const name=(input?.value||"").trim();

    if(!name){
      input?.focus();
      input?.setAttribute("placeholder","Hãy nhập tên tiệm trước nhé!");
      return;
    }

    state.shopName=name;
    state.started=true;
    state.isOpen=false;
    state.day=1;
    state.minutes=540;
    state.cash=400000;
    saveState();
    render();
    return;
  }

  if(action==="nav"){
    if(state.isOpen && state.activeCustomer && key!=="shop"){
      state.screen=key;
      saveState();
      render();
      return;
    }

    state.screen=key;
    saveState();
    render();
    return;
  }

  if(action==="open-shop"){
    openShop();
    return;
  }

  if(action==="close-shop"){
    closeShop();
    return;
  }

  if(action==="reset-build"){
    resetBuild();
    saveState();
    render();
    return;
  }

  if(action==="select-base"){
    if(!state.activeCustomer) return;

    if(baseStock(key)<=0){
      showModal(
        "Đã hết đế",
        state.purchased.bases[key]
          ? `Đã hết ${BASES[key].name}, vui lòng nhập thêm ở Kho Hàng!`
          : "Bạn chưa mua loại đế này nên chưa thể sử dụng.",
        "📦",
        [
          {
            label:"Đến Kho Hàng",
            primary:true,
            action:()=>{
              state.screen="warehouse";
              closeModal();
              render();
            }
          },
          {
            label:"Đóng",
            action:closeModal
          }
        ]
      );
      return;
    }

    state.build.base=key;

    if(employeeCanWork()){
      employeePrepare();
    }

    saveState();
    render();
    return;
  }

  if(action==="select-flavor"){
    if(employeeCanWork()) return;

    if(selectedFlavorCount()>=2){
      return;
    }

    if(flavorStock(key)<=0){
      showModal(
        "Không có nguyên liệu",
        state.purchased.flavors[key]
          ? `Đã hết loại ${FLAVORS[key].name}, vui lòng nhập thêm ở Kho Hàng!`
          : "Bạn chưa mua nguyên liệu này nên chưa thể mở bán.",
        "🍨",
        [
          {
            label:"Đến Kho Hàng",
            primary:true,
            action:()=>{
              state.screen="warehouse";
              closeModal();
              render();
            }
          },
          {
            label:"Đóng",
            action:closeModal
          }
        ]
      );
      return;
    }

    state.build.flavors.push(key);
    saveState();
    render();
    return;
  }

  if(action==="select-topping"){
    if(employeeCanWork()) return;

    if(key==="none"){
      state.build.topping=null;
    }else{
      if(toppingStock(key)<=0){
        showModal(
          "Hết topping",
          state.purchased.toppings[key]
            ? `Đã hết ${TOPPINGS[key].name}, vui lòng nhập thêm ở Kho Hàng!`
            : "Bạn chưa mua topping này.",
          "🍒",
          [
            {
              label:"Đến Kho Hàng",
              primary:true,
              action:()=>{
                state.screen="warehouse";
                closeModal();
                render();
              }
            },
            {
              label:"Đóng",
              action:closeModal
            }
          ]
        );
        return;
      }

      state.build.topping=key;
    }

    saveState();
    render();
    return;
  }

  if(action==="serve"){
    serveCustomer(false);
    return;
  }

  if(action==="buy-flavor"){
    purchaseFlavor(key);
    return;
  }

  if(action==="buy-topping"){
    purchaseTopping(key);
    return;
  }

  if(action==="buy-base"){
    purchaseBase(key);
    return;
  }

  if(action==="buy-upgrade"){
    buyUpgrade(key);
    return;
  }

  if(action==="reply-review"){
    const id=button.dataset.id;
    const input=document.querySelector(
      `[data-review-input="${CSS.escape(id)}"]`
    );

    const reply=(input?.value||"").trim();

    if(!reply) return;

    const review=state.reviews.find(r=>r.id===id);

    if(review){
      review.reply=reply;
      saveState();
      render();
    }

    return;
  }
});

/* =========================================================
   INPUT HANDLING
========================================================= */

document.addEventListener("keydown",event=>{
  if(event.key==="Enter" && event.target.id==="shopNameInput"){
    document.querySelector('[data-action="start-game"]')?.click();
  }
});

/* =========================================================
   STARTUP
========================================================= */

loadState();
render();
startPatienceLoop();

</script>

</body>
</html>
