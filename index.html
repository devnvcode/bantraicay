<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiệm Mì Cay Bốc Lửa</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#f9f0e2;--paper:#fff8ec;--ink:#4a2b1f;--ink2:#8b6248;--line:#e8d3b3;--pink:#e07b86;--red:#d9382a;--red2:#a8281a;--wood:#dcae72;--wood2:#a97b4c;--wood3:#7b5232;--gold:#f2b53f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#d9b98f;font-family:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
#app{max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0)}

/* ---------- HUD ---------- */
#hud{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:8px 12px 6px}
.hl{display:flex;align-items:center;gap:9px;min-width:0}
#pauseB{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:#f4c3c6;border:3px solid #fff;box-shadow:0 0 0 2.5px #e6d2b6,0 3px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:4px}
#pauseB i{display:block;width:6px;height:18px;border-radius:3px;background:#d9606c}
.dn{font-weight:800;font-size:18px;line-height:1;white-space:nowrap}
.tm{white-space:nowrap;font-weight:700;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:4px;margin-top:3px;line-height:1}
.dbar{height:5px;width:66px;background:#eadbc3;border-radius:5px;overflow:hidden;margin-top:4px}
.dbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2b53f,#e2452b);border-radius:5px}
.hc{text-align:center;min-width:0}
#shopName{font-weight:800;font-size:13px;color:#b55563;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1;margin:0 auto}
#pMoney{font-weight:800;font-size:29px;line-height:1.05;letter-spacing:-.5px}
.hr{text-align:right;min-width:0}
.stars{font-size:19px;line-height:1;letter-spacing:0;background:linear-gradient(90deg,#f2b53f var(--p,0%),#e6d6bd var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
#rate{font-weight:700;font-size:11.5px;color:var(--ink2);line-height:1.1;margin-top:1px;white-space:nowrap}
#stripe{flex:0 0 auto;height:12px;background:repeating-linear-gradient(90deg,#e07b90 0 42px,#fff 42px 84px)}

/* ---------- CỬA HÀNG (ẢNH CHÍNH) ---------- */
#scene{position:relative;flex:0 0 auto;height:218px;overflow:hidden;background:radial-gradient(circle,rgba(255,255,255,.4) 0 1.6px,transparent 2.4px) 0 0/20px 20px,linear-gradient(#f8dab4,#f4c99b 70%,#efbd8a)}
#scene:after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(#d9a468,#b98350);border-top:3px solid #8b5e3a;z-index:4}
#awn{position:absolute;left:0;right:0;top:0;height:54px;z-index:5;pointer-events:none}
#awn svg{width:100%;height:100%;display:block}
#logo{position:absolute;left:10px;top:14px;width:44px;height:44px;border-radius:50%;background:#fff5ea;border:3px solid var(--pink);box-shadow:0 0 0 3px #59b58f;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:6}
#queue{position:absolute;left:8px;top:64px;display:flex;gap:5px;z-index:6}
.qa{position:relative;width:29px;height:29px;border-radius:50%;background:#fff5ea;border:2px solid #8b5e3a;overflow:hidden}
.qa svg{width:100%;height:100%;display:block}
.qa i{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#8fd08f}
#cfront{position:absolute;inset:0;z-index:6}
.cav,.cav2{position:absolute;left:6px;bottom:11px;width:96px;height:120px}
.cav{animation:cin .5s var(--d,0s) both}
.cav svg,.cav2 svg{width:100%;height:100%;display:block;overflow:visible}
.cav .nm{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);background:#fff8ec;border:2px solid #8b5e3a;border-radius:9px;padding:0 8px;font-weight:800;font-size:11px;line-height:1.35;white-space:nowrap}
.sweat{display:none;position:absolute;right:4px;top:26px;font-size:16px}
#cfront.low .sweat{display:block;animation:sw2 .9s ease-in infinite}
#cfront.low .cav svg{animation:tremble .35s linear infinite}
.bub2{position:absolute;left:114px;right:8px;top:58px;background:var(--paper);border:3px solid #6b4632;border-radius:22px;padding:9px 12px 9px 10px;display:flex;gap:9px;align-items:flex-start;z-index:7;box-shadow:0 3px 0 rgba(107,70,50,.22);transform-origin:0 75%;animation:pop .35s calc(var(--d,0s) + .35s) both}
.bub2.static{animation:none}
.bub2:before{content:'';position:absolute;left:-16px;top:44px;border:9px solid transparent;border-right:13px solid #6b4632;border-left:0}
.bub2:after{content:'';position:absolute;left:-9px;top:46px;border:7px solid transparent;border-right:10px solid var(--paper);border-left:0}
.mini{flex:0 0 46px;width:46px;padding-top:2px}
.mini svg{width:100%;display:block;overflow:visible}
.bt{flex:1;min-width:0}
.say{font-weight:700;font-size:14px;line-height:1.2;color:var(--ink)}
.say b{color:#c04862;font-weight:800}
.pat{display:flex;align-items:center;gap:7px;margin-top:7px}
.pat span{font-weight:800;font-size:11.5px;letter-spacing:.3px;white-space:nowrap;line-height:1}
.bar{flex:1;height:13px;border:2.5px solid #5b3a29;border-radius:10px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#8fd08f;border-radius:8px}
.leaver{position:absolute;inset:0;z-index:8;pointer-events:none}
.leaver .cav2{animation:out 1.7s ease-in both}
.rbub{position:absolute;left:114px;top:66px;max-width:230px;background:var(--paper);border:3px solid #6b4632;border-radius:18px;padding:7px 12px;font-weight:800;font-size:14px;line-height:1.2;animation:rfade 1.7s both}
.flt{position:absolute;left:14px;top:104px;font-weight:800;font-size:24px;color:#2f9a4a;text-shadow:0 2px 0 #fff,0 0 6px #fff;z-index:9;animation:flt 1.3s ease-out forwards;pointer-events:none}
.clsign{position:absolute;left:12px;top:44px;width:98px;height:150px;animation:none}
.clsign svg{width:100%;height:100%;display:block;overflow:visible}
.ct{font-weight:800;font-size:16px;line-height:1.1;margin-bottom:4px}
.chk{list-style:none;font-weight:700;font-size:12.5px;line-height:1.35;margin-bottom:6px}
.chk .ok{color:#2f8a45}.chk .no{color:#b8352a}
.note{font-weight:600;font-size:11.5px;color:var(--ink2);line-height:1.25;margin-bottom:6px}
.btn{background:var(--red);color:#fff;font-weight:800;font-size:15px;padding:8px 16px;border-radius:14px;box-shadow:0 3px 0 var(--red2);line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2)}
.btn:disabled{background:#d9c4ba;box-shadow:0 3px 0 #bfa89c}
.btn.g{background:#5fae5a;box-shadow:0 3px 0 #438a3f}
.btn.g:active{box-shadow:0 1px 0 #438a3f}
.btn.s{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.wide{width:100%;display:block;margin-top:9px}
.btn.gray{background:#b89a86;box-shadow:0 3px 0 #94765f}

/* ---------- QUẦY LÀM MÌ ---------- */
#work{position:relative;flex:1;min-height:0}
#bench{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:8px 8px 0;background:var(--cream)}
.plate{display:inline-block;background:linear-gradient(#f0d6a9,#e3bb82);border:2.5px solid #a67c52;border-radius:8px;padding:0 14px;font-weight:800;font-size:15px;line-height:1.35;letter-spacing:.4px;color:#5a3a26;box-shadow:0 2px 0 #b58b58;align-self:flex-start;margin-left:4px}
.shelf{display:grid;grid-template-columns:.85fr repeat(5,1fr);gap:4px;align-items:end;margin-top:-2px;padding:9px 5px 8px;background:#f2e2c2;border:2.5px solid #c9a978;border-radius:12px;box-shadow:inset 0 -6px 0 #e7cf9f}
.stk{position:relative;text-align:center;padding-bottom:2px}
.stk svg{width:100%;display:block}
.stk b{display:block;font-size:12px;line-height:1;margin-top:2px}
.jar{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.jar .lid{width:70%;height:9px;border-radius:5px 5px 2px 2px;background:linear-gradient(#ebe3d3,#c7bca6);border:2px solid #a89c84;position:relative;z-index:2}
.jar .lid:before{content:'';position:absolute;left:50%;top:-6px;width:12px;height:6px;margin-left:-6px;border-radius:5px 5px 0 0;background:#b4a88f}
.jar .gl{display:block;width:96%;height:66px;margin-top:-2px;border:2.5px solid #b7a98d;border-radius:8px 8px 16px 16px;background:linear-gradient(90deg,rgba(255,255,255,.8),rgba(255,255,255,.35) 45%,rgba(255,255,255,.65));overflow:hidden;position:relative}
.jar .gl svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%}
.jar .lb{position:relative;margin-top:-21px;background:#fffdf7;border:2px solid #8b6b4a;border-radius:6px;padding:1px 3px;font-size:9.5px;font-weight:800;line-height:1.15;text-align:center;z-index:2;min-width:74%}
.bdg{position:absolute;right:-3px;top:-4px;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:#f9edd2;border:2.5px solid #7b5232;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:3;line-height:1}
.jar .bdg{top:0;right:-2px}
.lk{position:absolute;left:50%;top:40%;width:28px;height:28px;margin:-14px 0 0 -14px;z-index:4;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.locked .gl,.locked .lid,.locked .lb{opacity:.42;filter:grayscale(.7)}
.sold{position:absolute;top:36px;left:50%;transform:translateX(-50%) rotate(-8deg);background:var(--red);color:#fff;font-size:10px;font-style:normal;font-weight:800;padding:0 7px;border-radius:5px;z-index:4;line-height:1.4;border:1.5px solid #fff}
.out .gl svg,.out .tray .pl{opacity:.32}
.jar.sel .gl{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,56,42,.28)}
.mid{display:grid;grid-template-columns:37% 1fr;gap:9px;margin-top:9px;align-items:start}
.col{min-width:0;display:flex;flex-direction:column;gap:5px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px;background:#cdd1d3;border:3px solid #6f757a;border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.tw{position:relative}
.tray{display:block;position:relative;width:100%;aspect-ratio:1.18;border:3px solid #767b80;border-radius:8px;background:linear-gradient(#f6f7f7,#dde0e1);overflow:hidden}
.tray .pl{position:absolute;left:0;right:0;top:0;width:100%;height:100%}
.tray .tl{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);background:#fffdf7;border:1.5px solid #8b6b4a;border-radius:5px;padding:0 4px;font-size:9px;font-weight:800;line-height:1.3;white-space:nowrap;z-index:2}
.tw.sel .tray{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,56,42,.28)}
.tw .lk{top:38%;width:24px;height:24px;margin:-12px 0 0 -12px}
.tw.locked .tray .pl{opacity:.4;filter:grayscale(.8)}
.tw.locked .tl{opacity:.6}
.tw.locked .bdg{background:#efe7d6}
.board{position:relative;border:3px solid #b98a55;border-radius:12px;background:repeating-linear-gradient(90deg,rgba(150,100,50,.1) 0 2px,transparent 2px 9px),linear-gradient(#f6d6a0,#efc386);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 3px 0 #b98a55}
.bwl{width:100%}
.bwl svg{width:100%;display:block;overflow:visible}
.bcap{font-weight:800;font-size:12.5px;text-align:center;line-height:1.2;min-height:30px;color:#5a3a26;display:flex;align-items:center;justify-content:center}
.bacts{display:flex;gap:6px;width:100%}
.trash{flex:0 0 38px;height:38px;border-radius:12px;background:#fff8ec;border:2.5px solid #b98a55;font-size:18px;line-height:1}
.bacts .btn{flex:1;padding:8px 2px;font-size:14px;white-space:nowrap}
.cb{flex:1;min-height:44px;margin:10px -8px 0;background:linear-gradient(#c79662,#b48452 40%,#a97b4c);border-top:4px solid #7b5232;position:relative}
.cb:before{content:'';position:absolute;left:14px;right:14px;top:12px;bottom:10px;border:3px solid #7b5232;border-radius:6px;background:rgba(0,0,0,.05)}
#sheet{position:absolute;inset:0;display:none;overflow-y:auto;background:var(--paper);border-top:3px solid var(--line);padding:12px;z-index:8}
#nav{flex:0 0 auto;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));background:linear-gradient(#c79662,#a9794a);border-top:3px solid var(--wood3)}
#nav button{flex:1;border-radius:13px;padding:4px 0 3px;font-weight:800;font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:1px;color:#fff3dc;text-shadow:0 1px 0 rgba(0,0,0,.25)}
#nav button span{font-size:19px;line-height:1.1}
#nav button.on{background:#fff3dc;color:var(--ink);text-shadow:none;box-shadow:0 3px 0 #7b5232}

/* ---------- BẢNG TAB ---------- */
.hint{text-align:center;font-weight:700;color:var(--ink2);padding:26px 10px;line-height:1.5}
h3{font-size:17px;margin:2px 0 8px;font-weight:800}
.li{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.li .t{flex:1;min-width:0;line-height:1.2}
.li small{display:block;font-weight:600;color:var(--ink2);font-size:12px}
.li .btn{padding:6px 11px;font-size:13px}
.li.lkd{opacity:.6}
.ico{flex:0 0 30px;width:30px;height:30px}.ico svg{width:100%;height:100%;display:block}
.pr{display:flex;align-items:center;gap:6px}.pr b{min-width:46px;text-align:center}
.pr button{width:30px;height:30px;border-radius:9px;background:#ffe1cc;font-weight:800;font-size:17px;color:var(--red)}
.rv{padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.rh{display:flex;gap:9px;align-items:center;margin-bottom:4px}
.avs{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#fff;flex:0 0 42px;border:2px solid #b98a55}
.avs svg{width:100%;height:100%;display:block}
.st{color:#f2a73b;font-size:14px;letter-spacing:1px;line-height:1.2}.st span{color:#e5d3c8}.st small{color:var(--ink2);letter-spacing:0;margin-left:5px;font-weight:700;font-size:12px}
.rv p{line-height:1.4;font-weight:600}
.rpl{margin-top:6px;background:#fff0e0;border-radius:10px;padding:6px 10px;font-weight:700}
.lnk{background:none;color:var(--red);font-weight:800;font-size:13px;padding:4px 0}
.rin{display:flex;gap:6px;margin-top:6px}.rin input{flex:1;min-width:0;border:2px solid var(--pink);border-radius:10px;padding:6px 9px;font:700 14px inherit;color:var(--ink)}
.tpl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tpl button{background:#fff;border:1.5px solid var(--pink);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px;color:var(--ink);text-align:left}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sc{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px;text-align:center}.sc b{display:block;font-size:21px}.sc span{font-size:12px;color:var(--ink2);font-weight:700}

/* ---------- THÔNG BÁO / HỘP THOẠI ---------- */
#toast{position:absolute;top:calc(74px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 15px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:92%;text-align:center;line-height:1.25}
#toast.on{opacity:1}
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(60,30,20,.5);padding:24px}
.mcard{background:var(--paper);border:3px solid #6b4632;border-radius:22px;padding:18px 18px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:pop .3s both}
.mcard h2{font-size:24px;line-height:1.1;margin-bottom:8px}
.mcard p{font-weight:700;color:var(--ink2);line-height:1.35}
.ul{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
.ul div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-weight:800;font-size:13px;min-width:92px}
.ul svg{width:44px;height:44px;display:block;margin:0 auto 2px}
.pf{text-align:left;margin-top:8px}.pf label{font-weight:800;font-size:13px;color:var(--ink2)}
.pf input{width:100%;border:2.5px solid var(--pink);border-radius:12px;padding:8px 10px;font:800 16px inherit;color:var(--ink);background:#fff;margin-top:3px}

/* ---------- MÀN HÌNH ĐẦU (ĐẶT TÊN) ---------- */
#intro{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:#a5683a;transition:opacity .5s,transform .5s;overflow:hidden}
#intro.hide{opacity:0;transform:scale(1.06);pointer-events:none}
#introScene{flex:0 0 auto;width:100%;line-height:0;position:relative}
#introScene svg{width:100%;height:auto;display:block;overflow:visible}
#introForm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0));background:repeating-linear-gradient(180deg,rgba(0,0,0,.07) 0 2px,transparent 2px 46px),linear-gradient(#b3743f,#98602f);border-top:4px solid #7b5232;margin-top:-1px}
.ncard{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper);border:4px solid #6b4632;border-radius:24px;padding:18px 18px 16px;box-shadow:0 6px 0 rgba(60,30,15,.35)}
.ntitle{font-weight:800;font-size:22px;color:var(--ink);text-align:center;line-height:1.1}
.nin{width:100%;font-weight:800;font-size:19px;text-align:center;color:var(--ink);border:3.5px solid #f2b53f;border-radius:18px;padding:10px;background:#fff8ec;outline:0;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.nin:focus{border-color:var(--red)}
.nin.bad{animation:wob .4s;border-color:var(--red)}
.nhint{min-height:18px;font-weight:700;font-size:13px;color:var(--ink2);text-align:center;line-height:1.2}
.nhint.bad{color:var(--red)}
#goBtn{width:100%;font-size:20px;padding:11px;border-radius:18px;box-shadow:0 4px 0 var(--red2)}
.lnk2{color:var(--ink2);font-weight:700;font-size:13px;text-decoration:underline;padding:2px}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite}
.cd{animation:drift 60s linear infinite}
.stm{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;transform-box:fill-box;animation:stm 3.2s ease-in-out infinite;opacity:0}
.catb{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.4s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:0 50%;animation:tl 3s ease-in-out infinite}
.zz{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;fill:#a67ad0;opacity:0;animation:zz 3.6s ease-out infinite}
.sc0{transform-box:fill-box;transform-origin:center bottom}.sc0.new{animation:drop .35s ease-out}

@keyframes swing{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(580px)}}
@keyframes stm{0%{opacity:0;transform:translateY(10px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-16px)}}
@keyframes br{50%{transform:scaleY(1.035)}}
@keyframes tl{50%{transform:rotate(7deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,8px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-26px) scale(1.15)}}
@keyframes drop{0%{transform:translateY(-30px) scale(.7);opacity:0}70%{transform:translateY(3px) scale(1.08)}100%{transform:none;opacity:1}}
@keyframes cin{from{transform:translateX(-130px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.55);opacity:0}70%{transform:scale(1.04)}to{transform:none;opacity:1}}
@keyframes out{0%,60%{transform:none;opacity:1}100%{transform:translateX(160px);opacity:0}}
@keyframes rfade{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}
@keyframes flt{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-44px)}}
@keyframes sw2{0%{opacity:0;transform:translateY(-4px)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
@keyframes tremble{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.cd,.stm,.sw,.catb,.tail,.zz{animation:none}.stm{opacity:.6}.zz{opacity:.8}}
/* ===== NÂNG CẤP GIAO DIỆN (lớp thêm, không xoá code gốc) ===== */
#app{box-shadow:0 0 40px rgba(90,45,20,.35)}
#hud{background:linear-gradient(#fff7e8,#f9f0e2)}
#stripe{height:14px;box-shadow:0 3px 6px rgba(120,60,40,.25)}
#scene{height:236px;background:radial-gradient(circle at 50% -10%,rgba(255,246,220,.95),transparent 62%),radial-gradient(circle,rgba(255,255,255,.4) 0 1.6px,transparent 2.4px) 0 0/20px 20px,linear-gradient(#fbe3c2,#f4c99b 68%,#e6b07a)}
#scene:before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(120,60,20,.16))}
.btn{background:linear-gradient(#ef5d4b,#d9382a)}.btn.g{background:linear-gradient(#72c06b,#4f9d4a)}
.board{background:repeating-linear-gradient(90deg,rgba(150,100,50,.1) 0 2px,transparent 2px 9px),linear-gradient(#f8dcaa,#eec089)}
.shelf{display:flex;overflow-x:auto;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf>.stk{flex:0 0 50px}.shelf>.jar{flex:0 0 62px}
.busy .hr{visibility:hidden}
.busy #nav button:nth-child(4){display:none}
/* rèm cửa */
#curtain{position:absolute;inset:0;z-index:70;pointer-events:none;display:none}
#curtain.go{display:block}
#curtain i{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#c9303f 0 16px,#a8202f 16px 32px);box-shadow:inset 0 -40px 60px rgba(0,0,0,.28)}
#curtain i:first-child{left:0;transform:translateX(-102%);border-right:5px solid #f2b53f}
#curtain i:last-child{right:0;transform:translateX(102%);border-left:5px solid #f2b53f}
#curtain.go i:first-child{animation:cl 1.6s cubic-bezier(.65,0,.35,1) both}
#curtain.go i:last-child{animation:cr 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes cl{0%{transform:translateX(-102%)}38%,58%{transform:none}100%{transform:translateX(-102%)}}
@keyframes cr{0%{transform:translateX(102%)}38%,58%{transform:none}100%{transform:translateX(102%)}}
/* khách đi bộ vào / ra */
@keyframes walk{0%{transform:translateX(-160px);opacity:0}12%{opacity:1}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-6px) rotate(1.6deg)}}
.cav{animation:walk 1.6s var(--d,0s) ease-out both}
.cav svg{animation:bob .32s var(--d,0s) 5 ease-in-out}
.leaver .cav2 svg{animation:bob .32s 5 ease-in-out}
.bub2{animation:pop .35s calc(var(--d,0s) + 1.4s) both}
.bub2.static{animation:none}
/* thanh kiên nhẫn hình tròn */
.bar{display:none}
.pat{gap:9px}
#pring{position:relative;flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:conic-gradient(#8fd08f 360deg,#eadbc3 0)}
#pring:before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--paper)}
#pring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1}
/* mèo thần tài */
#neko{position:absolute;right:6px;bottom:14px;width:56px;z-index:5;pointer-events:none}
#neko svg,.ineko svg{width:100%;display:block;overflow:visible}
.nkw{transform-box:view-box;transform-origin:54px 66px;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(12deg)}}
.ineko{position:absolute;left:62%;width:30%;bottom:17%;z-index:3}
/* nồi mì */
#pot{position:absolute;inset:0;z-index:9;background:rgba(60,30,20,.55);display:flex;align-items:center;justify-content:center;padding:14px}
#pot .pc{background:var(--paper);border:3px solid #6b4632;border-radius:22px;padding:12px 16px 14px;width:100%;max-width:330px;text-align:center;animation:pop .3s both}
#pot h3{margin:0 0 4px}
.potv svg{width:170px;display:block;margin:0 auto}
.bub{animation:bu 1.4s ease-in infinite}.bub:nth-child(2){animation-delay:.5s}.bub:nth-child(3){animation-delay:.9s}
@keyframes bu{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.gauge{position:relative;height:22px;margin:8px 0 6px;border:3px solid #5b3a29;border-radius:12px;background:linear-gradient(90deg,#f2b53f 0 58%,#5fbf5a 58% 78%,#e2452b 78%);overflow:visible}
.gauge b{position:absolute;top:-8px;width:6px;height:34px;margin-left:-3px;border-radius:3px;background:#fff;border:2px solid #4a2b1f;left:0}
/* khay giao khách */
.trayb{flex:1;padding:6px 4px;border-radius:12px;font-weight:800;font-size:13px;line-height:1.15;color:#fff;background:linear-gradient(#c9ccce,#8f9497);border:3px solid #6f757a;box-shadow:0 3px 0 #5d6266}
.trayb:active{transform:translateY(2px)}
.bwl{transition:transform .38s ease-in,opacity .38s}
.bwl.slide{transform:translateY(60px) scale(.7);opacity:0}
.bacts .btn.g{display:none}
/* phản hồi của khách */
.crp{margin-top:6px;border-radius:10px;padding:6px 10px;font-weight:700;background:#eaf6e4}
.crp.rude{background:#fde3df;color:#8a2a1f}
.tpl.q{margin-top:4px}
</style>

/* quầy làm mì */
const STACK='<svg viewBox="0 0 60 78">'+[3,2,1,0].map(i=>{const y=32+i*9;return `<path d="M6 ${y}Q8 ${y+16} 30 ${y+16}Q52 ${y+16} 54 ${y}Z" fill="#e2452b" stroke="#7a1a12" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="30" cy="${y}" rx="24" ry="5.5" fill="#f7d9a5" stroke="#7a1a12" stroke-width="1.8"/>`}).join('')+'</svg>';
function jar(x,fn){const u=isU(x.id),st=S.stock[x.id],out=u&&st<=0,sel=B.base===x.id||B.top===x.id;
 return `<button class="jar${u?'':' locked'}${out?' out':''}${sel?' sel':''}" onclick="${fn}('${x.id}')" aria-label="${esc(x.n)}"><span class="bdg">${u?st:''}</span><span class="lid"></span><span class="gl">${pileJ(x.id,u?nJ(st):6)}</span><span class="lb">${esc(x.n.toUpperCase())}</span>${u?'':LOCK}${out?'<em class="sold">HẾT</em>':''}</button>`}
function tray(x){const u=isU(x.id),st=S.stock[x.id],out=u&&st<=0;
 return `<div class="tw${u?'':' locked'}${out?' out':''}"><button class="tray" onclick="addSc('${x.id}')" aria-label="${esc(x.n)}">${pileT(x.id,u?nT(st):9)}<span class="tl">${esc(x.n)}</span>${u?'':LOCK}${out?'<em class="sold" style="top:28%">HẾT</em>':''}</button><span class="bdg">${u?st:''}</span></div>`}

 <div class="col"><span class="plate">NGUYÊN LIỆU</span><div class="tgrid">${FL.map(tray).join('')}</div></div></div><div class="cb"></div>`}

 if(tab===1){const U=[['sign','🪧 Biển hiệu','Thêm 25% lượng khách mỗi cấp'],['seat','🪑 Ghế chờ','Khách kiên nhẫn hơn 15% mỗi cấp'],['tool','🥄 Dụng cụ vàng','Thêm 5% tiền tip mỗi cấp']],SN=[['🧑‍💼 Thu ngân','Khách đến nhanh hơn, kiên nhẫn lâu hơn',150000],['👨‍🍳 Đầu bếp','Tự chọn mì và bỏ đúng nguyên liệu',200000],['🥡 Giao mì','Tự thêm topping và giao cho khách',250000]];
  h='<h3>Nâng cấp tiệm</h3>'+U.map(u=>{const lv=S.up[u[0]];return `<div class="li"><div class="t">${u[1]} · cấp ${lv}/3<small>${u[2]}</small></div>${lv>=3?'<b>Tối đa</b>':`<button class="btn" onclick="upg('${u[0]}')">${fmt(75000*(lv+1))}</button>`}</div>`}).join('')+'<h3 style="margin-top:12px">Thuê nhân viên</h3>'+SN.map((s,i)=>`<div class="li"><div class="t">${s[0]}<small>${s[1]}</small></div>${S.staff[i]?'<b>Đã thuê ✓</b>':`<button class="btn" onclick="hire(${i})">${fmt(s[2])}</button>`}</div>`).join('')+(S.staff.every(x=>x)?'<div class="hint">Cả 3 nhân viên đã sẵn sàng, tiệm chạy tự động từ A đến Z!</div>':'')}
 if(tab===2){h='<h3>Giá bán</h3>'+ALL.map(x=>isU(x.id)?`<div class="li">${ico(x.id)}<div class="t">${x.n}<small>Giá gốc ${fmt(x.p)}</small></div><div class="pr"><button onclick="pr('${x.id}',-500)">−</button><b>${fmt(S.price[x.id])}</b><button onclick="pr('${x.id}',500)">+</button></div></div>`:`<div class="li lkd"><span class="ico" style="display:flex;align-items:center;justify-content:center;font-size:22px">🔒</span><div class="t">${x.n}<small>Đang bị khoá</small></div></div>`).join('')}
 if(tab===3){h=`<h3>Đánh giá khách hàng (${S.rn?(S.rs/S.rn).toFixed(1).replace('.',','):'–'} ★)</h3>`+(S.rv.length?S.rv.map(r=>`<div class="rv"><div class="rh"><span class="avs">${r.an?'<svg viewBox="0 0 60 60"><rect width="60" height="60" fill="#2b2b33"/><circle cx="30" cy="26" r="11" fill="#55555f"/><path d="M8 60q22-26 44 0z" fill="#55555f"/><text x="30" y="31" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">?</text></svg>':cust(r.g,r.s,r.st>=4?'h':r.st===3?'n':'a','12 8 96 96')}</span><div><b>${r.an?'Ẩn danh':esc(r.nm)}</b><div class="st">${'★'.repeat(r.st)}<span>${'★'.repeat(5-r.st)}</span><small>Ngày ${r.d}</small></div></div></div><p>${esc(r.tx)}${r.ic?` ${r.ic}`:''}</p>${r.rp?`<div class="rpl">🏪 ${esc(S.name)}: ${esc(r.rp)}</div>`:RO===r.id?`<div class="rin"><input id="rp" maxlength="140" placeholder="Nhập lời phản hồi…"><button class="btn" onclick="sendR(${r.id})">Gửi</button></div><div class="tpl">${(TPL[r.st]||TPL[1]).map(t=>`<button onclick="fillT(this)">${esc(t.replace(/\{n\}/g,r.an?'bạn':r.nm))}</button>`).join('')}</div>`:`<button class="lnk" onclick="replyTo(${r.id})">Trả lời</button>`}</div>`).join(''):'<div class="hint">Chưa có đánh giá nào. Hãy mở cửa đón khách!</div>')}
 if(tab===4){const D=S.D,av2=D.st.length?(D.st.reduce((a,b)=>a+b,0)/D.st.length).toFixed(1).replace('.',','):'–';
  h=`<h3>Ngày ${S.day} (hôm nay)</h3><div class="gr"><div class="sc"><b>${D.cu}</b><span>Khách đã đến</span></div><div class="sc"><b>${fmt(D.rev)}</b><span>Doanh thu</span></div><div class="sc"><b>${fmt(D.exp)}</b><span>Chi nhập hàng</span></div><div class="sc"><b>${av2} ★</b><span>Đánh giá TB</span></div></div><h3>Các ngày trước</h3>`+(S.hist.length?S.hist.map(x=>`<div class="li"><div class="t">Ngày ${x.day}<small>${x.cu} khách · ${x.left} bỏ về · ${x.wrong} sai đơn · ${x.avg?x.avg.toFixed(1).replace('.',','):'–'} ★</small></div><div style="text-align:right">${fmt(x.rev-x.exp)}<small style="display:block;font-weight:600;color:var(--ink2)">lãi ròng</small></div></div>`).join(''):'<div class="hint">Chưa có ngày nào hoàn thành.</div>')}
 e.innerHTML=h}
